leads:
  - "Humphreys and Waddington, “Dating the Crucifixion”, Nature 306 (1983), and “The Jewish Calendar, a Lunar Eclipse and the Date of Christ's Crucifixion”, Tyndale Bulletin 43.2 (1992): Friday 3 April AD 33; outside the ~30-year window (#86); not read."
  - "Colin J. Humphreys, The Mystery of the Last Supper (Cambridge University Press, 2011): AD 33 per Bond n. 4; not read."
  - "Schaefer, “Lunar Visibility and the Crucifixion”, QJRAS 31 (1990): disputes the eclipse's visibility (cited by ABR); not read."
  - "Raymond E. Brown, The Death of the Messiah (1994): undecided between 30 and 33 per Bond n. 4; not read."
  - "Köstenberger and Taylor, “April 3, AD 33”, First Things (2014), and The Final Days of Jesus (Crossway, 2014): not read; First Things is a journal, not a ministry."
  - "Blumell and Wayment, BYU Studies Quarterly 51.3 (2012): “we cannot know with any degree of certainty in which year Jesus died” per Chadwick; not read."
  - "Bond, Cambridge Core blog post on dating Jesus' death (29–34 CE per a search snippet): 503 on fetch; not read."
  - "Jimmy Akin, Catholic Answers audio on the date of the crucifixion: not listened to."
uncited:
  - "Bond 2013, § I ¶ 5: “if we accept the historicity of Luke 3.1 … Jesus’ death must have taken place some time between 29 and 34 CE.” Conditional; the Conclusion's unconditional sentence is cited instead."
  - "Bond 2013, § I last ¶: “14th Nisan appears to have fallen on two possible dates within our broader time period: Friday April 7th 30 CE or April 3rd 33.” Reported astronomy; the following sentence (cited) carries both dates."
  - "Bond 2013, Conclusion: “we can no longer use astronomy to date Jesus’ death” and “We simply have no way of knowing.” About the day, not the year; the abstract carries the verdict."
  - "Britannica “Jesus”, “Jesus’ last week”, ¶ 1: “About the year 30 CE Jesus and his disciples went to Jerusalem from Galilee to observe Passover.” Agrees with the lede; not needed. ¶ 9: “They took him and two thieves outside Jerusalem and crucified them.” No date."
  - "Britannica “Jesus”, “The political situation”: Caiaphas “held the office from about 18 to 36 CE”. A second bound; Pilate's suffices."
  - "Ehrman, ch. 9 summary: “Pontius Pilate, not Jewish authorities, sentenced him to crucifixion.” No year."
  - "Cohn / Gibson, Encyclopaedia Judaica 2nd ed., “Crucifixion” (Encyclopedia.com): sentenced by Pilate “between 27 and 36 c.e.”; “The accepted view is that the death of Jesus took place late in the 20s or early in the 30s of the first century. It seems reasonable, therefore, that the crucifixion took place in the year 30 c.e.” Agrees; not needed; which of the two authors wrote the passage is not stated."
  - "Flusser, Encyclopaedia Judaica “Jesus”: “JESUS (d. 30 c.e.)”; “died in the year 30 c.e.” Body likely from the 1971 first edition, outside the window."
  - "Orlett, New Catholic Encyclopedia “Jesus Christ, I (in the Bible)” (Encyclopedia.com): Pilate governor “from a.d. 26 to 36. One can only conjecture about a more precise date for His death.” Edition year unverified; Bond carries the verdict."
  - "Buckley, New Catholic Encyclopedia “Pilate, Pontius”: appointed “In a.d. 26”; same entry says Pilate killed himself on Caligula's orders “in a.d. 30”, an evident error; not used."
  - "HarperCollins Bible Dictionary (2009) on Bible Odyssey, “Pilate, Pontius”: prefect “(26–36 CE)”. Agrees with Britannica; not needed. Carter, Bible Odyssey “Pontius Pilate”: governor “(26-37 CE)”; recalled “in early 37 CE”. Different end year from Britannica; the prefecture is context only, Britannica's sentence carries it."
  - "Chadwick, “Dating the Death of Jesus Christ”, BYU Studies 54.4: “Jesus did in fact die in AD 30 … April 6”. Argues partly from Latter-day Saint scripture and apostles; class unsettled; not used."
  - "Bible Odyssey: Cook “Crucifixion in the Roman World”, Powell “The Crucifixion of Jesus and the Jews” and “Jesus”, Eberhart “Last Supper”; HarperCollins “Jesus Christ”; Martin, Open Yale RLST 152 lecture 13; NCE “Christ”: no year for the crucifixion."
  - "Got Questions, same page ¶ 4: “There is also an argument for an earlier date (April 7, AD 30) … The later date seems more in keeping with the historical record.” The ministry's own alternative; the cited sentence carries its date."
  - "Ligonier (Myers, “When Did Jesus Die?”, 2025): “The historical death of Jesus of Nazareth is widely recognized by His crucifixion on Friday, April 3, AD 33”. Same date; “widely recognized” claims recognition rather than holding it; one Tradition source suffices."
  - "Answers in Genesis (Köstenberger, “Placing the Cross in History”, 2014): “This author concludes that Jesus was most likely crucified on April 3, AD 33.” The author's judgment, hedged; not needed."
  - "ESV Study Bible (Crossway), “The Date of Jesus’ Crucifixion” on Bible Study Tools: “Jesus was probably crucified on April 3 (Nisan 14) in a.d. 33”; paywalled beyond the closing section; not used."
  - "Reasons to Believe (Leung, 2024): “the crucifixion probably occurred in AD 33”; April 3 only as a report of Humphreys. Not used."
  - "The Gospel Coalition (Howard, “When Did Jesus Die?”, 2026): AD 33 but “Friday, March 6, AD 33” (conditional), rejecting April 3; TGC calls itself “a group of pastors and churches in the Reformed tradition”. A different tradition date; not shown (one Tradition source suffices; noted for the second pass)."
  - "Associates for Biblical Research (Lanser, 2020): crucified “in AD 30”, “ruling out an AD 33 Crucifixion”, conditional on a baptism in AD 27; Lanser 2019 leaves 30 or 33 open. Another ministry's different date; not shown."
