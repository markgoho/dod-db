# Review record for the Timeline Entry `crucifixion-of-jesus` (/timeline/#crucifixion-of-jesus; #93 shape). Not rendered.
# Issue #232 (from #108), “Timeline Entry: The crucifixion of Jesus”. Issue notes: kind event; tradition as stated “April 3, 33 CE (lunar-eclipse argument)”; critical as stated “the 30s CE; exact date unknown”; sides “both, weakly”: April 3, 33 CE is stated only to be rejected, so a Tradition Date needs a Tradition source holding it in its own words; no critical year stated on the show, so likely a period or a “no exact date” statement; NABRE NT introductions outside the window (#86), not used; date one thing (ministry or execution): this entry dates the execution only; Pilate's prefecture bounds it but no published entry covers it (no anchor, no seeAlso; the 26–36 CE prefecture is cited through Britannica's own sentence); crowding of CE entries is #175.
# Shape decision (step 2): `critical`, display “c. 30 CE”, `from: 30`, `precision: year`. The issue's prediction (a period or “no exact date”) is overridden by the sourcing test: Britannica (Reference) gives “died c. 30 CE” in the lede in its own voice, and Ehrman's OUP companion summary (Reference) says “Scholars agree that Jesus died around 30 CE”. Britannica's summary narrows it to the Passover “Sometime between 29 and 33 CE—possibly 30 CE” at which he was “arrested, tried, and executed”, so the date is the execution's, not only the death's (critical-scope). Bond 2013 (Scholarly, NTS) argues in her own voice that the precise date “can no longer be recovered” and allows only “any time between 29 and 34 CE”: that is shown in the note, attributed, as the limit on the display's “c.”. No `to`: Britannica's 29–33 and Bond's 29–34 are different ranges, so neither is made the span; the display is the form both Reference sources give.
# #99: no Scholarly or Reference source read gives a different year in its own voice. Bond reports the two most popular dates (7 April 30 and, for a smaller group, 3 April 33) and accepts neither; both reports are in the note, attributed. The 33 CE scholarly proponents (Humphreys and Waddington, Nature 1983 and Tyndale Bulletin 1992; Hoehner 1977) are outside the window or not read (leads). Encyclopaedia Judaica “Crucifixion” (“It seems reasonable, therefore, that the crucifixion took place in the year 30 c.e.”) agrees (uncited). Chadwick (BYU Studies) also argues AD 30 but argues partly from Latter-day Saint scripture (uncited).
# Attribution: the note says “Britannica”, never a named author: the byline and JSON-LD author rotate per load (birth-of-jesus review; this pass saw Pelikan on the Scribes-and-Pharisees page), although a section sign-off “E.P. Sanders” is printed after “The Resurrection”. Bond is the guest who speaks the E48 Trigger Claim; she is not a Host, and her NTS article is an External Source in its own right (the Trigger Claim is shown apart from the note).
# Tradition: Trigger Claim 109@00:19:41 names April 3, 33 CE to reject it; recorded `states: tradition` on the E138 Exodus and E183 Flood precedent (a host stating the other side's date to reject it). Got Questions (Tradition, registry string reused: “Got Questions Ministries, an evangelical ministry”; About page: “We are Christian, evangelical, theologically conservative, and nondenominational”) holds “Friday, April 3, AD 33” in its own voice. Its argument is the Passover plus John the Baptist's start, not the eclipse; the page itself names the AD 30 alternative and prefers 33 (“The later date seems more in keeping with the historical record”, uncited). Display “April 3, 33 CE” (CE for the Timeline's era style; the day is the source's). Middles 30 and 33 are under 30 years apart, so the Tradition Date stays beside the entry (#214).
# Trigger Claims (#99, three): 48@00:03:49 (critical; Helen Bond: “walked the Galilean hills in the 30s CE and … was executed on a Roman cross”), 86@00:39:25 (critical; McClellan: Josephus born around 37 CE, “a handful of years after Jesus was probably crucified”), 109@00:19:41 (tradition; McClellan: “it was not April 3, 33 CE, because a lunar eclipse does not cause darkness”). Hedges and context dropped by trimming: 48 opens “Yeah, a good point. That scholars get so used to …” and goes on (“a real man in the 30s”); its decade covers the ministry and the execution together. 86's “probably” is kept; the line is a Who's That on Josephus, the crucifixion is a relative aside. 109 sits in an Easter-date segment: Beecher's turn before (00:19:20) says “We don't know the date of the actual resurrection … the killing of Jesus”, and after (00:19:51) “because we don't know the actual date”; “We've been through that one” points to E90.
# Read: E48 00:02:01–00:07:43; E86 00:37:43–00:41:31; E109 00:15:41–00:20:59; E90 00:23:03–00:31:30 (the NASA lunar-eclipse list, “Crucifixion of Christ?”; the eclipse started around 6:20 pm in Jerusalem; no year stated except the garbled “04343” in the transcript at 00:23:38, not stored); E50 00:37:40–00:38:35 (apologetic eclipse-year attempts; no year) and 00:49:39–00:50:08 (Friday; no year); E16 (Apostlepalooza!, episode 16 per data/processed-videos.json): no crucifixion date found by search (00:57:24 mentions “the years between the death of Jesus and the writing of Romans”, no year); “Don't Get Cross With Me” 00:08:27–00:09:21 (“about 100 years after Jesus”; graffito dates, not the crucifixion); “Bring Me the Head of John the Baptist!” 00:09:33 (Antipas 4 BCE–39 CE; not the crucifixion).
# Dropped Trigger Claim leads: 109@00:19:20 and 00:19:51 (Beecher, “we don't know the actual date”: a verdict, no year; three suffice); E90 00:23:38 (garbled year in the transcript); E50 00:38:09 (no year); E80 00:42:59 (Jerusalem Council “in the 30s CE”: a different subject, flagged as a likely slip in the inventory).
# agent: the first pass (2026-11-26). Two research agents (critical side; tradition side) saved every fetched page into their own scratch folders (cruc-critical, cruc-tradition) and copied quotes only from the saved text; no setting agent (an event). The lead read Britannica “Jesus” in Claude in Chrome (script-blocked): /biography/Jesus and /biography/Jesus/Scribes-and-Pharisees; JSON-LD datePublished 1998-07-20, dateModified 2026-11-20; the lede is p.topic-paragraph, not the hidden AI Q&A block; in-tab document.body.innerText split counts 1 for each cited Britannica sentence; relevant paragraphs saved (cruc-lead/britannica-jesus.txt). Bond 2013 read as the Edinburgh Research Explorer PDF (author's peer-reviewed version; locators by section, not NTS page). Quotes script-matched from the entry file against the saved copies (whitespace, quotes, dashes, entities, NFKC, soft hyphens normalised): 9 hits, 0 misses, each once. Trigger Claims matched by script as substrings of their final Transcript lines at timestamp and speaker: 3 hits.
# owner: empty (""). The owner delegated the publish review (#93; extended to the Timeline, #110, 2026-11-23); a `delegation` block is added when the independent second agent pass has run.
# Flags for the second pass: (1) Display “c. 30 CE” against Bond's “the precise date can no longer be recovered … any time between 29 and 34 CE”: check “c.” is no stronger than the sources together, or narrow (e.g. to Britannica's own range). If the display is cut to nothing, the entry is re-tested, not reshaped. (2) Britannica's lede dates the death; check the “Summary of Jesus’ life” sentence pair ties the execution to that Passover, so the title passes critical-scope. (3) #99: check that Bond's reported 3 April 33 minority is a report, not a Critical Date of hers, and that no cited source gives 33 in its own voice. (4) Ehrman's “Scholars agree” is a consensus word in a source; the note attributes it to his companion summary. Check that is enough, given Bond's reported spread. (5) 109@00:19:41 `states: tradition`: the line rejects the date; check against the E138 / E183 precedents. (6) Got Questions' date: own voice? It names the AD 30 alternative in the next sentence; check that “April 3, 33 CE” as display is no stronger than “narrows down … to”. (7) Bond 2013's manuscript is the author's peer-reviewed version, not the NTS typeset text; check the quotes would read the same (no access to the typeset version expected).
# Second agent pass, 2026-11-26 (fresh agent; did not build the entry; read none of the first pass's scratch folders or files). Re-fetched into its own scratch folder (cruc-p2): Ehrman summary, Got Questions page and About page, Bond PDF by curl (200 each); Cambridge Core record via doi.org (abstract and citation metadata). Britannica /biography/Jesus and the OUP US catalogue page read in Claude in Chrome in tabs of this pass (closed after). Britannica JSON-LD on this load: datePublished 1998-07-20, dateModified 2026-11-20, author E.P. Sanders (rotates per load; the note keeps “Britannica”).
# Match counts. Britannica: in-tab document.body.innerText split counts 1/1/1 for the three quotes (the authoritative match; the saved excerpt file was copied from tab output, so a script match against it is circular). Other six: script-matched against the saved copies (whitespace, quotes, dashes, entities, NFKC, soft hyphens normalised): 6 hits, each once; 9 of 9 overall, every locator confirmed. Trigger Claims: script-matched as substrings of the final Transcript lines at timestamp and speaker: 3 of 3, each once; ~2 min either side read.
# Second pass changed: (a) entry note “possibly 30, when the Roman prefect was Pontius Pilate (ruled 26–36 CE)” → “possibly 30; the Roman prefect during Jesus' public career was Pontius Pilate (ruled 26–36 CE)” (Britannica's own scope). (b) Registry `bond-2013-dating-death` title “‘Dating the Death of Jesus’: Memory …” → “Dating the Death of Jesus: Memory and the Religious Imagination” (Cambridge Core citation_title and the manuscript's own title line; the quote marks came from the repository's citation string). (c) This file: Ehrman edition re-verified on the OUP US catalogue (Fifth Edition, 01 October 2020, ISBN 9780190089528); Bond edition notes the Cambridge Core metadata (59.4, 461–475, 2013/10). No citation cut; no Trigger Claim cut; keys unchanged.
# Second-pass rulings on the first-pass flags: (1) Display “c. 30 CE” kept: it is the form of Britannica (own voice) and Ehrman's summary (report of agreement); no cited source gives a rival year in its own voice; Bond's 29–34 contains 30 and is a limit on precision (she targets the day 7 April 30), shown in the note, attributed. (2) Pass: “While there he was arrested, tried, and executed” follows the dated Passover sentence; Bond's abstract (critical/7) names the crucifixion. (3) Pass: Bond reports 33 as the “smaller group”'s (and, uncited, “a sizeable minority of largely conservative scholars favour 33”); no cited source gives 33 in its own voice. (4) Pass: “Scholars agree” is the source's own sentence, quoted and attributed; #86 makes reasons required only when a source gives them; Bond herself calls the agreement “truly astounding” (uncited), so the report is not contradicted, only its confidence. (5) Pass: settled by the issue (#232) and the E138/E183 records. (6) Pass: own voice (see tradition/1). (7) Verified a difference: Cambridge Core's published abstract has “7 April 30 CE” where the manuscript has “7th April 30 CE”; the cited URL is the manuscript and the quote matches it; kept; body text of the typeset version not accessible.
# Flags for the lead: (1) critical/7 quote differs from the typeset NTS abstract (“7 April” vs “7th April”); fine against the cited manuscript URL, but don't relabel the source as the typeset version. (2) The trimmed lede quote “died c. 30 CE” also occurs in Britannica's hidden AI-summary block (“Bethlehem–died c. 30 CE”, en dash); not in innerText (count 1), the locator names the lede. (3) Check the rendered Sources line for Bond after the registry title change (quote marks dropped). (4) 109@00:19:41 rejects the eclipse argument; Got Questions argues from Passover and Luke 3:1, not the eclipse: same date, different argument; the Tradition card shows the date only. (5) Not re-fetched by this pass: the uncited items and the leads (Encyclopaedia Judaica, NCE, Bible Odyssey, Ligonier, AiG, ESV, RTB, TGC, ABR, Chadwick, Humphreys et al.); they back nothing on the page.
