  - "Hayes l21 ch. 2 [00:08:37]: “there is debate among scholars over the date of the Book of Job” and “the books reached their final form … only later, in the post-exilic period.” The second is about the Writings generally, not Job by name; the first adds nothing to l20."
  - "Coogan ch. 24 ¶ 2 on Elihu as a later addition, and ¶ 1 on Job as “a well-known ancient figure”: not needed for the date."
  - "Encyclopaedia Judaica, Ginsberg/Gruber “Job, Book of” (Encyclopedia.com): Uz in Edom; wealth “like that of the Patriarchs in Genesis”. Redundant with Newsom and Hayes for the setting."
  - "HarperCollins Bible Dictionary “Uz” on Bible Odyssey: “The location of Uz is uncertain.” Read as the reason Edom stays out of the setting display."
  - "Bible Odyssey dictionary “Job” and Linafelt “The Patience of Job”: no date or setting."
  - "Got Questions “Summary of the Book of Job” (Date of Writing) and “When was Job written?”: Moses c. 1440 BC or Solomon c. 950 BC, conditional on the author, and “we can't know the date of writing”. Not a Tradition Date."
  - "The Bible Says “Timeline of Old Testament Books”: “2000 BC Job”, hedged “it could be the earliest”; its About page names no tradition, so no holder in its own words."
  - "ICR, Morris, “Modern Science In An Ancient” (1994): “recorded in Job almost 4000 years ago”; needs a conversion to a year."
  - "Answers in Genesis, Oard “Where Does the Ice Age Fit?”: “written about 500 years or so after the Flood”; a year only by chaining to AiG's Flood date. AiG “Book of Job: Fact or Fiction”: date unknown."
  - "Babylonian Talmud Bava Batra 14b–15a (Sefaria): Moses wrote Job; rabbis place Job's lifetime from Moses to the return from exile, or call him a parable. Authorship and lifetimes, no year for the writing."
  - "CMI Paul 2010, concluding section: “A number of features in Job point toward a date in the second millennium shortly after the time of Israel's patriarchs.” Ambiguous between setting and writing; tradition/1 used instead."
  - "Dates for when Job lived (AiG Kids c. 2100 BC, Ligonier 2100–1800 BC, Insight for Living 2100–1900 BC, Got Questions c. 2200 BC, Bible Hub): events, not the writing."
  - "MacArthur Study Bible, GTY Q&A, ESV Study Bible (BLB), CSB Apologetics: no date for the writing."
