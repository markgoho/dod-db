# Review record for the Timeline Entry `job` (/timeline/#job; #93 shape). Not rendered.
# agent: the first pass (#186, 2026-11-26). It does not count toward publish.
# owner: empty (""). The owner delegated the publish review (#93; extended to the Timeline, #110, 2026-11-23); the `delegation` block records the independent second agent pass once it has run.
# Issue #186 instructions: a Tradition Date needs a trigger stating the tradition's side and a Tradition source giving a year; "oldest" alone gives none. Consider `anchor` to a Cyrus entry if one publishes first: there is no Cyrus entry, and no source names the Persian period, so no anchor.
# Sourcing test (2026-11-26): critical. NABRE (Reference) dates the composition outright, hedged only by "probably" (a hedge, not a condition), so the entry is `critical`, not `undated`: "Probably 7th–5th century BCE" in NABRE's own form, precision century, from -700 to -401 (the centuries' bounds, not years the source gives). The other sources' wider and differing views go in the note: Coogan (10th–3rd c. proposed; "for many an exilic date"), Hayes ("we really don't know its date … probably no earlier then the sixth century"), Newsom EoR ("early postexilic period"). Not treated as a split: only NABRE gives a range; the others are a spread of views and a lower bound, all in the note.
# The Trigger Claims say "Persian period, 539–332 BCE" and "one of the youngest". No source read names the Persian period or ranks Job among the youngest books; per CONTEXT.md the entry is worded for what its sources date, and the mismatch is left unexplained (#86), as in Lamentations.
# Setting: no source gives a year for the narrated period, so no from/to (no minimap span). Worded at Newsom's strength ("described in terms that evoke a patriarchal setting"), not "the patriarchal age"; Uz is in the display, Edom is not (flat in Hayes, "perhaps" in Bible Odyssey, "uncertain" in HarperCollins).
# Tradition: CMI (Paul 2010, Journal of Creation, republished on creation.com) is the only Tradition source found that gives an unconditional date for the writing: "presumably written in the second millennium BC". Shown as "2nd millennium BCE", from -2000 to -1001. Holder from CMI's "What We Are" page (https://creation.com/en/pages/what-we-are): "Creation Ministries International is a group of non-profit ministries in several countries." and "We are apolitical and non-denominational (as an organisation, not as individuals within it)."; the holder combines those two self-descriptions.
# First pass: three research agents (critical, tradition, setting) fetched every source on 2026-11-25/26 into separate scratch folders and copied quotes from the saved text; every quote then script-matched by the lead (whitespace, quotes, dashes, HTML entities normalised): 9/9, 0 misses. Trigger Claims matched by script against the final Transcript line (timestamp, speaker, verbatim text): 5/5.
# Flags for the second pass: (1) Tradition Date rests on one CMI article; "presumably" is kept out of the display (the schema has no tradition note), as "likely" is for Daniel's Got Questions date; the holder joins two sentences from the same CMI page; cut to uncited if either reads too strong. (2) NABRE: the research agents' fetches differed: one got the page via https://bible.usccb.org/bible/job/0.md on the first try, another got Cloudflare 403 on /job/0, a retry and /job/0.md. Retry the .md alternate, then Claude in Chrome, before treating critical/1 as unreadable. (3) Newsom EoR edition and year: the Encyclopedia.com page signs the entry "Carol A. Newsom (2005)" and labels it "Encyclopedia of Religion" with no edition; registry edition null, as for the Sperling EoR entry. (4) The note's "for many an exilic date" (Coogan) and "early postexilic" (Newsom) are attributed views in the note, not the display. (5) critical/3 keeps the transcript's "then" for "than". (6) Episode 150's claim is a passing clause inside a zodiac answer; kept as a Trigger Claim, since it asserts the date.
