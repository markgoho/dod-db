uncited:
  - "Allison 2015, Introduction, “What should one conclude?” ¶ 1: “Perhaps it would be prudent, given the extraordinary differences in learned judgement, to refrain from drawing too many conclusions regarding James.” About the letter as a whole, not its date alone; Britannica's “wide disagreement as to the date” carries the debate."
  - "Allison 2015, Introduction ¶ 1: “Informed scholars promote each possibility” (authorship). Authorship only; the note states no authorship verdict (header, #80)."
  - "Allison 2015, Introduction ¶ 6: “the majority of modern German scholars – maintain that James represents … a reaction … to later, post-70 (mis)interpretations of Paul”. A majority claim for one country's scholars, about the letter's target, not its date."
  - "Brosend 2015, deck: “The Letter of James is now recognized by many New Testament scholars to have been written by James, the brother of Jesus.” Authorship state-of-field claim that Britannica and Jackson-McCabe contradict (#80); not on the page."
  - "Brosend 2015, ¶ 2: “More recent interpreters of the letter have changed their minds and now realize there is nothing in the content of the letter that precludes it having been written before the Jewish War of 66-70 C.E.” A reported shift in the field, which Painter and Britannica don't share; not stated."
  - "Britannica, opening paragraph: “Thus, the Letter of James is usually understood to be pseudepigraphical”. Authorship only (header)."
  - "Jackson-McCabe, Bible Odyssey “James” (2020), “Did You Know?”: “The authenticity of the New Testament Letter of James was disputed in antiquity, and many historians continue to doubt it today.” Authorship only; no date for the letter."
  - "HarperCollins Bible Dictionary (on Bible Odyssey), “James, the Letter of”, ¶ 1: “seems to have been written for Jewish Christians in or near Palestine”. Addressees, no date; no Setting (header)."
  - "Ehrman Brief 5e ch. 18 summary, “The Epistle of James” ¶ 2: “there is little evidence to substantiate this claim” (authorship by Jesus' brother). No date for James; the summary's “near the end of the first century” is about Jude."
  - "Martin, Open Yale RLST 152 lecture 18, ch. 3–4: James and Paul; no date or authorship verdict."
  - "Got Questions “Summary of the Book of James”, “Date of Writing:”: “written perhaps as early as AD 45, before the first council of Jerusalem in c. AD 50”. Tradition source; lower bound only; Insight gives a range."
  - "ESV.org “Introduction to James” (Crossway): “It was probably written about A.D. 40–45”. Tradition source; page names no study Bible edition or author; Insight preferred."
