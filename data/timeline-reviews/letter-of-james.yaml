  - "Insight for Living, “James” book overview (insight.org/resources/bible/the-general-epistles/james; © 2010 Charles R. Swindoll, Inc.), section “Where are we?”, ¶ 1: “This council met in AD 49, meaning James likely wrote his letter in AD 45–48.” Was tradition/1. Second pass cut the Tradition Date: no Trigger Claim states the tradition’s side (170@00:08:53 names only “some scholars” for the early date); registry entry insight-swindoll-james removed. Holder wording was “Insight for Living, the Bible-teaching ministry of Pastor Chuck Swindoll” (banner re-verified; About page not re-read)."
