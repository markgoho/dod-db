# Review record for the Timeline Entry `letter-of-james` (/timeline/#letter-of-james; #93 shape). Not rendered.
# Issue #229 (from #108), “Timeline Entry: James”. Issue notes: kind composition; tradition as stated “James the brother of Jesus, so mid-1st century CE”; critical as stated “pseudepigraphic; beginning of the 2nd century. Scholarly proposals run from before 50 CE to 120–150 CE”; sides both; NABRE NT introductions are outside the 30-year window (#86), so not used; the Tradition Date needs a Tradition source giving a date, not only the attribution; the scholarly spread may mean the sources date it conditionally, “say so rather than forcing a year”; keep separate from the Death of James entry (#233, an event; not published, so no `anchor` or `seeAlso`): this entry dates the letter, not the man; CE crowding is #175. Id `letter-of-james` and title “Letter of James” (not bare `james`) keep it apart from #233. Overlaps: no published entry dates the letter; `acts` and `revelation` date other books; nothing contradicted.
# Sourcing test, 2026-11-26: met, as a `critical` entry. Brosend (Bible Odyssey 2015, Reference) dates the letter outright: “written sometime between 55 and 100 C.E.”, while calling it “a document of an uncertain age”. Britannica's editors (Reference) report “wide disagreement as to the date of composition” and that “many scholars hold” it was “likely penned at the turn of the 1st century” (hedged, a report). Painter (Bible Odyssey 2014, Reference) gives a lower bound only (“likely … after … 70 C.E.”). Allison (In die Skriflig 2015, Scholarly) gives the conditional date (“If the brother of Jesus wrote it … before the mid-60s. If, however, he did not … could be very late”) and reports second-century proposals; a conditional date is never a Critical Date (CONTEXT.md), so Allison is in the note only. Display “Between 55 and 100 CE” is Brosend's range, the only outright range read; Painter's after-70 and Britannica's turn-of-the-century both fall inside or at its end. `from: 55`, `to: 100`, `precision: period`. Not shown as #99 alternatives: no second source gives a range of its own; Painter's is a lower bound and Britannica's a hedged report. The second-century view is reported in the note (Allison's “Some informed voices”), not put in the display (the Acts ruling: a report alone doesn't carry a display alternative).
# State of the field (#80): no consensus word on the page. Britannica's “many scholars” is quoted in its citation and paraphrased as “many scholars” in the note, attributed to Britannica's editors. On authorship the sources disagree about the field: Brosend's deck says the letter “is now recognized by many New Testament scholars to have been written by James, the brother of Jesus”; Britannica says it “is usually understood to be pseudepigraphical”; Jackson-McCabe (Bible Odyssey 2020) says “many historians continue to doubt” it; so the note states no authorship verdict, only Allison's conditional date. The show's “majority of scholars … pseudepigraphic” and “scholarly consensus” (E170, E99) stay off the page.
# Setting: none. The letter narrates no period; its addressees (“the twelve tribes in the Dispersion”) are not a period, and the sources split on Palestine (HarperCollins dictionary entry) vs the diaspora (Painter). Dropped.
# Tradition: Trigger 170@00:08:53 states the traditional author's date (“if it was actually written by James, the brother of Jesus, it was obviously written in the middle of the 1st century CE”). Cited: Insight for Living's James overview (© 2010 Charles R. Swindoll, Inc.): “This council met in AD 49, meaning James likely wrote his letter in AD 45–48.” Display “Likely 45–48 CE” keeps the hedge. Holder in the ministry's own words from its site banner and About page, “The Bible-Teaching Ministry of Pastor Chuck Swindoll” (as the Acts first pass worded it). Alternatives (uncited): Got Questions “perhaps as early as AD 45” (lower bound only, no `to`; the upper bound is James's death); ESV.org “Introduction to James” (Crossway) “probably written about A.D. 40–45”, but the page names no study Bible or author. Tradition middle (46.5) and Critical middle (77.5) are 31 years apart, so the Tradition Date sits at its own year (#214), just.
# Trigger Claims (#99, one to three): E170 00:31:19 (critical, “beginning of the 2nd century when this was probably written”), E99 00:26:18 (critical, “opinion is … remarkably diverse”), E170 00:08:53 (tradition). Shown verbatim. Hedges dropped by trimming: E170 00:31:19 is introduced by “there are scholars who are going to say” (kept in the quote) and the turn goes on to “did James think that's really what Paul meant … that's a little more granular than I want to get”. E99 00:26:18 is McClellan reading Dale Allison's ICC commentary (2013) aloud (“As for the date of James, opinion is here, as on so much else, remarkably diverse. Here is a sampling”); the rest of the turn lists the proposals (120–150, before 50, 44–66 …) and the stored text stops before them; the ICC is not open, so the list is a lead, never a citation. E170 00:08:53 drops the sentence before (“if this was written in like the early to mid-1st century CE as as some scholars have argued, why did nobody talk about it”) and after (“there are a lot of scholars who think that it was not actually written by James. It is pseudepigraphic”).
# Dropped Trigger Claim leads: E99 00:27:17 (“the Catholic epistles … overwhelmingly probably second century”: all four, not James alone); E99 00:25:15 and E170 00:10:01 (authorship only: “scholarly consensus … not written by the brother of Jesus”, “majority of scholars are going to say it's pseudepigraphic”); E170 00:07:41–00:08:01 (first explicit reference by Origen, third century: reception, not a date of writing).
# agent: the first pass (2026-11-26). Two research agents (critical, tradition) saved every fetched page into their own scratch folders (james-critical, james-tradition); the lead agent read Britannica “Letter of James” in Claude in Chrome (curl 403 behind a Cloudflare challenge), saving the page's `article` p/h1/h2 innerText (1928 characters; both cited and uncited sentences also matched with includes() in the tab); JSON-LD datePublished 1998-07-20, no dateModified. Quotes script-matched by the lead agent from the entry file against the named saved copies (whitespace, quotes, dashes, entities, NFKC, soft hyphens normalised): 5 hits, 0 misses, each occurring once. Trigger Claims matched by script as substrings of their final Transcript lines at timestamp and speaker: 3 hits; E170 00:06:00–00:11:00 and 00:29:01–00:33:39, E99 00:22:34–00:27:31 read.
# owner: empty (""). The owner delegated the publish review (#93; extended to the Timeline, #110, 2026-11-23); a `delegation` block is added when the independent second agent pass has run.
# Flags for the second pass: (1) The display rests on one Reference article (Brosend), whose author holds that James the brother of Jesus wrote the letter (“I will stick with the tradition”); his range itself spans both authorship views. Check it carries the display, and whether the display should instead be an `undated` statement given “uncertain age”, Britannica's “wide disagreement” and Allison's “extraordinary differences in learned judgement” (uncited). (2) Brosend is professor of Homiletics (School of Theology, University of the South) and author of James and Jude (New Cambridge Bible Commentary, 2004): the #86 per-author check passes on the commentary; check. (3) Tradition side: the E170 00:08:53 turn frames the early date as what “some scholars have argued”, as the Acts second pass found for its Tradition Date (cut there). Kept here because the stored sentence names the traditional author (James the brother of Jesus) and Brosend himself calls that authorship “the tradition”; cut if in doubt. (4) Britannica's sentence is hedged (“probably … likely”) and a report (“many scholars hold”); backs the note only. Its datePublished 1998-07-20 is inside the ~30-year window just. (5) Painter's next sentence has a doubled “in in”; the cited span stops before it. (6) The note's “after the apostles' time” paraphrases Britannica's “post-apostolic”; check.
