# Review record for the Timeline Entry `bible-composition` (/timeline/#bible-composition; #93 shape). Not rendered.
# Issue #226 (from #108). Issue notes: the critical side is a span, not a date: decide whether the entry plots a range (earliest text to latest) or only the endpoints, and word it as what the sources date. #99 inconsistency in the show: E11 puts the Hebrew Bible's start at c. 600 BCE, E175 at c. 1000 BCE poetry, E115 "about a thousand to eleven hundred years" to Daniel. Overlaps: early end must agree with `hebrew-writing` ("Around 1000 BCE, or the 9th century BCE"); late end touches `daniel` (167–164 BCE), `revelation` and the unpublished New Testament complete entry (#230, same E175 lead at 00:15:14); not to be conflated with `christian-canon` (367 CE, a list). NABRE New Testament introductions are outside the 30-year window (#86). The Tradition Date needs a Tradition source holding the 1400 BCE–100 CE span in its own words.
# Shape chosen: one `critical` range, earliest texts to latest, placed by its start (from -1000). Britannica's "When was the Bible written?" answer (Reference) is the only source read that dates both testaments in one place, and it does so unconditionally: parts of the Hebrew Bible "perhaps" in the 10th century BCE, the New Testament's books "in the 1st and 2nd centuries CE". "Perhaps" is a hedge, not a condition (conditional-not-critical): the display keeps it. Not `undated`: no source says the span is dated only conditionally or not at all; Breed's "exact dates … unrecoverable" sits beside his own centuries (contrast `hebrew-language`, which went undated because its sources gave only lower limits).
# Sourcing test, 2026-11-26: met. Critical: britannica-bible (both ends), hayes-rlst145-l1 (approximately 1000 BCE, with "very diverse opinions"), breed-bo-written-transmitted (#99 split on the start: "many scholars now claim" the 8th or even 7th century BCE), ehrman-brief-5e-ch1-summary and neufeld-bo-nt-religious-text (New Testament 50–120 CE), martin-rlst152-l1 (50–150, "probably"), Breed again for the whole span ("over a thousand-year period", writing and editing). Tradition: gotquestions-how-old-is-the-bible gives both years itself, "around 1400 BC" to "around AD 90", with "around 1,500 years"; the display keeps "around". Its end year is 90, not the Trigger Claim's 100 CE; the entry follows the source (#80).
# Scope: worded for what the sources date: composition of the texts, earliest to latest. No "complete" wording and no 2 Peter in the title or display: Martin's 2 Peter date (l24) is his own view ("I believe"), Hultin's is hedged ("perhaps the end of the first century or even well into the second"); both uncited. Hebrew Bible-only spans (Coogan ch. 1 "written and collected over a thousand years", Rubin's sidebar) uncited: narrower subject, and Coogan's includes collecting. No author counts in the display or note: "40 authors" is the tradition's claim, and no Scholarly or Reference source read counts the Bible's authors (Ehrman counts the New Testament's only).
# Overlaps checked: `hebrew-writing` dates the earliest known Hebrew writing (around 1000 BCE or the 9th century); this entry dates composition, "perhaps the 10th century" by Britannica, so no contradiction; Rubin (cited there) adds that a few biblical texts "may have been composed a couple of centuries earlier". `daniel` 167–164 BCE agrees with Hayes's "the 160s BCE". `revelation` (toward the end of the 1st century) sits inside the 1st–2nd century end. Nothing here says when the canon or New Testament was complete (#230; `christian-canon`). No `anchor` or `seeAlso`: #230 is unpublished; `hebrew-writing` is a different subject.
# #99 on the show: Trigger Claims kept: E175@00:20:26 (critical: 1100 to 1200 years tops, 2 Peter 120–150, poetry going back to 1000 BCE) and E175@00:15:14 (tradition: "1400 BCE to 100 CE"). Not stored: E11@00:03:58 (Hebrew Bible only, "between around 600 BCE and down to around … 164-ish BCE"), E115@00:07:48 (Hebrew Bible only, "about a thousand to eleven hundred years … down to the book of Daniel"; the inventory's lead at 00:07:15 is a Dan Beecher question), E55@00:18:10 ("About a thousand years. Yeah.", answering a Beecher question), E137@00:32:59 (McClellan quoting the "1,500 years, 45 authors" meme; E175@00:15:14 already states the tradition's side). The gap between the show's 1000 BCE start and Breed's 8th–7th century alternative is left unexplained (#99, #86).
# agent: the first pass (2026-11-26, lead agent). Two research agents (critical; tradition) each fetched pages by curl into their own scratch folders (bc-critical, bc-tradition) and quotes were copied from that saved text; Britannica read by the lead in Claude in Chrome (refuses scripts) and the Top Questions box saved verbatim from the DOM text (bc-lead). One script matched every quote against its saved text (whitespace, quotes, dashes and HTML entities normalised): 9/9 hits, 0 misses, each occurring once; both Trigger Claims matched as substrings of their Transcript lines at timestamp and speaker: 2/2.
# owner: empty (""). The owner delegated the publish review (#93; extended to the Timeline, #110, 2026-11-23); a `delegation` block is added when the independent second agent pass has run.
# Flags for the second pass: (1) Britannica's answer is in a collapsed Top Questions box: get_page_text returns another article (the Dead Sea Scrolls); read document.body.textContent. Byline "Britannica Editors", last updated 19 November 2026. (2) Display "From perhaps the 10th century BCE, or the 8th or 7th, to the 2nd century CE": the "perhaps" scopes Britannica's start; the split is Breed's attributed "many scholars now claim"; check the display reads no stronger than either. (3) from -1000 / to 200 are the century bounds of "10th century BCE" and "2nd century CE", not years a source gives. (4) Hayes's "the Bible" in lecture 1 is the Hebrew Bible (an Old Testament course; "the last book within the Hebrew Bible"); the note says "the Hebrew Bible's writings". (5) Breed's span quote says "wrote and edited", so the note says "the writing and editing"; cut if it reads as a composition span. (6) Got Questions' end year is 90, the Trigger Claim's 100: shown as the source has it. (7) Neufeld's Bible Odyssey date: page metadata 2022-12-14 looks like a site-migration stamp; registry year stays null as for Breed.
# Independent second agent pass 2026-11-26 (#93 delegation, #110): a fresh agent that did not build the entry, working from its own scratch folder only (bc-p2). Re-fetched by curl (browser UA): oyc.yale.edu rlst-145/lecture-1 and rlst-152/lecture-1; bibleodyssey.org how-was-the-bible-written-and-transmitted and in-what-ways-is-the-new-testament-a-religious-text; learninglink.oup.com ehrman_briefnt5e chapter-1-summary; gotquestions.org how-old-is-the-Bible.html and about.html. HTML tags stripped, entities decoded. Britannica read in a new Claude in Chrome tab, document.body.textContent; passage saved; then in-page counts of both quotes (each twice: the rendered Top Questions box once, the FAQ JSON-LD once). Quotes re-matched by one script (NFKC, whitespace, curly quotes, dashes normalised): 9/9, each once in its saved text, each at its locator (chapter headings and paragraph positions checked). Trigger Claims re-matched by script as substrings of the line at that timestamp and speaker: 2/2; read 00:12:48–00:23:10.
# Second pass changed (entry note only; title, display, from/to, tradition display and holder unchanged; no citation or Trigger Claim cut): (a) “Breed says many scholars now date the earliest biblical texts to the 8th or even 7th century BCE” became “Breed says many scholars now claim the earliest biblical texts were written down in the 8th or even 7th century BCE” (Breed's verb). (b) “Ehrman's summary and Neufeld date the New Testament's books between about 50 and 120 CE” became “Ehrman's summary dates the New Testament's books between 50 CE and 120 CE, Neufeld between approximately 50 and 120” (each source's own hedge). (c) “…, and that the exact dates of composition are unrecoverable” became “…, and adds that the exact dates of composition are unrecoverable” (Breed's own sentence, not the many scholars'). (d) “Breed puts the writing and editing of both testaments at over a thousand years.” became “Breed says the writing and editing of the books of both testaments extended over a thousand-year period.” (“over a … period” is across, not more than).
# Second-pass rulings on the first pass's flags: (1) Confirmed: byline and Nov. 19, 2026 update; the passage is in DOM text and FAQ JSON-LD. (2) Accepted: the display reads no stronger than either source; “perhaps” is Britannica's and the “or the 8th or 7th” alternative is Breed's attributed claim. (3) Accepted: same century-bound convention as `hebrew-writing`, `job`, `aramaic-script`; `to` is not rendered (check-timeline.ts). (4) Accepted: Hayes's course and “the last book within the Hebrew Bible” make it the Hebrew Bible. (5) Kept, reworded (change c): Breed's sentence covers both testaments' writing and editing, which is what the note now says. (6) Accepted (#80: the entry follows the source). (7) Confirmed: Neufeld died 2015 and Breed's page carries the same 2022-12-14 publish stamp, so it is a migration stamp; year null right.
# Flags for the lead: (1) Britannica is Reference by precedent only (all Britannica registry entries; no explicit ruling on encyclopedias in #80/#86), and both its cites are the unsigned Top Questions box, not the article body. If ruled out: the start rests on Hayes (approximately 1000 BCE) and Breed (8th or 7th), the end on Ehrman, Neufeld and Martin (50 to 120 or 150), and the display's “perhaps” and “2nd century CE”, Britannica's words, need rewording. (2) Stored span is 1000 BCE–200 CE by century bounds; no named scholar's end goes past 150 (Martin), and Britannica's “2nd century” is the only source for the 200 bound. Fine while `to` is unrendered; revisit if the scale returns. (3) Ehrman 5th ed. year 2020 not re-confirmed from an OUP catalogue (pre-existing registry entry; #86 asks for it; univocality's scholarship review cites an earlier “OUP catalogue check recorded for this textbook”). (4) Got Questions ¶¶ 3–4 narrow its own dates to 1450–1400 BC and AD 90–95; display keeps ¶ 1's “around 1400 BC … around AD 90”. (5) Breed's ¶ 3 gives the traditional mid- to late second-millennium date (circa 1500–1200 B.C.E.) as what Christians and Jews traditionally held: a Reference source reporting tradition, not a Tradition source; correctly unused for the tradition lane.
