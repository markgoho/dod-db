uncited:
  - "Britannica “When was the Bible written?”: “The final redaction and canonization of the Torah … most likely took place during the Babylonian Exile (6th–5th century BCE). The entire Hebrew Bible was complete by about 100 CE.” Redaction and canon, not composition; and the subject of #230 and `christian-canon`, not this entry."
  - "Hultin, Bible Odyssey “2 Peter”: modern scholars “have often considered 2 Peter to be the latest of all the New Testament writings … perhaps the end of the first century or even well into the second century”. Hedged and names one book; the display's end rests on Britannica."
  - "Martin l24 ch. 4 [00:37:00]: “I believe 2 Peter was written sometime in the second century”; Martin l19 ch. 1: Pastorals “maybe even toward the middle of the second century … later than a lot of scholars would put them”. One scholar's own view; no 2 Peter claim on the entry."
  - "Coogan ch. 1 OUP summary: the Hebrew Bible “an anthology that was written and collected over a thousand years”. Hebrew Bible only, and includes collecting; Breed carries the span for both testaments."
  - "Rubin, Bible Odyssey, sidebar: the Hebrew Bible written “over a period of about a thousand years”; body: “a few biblical texts may have been composed a couple of centuries earlier” than 1000 BCE. Hebrew Bible only; hedged; cited on `hebrew-writing`."
  - "McCarter 2008 (Cambridge chapter summary): earliest poetry “may have been composed before the end of the second millennium BC”. Hedged twice; the entry's start rests on Britannica and Hayes."
  - "Frolov, Bible Odyssey “How Old Is the Song of Deborah?”: many scholars date Judges 5 to the 11th or even 12th century BCE; Frolov himself argues for around the Babylonian exile. One text's date, debated; not the Bible's span."
  - "Koosed, Bible Odyssey “Deborah”: body reports both views on Judg 5; the “Did You Know?” bullet (“The two oldest passages in the Bible are both victory songs attributed to women”) is unsigned box text and gives no date."
  - "Wright and Walker, Bible Odyssey “How Was the Bible Formed?”: “most scholars today now conclude that the first major period of literary production was … (eighth–sixth centuries B.C.E.)”. Co-author Walker is listed as a Ph.D. student (#86 per-author check); left uncited."
  - "Werrett, Bible Odyssey (scribes): earliest portions committed to writing “perhaps in the eighth to seventh centuries B.C.E.”. Agrees with Breed; Breed carries the split."
  - "NABRE notes on Exodus 15 (“regarded by many scholars as one of the oldest compositions in the Bible”), Judges 5, Genesis 49, Psalm 68, Deuteronomy 32: no dates; Exodus 15, Genesis 49, Psalm 68 and Deuteronomy 32 read in Chrome as typed excerpts only."
  - "Hayes l8 ch. 2: the oldest account of the sea event is Exodus 15; Tobolowsky (Bible Odyssey): Judg 5 “generally considered to be the oldest tribal text”. No dates; narrower subjects."
  - "Hayes l23 ch. 5 (Daniel the latest book, 167–164) and Coogan ch. 25: the Hebrew Bible's late end, covered by `daniel` and Hayes l1."
  - "Ehrman ch. 18 summary: 2 Peter not by Peter; Jude near the end of the first century. Authorship, no 2 Peter date."
  - "Got Questions “Who were the authors of the books of the Bible?”: “approximately 40 men … over the course of 1500 years”, with years only in the book list. The “How old is the Bible?” page states both years in its own sentence."
  - "Blue Letter Bible, Don Stewart, “The Bible’s Unique Design”: “a period of about fifteen hundred years … The Old Testament was written between 1400 and 400 B.C. The books of the New Testament were written from approximately A.D. 40 to A.D. 90.” Agrees with Got Questions; BLB's disclaimer says its authors' content is not necessarily affirmed by the ministry, so the holder would be Stewart, not a tradition; one Tradition source is enough (#86)."
  - "Christian Research Institute, Dean Davis, “One Shot, One Book, One God” (2004): “about 1,500 of them”, no start year."
