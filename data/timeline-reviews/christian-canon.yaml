# Review record for the Timeline Entry `christian-canon` (/timeline/#christian-canon; #93 shape). Not rendered.
# Issue #196 (from #108), “Timeline Entry: The Christian canon”. Issue notes: word for what the sources date (first list of the 27 books), not “the canon closed”; the Nicaea legend is not a tradition's date; a Tradition Date needs a Tradition source that holds an early canon, in its own words; latest entry, check the axis end and minimap.
# Sourcing test, 2026-11-26: met. Martin l2 (Reference, Open Yale intro lecture), Brakke 2010 (Scholarly, HTR) and Ehrman's OUP ch. 1 summary (Reference) date the list to 367 outright. Martin and Brakke say “extant” / “that survives” / “first extant … precisely”; Ehrman's summary says “not until 367”. The title follows the weaker pair: “Earliest surviving list of the 27 New Testament books”, not “the canon closed” or “first list”. Two non-Ehrman sources, since Ehrman is also a Trigger Claim speaker (E4).
# Note: each clause cited (Martin ch. 2 for the Easter letter and Alexandria; Martin ch. 4 for “not binding … So it didn't set the canon” and “never completely settled”). Hippo 393 and Carthage 397 are left out: of the sources read only Becerra (uncited) names Carthage, none Hippo. Nicaea is left out: no source read says Nicaea had nothing to do with the canon.
# Trigger Claims (#99, one to three): E4 00:27:39 (Ehrman, first to list the 27 books; the turn goes on “Athanasius didn't decide the canon. He gave his judgment on it, but his judgment eventually prevailed.”); E119 00:46:52 (367; the trimmed quote keeps its condition “If the Muratorian Fragment is late 4th century”; the turn's earlier sentences on the Muratorian fragment's date are dropped); E119 00:49:34 (states: both, apologists' end of first / beginning of second century, and “that's just not the case”). Not kept: E39 00:54:40 (“I believe”; dates Revelation's endorsement); E5 00:41:21 (the Nicaea legend, per the issue); E20 00:42:51 (“more or less”, no date); the inventory's other Episodes.
# Tradition: E119 00:49:34 states the apologists' side. Got Questions and Catholic Answers (read) date the 27 books to the fourth century, so they hold no early date (uncited). The Continuing Church of God's Statement of Beliefs (ccog.org) says the Bible “was finalized by the Apostle John” and links “The New Testament Canon” to cogwriter.com/canon.htm, which dates it: “finalized by the Apostle John in the late 1st century”, in a paragraph headed by “We in the Continuing Church of God believe”. Holder “the Continuing Church of God” is the church's own name on both pages. `from: 90` is a placement year for “late 1st century”, not a source year; it does not place the entry (the Critical Date does).
# CE axis: first entry after 165 BCE; the eras partial handles CE (labels “1–500 CE”); the axis grows to 500 CE. Check the minimap at publish and note on #175.
# agent: the first pass (2026-11-26). Two research agents (critical, tradition) saved every fetched page into their own scratch folders; the lead agent fetched ccog.org itself. Every quote script-matched (whitespace, quotes, dashes, entities normalised) against the saved texts: 7/7, 0 misses. Trigger Claims matched by script as substrings of their final Transcript lines at timestamp and speaker: 3/3.
# owner: empty (""). The owner delegated the publish review (#93; extended to the Timeline, #110, 2026-11-23); a `delegation` block is added when the independent second agent pass has run.
# Flags for the second pass: (1) Brakke is cited from the publisher page's open extract only; the full text is paywalled. Is a fully visible extract sentence “read in the source itself” (#80)? (2) Ehrman's summary lacks “extant”; it dates the same list flat. (3) The holder is one small church; its canon paper sits on cogwriter.com (Bob Thiel's site), tied to the church by the Statement of Beliefs link and the paper's “We in the Continuing Church of God”. Is that a Tradition source or an excluded personal site (#80, #86)? CARM, Ligonier, Answers in Genesis and Crossway were not reached. (4) Tradition display “Late 1st century CE, finalized by the Apostle John” dates the canon's finalizing, not a list; the issue allows “a Tradition source that holds an early canon”. (5) Note's “which was never completely settled for all Christians” follows Martin's “they never completely settled the question for all Christians everywhere”, said of the councils. (6) `related.books: [revelation]`: the Trigger Claims centre on Revelation's place in the list; drop if loose.
