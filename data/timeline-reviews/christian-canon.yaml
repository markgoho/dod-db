leads:
  - "Gallagher and Meade, The Biblical Canon Lists from Early Christianity (OUP 2017): Google Books returned a CAPTCHA, OUP an empty shell; no preview confirmed."
  - "Metzger, The Canon of the New Testament (1987): “the first time … exactly the twenty-seven books” seen only quoted on Christianity Today / Christian History Institute pages; also outside the 30-year window."
  - "Brakke, “Canon Formation and Social Conflict in Fourth-Century Egypt”, HTR 1994: paywalled; outside the 30-year window."
  - "Ehrman blog, “Was the New Testament Canon Really Closed in 367 CE?” (Hippo 393, Carthage 397/419): search snippet; blogs are excluded."
  - "McDonald, The Biblical Canon (2007), and McDonald and Sanders, The Canon Debate (lists appendix): cited by others, not read."
uncited:
  - "Becerra, “The Canonization of the New Testament”, in Blumell (ed.), New Testament History, Culture, and Society (BYU RSC / Deseret, 2019): “The first canon list to name all twenty-seven books of the New Testament as exclusively authoritative was written by Athanasius … AD 367 … later ratified by the Council of Carthage in AD 397”. Not cited: the author is listed as a PhD candidate, not a professional scholar (#80), so Carthage 397 has no qualifying source here."
  - "McDonald, “The New Testament Canon”, Bible Odyssey: “By the fourth century C.E., most Christians had accepted most of the NT writings, but canon lists varied well into the eighth or ninth centuries.” Not cited: does not name Athanasius or 367."
  - "Martin l2 ch. 2 on the Muratorian fragment (“composed around the year 200 or around the year 400 … probably the majority of scholars would say … a later period”). Not cited: the entry does not date the fragment."
  - "Got Questions, “What is the canon of the Bible?”: Hippo 393 and Carthage 397 “affirmed the same 27 books”; “The closed canon”: recognition “finalized by the early Christian church by the end of the fourth century”. Not cited: a fourth-century date, not the early canon the Trigger Claim states."
  - "Catholic Answers, “Who compiled the Bible and when?” (Rome 382, Hippo 393, Carthage 397, Trent 1546) and “Was the Canon of Scripture Determined before the Church Councils…?” (“not settled in the first years of the Church”). Not cited: fourth-century dates."
  - "Grace Evangelical Society (Wilkin 2025): AD 70 attributed to “many”; AD 70 or 95 to “some”. Not cited: attributed, not the source's own date."
  - "Kruger, Canon Fodder (2013): 22-book core “established and in place” at the end of the second century. Not cited: a blog, and a core, not the 27."
  - "Theology Matters (Hobson 2014): “closed but not settled” at the close of the second century. Not cited: not the 27 books."
  - "cogwriter.com/canon.htm: “the New Testament canon must have been finalized by the end of the first century A.D.” (an inference, “must have been”) and a block quote from Tomorrow's World (another publication's words). Not cited; the flat “late 1st century” sentence is."
