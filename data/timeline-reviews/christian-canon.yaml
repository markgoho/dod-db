# Review record for the Timeline Entry `christian-canon` (/timeline/#christian-canon; #93 shape). Not rendered.
# Issue #196 (from #108), “Timeline Entry: The Christian canon”. Issue notes: word for what the sources date (first list of the 27 books), not “the canon closed”; the Nicaea legend is not a tradition's date; a Tradition Date needs a Tradition source that holds an early canon, in its own words; latest entry, check the axis end and minimap.
# Sourcing test, 2026-11-26: met. Martin l2 (Reference, Open Yale intro lecture), Brakke 2010 (Scholarly, HTR) and Ehrman's OUP ch. 1 summary (Reference) date the list to 367 outright. Martin and Brakke say “extant” / “that survives” / “first extant … precisely”; Ehrman's summary says “not until 367”. The title follows the weaker pair: “Earliest surviving list of the 27 New Testament books”, not “the canon closed” or “first list”. Two non-Ehrman sources, since Ehrman is also a Trigger Claim speaker (E4).
# Note: each clause cited (Martin ch. 2 for the Easter letter and Alexandria; Martin ch. 4 for “not binding … So it didn't set the canon” and “never completely settled”). Hippo 393 and Carthage 397 are left out: of the sources read only Becerra (uncited) names Carthage, none Hippo. Nicaea is left out: no source read says Nicaea had nothing to do with the canon.
# Trigger Claims (#99, one to three): E4 00:27:39 (Ehrman, first to list the 27 books; the turn goes on “Athanasius didn't decide the canon. He gave his judgment on it, but his judgment eventually prevailed.”); E119 00:46:52 (367; the trimmed quote keeps its condition “If the Muratorian Fragment is late 4th century”; the turn's earlier sentences on the Muratorian fragment's date are dropped); E119 00:49:34 (states: both, apologists' end of first / beginning of second century, and “that's just not the case”). Not kept: E39 00:54:40 (“I believe”; dates Revelation's endorsement); E5 00:41:21 (the Nicaea legend, per the issue); E20 00:42:51 (“more or less”, no date); the inventory's other Episodes.
# Tradition: E119 00:49:34 states the apologists' side. Got Questions and Catholic Answers (read) date the 27 books to the fourth century, so they hold no early date (uncited). The Continuing Church of God's Statement of Beliefs (ccog.org) says the Bible “was finalized by the Apostle John” and links “The New Testament Canon” to cogwriter.com/canon.htm, which dates it: “finalized by the Apostle John in the late 1st century”, in a paragraph headed by “We in the Continuing Church of God believe”. Holder “The Continuing Church of God” is the church's own name on both pages. `from: 90` is a placement year for “late 1st century”, not a source year; it does not place the entry (the Critical Date does).
# CE axis: first entry after 165 BCE; the eras partial handles CE (labels “1–500 CE”); the axis grows to 500 CE. Check the minimap at publish and note on #175.
# agent: the first pass (2026-11-26). Two research agents (critical, tradition) saved every fetched page into their own scratch folders; the lead agent fetched ccog.org itself. Every quote script-matched (whitespace, quotes, dashes, entities normalised) against the saved texts: 7/7, 0 misses. Trigger Claims matched by script as substrings of their final Transcript lines at timestamp and speaker: 3/3.
# owner: empty (""). The owner delegated the publish review (#93; extended to the Timeline, #110, 2026-11-23); a `delegation` block is added when the independent second agent pass has run.
# Flags for the second pass: (1) Brakke is cited from the publisher page's open extract only; the full text is paywalled. Is a fully visible extract sentence “read in the source itself” (#80)? (2) Ehrman's summary lacks “extant”; it dates the same list flat. (3) The holder is one small church; its canon paper sits on cogwriter.com (Bob Thiel's site), tied to the church by the Statement of Beliefs link and the paper's “We in the Continuing Church of God”. Is that a Tradition source or an excluded personal site (#80, #86)? CARM, Ligonier, Answers in Genesis and Crossway were not reached. (4) Tradition display “Late 1st century CE, finalized by the Apostle John” dates the canon's finalizing, not a list; the issue allows “a Tradition source that holds an early canon”. (5) Note's “which was never completely settled for all Christians” follows Martin's “they never completely settled the question for all Christians everywhere”, said of the councils. (6) `related.books: [revelation]`: the Trigger Claims centre on Revelation's place in the list; drop if loose.
# Independent second agent pass 2026-11-26 (#93 delegation, #110): a fresh agent that did not build the entry, working from its own scratch folder only. Re-fetched every source from its URL: oyc.yale.edu RLST 152 lecture 2; the Cambridge Core HTR article page; the OUP Learning Link ch. 1 summary; ccog.org/statement-of-beliefs (body from ccogorg.ccogdr.eu) and the church's About page (ccogorg.ccogdr.eu/about-the-continuing-church-of-god/); cogwriter.com/canon.htm and the cogwriter.com home page. Quotes re-matched by one script (tags stripped, inline tags such as Brakke's small-caps “c.e.” span removed without a space; entities, whitespace, curly quotes and dashes normalised): 7/7, 0 misses. Locators checked by position: Martin's three quotes sit between the right chapter headings (ch. 2 [00:16:17]; ch. 4 [00:32:50], two consecutive paragraphs); Ehrman's under “The Development of the Christian Canon”, before “Implications for Our Study”; Brakke's in the page's “Extract” block; CCOG's under “THE HOLY BIBLE”; Thiel's at a <P> that opens “We in the Continuing Church of God believe that view”. Trigger Claims re-matched by script as normalised substrings of the line at that timestamp and speaker: 3/3; read about two minutes either side (E4 00:25:51–00:30:16; E119 00:44:24–00:51:46).
# Second pass changed: (a) note narrowed: “did not set the canon, which was never completely settled for all Christians” became “did not set the canon, and says bishops' and councils' decrees never completely settled the question for all Christians”; Martin's subject is the bishops' and councils' decrees, and he goes on to say the 27 books are “generally” accepted by all churches (flag 5). (b) Brakke locator: “p. 47, opening paragraph” became “opening paragraph, second sentence (publisher page extract; article pp. 47–66)”; the page shows no page number, p. 47 was inferred from the range, and the quote is the extract's second sentence, not its first. (c) tradition/1 note corrected: the canon link is in the next sentence, not a continuation of the quoted one. No citation cut; no Trigger Claim cut.
# Second-pass rulings on the first pass's flags: (1) Brakke kept. The sentence is the article's own text (footnote anchor 1 follows the next sentence), shown in full on the publisher's page with no login: a publisher preview (#80), not a cut-off snippet (#86). (2) Ehrman kept: “not until 367 … listed” dates the same list; the title rests on Martin's and Brakke's “extant”. (3) cogwriter kept as Tradition. #80 excludes blogs, not a church leader's site as such; canon.htm is a standing paper (revision line 2004–2021 0414), not a dated item in the site's news feed. Adoption: the Statement of Beliefs' “THE HOLY BIBLE” paragraph links “The New Testament Canon” to cogwriter.com/canon.htm. Standing: the church's About page says “the Continuing Church of God is led by its overseer and pastor, the evangelistic prophet Bob Thiel”. The cited paragraph speaks as “We in the Continuing Church of God” and links that name to ccog.org. (4) Tradition display kept: CCOG gives “finalized by the Apostle John”, Thiel “finalized by the Apostle John in the late 1st century”; the display says no more. (5) Narrowed, change (a). (6) `related.books: [revelation]` kept: two of three Trigger Claims are about Revelation's place in the list.
# Flags for publish: (1) the two lanes date different things: the Critical Date dates the earliest surviving list, the Tradition Date the canon's finalizing. The display says “finalized”, and the issue allows a Tradition source that holds an early canon. (2) `from: 90` is a placement year for “late 1st century”, not a source year; the Critical Date places the entry. david-and-solomon dropped a bound like this at publish; consider it here if the lane renders it as a year. (3) The holder is one small church whose canon paper is its leader's own site; kept on the evidence in ruling (3). If the publisher reads #80's blog exclusion as covering single-author sites, cut tradition/2, and with it the whole tradition block: no other source read gives a date. (4) First CE entry: check the axis end and minimap at publish and note on #175 (first-pass header).
# Publish resolutions, 2026-11-26 (lead agent, on the second pass's flags): (1) the two lanes date different things (earliest surviving list; the canon's finalizing): kept, the tradition display says “finalized” and the issue allows a Tradition source that holds an early canon. (2) `from: 90` kept: TraditionSchema requires a year; it is a placement year for “late 1st century”, not a source year, and does not place the entry (the Critical Date does). (3) cogwriter kept as a Tradition source: the church's own Statement of Beliefs links it as its New Testament Canon page, the church's About page names Thiel its overseer, and the cited paragraph speaks for the church; ccog-statement-of-beliefs carries “finalized by the Apostle John” on the church's own site. (4) CE axis checked in the /timeline/ preview. Note's “, and says” changed to “; he says” (grammar only). draft dropped.
