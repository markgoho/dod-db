# Issue #195 (from #108), “Timeline Entry: Revelation”. Issue notes: kind composition; tradition as stated “the apostle John; preterists date it before 70 CE”; critical as stated “early 90s CE under Domitian; a different John from the Gospel's author”; NABRE NT introductions are outside the 30-year window (#86), so another Reference or Scholarly source; the Tradition Date needs a Tradition source holding the early date, named in its own words; setting (Patmos, the author's own time) optional; sits near 70 CE on the minimap, CE crowding is #175.
# Sourcing test, 2026-11-26: met. Three Reference sources date the composition outright to the end of the first century: deSilva (Bible Odyssey, “toward the end of the first century C.E.”), Ehrman's OUP ch. 19 summary, opening sentence (“Near the end of the first century”), Martin RLST 152 l23 (“More tend to believe that it's written toward the end of the century”). Display “Toward the end of the 1st century CE”, worded for the sources, not the show's “early 90s” / “90s … Domitian”: no source read names Domitian or a 90s year outright; the only one that does (Ehrman summary) hedges twice (“may”, “perhaps … ca. 95 CE”). `from: 90`, `precision: period` is a placement year for “toward the end of the 1st century”, not a source year (same convention as christian-canon's tradition `from: 90`); no `to`.
# Split (#99): the sources disagree on how scholars divide. Martin: “Some” date it to the 60s under Nero, “More” to the end of the century. Ehrman's summary: “Most scholars agree that parts” date to the 60s, other parts “may” be later, “perhaps” under Domitian; the same summary's opening dates the book as a whole to the end of the century. Not harmonised: the display follows the outright end-of-century statements (three sources), and the note gives the 60s view and Ehrman's composite view, each attributed and cited (critical/4–6). Flag for the second pass whether the 60s view belongs in `display` as an alternative (“60s or end of the 1st century CE”) instead of the note.
# Author: the note's last sentence (not John son of Zebedee, not the Gospel's author) is stated outright by Martin l24 and the Ehrman summary (critical/7–8); in scope because the issue's critical side names it. McGrath (Bible Odyssey, “Which John?”) agrees (uncited, author only).
# Setting: “the author's own time, with John on the island of Patmos”, no year (#167 §4: no span on the minimap). Martin l23 ch. 1 (“He actually places it in his own time”); Boxall (Bible Odyssey) for Patmos, quoting Rev 1:9. Martin's l23 ch. 4 “imprisoned on the isle of Patmos” not used: it says more than Rev 1:9.
# Tradition: Trigger 119@00:17:27 states the preterists' side (“folks who want to put Revelation prior to 70 CE”). Cited: Keith Mathison, “Understanding John's Prophecy”, Tabletalk (Ligonier Ministries), 2012: a minority “argue that the book of Revelation was written between AD 64 and 70 … I am convinced that the arguments for an early date are much stronger”. He holds the early date in his own voice and the 64–70 range is the one he adopts. Holder names Mathison, not Ligonier: Ligonier's own devotional “Reading John's Prophecy” says “We will tentatively assume the later date”, so “Ligonier holds” would be false. Ligonier's self-description from its Who We Are page: “Ligonier Ministries is the international Christian discipleship organization founded by theologian Dr. R.C. Sproul.” The issue's “the apostle John” (traditional authorship) is not shown: the Tradition Date is a date only.
# Alternative Tradition source (uncited): Kenneth L. Gentry Jr., Postmillennial Worldview (GoodBirth Ministries) holds the early date outright and calls his view “an evangelical preterism”, but gives only upper bounds (“prior to … August, A.D. 70, and even the death of Nero Caesar in June of A.D. 68”), and the schema needs a `from`. Mathison gives a range in his own article.
# Trigger Claims (#99, one to three): E39 00:07:24 (critical, “early 90s CE”, shown verbatim though the sources say end of the century); E98 00:49:51 (critical, “late 1st century CE”); E119 00:17:27 (tradition). Hedges dropped by trimming: E39 drops “Yeah, well, it's. It's loaded with beasts and dragons. The.” and the next turn's caveat that Domitian's reign “is not as … handy an anchor for dating the text. But most scholars think it's probably right around there”; E98 drops “Yeah, yeah. And something I've mentioned in a lot of videos:”; E119 drops “Yeah. And okay,” and the rest of the turn (“you won't see many preterists say that Revelation comes from the 90s CE”).
# Dropped Trigger Claim leads: E39 00:07:55 (“a small minority of scholars who think it predates 70 CE … preterist camp”: frames the early date as a scholars' minority; E119 states the preterists' side more directly); E4 00:15:17 (Bart Ehrman, “written in the 90s when the Emperor Domitian was the ruler”: Ehrman's summary is a cited source, and two critical Trigger Claims from McClellan suffice); E9 00:25:21 (Nero died “before the book of Revelation was written, or so the story goes”, no date); E118 00:27:20 (“Revelation is about the late 1st century CE”: what it is about, not when written); E128 (no dating hit found for Revelation); E178 00:25:18 (authorship only, “a dude named John”); E156 (traditional authorship only, per the inventory).
