uncited:
  - "Martin l24 ch. 1: “One way to think about this is if this document was written toward the last part of the first century, as a lot of scholars think it is, he may--” Conditional and breaks off; critical/3 carries the same view outright."
  - "Martin l23 ch. 4: “He says he was imprisoned on the isle of Patmos in the Mediterranean when he wrote this” — “imprisoned” goes beyond Rev 1:9; setting/2 used instead."
  - "Ehrman ch. 19 summary: “The second section (chapters 2–3) contains seven letters addressed to seven churches in Asia Minor” — structure, not date or setting time."
  - "Frankfurter, Bible Odyssey “The Seven Cities of Revelation”: “Both such conflicts make sense in the later first century CE in Asia Minor” dates the conflicts, not the writing; page gives degrees, no current post."
  - "McGrath, Bible Odyssey “Which John?”: “So it is extremely unlikely that the same person wrote all of these books.” Author only; critical/7–8 carry it."
  - "Gentry, Postmillennial Worldview “Revelation's Date: Internal Evidence (3)” (2020): early date with upper bounds only (June 68 / August 70); no start year. See header."
  - "Ligonier devotional “Reading John's Prophecy”: “We will tentatively assume the later date” — why the holder is Mathison, not Ligonier."
  - "Hanegraaff, CRI “Dating the Book of Revelation” (2009): calls the late date “untenable” but states no positive date of his own."
  - "GotQuestions “Book of Revelation” and “When was Revelation written?”: 90–95 (A.D.); a Tradition source holding the late date, not the preterist side the Trigger Claim states."
