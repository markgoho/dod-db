# Review record for the Timeline Entry `david-and-solomon` (/timeline/#david-and-solomon; #93 shape). Not rendered.
# Issue #188 (from #108), “Timeline Entry: David, Solomon and the united monarchy”. Issue notes: two subjects in one row; word the title for what the sources date (#99); the undated part gets no entry; reuse sources from the `david-and-the-united-monarchy` Scholarship Page; “probably undated for the united kingdom”.
# Shape, 2026-11-25: the checker allows `critical` or `undated`, never both, and CONTEXT.md (an entry is worded for what its sources date) and #99 (the undated part has no row) settle which wins. Scholarly and Reference sources date David and Solomon flat (below), so the entry is `critical`, titled for their reigns, not for “the united monarchy”. The united kingdom is not dated by the sources as a historical entity (they debate whether it existed); it gets no entry of its own, and the note says the dating sources differ on it. The issue's “probably undated” guess is not taken: an undated entry would have to be the united kingdom, which the sources neither date nor call not-historical (verdict enum no-firm-date / not-historical fits neither “debated”).
# Sourcing test, 2026-11-25: met. HarperCollins (Reference) dates David's reign ca. 1010–970 BCE and Solomon's to the second third of the tenth century; Coogan and Chapman (Reference) place David at the beginning of the tenth century; Finkelstein (Scholarly) calls tenth-century Jerusalem “the city of the time of David and Solomon”; Sergi (Scholarly) speaks of “David’s kingdom in the tenth century BCE”. Display is the umbrella “10th century BCE” all four share; the note gives the dictionary's ca. 1010 start (strictly late 11th century), so nothing is hidden. `from: -1010` follows that start.
# Dropped as conditional or attributed (conditional-not-critical): McKenzie's “around 1000 B.C.E.” is what “The Hebrew Bible credits him with”; Garfinkel's “about 1000 BC” is “According to the biblical account”; Mazar's Part 4 “the supposed time” / “alleged time of David and Solomon”; Nakhai's “era of the united monarchy … much of the 10th century” sits beside a historicity hedge and dates the era, not the reigns. All under `uncited`.
# Trigger Claims (#99: one to three, a date or datable verdict on the row's subject): E181 00:54:20 (David around 1000 BCE), E64 00:57:17 (a historical David more likely than not), E133 00:35:57 (tradition: Saul, David and Solomon in the 10th century). Not kept: E169 00:15:59 (the issue's lead) and E64 00:47:01 are verdicts on the united kingdom only, not on the entry's subject; the entry names no date for the kingdom, so they would attach to nothing dated.
# Tradition: E133 states the tradition's side. Got Questions gives David 1009–969 and Solomon 971–931; display spans both reigns. Got Questions pages differ among themselves by a year or two (“When was Psalms written?” 1010–970; “When was 2 Samuel written?” approximately 1011–971); only the kings page is cited (under `leads`/`uncited`).
# agent: the first pass (2026-11-25). Quotes script-matched against saved copies of each source (whitespace, quotes, dashes, entities and line-break hyphens normalised): zero misses. Pages from the PDF running heads (Finkelstein/Mazar/Schmidt volume; Sergi). Trigger Claims matched by script as substrings of their Transcript lines.
# owner: empty (""). The owner delegated the publish review (#93; extended to the Timeline, #110, 2026-11-23); a `delegation` block is added when the independent second agent pass has run.
# Flags for the second pass: (1) is “10th century BCE” right as display when HarperCollins starts David at ca. 1010 (11th century) — alternative: “About 1010–930 BCE”, but no Scholarly or Reference source read gives Solomon's end year except Hayes l14's “when Solomon died in 922” (uncited)? (2) Coogan's sentence is governed by “it is likely”; the hedge is on David's power, the date phrase is taken for granted. (3) Finkelstein and Sergi date the reigns only in subordinate phrases. (4) Note's “far from the one the Bible portrays” paraphrases Mazar's “far from the rich and widely expanding state portrayed in the biblical narrative”. (5) Registry title for finkelstein-2007-quest-solomon may be wrong: the volume's contents list calls the essay “King Solomon’s Golden Age?: History or Myth?”; “The Truth about King Solomon” is its running head (research agent's finding; not fixed here).
# Independent second agent pass 2026-11-25 (#93 delegation, #110): every source re-fetched from its URL (Bible Odyssey entry pages /dictionary/david/ and /dictionary/solomon/; OUP ch. 14 summary; Got Questions kings page and About page; SBL ICI PDFs via pdftotext, page by page). All nine quotes re-matched by script (whitespace, quotes, dashes, entities, inline tags, soft and line-break hyphens normalised): 9 hits, 0 misses, each at its locator (HarperCollins opening sentences of both entries; Coogan para. “As with the earlier works”; Finkelstein printed p. 113, PDF p. 124, head “The Truth about King Solomon 113”; Sergi printed p. 298, PDF p. 320, §6.2.5; Schmidt printed p. 101, PDF p. 112; Mazar printed p. 139, PDF p. 150; Got Questions David and Solomon paragraphs, separate paragraphs as located). All three Trigger Claims re-matched by script (timestamp, speaker, verbatim substring of the Transcript line), about two minutes either side read: 3 hits. Holder re-checked: About page has “Christian, evangelical, theologically conservative, and nondenominational”.
# Second pass changed: (a) Coogan (old critical/3) cut to `uncited`: “it is likely that” governs the clause that holds the date (“… at the beginning of the tenth century BCE”), so the date is hedged while the display is flat; no note sentence rested on it, and HarperCollins, Finkelstein and Sergi still carry the tenth century. Old critical/4–7 renumbered critical/3–6; `sources.coogan-brief-4e-summary-ch14` removed (no citation left). (b) Note narrowed: dropped “Scholars who place them in the tenth century differ on whether they ruled a united kingdom” (it generalised to “scholars” and put a tenth-century placement on Mazar, whose cited p. 139 sentence has no date and whose Part 4 calls the period “supposed”/“alleged”, see uncited); the Finkelstein clause is now attributed to Schmidt (“Schmidt summarises Finkelstein as upholding …”), since the quote is Schmidt's report; Mazar's clause now keeps his words (“far from the rich and widely expanding state portrayed in the biblical narrative”) instead of the paraphrase “far from the one the Bible portrays” (first-pass flag 4). Title, display, `from`/`to`, tradition and holder unchanged.
# Flags for publish: (1) display “10th century BCE” kept with `from: -1010`, `to: -901`, `precision: century`: HarperCollins (both entries), Finkelstein and Sergi all say tenth century; the note shows the dictionary's ca. 1010 start. `to: -901` is the century bound, not a source year (no Scholarly/Reference source read gives Solomon's end year; Merneptah's from/to use source years instead), and `from: -1010` sets the row in the late 11th century on the axis. Publisher's choice: keep, or set `to` to an attested bound. (2) Finkelstein (p. 113) and Sergi (p. 298) date the reigns only in subordinate phrases (an appositive; a “regardless of” clause); both flat and the authors' own, kept (first-pass flag 3). (3) Mazar (critical/6) dates nothing; cited for the note's Mazar clause only. (4) E64 00:57:17 gives no date: kept as a verdict on the row's subject (a historical David), critical side, under #99's “a date or a datable verdict on the row's subject”; E181 alone meets the entry rule if the publisher reads #99 more narrowly. (5) E133's “traditionally” states the tradition's side (CONTEXT.md: a Tradition Date shows only when a Trigger Claim states it); it alone carries the tradition block. (6) Registry title for `finkelstein-2007-quest-solomon` is wrong (confirmed): the PDF contents list (PDF p. 7) gives “King Solomon’s Golden Age?: History or Myth?” (p. 107) and the essay head “King Solomon’s Golden Age: History or Myth?”; “The Truth about King Solomon” is only its running head, and “The Rise of Jerusalem and Judah” is not in Part 4's contents. Not edited here: the id is shared with the published `david-and-the-united-monarchy` Scholarship Page. (7) check:timeline returns before the publish gate for a draft entry; this file was yaml-loaded and its keys checked against the entry separately.
# Publish resolutions, 2026-11-25: (1) `to: -901` dropped: no source gives it (the end of the century is not a source year); `from` moved from -1010 to -1000, the start of the displayed century: in the /timeline/ preview, -1010 filed the “10th century BCE” card under the 1500–1000 BCE era; display stays “10th century BCE”, the wording all three dating sources share, with the note carrying the ca. 1010 start. (2) Finkelstein and Sergi kept: flat, in the authors' own words. (3) Mazar kept for the note's Mazar clause only. (4) E64 00:57:17 kept as a datable verdict on the row's subject (#99); E181 alone meets the entry rule either way. (5) E133 kept as the tradition-side Trigger Claim. (6) finkelstein-2007-quest-solomon registry title: shared with the published Scholarship Page, so not changed here; filed as a follow-on issue. Coogan cut stands.
# Registry title fix (#200, 2026-11-27; owner delegated, #93/#110; no owner check): `finkelstein-2007-quest-solomon` was titled “The Rise of Jerusalem and Judah; The Truth about King Solomon (essays in Part 4)”. In FinkelsteinMazar.pdf all of this id's citations come from one essay, pp. 107–116 (Mazar's essay starts p. 117). Its head (PDF p. 118) reads “King Solomon’s Golden Age: History or Myth?” and the contents list (PDF p. 7) reads “King Solomon’s Golden Age?: History or Myth?”. “The Truth about King Solomon” is only the odd-page running head, and “The Rise of Jerusalem and Judah: The Missing Link” is a bibliography item (Levant 33, 2001; printed p. 204), not an essay in the volume. The registry title is now the essay-head form. The Scholarship Page's p. 107 locator dropped the running head as an essay name; this entry's locator (“p. 113”) is unchanged. Entry text, quotes and display are unchanged; closes publish flag (6). Independent second agent pass, 2026-11-27: a fresh agent given only the registry entry, the five locators and quotes under this id across this Timeline Entry and the david-and-the-united-monarchy Scholarship Page, and the PDF URL. It re-fetched the PDF by curl, ran pdftotext per page, and matched quotes by script (whitespace, quote and dash styles, line-break hyphens normalised): 5/5 hits, each on its printed page (printed = PDF − 11) inside pp. 107–116, and the parentheticals were accurate (“Let me begin at the end” opens the p. 107 paragraph; the “Back to History” section heading is at the foot of p. 114 and the section runs on to p. 115). Author on the byline; © 2007 on the copyright page. It recommended the essay-head form over the contents form, and that form was adopted.
# Split (#274, 2026-11-28; owner chose to keep this id, #219: a published id never changes): this entry is now David only, titled “Reign of David”; Solomon has his own entry, `solomon`. Moved out to `solomon`: old critical/2 (HarperCollins “Solomon”) and old tradition/2 (Got Questions Solomon paragraph). Old critical/3–6 renumbered critical/2–5. Note drops the Solomon dictionary clause; display “10th century BCE”, `from: -1000` and `precision: century` unchanged (HarperCollins ca. 1010–970, Finkelstein p. 113 and Sergi p. 298 all place David in the tenth century). Tradition now David's reign alone: “1009–969 BCE” (Got Questions David paragraph), so its middle sits about 40 years before the Critical Date's and the Tradition Date moves to its own row (#214). `watch` drops “Solomon”. Trigger Claims unchanged; E133 00:35:57 (“traditionally to Saul and David and Solomon”) also attached to `solomon`. Flags for the second pass: (1) Finkelstein p. 113 (“the city of the time of David and Solomon”) and Schmidt p. 101 (“the historicity of David and Solomon”) name both kings; kept here and cited on `solomon` too. (2) Note's Schmidt/Mazar clauses speak of David and Solomon and the United Monarchy; kept as the David entry's kingdom context.
