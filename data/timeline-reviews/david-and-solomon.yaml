# Review record for the Timeline Entry `david-and-solomon` (/timeline/#david-and-solomon; #93 shape). Not rendered.
# Issue #188 (from #108), “Timeline Entry: David, Solomon and the united monarchy”. Issue notes: two subjects in one row; word the title for what the sources date (#99); the undated part gets no entry; reuse sources from the `david-and-the-united-monarchy` Scholarship Page; “probably undated for the united kingdom”.
# Shape, 2026-11-25: the checker allows `critical` or `undated`, never both, and CONTEXT.md (an entry is worded for what its sources date) and #99 (the undated part has no row) settle which wins. Scholarly and Reference sources date David and Solomon flat (below), so the entry is `critical`, titled for their reigns, not for “the united monarchy”. The united kingdom is not dated by the sources as a historical entity (they debate whether it existed); it gets no entry of its own, and the note says the dating sources differ on it. The issue's “probably undated” guess is not taken: an undated entry would have to be the united kingdom, which the sources neither date nor call not-historical (verdict enum no-firm-date / not-historical fits neither “debated”).
# Sourcing test, 2026-11-25: met. HarperCollins (Reference) dates David's reign ca. 1010–970 BCE and Solomon's to the second third of the tenth century; Coogan and Chapman (Reference) place David at the beginning of the tenth century; Finkelstein (Scholarly) calls tenth-century Jerusalem “the city of the time of David and Solomon”; Sergi (Scholarly) speaks of “David’s kingdom in the tenth century BCE”. Display is the umbrella “10th century BCE” all four share; the note gives the dictionary's ca. 1010 start (strictly late 11th century), so nothing is hidden. `from: -1010` follows that start.
# Dropped as conditional or attributed (conditional-not-critical): McKenzie's “around 1000 B.C.E.” is what “The Hebrew Bible credits him with”; Garfinkel's “about 1000 BC” is “According to the biblical account”; Mazar's Part 4 “the supposed time” / “alleged time of David and Solomon”; Nakhai's “era of the united monarchy … much of the 10th century” sits beside a historicity hedge and dates the era, not the reigns. All under `uncited`.
# Trigger Claims (#99: one to three, a date or datable verdict on the row's subject): E181 00:54:20 (David around 1000 BCE), E64 00:57:17 (a historical David more likely than not), E133 00:35:57 (tradition: Saul, David and Solomon in the 10th century). Not kept: E169 00:15:59 (the issue's lead) and E64 00:47:01 are verdicts on the united kingdom only, not on the entry's subject; the entry names no date for the kingdom, so they would attach to nothing dated.
# Tradition: E133 states the tradition's side. Got Questions gives David 1009–969 and Solomon 971–931; display spans both reigns. Got Questions pages differ among themselves by a year or two (“When was Psalms written?” 1010–970; “When was 2 Samuel written?” approximately 1011–971); only the kings page is cited (under `leads`/`uncited`).
# agent: the first pass (2026-11-25). Quotes script-matched against saved copies of each source (whitespace, quotes, dashes, entities and line-break hyphens normalised): zero misses. Pages from the PDF running heads (Finkelstein/Mazar/Schmidt volume; Sergi). Trigger Claims matched by script as substrings of their Transcript lines.
# owner: empty (""). The owner delegated the publish review (#93; extended to the Timeline, #110, 2026-11-23); a `delegation` block is added when the independent second agent pass has run.
# Flags for the second pass: (1) is “10th century BCE” right as display when HarperCollins starts David at ca. 1010 (11th century) — alternative: “About 1010–930 BCE”, but no Scholarly or Reference source read gives Solomon's end year except Hayes l14's “when Solomon died in 922” (uncited)? (2) Coogan's sentence is governed by “it is likely”; the hedge is on David's power, the date phrase is taken for granted. (3) Finkelstein and Sergi date the reigns only in subordinate phrases. (4) Note's “far from the one the Bible portrays” paraphrases Mazar's “far from the rich and widely expanding state portrayed in the biblical narrative”. (5) Registry title for finkelstein-2007-quest-solomon may be wrong: the volume's contents list calls the essay “King Solomon’s Golden Age?: History or Myth?”; “The Truth about King Solomon” is its running head (research agent's finding; not fixed here).
