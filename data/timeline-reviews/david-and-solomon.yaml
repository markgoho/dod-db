  - "Mazar 2007 (Part 5, “The Divided Monarchy”), p. 161: “I still adhere to the concept of an Israelite United Monarchy in the tenth century”. Not in the registry; Mazar p. 139 carries his view."
  - "Hayes l14 ch. 3: “So, when Solomon died in 922 …”. Would give Solomon's end year; the umbrella display doesn't need it, and Hayes says the years are approximate."
