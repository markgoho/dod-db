leads:
  - "Foster, “Does the Apocalypse of Peter Help to Determine the Date of 2 Peter?”, in Frey, den Dulk and van der Watt (eds.), 2 Peter and the Apocalypse of Peter (Brill, 2019), pp. 217–260, doi 10.1163/9789004399549_010. Submitted manuscript at research.ed.ac.uk (files/32936291) and core.ac.uk (425532963): bot-check pages to curl and in Chrome; not read. Likely the strongest Scholarly source on the date."
  - "Frey, The Letter of Jude and the Second Letter of Peter (Baylor, 2018): cited by Rodenbiker; no open text; not read."
  - "Thornhill, 2 Peter (Cambridge): the publisher excerpt ends before its date section; not read."
  - "Bauckham, Jude, 2 Peter (WBC, 1983), 80–90 CE: reported second-hand by Mbuvi; outside the 30-year window (#86); not read."
uncited:
  - "Rodenbiker, Novum Testamentum 65 (2023) 109–131 (open access), pp. 123–124: “likely late (mid-second-century or later) date based on possible sources including the Apocalypse of Peter”. Hedged and conditional on possible sources, inside a list of reasons that “arguably preclude” Petrine authorship; the sentence is broken by a page break and footnotes. Not a Critical Date."
  - "Mbuvi, Jude and 2 Peter (New Covenant Commentary, Lutterworth 2016), introduction sample, p. 15: two camps, “early pre-70 CE dating” (Petrine) “versus pseudepigraphic writing which puts it between 70 CE and 125 CE”. Conditional on authorship; Mbuvi doubts pseudepigraphy (pp. 20–21). Not a Critical Date."
  - "Ehrman blog 2025, Paul-collection paragraph: “It is hard to imagine any such situation before the end of the first century, at best.” Earliest-possible bound only; flag 2."
  - "Ehrman blog 2025, Jude paragraph: “2 Peter is, as a consequence, later still.” Relative; Martin carries the Jude relation."
  - "Martin lecture 24, page overview: “2 Peter seems to be a letter dating from the second century, from the post-apostolic age.” Courseware summary, not the lecture transcript; the transcript sentence is cited."
  - "Britannica “Biblical literature”, section “The Letter of Jude” (datePublished 1998-10-19): “The date is probably near the end of the 1st century and before II Peter, which draws upon it.” Dates Jude; relative for 2 Peter; Martin carries the relation."
  - "Britannica “Letters of Peter”, closing sentence: doubts about authorship “as early as the 3rd century … reinforced by subsequent scholarship”. Authorship only."
  - "Hultin 2015, ¶ 1: “we have no explicit mention of 2 Peter until the early third century C.E.” Attestation, not composition."
  - "Ehrman Brief 5e ch. 18 summary: Jude “written near the end of the first century” and used by 2 Peter. Publisher paraphrase; no date for 2 Peter."
