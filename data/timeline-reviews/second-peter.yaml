# Review record for the Timeline Entry `second-peter` (/timeline/#second-peter; #93 shape). Not rendered.
# Issue #230 (from #108), “Timeline Entry: New Testament complete”. Issue notes: kind composition; tradition as stated “all 27 books written by the end of the 1st century CE (apologists; Wes Huff named)”; critical as stated “laughably untrue; some books early to mid 2nd century CE; 2 Peter 120–150 CE, probably the last New Testament text written” (E104); word for what the sources date, the composition of the latest NT book (likely 2 Peter), not the canon; overlaps `christian-canon` (367 CE, the earliest list; a different subject, not restated) and `revelation` (“Toward the end of the 1st century CE”; not the latest book on the critical view); same E175 lead as the Bible-as-a-whole entry; NABRE NT introductions are outside the 30-year window (#86), not used; “consider whether this is better as a note on a 2 Peter entry; decide at step 1”.
# Shape decision (step 1/2): a 2 Peter composition entry, id `second-peter` (not `2-peter`: an id starting with a digit is not a valid CSS id selector), title “2 Peter”. Reasons: (a) no source read dates “the New Testament complete” or “the last NT book” in its own voice; Hultin and Ehrman report it as what scholars have often or typically considered; so the latest-book claim is in the note only, attributed. (b) The NT's late end is already on `bible-composition` (Ehrman summary 50–120, Neufeld 50–120, Martin 50–150; Britannica “1st and 2nd centuries CE”); an NT-complete entry would restate it. (c) The sources date 2 Peter itself, and three Trigger Claims date 2 Peter. Fit with published entries: this entry's 2nd century and Ehrman's “around 120 CE or so” sit inside `bible-composition`'s late end (120 / 150); Martin's “decades after … the Book of Revelation” agrees with `revelation` (end of the 1st century); nothing about the canon list (`christian-canon`) is stated. Dropped from the issue's framing: the E175 00:15:14 Wes Huff claim (below) and “all 27 books”.
# Sourcing test, 2026-11-26: met, as a `critical` entry. Martin (Open Yale RLST 152 lecture 24, Reference) dates it outright in his own voice: “I believe 2 Peter was written sometime in the second century”. The HarperCollins Bible Dictionary (Reference) reports the usual view, “usually regarded as … written in the second century”. Britannica's editors (Reference) hedge: the two letters were “perhaps written during the early 2nd century”. Hultin (Bible Odyssey 2015, Reference) hedges: “difficult to say, but perhaps the end of the first century or even well into the second century”. Ehrman's blog (2025, his edited account of Forgery and Counterforgery, OUP) reports scholars' typical view, “written around 120 CE or so”. Display “Probably the 2nd century CE”: Martin's outright century, with “Probably” because every other source hedges or reports (“seems”, “usually regarded”, “perhaps”); `from: 101`, `to: 200`, `precision: century`. Not shown as #99 alternatives: Hultin's “perhaps the end of the first century” is a hedged possibility, not a range of its own, and sits in the note (as the James ruling on hedged reports). The show's “between 120 and 150” is not on the page: no source read gives that range in its own voice.
# State of the field (#80): no consensus word on the page. HarperCollins's “usually regarded”, Hultin's “often considered” and Ehrman's “typically considered” are each attributed in the note. The show's “agreed by the majority of scholars” (E104) stays off the page.
# Setting: none; a letter narrates no period. Tradition: none. No Trigger Claim states a tradition's side for 2 Peter's date: the only tradition-side claim in the issue, E175 00:15:14 (“he believes that 99% of all biblical scholars believe the 27 books of the New Testament were completed by the end of the first century CE, which is laughably untrue”), is McClellan reporting Huff's claim about what scholars believe of all 27 books, not a tradition's date for 2 Peter (same ruling as the Acts and James second passes); no tradition research agent was dispatched. E175 00:15:14's first sentence is already a `bible-composition` trigger (tradition).
# Trigger Claims (#99, three): 104@00:07:08 (critical), 175@00:20:26 (critical; also a `bible-composition` trigger, there with the full turn), 99@00:27:31 (critical). All Dan McClellan; all give 120–150. Hedges dropped by trimming: 104@00:07:08 is the last sentence of a turn on Jude's date (“I personally think we're probably looking at the 90s or maybe … the aughts of the … second century CE … most scholars think that Second Peter is probably referencing parts of Jude”); the next turn (00:08:05) adds “So that. That was probably the last text that was written in the whole New Testament”. 175@00:20:26 drops the turn's opening (“the New Testament has texts that were probably written in the second century CE”) and its Bible-span conclusion. 99@00:27:31 is preceded by 00:27:17 (“the Catholic epistles … overwhelmingly probably second century”) and goes on to the Pastorals (“maybe first quarter of the second century”). E104 00:06:25–00:09:00, E175 00:14:49–00:22:01, E99 00:25:15–00:29:00 read.
# Dropped Trigger Claim leads: E98 00:08:41 (“So 2 Peter is probably somewhere between 120 to 150 CE”, in a turn about 1 Peter; three triggers suffice); E6 00:46:38 (“These are among the last texts of the New Testament written. So we're early to mid-2nd century CE”, McClellan unsure whether 1 or 2 Peter); E119 00:27:52 (“it's probably over a century after Jesus's death that the final books are being … completed”: no book named); E175 00:23:56 (Alexandria, place not date); E104 00:39:30 (Jude/2 Peter relative order “a little tricky”).
# agent: the first pass (2026-11-26). One research agent (critical side) saved every fetched page into its own scratch folder (peter-critical) and copied quotes only from the saved text; the lead read Britannica “Letters of Peter” and “Biblical literature” (Jude section) in Claude in Chrome (script-blocked), saving the `article` h1/h2/p innerText (Letters of Peter 2346 characters; cited sentence matched with includes() in the tab, true); JSON-LD datePublished 1998-07-20 (Letters of Peter), 1998-10-19 (Biblical literature), no dateModified. Quotes script-matched by the lead from the entry file against the saved copies (whitespace, quotes, dashes, entities, NFKC, soft hyphens normalised): 6 hits, 0 misses, each once. Trigger Claims matched by script as substrings of their final Transcript lines at timestamp and speaker: 3 hits.
# owner: empty (""). The owner delegated the publish review (#93; extended to the Timeline, #110, 2026-11-23); a `delegation` block is added when the independent second agent pass has run.
# Flags for the second pass: (1) The Ehrman blog has no registry precedent (a blog post); classed Reference, kind article, since Ehrman says it is an edited account of Forgery and Counterforgery (OUP 2013). Its sentence is a report (“scholars have typically considered”). Cut if the class doesn't hold; the note's latest-book report then rests on Hultin alone. (2) Display: Martin is the only outright date, first person (“I believe”); check “Probably the 2nd century CE” is no stronger than the sources, and whether `from: 101` should open earlier given Hultin's “perhaps the end of the first century” and Ehrman's “hard to imagine … before the end of the first century, at best” (uncited). (3) Britannica's sentence dates both Letters of Peter together, hedged; note says “the two Letters of Peter”. The same article has an apparent error (“only 2 John and 2 Peter were universally recognized”; Britannica's own search snippets for its Letters of John and Biblical literature articles say 1 John and 1 Peter); not cited. (4) Martin lecture 24 (2009) is inside the window; check its chapter locator. (5) Hultin's quote is two-and-a-bit sentences including the latest-book report; check the note's paraphrase.
