leads:
  - "Finkelstein and Sass 2013, “The West Semitic Alphabetic Inscriptions, Late Bronze II to Iron IIA”, HeBAI 2: 149–220, pp. 164–66: writing in Hebrew began only in late Iron IIA, the first half of the 9th century BCE. Paywalled; known only via Naʼaman 2017 p. 10 n. 13."
  - "Donnelly-Lewis 2022 (BASOR), the Qeiyafa ostracon as archaic Hebrew: the main counter-voice on the Hebrew side; no open copy found."
  - "Tappy, McCarter et al. 2006 (BASOR 344), Tel Zayit abecedary as mid-10th-century, nascent Hebrew script: login only; known via Rollston pp. 31–35."
  - "Rollston 2012, “What's the Oldest Hebrew Inscription?” (BAR) and Demsky's reply (Bible History Daily): BAS library refused (403) / Cloudflare block; popular, not Scholarly."
  - "Pardee, on the Gezer Calendar's language as Phoenician; Sivan 1998 (IEJ 48); Galil 2009 (UF 41): not open; known via Rollston and search results."
  - "Bible History Daily, “The Oldest Hebrew Script and Language” (BAS, 2012): unsigned staff summary paraphrasing Rollston; not Scholarly or Reference."
uncited:
  - "Rollston 2010 (SBL, Archaeology and Biblical Studies 11, open PDF), pp. 3, 29–35, 42, 44: script and language differ; Israelite scribes first wrote with the Phoenician script; Gezer Calendar and Tel Zayit abecedary in Phoenician script, late 10th or very early 9th century; Cross considers the Gezer Calendar's language Hebrew, Pardee Phoenician; the Old Hebrew script “became a distinct national script during the ninth century b.c.e.” and “no evidence for a distinct Old Hebrew national script during the tenth century”. Script dating, and a report of a dispute over one object's language; names no earliest Hebrew-language inscription. Read; not the entry's subject."
  - "Naʼaman 2017 (JHS 17), p. 10: the early Hebrew script “was formed only in the 9th century” (after Naveh 1982); pp. 10–11 on the Qeiyafa ostracon not proven Hebrew. Script, and the language's emergence (cited on hebrew-language)."
  - "Sergi 2023 pp. 204–8, 212: Old Hebrew script at Tel Reḥov, Gath and Arad in late Iron IIA (ca. 900–800/780 BCE, his Table 1.1, p. 24); p. 208 “it seems that the royal scribes in both Israel and Judah made use of the Old Hebrew script for writing their own language—Hebrew” by the second half of the 9th century. Script, and hedged. (First pass cited p. 34 instead; the second pass cut it, below.)"
  - "Millard 2011 (Tyndale Bulletin 62.1), Qeiyafa ostracon (about 1000 BC): “the language may be Hebrew, Canaanite, Phoenician or Moabite”; “there is no proof the text is written in Hebrew rather than Canaanite”. One object; no date for the earliest Hebrew writing."
  - "Crenshaw, Bible Odyssey “Literacy in the Ancient World” (2017): the Gezer agricultural calendar “(southern Canaan, 10th century)” among finds from neighbouring lands; does not call it Hebrew."
  - "Ben-Dov, Bible Odyssey “The Calendar in the Hebrew Bible” (2025): the Gezer Calendar “a famous tenth century BCE inscription”; does not call it Hebrew."
  - "Nowogórski 2016 (Saeculum Christianum 23): national Hebrew script “used from the late tenth century BC”, then “It is impossible to determine when the national Hebrew script was developed”. Script; self-contradicting; theology journal."
  - "Bible Odyssey “The Mesha Stela”; Suriano, “The Samaria Ostraca” (Paleo-Hebrew of the late 9th and 8th centuries): no date for the earliest Hebrew writing."
  - "Sergi 2023 p. 34 (PDF p. 56), §2.1: “From the second half of the ninth century BCE, we see in the epigraphic finds the earliest appearance of local dialects such as Hebrew, Aramaic, Moabite, and Ammonite committed to writing through specific and differentiated scripts.” Cut by the second pass (was critical/2): the date is qualified by “specific and differentiated scripts” (national, royal scripts). The sentence before it has undated “earliest attempts to have the local spoken languages committed to writing through alphabetic scripts”; n. 13 points to §5.4, which puts alphabetic writing in Israel and Judah by the late 10th/early 9th century (pp. 205, 208). The date may be for the script, not the language; in doubt, so cut."
