# Review record for the Timeline Entry `hebrew-writing` (/timeline/#hebrew-writing; #93 shape). Not rendered.
# Issue #207 (split from #197, published as `hebrew-language`, undated). Issue notes: word the entry for the script or for the written language, not both (Rollston 2010 p. 3: script and language differ; the earliest Old Hebrew script he names writes Moabite). A dated entry sits near david-and-solomon and merneptah-stele on the minimap (#175). No Tradition Date expected.
# Scope chosen: the earliest known writing in the Hebrew language (attestation), the Trigger Claim's own subject (“the written language begins”). Not the Old Hebrew script: the sources date the script outright to the 9th century BCE (Rollston 2010 pp. 42, 44; Naʼaman 2017 p. 10 after Naveh 1982), but no Trigger Claim dates the script, and it is a different subject, not a narrower one (Rollston p. 3; the Mesha Stele is Moabite in Old Hebrew script, p. 42). Script left out of the entry; recorded under uncited. `watch` carries “Old Hebrew script” and “Paleo-Hebrew” so a future dated script claim is caught.
# Does not contradict `hebrew-language` (Hebrew as a discrete language, undated): that entry cites McCarter and Naʼaman pp. 10–11 on the language's emergence; this one dates only its earliest attestation in writing. Naʼaman pp. 10–11 not reused here. No seeAlso added (only creation→priestly-genesis-1 uses it, for a composition the entry contains).
# Sourcing test, 2026-11-26: met as critical, split. Two sources date the earliest Hebrew writing outright and differ: Rubin (Bible Odyssey, Reference) “around 1000 BCE”, naming no inscription; Sergi 2023 p. 34 (Scholarly) “From the second half of the ninth century BCE … the earliest appearance of local dialects such as Hebrew … committed to writing through specific and differentiated scripts”. Shown as a split with each side cited (split-shown), in the sources' own terms; no merged “10th–9th century” that neither gives. The split is not explained: Rubin names no object, so nothing read ties his date to the Gezer Calendar or the Qeiyafa ostracon (cf. merneptah-stele, which left its spread unexplained for the same reason). Either side alone meets the entry rule if the other is cut.
# Placement: from -1000 (Rubin's side), to -801 (end of Sergi's “second half of the ninth century”), precision century. Placed by from, so it sits at 1000 BCE beside david-and-solomon; check crowding at preview (#175).
# Trigger Claims: E187@00:44:37.460 only, the full line, Dan McClellan. Read 00:42:59 to 00:46:22. “Hebrew” comes from McClellan's 00:44:31 “Hebrew doesn't even exist yet”; Beecher asks whether the language doesn't exist, McClellan narrows to “Least the written” (00:44:36), and the stored line follows. Iron Age I is bounded in the same segment by the “pivot right around 1200” (00:42:59) and the territorial states “at the very beginning of the first millennium BCE” in Iron Age 1 and early Iron Age 2 (00:49:20); “toward the end of Iron Age one” is thus roughly 1000, matching Rubin's side. states: critical. Not stored: E152@00:48:19 (“Yes, it was indistinguishable from a generic, broader Canaanite language until somewhere in between 1100 and 1000 BCE”, answering “As both a written and a spoken language?”): its text dates the language, not writing; `hebrew-language` also left it out. E64@00:24:43 (narrative prose “in alphabetic languages like Hebrew until the late 9th century BCE”): a different subject (narrative prose). E152@00:40:11 (old Hebrew “basically a borrowing of Phoenician”): script, no date. One Trigger Claim, no second date from the show: no #99 contradiction.
# agent: the first pass (2026-11-26). Research agents per subject (Old Hebrew script; earliest Hebrew-language writing), each saving fetched pages; quotes copied from saved text only. Quotes script-matched against the saved text (whitespace, quotes, dashes, entities, soft and line-break hyphens normalised): 2 hits, 0 misses. Trigger Claim matched by script as a substring of its Transcript line at timestamp and speaker: 1 hit.
# owner: empty (""). The owner delegated the publish review (#93; extended to the Timeline, #110, 2026-11-23); a `delegation` block is added when the independent second agent pass has run.
# Flags for the second pass: (1) Sergi p. 34 says Hebrew written “through specific and differentiated scripts”: is that the earliest Hebrew writing, or the earliest Hebrew in a national script (which would make it a script date)? The note keeps his words. His p. 208 is hedged (“it seems”) and puts Israel's scribes in the first half of the 9th century, Judah's in the second; p. 34 is used because it is unhedged. (2) Rubin's parenthesis (“though a few biblical texts may have been composed a couple of centuries earlier”) is kept in the quote and left out of the note: it is about composition, not attested writing. (3) Rubin is a short Bible Odyssey article, Reference; check author and 2024 date. (4) Title “Earliest known Hebrew writing” is Rubin's phrase; Sergi's “earliest appearance … in the epigraphic finds” is the same notion. (5) display “Around 1000 BCE, or from the second half of the 9th century BCE” and to: -801: check neither side is overstated.
# Independent second agent pass 2026-11-26 (#93 delegation, #110): both cited sources re-fetched by curl from their registry URLs into a fresh folder (Rubin, Bible Odyssey HTML stripped to text; Sergi 2023 SBL ICI PDF via pdftotext). Both quotes re-matched by script (whitespace, quotes, dashes, entities, soft and line-break hyphens, space before punctuation normalised): 2 hits, 0 misses, each at its locator (Rubin: section “Where did the Hebrew language come from?”, third paragraph, on Akkadian, sentence 3 after “by contrast,”; the whole article read, and it names no inscription or object and gives no other date for Hebrew writing (its close, “continuous written use for roughly three thousand years”, agrees); Sergi printed p. 34 = PDF p. 56, inside §2.1 “The Early Iron Age Levant: Forging Identities, Forming Polities”, pp. 30–41 per the TOC). Trigger Claim re-matched by script at timestamp and speaker in the final Transcript (via processed-videos.json): 1 hit; 00:42:59 to 00:47:38 read in full, plus the turns from 00:40:36. Registry checked against the sources: Sergi title and copyright pages (Archaeology and Biblical Studies Number 33; © 2023, SBL Press); Rubin author box (Ann and Jay Davis Professor of Jewish Studies, University of Georgia; PhD Harvard 2004), dated April 26, 2024; Sergi SBL ABS 33, 2023, opens without login (#80 clarification on ICI PDFs).
# Second pass changed: Sergi p. 34 (old critical/2) cut to `uncited`. It is a script claim, not a date for the earliest Hebrew writing: the sentence just before it says the Late Bronze cuneiform system “was replaced by the earliest attempts to have the local spoken languages committed to writing through alphabetic scripts”, undated, so “earliest appearance … through specific and differentiated scripts” is limited by the differentiated (national, royal) scripts; its n. 13 points to §5.4, where Sergi puts alphabetic writing in Israel and Judah by the late 10th/early 9th century (pp. 205, 208) and Israel's scribes by the first half of the 9th, and ties Hebrew-language writing only to the Old Hebrew script, hedged (“it seems”, p. 208); he never calls the earlier alphabetic writing Hebrew. So p. 34 may date only Hebrew in its own script, the Old Hebrew script subject the first pass already left out; the reading is in doubt, so it is cut. With it gone there is no split: display “Around 1000 BCE, or from the second half of the 9th century BCE” → “Around 1000 BCE”; `to: -801` dropped (from -1000, precision century, as on david-and-solomon); note “The sources differ. One dates … Another sees …” → “One source dates the earliest known Hebrew writing to around 1000 BCE; it names no inscription.” `citations.critical/2` and `sources.sergi-2023-two-houses` removed from this file (registry entry kept; other entries cite it). Rules split-shown, critical-scope and conditional-not-critical corrected. Title unchanged (Rubin's phrase). Trigger Claim unchanged. No citation added.
# Second pass on the first-pass flags: (1) Script claim; cut (above). (2) Kept: Rubin's parenthesis is about composition; the note leaves it out, and it does not hedge the date. (3) Pass: author and date confirmed on the page; Bible Odyssey is Reference judged per author (#86), Rubin is a professional Semitist. (4) Title kept; now rests on Rubin alone, whose phrase it is. (5) Display narrowed to Rubin's “around 1000 BCE”, which is no stronger than the source (“only around 1000 BCE”). E187's other date-bearing turns (00:44:45 “around 1000 … the Israelites … speak our language different”; 00:46:22 “between like 1000 and 800ish … asserting, we're this kingdom”) date language and kingdoms, not writing: no second show date for this subject, no #99 contradiction.
# Flags for publish: (1) The entry now rests on one Reference source's passing remark (an aside in a paragraph on Akkadian) that names no inscription; it meets the entry rule (one Scholarly or Reference source, #80 one-source rule), but it is the thinnest kind of support. (2) The field reads later than Rubin and none of it is shown: Sergi's own picture (Hebrew written in Old Hebrew script by the 9th century, hedged, p. 208; differentiated scripts from the second half of the 9th, p. 34) and the Finkelstein–Sass lead (first half of the 9th, paywalled, via Naʼaman n. 13); the Gezer Calendar's and Qeiyafa ostracon's language is disputed (Rollston, Millard, Naʼaman, uncited). A publisher may prefer to hold the entry until a Scholarly source that dates the earliest Hebrew-language writing outright is read. (3) “Around 1000 BCE” sits in tension with Naʼaman p. 10 on `hebrew-language` (no epigraphic evidence that Hebrew detached from Canaanite in the first half of the 10th century). Kept as a tension between sources, not a contradiction between entries: each note is attributed, and `hebrew-language` dates the language, this entry its attestation in writing. (4) Placed at -1000, beside david-and-solomon (also -1000) and near merneptah-stele: check minimap crowding at preview (#175).
