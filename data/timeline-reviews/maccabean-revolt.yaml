# Review record for the Timeline Entry `maccabean-revolt` (/timeline/#maccabean-revolt; #93 shape). Not rendered.
# Issue #235 (from #108), “Timeline Entry: Antiochus IV and the Maccabean revolt”. Issue notes: the E34 lead quote dates Daniel's composition, not the event, so a Trigger Claim must date the persecution or revolt itself; date one thing (the persecution and desecration, 167, or the rededication, 164) and put the rest in the note; Onias III 171 (E32) or 170 (E34) is a #99 inconsistency; must agree with `daniel` (167–164 BCE) and not restate Daniel's composition; `alexander` overlaps (Hellenistic period to 63 BCE); the Hasmonean kingdom entry (#236) follows from the revolt.
# Id `maccabean-revolt` (matches the topic slug). Title worded for what the display dates: the rededication of the Temple by Judas Maccabeus's forces.
# Sourcing test, 2026-11-27: met. Every source read dates the rededication to 164 BCE, none to 165, none conditionally: Henze and Werline 2020 Chronology (Scholarly, in window; row 164 “Rededication of the Jerusalem temple”), Levine 1999 (Scholarly, in window; “in the month of Kislev, 164 B.C.E.”), NABRE note to 1 Mc 4:52 (Reference; “December 14, 164 B.C.”), Seeman, Bible Odyssey “Hanukkah” (Reference; “in 164 BCE”), Britannica “Hanukkah” (Reference; “Kislev 25, 164 BCE”). Kind: event. No Tradition Date: the one Trigger Claim states critical. No setting (event entry).
# Why 164, not 167 (issue: date one thing): the rededication's year is unanimous; the revolt's outbreak splits three ways (167 Henze and Werline; 166 Levine and Britannica “Antiochus IV”; Britannica “Maccabees” gives the wars as 168–164) and Britannica “Maccabees” also has a 168 act of desacralizing the Holy of Holies before the December 167 Zeus dedication. The desecration (167) and the revolt's start go in the note, the split shown (#99). The day of the rededication differs (NABRE December 14; Britannica “Maccabees” December 24; both Kislev 25): days are out of the display.
# Dropped: Antiochus IV's accession. Henze and Werline's chronology gives his rule as “177–164”, against 175 in NABRE (1 Mc 1:10 note, “September, 175 B.C.”), Britannica, Bible Odyssey and the Second Temple timeline; Iranica (Sievers, 1986, out of window) says “late in 175” and calls September too early. Rather than show a likely misprint as a split, the note leaves the accession out. Onias III (171/170): no source read dates his death; the show's two years are Daniel 9 exegesis (E32 00:26:51, E34 00:40:25) and are out of scope. Every Hasmonean-kingdom date (Henze and Werline 142/140/129; the show's 141) is left for #236.
# Consistency: `daniel` dates its chapters 7–12 to the persecution “(167–164 B.C.)” (NABRE): this entry's 167 desecration and 164 rededication agree, and it does not restate Daniel's composition. `alexander` (332; Hellenistic kingdoms to 63) untouched. seeAlso: daniel (published). No anchor: the entry has its own sourced year.
# Trigger Claims (#99: one to three): E158 00:15:58 (dates the revolt “I want to say this is 167 BCE” and the rededication “around 164”; hedges kept inside the quote; the trim drops the turn's opening on Mattathias, which begins “in the story”, and the 167 points at the guerrilla campaign, not the desecration). Not kept: E158 00:09:46 (accession “around 175 BCE”, not in the entry); E34 00:44:03 (Daniel's composition, issue note) and 00:47:19 (no year); E123 00:42:45 (“160 BCE to around 63 BCE”, the Hasmonean kingdom, #236); E87 00:33:26 (“160 years before”, relative, about the Maccabees' kingdom); E71 00:54:06, E123 00:38:50 (no year).
# agent: the first pass (2026-11-27). Henze and Werline PDF and the Bible Odyssey Tiki-Toki embed fetched by curl by the lead agent (pdftotext plain and -layout). A research agent saved Levine (cojs.org, curl), Iranica (curl), the USCCB 1–2 Maccabees pages, Britannica and Bible Odyssey (Claude in Chrome, abridged transcriptions). The lead agent re-read the cited NABRE notes (1 Mc 1, 4, 6), Britannica “Hanukkah”, “Maccabees”, “Antiochus IV Epiphanes” and Seeman's “Hanukkah” in Claude in Chrome (page innerText) and saved the cited paragraphs verbatim. Every cited quote script-matched against the saved text (NFKC, whitespace, curly quotes, dashes, ellipsis normalised): 12/12, each found once. Trigger Claim matched by script as a substring of the E158 line at that timestamp and speaker: 1/1.
# owner: empty (""). The owner delegated the publish review (#93; extended to the Timeline, #110, 2026-11-23); a `delegation` block is added when the independent second agent pass has run.
# Flags for the second pass: (1) Levine 1999: excerpt of a chapter in Shanks (ed.), Ancient Israel (BAS, 1999; the page spells the editor “Hershal”), hosted by the Center for Online Judaic Studies; Scholarly class (a scholar's chapter in a popular-audience volume)? Edition left null (revised edition unconfirmed). (2) Britannica “Maccabees”: “in 168 BCE, Antiochus invaded Jerusalem and desacralized the Holy of Holies”, then “later in the same year” the December 25, 167 Zeus dedication; read as a separate act and internally inconsistent, not cited, not a split for the note's “desecrated the Temple in 167 BCE”. Agree? (3) Henze and Werline “177–164”: dropped as above; does leaving the accession out suffice? (4) The note's “the year Levine dates his decree” leans on Levine's “Kislev (December), 167 B.C.E., the king issued a decree”; “desecrated the Temple in 167” rests on Henze and Werline row 167 and NABRE 1 Mc 1:54. (5) Britannica “Maccabees” 168–164 is a span of the “wars of independence”, shown as a third outbreak date; is it fair to report it as dating the outbreak?
# Independent second agent pass 2026-11-27 (#93 delegation, #110): every cited source re-fetched into a fresh scratch folder. By curl: Henze and Werline PDF (pdftotext -layout and plain), Levine at cojs.org (HTML stripped). In Claude in Chrome (own tab, closed after): USCCB 1 Maccabees 1, 4 and 6, Bible Odyssey “Hanukkah”, Britannica “Hanukkah”, “Antiochus IV Epiphanes” and “Maccabees”; for these seven the cited notes and paragraphs (with their headings) were saved verbatim from page innerText, not full-page dumps. Quotes parsed from the entry and re-matched by script (NFKC, entities, whitespace, curly quotes, dashes, ellipsis normalised): 12 of 12 found, each once, before the cut. Locators checked by hand against the saved headings and paragraphs: 9 of 12 confirmed as written; 3 wrong or loose (Britannica “Maccabees” “opening paragraph”, cut; Seeman and Britannica “Hanukkah”, corrected). Trigger Claim parsed from triggers.yaml and re-matched by script (substring of the only turn at that timestamp and speaker; E158 per processed-videos.json; states critical), 00:13:42 to 00:18:34 read in full: 1 of 1.
# Second pass changed: (a) cut Britannica “Maccabees” (was critical/11) to `uncited` (flag 5); old critical/12 renumbered critical/11; britannica-maccabees dropped from `sources`. So the outbreak split is two-sided (167 / 166), not three-way; the “three ways” and “168–164” lines above are superseded. Note, sentence 2: “The sources date the outbreak of the revolt that followed to 167 (Henze and Werline's chronology) or 166 (Levine, “the year following” the decrees; Britannica's article on Antiochus IV); Britannica's article on the Maccabees gives the wars of independence as 168–164 BCE.” became “Sources date the outbreak of the revolt that followed to 167 (Henze and Werline's chronology) or 166 (Levine, “the year following” the decrees; Britannica's article on Antiochus IV).” (“The sources” narrowed to “Sources”: NABRE, Seeman and Britannica “Hanukkah” do not date the outbreak.) (b) Locators: Seeman “opening paragraph” → “paragraph beginning “Hanukkah, a term from”, after the summary line”; Britannica “Hanukkah” “Origin section, opening paragraph” → “section “Origin and history”, subsection “The Maccabean victory”, first paragraph”. (c) Registry: levine-1999-age-of-hellenism class Scholarly → Reference (flag 1). Title, display, from, precision, Trigger Claim and the note's first and last sentences unchanged.
# Rulings on the five flags: (1) Reclassed Reference, not cut: #80's Scholarly test is venue (academic publisher or peer-reviewed journal) and BAS is a popular publisher; a scholars' introductory survey fits Reference. Either class may back a Critical Date, and the display does not hang on Levine (four other sources give 164). Edition stays null. (2) Agree: Britannica “Maccabees” 168 desacralization is a separate, earlier act in an internally inconsistent passage (“later in the same year” then “167 BCE”); the same article's “In December 164 BCE, three years after Antiochus had defiled it” puts the defilement in 167, so it does not contradict the note's 167; not a split. (3) Agree: the note says nothing of the accession, so the 177 vs 175 discrepancy is not a statement on the entry; leaving it out suffices. (4) Agree: “desecrated the Temple in 167” rests on Henze and Werline row 167 and NABRE 1:54 (December 6, 167); Levine's decree paragraph itself continues “Antiochus proceeded to desecrate”, so tying the year to his decree is faithful. (5) Not fair: cut (above).
# Flags for publish: (a) Levine (critical/9) gives no year: the note's 166 is derived from “the year following” the Kislev 167 decrees (and his section heading “166–164 B.C.E.”); the note shows it as his relative date. (b) Britannica “Antiochus IV” (critical/10) “at the beginning of their rebellion in 166” can be parsed as dating the Daphne review; both readings place the start about 166. (c) Registry britannica-maccabees now has no citation on this entry (check:timeline passes with it in the registry); remove it at publish if no other page cites it. (d) Registry britannica-hanukkah edition reads “Online, Britannica Editors”; bylines rotate, and the entry attributes to Britannica, so harmless, but the other two Britannica entries say “Online”. (e) The seven Chrome-read sources were matched against saved passages, not whole pages.
# Publish resolutions, 2026-11-27 (lead agent, on the second pass's flags, conservatively): (a) Levine's 166 kept: the note shows it as his relative date (“the year following” the decrees), not as a year he prints; his section heading “166–164 B.C.E.” agrees. (b) Britannica “Antiochus IV” kept: either parse puts the rebellion's start in 166, and the note attributes it to that article. (c) Registry britannica-maccabees removed (no page cites it; its passages stay in `uncited`). (d) britannica-hanukkah edition left as is (attributed to Britannica). (e) Partial saved passages accepted: both passes read the cited notes and paragraphs with their headings in the live pages. Levine as Reference accepted; the display rests on Henze and Werline 2020 (Scholarly, in window) with NABRE, Seeman, Britannica and Levine agreeing, so the entry rule holds. (f) seeAlso: daniel dropped at preview: the template renders it as “For when the account was written, see Daniel”, and Daniel is not the account of this event (the “seeAlso: daniel” in the Consistency line above is superseded). draft dropped; sourcesRead, review and secondPass all 2026-11-27.
