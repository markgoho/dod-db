uncited:
  - "Second pass: Britannica “Maccabees”, section “Historical context of the Maccabees”, first paragraph: “the hero of the Jewish wars of independence, 168–164 BCE” (was critical/11; the first pass’s locator “opening paragraph” was wrong). Cut: a span for the wars as a whole does not date the revolt’s outbreak, and the same article’s 168 chronology (168 desacralization, then “later in the same year” the December 25, 167 Zeus dedication) is internally inconsistent and already set aside under flag 2; it cannot be leaned on here and discarded there. The registry id britannica-maccabees now has no citation on this entry."
  - "Henze and Werline Chronology row “177–164 Antiochus IV rules Seleucid Empire”: every other source gives 175 for the accession; accession left out of the note (header)."
  - "NABRE note to 1 Mc 1:10: “Antiochus IV seized the throne in September, 175 B.C.” Accession out of scope."
  - "NABRE notes to 1 Mc 1:20 (169, Egypt), 2:70 (Mattathias died 166); 2 Mc notes 1:11–12 and 9:1–29 (death 164), 5:1 (second pillage 167 after the 168 invasion of Egypt), 10:3 (two vs three years). Context; not needed."
  - "Britannica “Maccabees”: “Finally, in 168 BCE, Antiochus invaded Jerusalem and desacralized the Holy of Holies in the Temple.” and the December 25, 167 Zeus dedication; “Antiochus IV ruled Syria from 175 to 164/163 BCE.”; Mattathias's death “c. 166”; reconsecration December 24 (Kislev 25), 164. See flag 2."
  - "Britannica “Antiochus IV Epiphanes”: “When Antiochus returned from Egypt in 167 he took Jerusalem by storm”; “in December 164 was able to tear down the altar of Zeus and reconsecrate the Temple”; death “at the end of 164”. Agrees; not needed beyond critical/10."
  - "Britannica “Hanukkah” para 2 (“According to I Maccabees …”): narrative, not a date."
  - "Seeman, Bible Odyssey “Hanukkah” para 2: “Three years earlier” Antiochus forbade Jewish practices; the day “allegedly” that of the desecration. Relative and hedged; critical/6–8 carry 167."
  - "Seeman, Bible Odyssey “Maccabees”: reign “175-164 BCE” only."
  - "Merrill Willis, Bible Odyssey “Daniel” (registered): outlawed Judaism in 167, temple worship resumed “in the winter of 164 B.C.E.”, Antiochus dead “by early 163”. Agrees; cited on `daniel`, not needed here."
  - "Bible Odyssey Second Temple timeline (bo-timeline-second-temple-judaism): “Desecration of the temple” item attributes the 167 decree to 1 Maccabees (“According to the book of 1 Maccabees”); “2 Maccabees” item: Hanukkah celebrates “the rededication of the Jerusalem temple in 164 B.C.E.”; “Antiochus IV Epiphanes (175-164 B.C.E.)”. Agrees; texts sit in the embed's JS object with escaped apostrophes; not needed."
  - "Sievers, Encyclopaedia Iranica “Antiochus” (1986, updated 2015): accession “late in 175”, robbery of the Temple treasury “169 or 168”, death news in Babylon November 19 to December 19, 164; Granius Licinianus gives 163. Out of the 30-year window."
  - "Zank, Boston University course page on Seleucid chronology: undated, unsigned page, heads Antiochus IV “187-164”; fails the class test."
