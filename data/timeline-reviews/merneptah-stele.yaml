leads:
  - "JAEI: van der Veen, Theis and Görg 2010, “Israel in Canaan (Long) Before Pharaoh Merenptah?”: host blocks scripted fetches; not read."
  - "Hasel, AASOR 58 (2003) and BASOR 1994 on the stele: no free copy."
  - "Killebrew 2005, Biblical Peoples and Ethnicity: no open copy found."
uncited:
  - "Finkelstein 2007 (Quest, p. 74): “describes his campaign to Canaan in 1207 b.c.e.” Dates the campaign, not the stele; Sergi carries 1207."
  - "Longman, Bible Odyssey “Origins of the Israelites”: “late thirteenth century B.C.E., typically in the last decade of that century.” Adds nothing Meyers and Sergi don't."
  - "Mazar 2007 (Quest, p. 93), Noegel (Bible Odyssey “Pharaoh”), HarperCollins Bible Dictionary (Bible Odyssey “Other, unnamed Egyptian kings”): Merneptah's reign only (1213–1203 or 1212–1202); deriving year 5 would be our arithmetic."
  - "Wiener 2011 draft (“Oh, No—Not Another Chronology!”): Egyptian high, middle and low chronologies; never names Merneptah, and venue unconfirmed."
  - "Encyclopaedia Judaica “Merneptah” (Schulman, via Encyclopedia.com): reign c. 1224–1214; text from the 1971 edition, outside the 30-year window."
  - "Tigay, Penn NELC 150 slide 3: undated slide; says “4th year”."
  - "Bruce, JETS 62.3 (2019), ca. 1209: independent researcher, fails the professional-scholar rule (#80)."
  - "Hayes l12: “the Merneptah stele of 1204”; same author and year as the cited l7."
