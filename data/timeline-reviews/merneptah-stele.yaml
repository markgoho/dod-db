# Review record for the Timeline Entry `merneptah-stele` (/timeline/#merneptah-stele; #93 shape). Not rendered.
# Issue #184 (from #108). Issue note: word the entry for what the stele dates (a people named Israel in Canaan), not for the emergence of Israel as a whole. Ties to `exodus` and `jericho`; no seeAlso added (neither cites the stele as its subject).
# Sourcing test, 2026-11-25: met. Five Scholarly or Reference sources date the stele outright, none conditionally. They differ by year: Kaltner about 1208, Sergi ca. 1207, Mazar 1206, Hayes about 1204; Meyers late thirteenth century. Display is the shared umbrella “Late 13th century BCE” (Meyers's “late thirteenth-century”, Hayes's “end of the thirteenth century”); the note lists each year, each cited. No dash range: no source gives a range for the stele.
# Why the years differ (Egyptian regnal chronology) is left out: no source read ties the spread to it for this stele (Wiener's chronology paper never names Merneptah).
# The determinative point (Israel written as a people, not a city or land) is in the Trigger Claims but in no source quote; the note says “a people in Canaan” on Hayes l7 only.
# agent: the first pass (2026-11-25). Quotes script-matched against saved copies of each source (whitespace, quotes, dashes, entities and line-break hyphens normalised): zero misses. Trigger Claims matched by script as substrings of their Transcript lines.
# owner: empty (""). The owner delegated the publish review (#93; extended to the Timeline, #110, 2026-11-23); a `delegation` block is added when the independent second agent pass has run.
# Flags for the second pass: (1) is “Late 13th century BCE” plus the year list the right split form, against fall-of-jerusalem's “587 or 586 BCE”? (2) Mazar's p. 30 sentence is about Israel's absence from later sources; it is cited for the 1206 date only. (3) Kaltner is the only source at 1208, the show's year.
