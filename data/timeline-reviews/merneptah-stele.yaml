# Review record for the Timeline Entry `merneptah-stele` (/timeline/#merneptah-stele; #93 shape). Not rendered.
# Issue #184 (from #108). Issue note: word the entry for what the stele dates (a people named Israel in Canaan), not for the emergence of Israel as a whole. Ties to `exodus` and `jericho`; no seeAlso added (neither cites the stele as its subject).
# Sourcing test, 2026-11-25: met. Five Scholarly or Reference sources date the stele outright, none conditionally. They differ by year: Kaltner about 1208, Sergi ca. 1207, Mazar 1206, Hayes about 1204; Meyers late thirteenth century. Display is the shared umbrella “Late 13th century BCE” (Meyers's “late thirteenth-century”, Hayes's “end of the thirteenth century”); the note lists each year, each cited. No dash range: no source gives a range for the stele.
# Why the years differ (Egyptian regnal chronology) is left out: no source read ties the spread to it for this stele (Wiener's chronology paper never names Merneptah).
# The determinative point (Israel written as a people, not a city or land) is in the Trigger Claims but in no source quote; the note said “a people in Canaan” on Hayes l7 only (narrowed by the second pass, below).
# agent: the first pass (2026-11-25). Quotes script-matched against saved copies of each source (whitespace, quotes, dashes, entities and line-break hyphens normalised): zero misses. Trigger Claims matched by script as substrings of their Transcript lines.
# owner: empty (""). The owner delegated the publish review (#93; extended to the Timeline, #110, 2026-11-23); a `delegation` block is added when the independent second agent pass has run.
# Flags for the second pass: (1) is “Late 13th century BCE” plus the year list the right split form, against fall-of-jerusalem's “587 or 586 BCE”? (2) Mazar's p. 30 sentence is about Israel's absence from later sources; it is cited for the 1206 date only. (3) Kaltner is the only source at 1208, the show's year.
# Independent second agent pass 2026-11-25 (#93 delegation, #110): every source re-fetched from its registry URL (PDFs via pdftotext); all six quotes re-matched by script (whitespace, quotes, dashes, entities, soft and line-break hyphens normalised): 6 hits, 0 misses, each at its locator (Meyers PDF p. 5 under running head “Introduction 5”; Sergi printed p. 46 inside §2.3; Mazar printed p. 30, inside his essay that opens on PDF p. 32; Hayes l7 ch. 3, 00:10:06 to 00:21:14; Kaltner's stela paragraph). All three Trigger Claims re-matched (timestamp, speaker, verbatim substring), about two minutes either side read: 3 hits.
# Second pass changed: the note's “It names Israel as a people in Canaan” became “It lists Israel among the groups in Canaan that Merneptah claims to have defeated” (Hayes l7's own words). No cited quote says the stele writes Israel as a people; Hayes only says it “suggests” a people known as Israel was in Canaan. No citation cut; nothing moved to uncited.
# Flags for publish: (1) display “Late 13th century BCE” kept: Meyers's wording, with Sergi (“very late thirteenth century”) and Hayes (“end of the thirteenth century”) agreeing, and the rendered note (timeline-entry.html shows `note`) lists every year, so none is picked; #99's literal form would be “1208, 1207, 1206 or 1204 BCE” if the publisher prefers it. (2) Title “Earliest mention of Israel” is unqualified; Meyers, Kaltner and Hayes say outside the Bible, and Sergi's unqualified sentence sits in a paragraph on extrabiblical sources, so no source makes the unqualified claim. Kept (the note carries “outside the Bible”; the issue title is unqualified too); publisher's choice: add the qualifier to the title or rely on the note. (3) The people-not-place point (the determinative, in all three Trigger Claims) is in Kaltner's next sentence (“the name is identified as a group of people and not, as the others on the list, a place”) and in Sergi p. 46 (“a group of people named Israel who lived somewhere in Late Bronze Age Canaan”), both read but not cited (now under uncited); adding either is a new citation, left to the publisher. (4) Mazar's quote dates the stele only in a subordinate clause; cited for 1206 only. (5) Ep 64's “1208, 1210 BCE”: 1210 is in no cited source; kept verbatim per #99. (6) check:timeline returns before the publish gate for a draft entry, so its pass here does not check this review file; the file was checked separately by yaml load.
# Publish resolutions, 2026-11-25: (1) display kept as “Late 13th century BCE”, the wording three sources share; the rendered note lists every year, each cited. (2) Title qualified to “earliest mention of Israel outside the Bible”, as Meyers, Kaltner and Hayes say; no source makes the unqualified claim. (3) Determinative point left out: adding Kaltner's or Sergi's sentence would be a new citation after the second pass; stays under uncited. (4) Mazar kept for 1206 only. (5) Ep 64 kept verbatim. (6) Publish gate now checks this file (draft dropped).
