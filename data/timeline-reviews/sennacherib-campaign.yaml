# Review record for the Timeline Entry `sennacherib-campaign` (/timeline/#sennacherib-campaign; #93 shape). Not rendered.
# Issue #189 (from #108), “Timeline Entry: Sennacherib's campaign against Judah”. Issue notes: date the campaign; Hezekiah's reform is conditional (“if historical”) and stays out of the Critical Date. Critical side only.
# Issue lead not taken as written: no final Transcript says “701”. The inventory's “701 BCE” is its own gloss; the display comes from the sources only. E72 00:41:15 dates Sennacherib's reign, not the campaign.
# Sourcing test, 2026-11-26: met. Reference sources date the campaign outright to 701 (NABRE Isaiah intro, Coogan and Chapman ch. 18, EJ “Sennacherib”) and a Scholarly article does too (Ussishkin 2015, Journal for Semitics). No source read splits the year (701 vs 700). Kind: event. No Tradition Date: no Trigger Claim states the tradition's side. No setting (event entry).
# Reign in the note: sources differ on the accession year (#99: show both, each cited). 705–681 in HarperCollins and EJ; 704–681 in Rollston (Bible Odyssey). Britannica “Sennacherib” gives “705/704–681” but was read only as a research agent's transcription of Chrome page text, so it is uncited.
# Hezekiah's reform: out of the display and the note (issue note; rule conditional-not-critical). The only source read that dates it is Faust 2026, and conditionally (“Should this dating be accepted”), with its historicity “hotly debated”; NABRE, EJ, HarperCollins, Coogan and Hayes describe it undated. Recorded in uncited.
# Dropped: the two-campaign question (Britannica “Sennacherib” rejects it; Britannica “Hezekiah” leaves it open, “may possibly”; EJ “Hezekiah” calls it “even less likely”) and the 2 Kgs 18:13 fourteenth-year problem (EJ “Hezekiah”, Britannica “Hezekiah”). Neither is needed to date the campaign and the sources don't agree on how to frame the first; recorded in uncited.
# Trigger Claims (#99: one to three): E146 00:34:24 (campaign, “toward the end of the 8th century BCE”), E72 00:41:15 (reign 705–681, in the Who's That segment whose subject is the invasion, 00:39:33). Not kept: E72 00:42:20 (“17 years earlier” — a relative date for the earlier Assyrian conquest of the north, not the campaign's date); E88 00:03:00 (“back up a little over a century”, relative to Josiah); E13 00:15:30 (“around the year 700 BCE” dates Arad's decommissioning, not the campaign); E21 00:22:44 (“around 700 BCE”, Hezekiah's vassalage to Egypt); E43 00:33:47 and E126 00:27:44 (relative only); E105 00:18:51, E7 00:28:02 (no date).
# agent: the first pass (2026-11-26). Two research agents (registry reuse; new sources) fetched every source into separate scratch folders (curl plus HTML-to-text; NABRE Kings and Jeremiah, Britannica and the British Museum read in Chrome, page text saved). Every cited quote script-matched by the lead agent against the saved text (whitespace, quotes, dashes, entities normalised): 8/8, zero misses. Trigger Claims matched by script as substrings of their Transcript lines at timestamp and speaker: 2/2.
# owner: empty (""). The owner delegated the publish review (#93; extended to the Timeline, #110, 2026-11-23); a `delegation` block is added when the independent second agent pass has run.
# Flags for the second pass: (1) The note's reign split rests on one 704 source (Rollston, a Bible Odyssey article on the Siloam tunnel, the date given in passing); is that enough to show “or 704”, or should the note keep 705–681 only and put Rollston in uncited? #99 says sources differ → show both. (2) Rollston's paragraph hedges the tunnel inscription's context (“most scholars accept this as the most likely context”); the hedge is about the inscription, not Sennacherib's reign. (3) EJ “Sennacherib” on Encyclopedia.com shows no author credit and no edition; registry author and edition null. (4) Ussishkin's PDF footer misprints the page range “750–750”; volume, issue, pages (719–758) and DOI 10.25159/1013-8471/3477 are from the landing page's citation meta tags; p. 720 is the PDF's running head. (5) Coogan ch. 18 is a new registry id; same textbook and edition as the ch. 17 and ch. 19 entries. (6) Note's second sentence rests on NABRE ¶ 5 (“laid siege to Jerusalem”, “The city was spared but at the cost of paying a huge indemnity to Assyria”); “paid to Assyria” paraphrases “to Assyria”. (7) Display has no “c.”: NABRE, Coogan, Ussishkin and EJ are flat; Hayes l14 (“about 701”), Darby (“circa 701”) and Price (“ca. 701”) hedge and are uncited.
# Independent second agent pass 2026-11-26 (#93 delegation, #110): a fresh agent that did not build the entry, working from its own scratch folder only. Re-fetched every source from its registry URL by curl (bible.usccb.org/bible/isaiah/0 served to curl today; OUP Learning Link ch. 18 summary; unisapressjournals.co.za article landing page and PDF download 3477/1876/15800, pdftotext; Encyclopedia.com EJ “Sennacherib”; Bible Odyssey dictionary/sennacherib/ and the Rollston Siloam article), HTML tags stripped and entities decoded. Quotes re-matched by one script (NFKC, whitespace, curly quotes and dashes normalised): 8/8, 0 misses, each found once in its source. Locators checked by position: NABRE quotes in the intro's fifth paragraph (“When Hezekiah came to the throne in 715 B.C.”); Ussishkin under the heading “THE ASSYRIAN CAMPAIGN”, after the p. 720 running head; EJ's 701 sentence opens the entry's second paragraph and the reign phrase its first; HarperCollins's sentence follows the pronunciation line; Rollston's in the paragraph named. Trigger Claims re-matched by script as normalised substrings of the line at that timestamp and speaker in the final Transcripts (E146 2026-01-18-jesus-is-so-fulfilling.txt; E72 2024-08-19-episode-72-…-the-truth-about-ruth.txt): 2/2; read about two minutes either side (E146 00:32:43–00:36:49; E72 00:39:08–00:43:21).
# Second pass changed: (a) Coogan locator (critical/2): “section “Invasions of Judah”, first paragraph” became “…, second paragraph, first sentence”. The section's first paragraph (<p> after the underlined heading) is about the 734 BCE Syro-Ephraimite invasion; the quote opens the second <p>. No citation cut; no Trigger Claim cut; title, display and note unchanged.
# Second-pass rulings on the first pass's flags: (1) Rollston kept for the 704 side. He is a Reference source (Bible Odyssey, SBL; an epigrapher) and states the reign flatly; #99 says sources differ → show both, each attributed, which the note does by name. (2) Confirmed: Rollston's hedge (“most scholars accept this as the most likely context”) is about the Siloam inscription's date, the next sentence going on to the Hasmonean alternative; it does not touch the reign. (3) Confirmed: the Encyclopedia.com page carries no author or edition line; registry author and edition stay null. (4) Confirmed from the landing page's Dublin Core meta tags: pages 719-758, volume 24, issue 2, DOI 10.25159/1013-8471/3477; the PDF footer reads “750–750” and its running head “720”. The landing page's DC.Date.issued is 2017-11-17 (online posting); registry year 2015 is the issue's printed year, kept. (5) Coogan ch. 18 URL resolves to the ch. 18 summary; new id fine. (6) Note's second sentence matches NABRE ¶ 5 in scope: “laid siege to Jerusalem”, “The city was spared but at the cost of paying a huge indemnity to Assyria”; “paid to Assyria” adds nothing. (7) Display without “c.” kept: the four display sources give 701 flat.
# Flags for publish: (1) The 704 side still rests on one source; Ussishkin (cited for 701) also says “In 705 B.C.E. Sennacherib ascended to the throne of Assyria” (p. 719, uncited), which agrees with the 705 side. No change needed. (2) E72 00:41:15 dates the reign, not the campaign; kept as the Trigger Claim gates the subject (its segment is on the invasion, 00:39:33) and the entry is worded for what its sources date (CONTEXT.md).
# Publish resolutions, 2026-11-26 (lead agent, on the second pass's flags): (1) 704 side kept on Rollston (#99: sources differ → show both, each attributed by name); Ussishkin p. 719 agrees with the 705 side and stays uncited. (2) E72 00:41:15 kept: a Trigger Claim gates the subject (CONTEXT.md: a Trigger Claim gates a page and its subject, not each statement), its segment is on the invasion, and it is the show's side of the note's reign split. draft dropped; sourcesRead, review and secondPass all 2026-11-26.
