# Review record for the Timeline Entry `december-25` (/timeline/#december-25; #93 shape). Not rendered.
# Issue #240 (from #231), “Timeline Entry: December 25 as Jesus' birth date”. Issue notes: kind event (the first argument that Jesus was born on December 25); tradition as stated: December 25 as Jesus' birthday; critical as stated: a calculation from the March 25 conception/death tradition, first argued by Hippolytus around 210 CE, not from Sol Invictus (temple dedicated 273/274); leads E86 00:34:56, 00:35:59, 00:36:31 (McClellan), E37 00:34:55 and 00:39:23 (winter solstice); sides: critical (“this was just a tradition” names the day, not a year); Bible Odyssey Nissenbaum (2017) and Bond's “The Nativity” sidebar as unchecked leads; overlap `birth-of-jesus` (c. 6–4 BCE; the year of the birth, a different subject; don't restate it). Lead brief: the subject is a day of the year, not a year: title and word the entry for exactly what its sources date (when December 25 is first attested as the date of the birth or of the feast); exit if no source dates anything a Trigger Claim states; on a lone Scholarly dissent follow the `death-of-herod` precedent (note only) and reference #244; `seeAlso` only toward a composition entry that is the account of this event.
# Id `december-25`; title “December 25 first named as the date of Jesus' birth”: what Britannica (“first identified as the date of Jesus’ birth”), Roll and McGowan (“earliest mention of … December 25”) date. It does not date the feast's first celebration, the calculation's origin, or the birth itself.
# Sourcing test, 2026-11-27: met, with a split. Britannica “Christmas” (Reference) dates the first identification of December 25 as the birth date flat: by Sextus Julius Africanus in 221. Roll, “Christmas and Its Cycle”, New Catholic Encyclopedia 2nd ed. (Reference; section credited “[s. k. roll]”; bibliography opens with Roll's own Toward the Origins of Christmas, 1995) puts the earliest mention in the Chronograph of Philocalus, “whose source material can be dated to 336”, and reads Africanus's March 25 for annunciation and passion only as what “would point to” December 25. McGowan, “How December 25 Became Christmas” (Bible Review, December 2002; Bible History Daily reprint; McGowan a professional scholar, Yale Divinity School per the page) agrees with Roll: earliest mention a “mid-fourth-century Roman almanac” (his note 3: the Philocalian Calendar). #99: sources differ (221 vs 336) → display “221 or 336 CE”, each side cited, no pick, no “contested” label (no source read uses that word; Britannica's “precise origin … is unclear” is quoted in the note as its own words). This is not the #244 case: Britannica and Roll/McGowan are each Reference sources of comparable standing, not a lone dissent against a majority. Kind: event. No Tradition Date: the only Trigger Claim states critical, and a day of the year has no year to place (issue: sides critical). No setting (event entry). No anchor. No seeAlso: no published composition entry is the account of this event.
# Not dated by this entry, and why: (a) Hippolytus c. 204/210 (the Trigger Claim's date): no source read dates it. McGowan's note 10 only names Hippolytus as a further text for the March 25 conception/passion link; T. C. Schmidt's BAR article (Winter 2022, paywalled) and Vigiliae Christianae 69 (2015) article, and the JEH review of his Commentary on Daniel translation, were not readable; a BAS staff page quotes Schmidt (lead, near the excluded blog class, as in `death-of-herod`). The Trigger Claim stays verbatim (#99: shown even where it differs from the row; the gap is left unexplained). (b) “354”: no source read gives it; Roll's 336 dates the almanac's source material, not the almanac, and the display keeps Roll's 336. (c) Sol Invictus: McGowan says Aurelian “established a feast” of Sol Invictus on December 25 in 274; the show speaks of a temple dedicated 273/274; not equated, not used (a different subject). (d) The feast's first celebration: Roll's earliest extant evidence for the celebration (Optatus, early 360s) and Baldovin's “certainly … observed at Rome by the middle of the same century” date the feast, not the naming of the day; uncited.
# Consistency: `birth-of-jesus` (c. 6–4 BCE, the year) untouched; nothing here restates it. Britannica's and Roll's “the New Testament provides no clues” / “true birth date … is unknown” agree with Bond's `birth-of-jesus` note that the earliest Christians in all probability did not know exactly when Jesus was born; not repeated here.
# Trigger Claims (#99: one kept): E86 00:34:56 (McClellan): the identification of December 25 “seems to come down to a calculation …”, “we see this first in Hippolytus around 210 CE”. Kept whole from the turn's start through “somebody's actually arguing this”, so the hedges (“as best we can tell”, “there's still debate about when this originates”, “seems to”, “a good case to make”) stay in; trimmed off: the March 25 death and the birth/death alignment (the rest of the turn). Not kept: E86 00:35:59 and 00:36:31 (the March 25 + nine months calculation and Sol Invictus's temple “273 or 274”: no date for the naming of December 25 beyond the 00:34:56 turn; Sol Invictus is a different subject); E37 00:34:55 (McClellan on the “sun in the grave three days” claim) and 00:39:23 (Beecher/McClellan banter): no dating; E141 00:02:20 (“why December 25th” as a past topic), E86 00:10:53/00:16:12/00:29:36 (Zeitgeist claims read aloud), E137 00:17:38 (solstice). A grep of every final Transcript for “December 25|25th of December|Hippolytus|Sol Invictus|Chronograph|Saturnalia|Annunciation” found nothing else dating the day.
# agent: the first pass (2026-11-27), lead agent alone (one side: critical). A curl fetch of the three web sources with a browser user agent was refused by the permission classifier; not retried. All sources read in Claude in Chrome (document.body.innerText split into paragraphs; transcribed verbatim into scratchpad/dec25-p1): Britannica “Christmas” (byline shown “Hans J. Hillerbrand, Britannica Editors”, rotates; attributed to Britannica); New Catholic Encyclopedia “Christmas and Its Cycle” on Encyclopedia.com; McGowan on Bible History Daily (inline footnote letters/numbers fused to words, e.g. “diedc”, “calendar.9”: no cited quote crosses one); Encyclopedia of Religion “Christmas” (Baldovin, 1987) on the same Encyclopedia.com page; Bible Odyssey Nissenbaum; BAS staff page on Schmidt. Every cited quote script-matched against the saved text (NFKC, entities, whitespace, curly quotes, dashes normalised): 5/5 found, once each. Trigger Claim matched by script as a substring of the only line at that timestamp and speaker in the final Transcript (E86 per processed-videos.json): 1/1; read 00:32:05 to 00:39:25.
# owner: empty (""). The owner delegated the publish review (#93; extended to the Timeline, #110, 2026-11-23); a `delegation` block is added when the independent second agent pass has run.
# Flags for the second pass: (1) Is 221 vs 336 a #99 split (display “221 or 336 CE”), or does Roll's “would point to” mean Britannica overstates Africanus, so the display should be 336 alone with Britannica in the note? The first pass shows both: two Reference sources date the same subject differently and #99 says the row “does not pick one”. (2) Roll's 336 dates the almanac's “source material”, not the mention's writing; is “336” in the display within Roll's scope, or should it read “by 336”/the mid-4th century (McGowan)? (3) Class: McGowan's Bible Review article is a signed piece by a professional scholar in a BAS magazine; Reference by the registry's BAS precedent (levine-1999-age-of-hellenism) and #86's trade-press ruling; in window (2002). Roll NCE 2nd ed.: year null as for the other NCE entries (collins-nce-pastoral-epistles: “bibliography to 2001”); Roll's bibliography item is 1995. (4) Britannica: author null, as for britannica-herod. (5) Title says “first named”: Britannica “first identified”, Roll/McGowan “earliest mention”; check it is no stronger than either.
