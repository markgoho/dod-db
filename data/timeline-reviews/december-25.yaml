# Flags for the second pass: (1) Is 221 vs 336 a #99 split (display “221 or 336 CE”), or does Roll's “would point to” mean Britannica overstates Africanus, so the display should be 336 alone with Britannica in the note? The first pass shows both: two Reference sources date the same subject differently and #99 says the row “does not pick one”. (2) Roll's 336 dates the almanac's “source material”, not the mention's writing; is “336” in the display within Roll's scope, or should it read “by 336”/the mid-4th century (McGowan)? (3) Class: McGowan's Bible Review article is a signed piece by a professional scholar in a BAS magazine; Reference by the registry's BAS precedent (levine-1999-age-of-hellenism) and #86's trade-press ruling; in window (2002). Roll NCE 2nd ed.: year null as for the other NCE entries (collins-nce-pastoral-epistles: “bibliography to 2001”); Roll's bibliography item is 1995. (4) Britannica: author null, as for britannica-herod. (5) Title says “first named”: Britannica “first identified”, Roll/McGowan “earliest mention”; check it is no stronger than either.
# Independent second agent pass 2026-11-27 (#93 delegation, #110): a fresh agent that did not build the entry, working only in its own scratch folder scratchpad/dec25-p2 (dec25-p1 and its match script not read). All three sources re-read in Claude in Chrome (own tab, closed after; two loads, the second to read more of McGowan and to look for Roll's edition line): Britannica “Christmas” (13 <p> elements with “December 25”, “Africanus” or “origin” listed by their opening words and headings; 4 read in full: the FAQ answers “How did December 25 become Christmas?” and “Does Christmas have pagan roots?”, and the two “Development of Christmas as a holiday” paragraphs beginning “The precise origin” and “A second view”; byline this load “Hans J. Hillerbrand, Britannica Editors”, attributed to Britannica); NCE “Christmas and Its Cycle” on Encyclopedia.com (document.body.innerText sliced: “History” ¶¶ 1–3, the History of Religions ¶ with “no earlier than 243, and no later than 336”, the Calculation Hypothesis ¶, bibliography and credit); McGowan on Bible History Daily (byline; the paragraphs beginning “Finally, in about 200 C.E.”, “The earliest mention of December 25”, “There are problems with this popular theory”, “The December 25 feast seems to have existed before 312”, “Around 200 C.E. Tertullian” and “Augustine, too”; notes 3 and 10; author line; original-publication line). Saved as verbatim excerpts with marked elisions (“[...]”), not full pages. Transcripts: E86 final Transcript (per processed-videos.json) read 00:32:33 to 00:39:25.
# Second pass matches: quotes 5/5 found once each by script (NFKC, entities, whitespace, curly quotes, dashes normalised) against the saved excerpts, and 5/5 once each by an in-page normalised occurrence count over document.body.innerText. Locators all find their quote; McGowan's “The earliest mention of December 25” confirmed to start its paragraph. Trigger Claim 1/1 by script: exactly one line at 00:34:56.680, speaker Dan McClellan as stored, text a substring.
# Second pass found (not cited; no citations added): (i) Britannica's own FAQ box on the same page, “How did December 25 become Christmas?”, says Africanus “dated Jesus’ conception to March 25 (the Annunciation), which, after nine months in his mother’s womb, would result in a December 25 birth”, and that “It was not until 336” that the church in Rome “began formally celebrating Christmas on December 25”: the FAQ treats Africanus as Roll does (a conception date that implies December 25), narrower than Britannica's body sentence (critical/2), and dates the feast at 336, not the naming. (ii) McGowan's “the first mention of a date for Christmas (c. 200)” refers to his paragraph beginning “Finally, in about 200 C.E.” (Clement of Alexandria), who “doesn’t mention December 25 at all”; not a December 25 date; McGowan nowhere names Africanus, and Hippolytus only in note 10. McGowan agrees with Roll on the earliest mention. (iii) McGowan, paragraph beginning “The December 25 feast”: the feast “seems to have existed before 312” (the Donatists): dates the feast, hedged; uncited. (iv) Encyclopedia.com shows no NCE edition or year line (only “© 2019 Encyclopedia.com”).
# Second pass changed: (a) title “December 25 first named as the date of Jesus' birth” → “December 25 first attested as the date of Jesus' birth” (Roll and McGowan date the earliest surviving mention, not a first naming; “attested” is no stronger than Britannica's “first identified … by Sextus Julius Africanus in 221” either; the lead brief's word). (b) Note: “Roll, in the New Catholic Encyclopedia, finds the earliest mention of the Nativity on December 25 in the Chronograph of Philocalus” → “Roll, in the New Catholic Encyclopedia, says the earliest mention of the Nativity on December 25 can be found in the Chronograph of Philocalus” (source's verb); “Africanus, writing before 221” → “Africanus, writing prior to 221” (source's words). Display, from, to, precision, cites, Trigger Claim and registry unchanged. Review notes: the first-pass header said the quote is kept whole from the turn's start; the turn opens “Yeah.”, which the quote leaves off (noted, not changed in the trigger).
# Second pass rulings on the first-pass flags: (1) Display stays “221 or 336 CE”. critical/2 verifies verbatim at its locator, flat, in Britannica's own voice; the FAQ box (finding i) is an uncited, softer gloss on the same page, not a source the entry can cite, and cannot by itself demote a verified sentence. Roll and McGowan are Reference sources of standing comparable with Britannica, and none of the three reports the others' date as a majority against itself, so this is #99's “sources differ … does not pick one”, not the `death-of-herod` lone-dissent pattern; demoting 221 because two sources give 336/mid-4th century would be the page counting sources (#80). But see lead flag 1. (2) 336 is within Roll's scope: Roll ties the earliest mention to the Chronograph's “source material”, which “can be dated to 336” (critical/3); the note keeps “whose source material can be dated to 336”. 336 rests on Roll alone (McGowan gives “mid-fourth-century”, no year); Roll's edition year was not read on the page (registry year null, as for the other NCE entries). (Context only: Roll's History of Religions ¶ dates the feast's institution “no earlier than 243, and no later than 336”, a different subject.) Kept; see lead flag 2. (3) McGowan: Reference. Signed article by a professional scholar (page: Dean and President of the Berkeley Divinity School at Yale, McFaddin Professor at Yale Divinity School), “originally appeared in Bible Review, December 2002”, in window; BAS precedent levine-1999-age-of-hellenism; #86 trade-press ruling (a scholar's popular work → Reference, state-of-the-field only). Agree. (4) Britannica author null, as for the other britannica-* entries. Agree. (5) “first named” was stronger than Roll's and McGowan's “earliest mention”; narrowed to “first attested” (change a).
# Flags for the lead: (1) Display alternative: “336 CE” (from/to 336), with Britannica's 221 kept cited in the note, attributed, beside Roll's “would point to”. Grounds: Roll explicitly reads Africanus as dating the annunciation and passion only, and Britannica's own FAQ box on the same page says the same (finding i), so Britannica's body sentence may overstate its source; and two sources (Roll, McGowan) agree on the earliest mention. The second pass kept the split (ruling 1). #244 (lone dissent, #99 vs #80) is not this case as filed, but the owner's answer on “comparable standing” would govern it; if #244 rules that one source against two that agree goes to the note, this entry's display becomes “336 CE”. (2) “336” rests on Roll alone; McGowan says only “mid-fourth-century”. If the lead wants the display no stronger than both, “by 336” or a mid-4th-century range is the narrower form; kept as Roll's year. Roll's edition and year were not read on the Encyclopedia.com page (no edition line; credit “[s. k. roll]”, “New Catholic Encyclopedia”; bibliography runs to Roll's own 1995 book); registry “2nd ed.”, year null, not confirmed on the page. (3) The Trigger Claim's Hippolytus c. 210 is dated by no source read; shown verbatim per #99, gap unexplained (Schmidt's work remains a lead). (4) At publish the gate requires `sourcesRead` to equal `delegation.secondPass` (2026-11-27).
# Publish resolutions, 2026-11-27 (lead agent, on the second pass's flags, conservatively): (1) Display stays “221 or 336 CE”, as both passes ruled. #244 (open) frames its question as sources of comparable standing versus a lone dissent that reports the majority against itself; here Britannica, Roll and McGowan are Reference works of comparable standing and none reports a majority, so #99's “does not pick one” governs and the `death-of-herod` note-only pattern does not apply. Moving 221 to the note on a two-against-one tally would be the page counting sources (#80). Britannica's FAQ box (uncited) adds no citation and cannot move the display. If the owner's #244 ruling sends a one-against-two split of comparable sources to the note, this display becomes “336 CE” with Britannica's 221 attributed in the note. (2) “336” kept as Roll's year, in Roll's scope (the almanac's source material). Roll's NCE text cites Roll's own 1995 book, so it is no older than that, whatever the edition label (“2nd ed.”, year null, as for the other NCE entries); in window. (3) Hippolytus c. 210 stays a lead (Schmidt, JEH review, BAS staff page); no issue filed: the leads stay in this file. The Trigger Claim stays verbatim (#99). (4) sourcesRead, review and secondPass all 2026-11-27; draft dropped. (5) First-pass slips corrected here: the Trigger Claim quote starts after the turn's opening “Yeah.”, not at the turn's very start; the `critical-scope` rule's first-pass note says “first naming”, superseded by the retitle to “first attested” (second pass).
