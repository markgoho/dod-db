leads:
  - "T. C. Schmidt, “Calculating Christmas: Hippolytus and December 25th”, Biblical Archaeology Review (Winter 2022): argues Hippolytus placed the birth on December 25 in the early third century (the Trigger Claim's side). BAS Library, paywalled; only title and byline visible. Not read."
  - "T. C. Schmidt, “Calculating December 25 as the Birth of Jesus in Hippolytus' Canon and Chronicon”, Vigiliae Christianae 69.5 (2015): 542–563 (as reported by search results). Not openly readable; not read."
  - "Review of T. C. Schmidt, Hippolytus of Rome's Commentary on Daniel (Gorgias, 2022), Journal of Ecclesiastical History (Cambridge Core PDF): reportedly notes the disputed manuscript reading of the birth date (Commentary on Daniel 4.23). Did not open in Chrome; not read."
  - "Megan Sauter (BAS staff), “December 25th and Christmas”, Bible History Daily (updated 19 December 2025): summarises and quotes Schmidt's BAR article (Hippolytus “wrote in the early third century AD”; a passage stating that Jesus was born on December 25). A staff summary near the excluded blog class (#80, #86); the quotes are found in another work, so a lead."
  - "Thomas J. Talley, The Origins of the Liturgical Year (1991), pp. 86, 90–91 (McGowan's note 10 for Hippolytus and De pascha computus); S. K. Roll, Toward the Origins of Christmas (1995). Not read."
  - "Helen K. Bond, “The Nativity” (Bible Odyssey; registry bond-2018-nativity): the issue's quoted sidebar line was not re-read for this subject."
uncited:
  - "McGowan, ¶ “Around 200 C.E. Tertullian of Carthage reported the calculation that the 14th of Nisan … was equivalent to March 25 in the Roman (solar) calendar”; March 25 nine months before December 25, later the Annunciation. Dates the March 25 calculation, not the naming of December 25; the sentence is broken by footnote marks. Not needed."
  - "McGowan, ¶ on Clement of Alexandria (about 200 C.E.): several days proposed, “Clement doesn’t mention December 25 at all.” Context; not needed."
  - "McGowan, ¶ 18: “in 274 C.E., the Roman emperor Aurelian established a feast of the birth of Sol Invictus (the Unconquered Sun), on December 25.” The show's Sol Invictus claim is a temple dedication; a different subject; not used."
  - "Roll, NCE, ¶ “The earliest extant evidence for the celebration of the feast is found in a sermon by Optatus of Mileve … In the early 360s”. Dates the feast's celebration, not the naming of the day."
  - "Britannica “Christmas”, ¶ beginning “A second view”: the a priori reasoning from a March 25 conception to December 25. No date."
  - "John F. Baldovin, “Christmas”, Encyclopedia of Religion (1987), on Encyclopedia.com: the feast “may have been celebrated as early as the beginning of the fourth century in North Africa, but certainly it was observed at Rome by the middle of the same century.” Dates the feast, and outside the 30-year window; not needed."
  - "Stephen Nissenbaum, “Luke’s Nativity and the Battle over Christmas”, Bible Odyssey: “Not until 395 C.E. did the church officially add that event—Christmas—to the ecclesiastical calendar.” Dates an official calendar addition, not the naming of December 25; no other source read gives 395; Nissenbaum writes as a cultural historian of Christmas, not of the early church. Not used."
