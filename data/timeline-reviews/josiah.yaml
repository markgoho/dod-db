# Review record for the Timeline Entry `josiah` (/timeline/#josiah; #93 shape). Not rendered.
# Issue #190 (from #108), “Timeline Entry: Josiah's reign and reform”. Issue notes: show the source's dual form as given (640/639); keep consistent with `judges-dtr` (“after 622 BCE”, from the reform) or note the source difference; the reform's extent goes in the note, not the date. Critical side only.
# Issue note not taken as written: no source read prints a dual form “640/639”. The issue's 640/639 merges the show's two numbers (E88 639, E163 640). The sources split instead: NABRE Kings, Britannica and EJ “Josiah” give 640–609; EJ “History: Kingdoms” and the HarperCollins dictionary give 639. Per #99 (sources differ → show both, each cited), display “640–609 or 639–609 BCE”; `from: -640`, the earlier start.
# Consistency with `judges-dtr` and `deuteronomy`: both rest on Hayes l11/l12 for 622. This entry's note dates the reform “around 622 BCE” on EJ (“i.e., 622 b.c.e.”) and Hayes l11 (“around 622”), and shows Britannica's “About 621” and HarperCollins's “ca. 620” as the other sources' years. No conflict with “after 622”.
# Sourcing test, 2026-11-26: met. Reference sources date the reign outright (NABRE, Britannica, two EJ articles, HarperCollins); Scholarly source on the reform's extent (Pakkala 2017, BZAW); Reference middle position (Coogan and Chapman). Kind: event. No Tradition Date: no Trigger Claim states the tradition's side. No setting (event entry).
# Trigger Claims (#99: one to three): E88 00:06:25 (reign 639–609), E88 00:31:26 (reform: some of it, mostly rhetorical), E163 00:21:07 (640 … 609, hedged). Not kept: E31 and E65 (“7th century” only), E7, E40, E102, E123, E172 (no date or verdict on the reign or reform found in the Transcript).
# agent: the first pass (2026-11-26). Two research agents (reign; reform) fetched every source into separate scratch folders (NABRE and Britannica refuse scripts; read in Chrome, page text saved). Every quote script-matched against the saved text (whitespace, quotes, dashes, entities, tags and EJ's “*” cross-reference marks normalised; case-insensitive): 14/14, zero misses. Trigger Claims matched by script as substrings of their Transcript lines at timestamp and speaker: 3/3.
# owner: empty (""). The owner delegated the publish review (#93; extended to the Timeline, #110, 2026-11-23); a `delegation` block is added when the independent second agent pass has run.
# Flags for the second pass: (1) Is “640–609 or 639–609 BCE” the right display, or should the one-year difference be shown only in the note? #99 says sources differ → show both. (2) HarperCollins's “(639 BCE)” dates Amon's assassination / Josiah's accession, not a printed reign span; Britannica gives 641 for the assassination while dating the reign c. 640. (3) Britannica and Van Seters mark the dates “c.”; NABRE, EJ and HarperCollins don't. Display has no “c.”. (4) EJ's “622” follows “discovered in the 18th year of the reign of Josiah, i.e.,” — EJ's own gloss on the text's eighteenth year; the note says “the eighteenth year of his reign”. (5) Pakkala's p. 271 sentence: the PDF has the stray space in “23:1– 24”; pages are the Helsinki reprint's running heads, which the reprint says may differ from the original. (6) Pakkala is the most skeptical position, attributed by name; Coogan and Chapman carry the middle position; neither is presented as the field. (7) Britannica's page also embeds a sidebar Deuteronomy article; quotes come from the Josiah article's paragraphs only. (8) E163's quoted span drops the turn's opening hedge: “if, and my late 7th century BC history I need to bone up a little bit on, but there is probably an overlap between Josiah and Jeremiah.”
# Independent second agent pass 2026-11-26 (#93 delegation, #110): every source re-fetched into a fresh scratch folder (Encyclopedia.com EJ “Josiah” and “History: Kingdoms”, Bible Odyssey /dictionary/josiah/, Open Yale lecture 11, OUP ch. 19 summary, Helda PDF via pdftotext; NABRE Kings intro and Britannica read in Chrome, the relevant paragraphs saved as excerpts from the page-text output, not full page dumps). All 14 quotes re-matched by script, case-sensitive (whitespace, quotes, dashes, entities, inline tags and EJ's “*” marks normalised): 14 hits, 0 misses, each at its locator (NABRE ¶ 7; Britannica ¶ 1–2 of the Josiah article, not the sidebar; EJ opening paragraph; EJ Kingdoms section head; HarperCollins sense 1; Hayes ch. 3; Coogan “Josiah” ¶ 3; Pakkala PDF pp. 8–9, running heads 271, 272). All 3 Trigger Claims re-matched by script at timestamp, speaker and verbatim text, about two minutes either side read: 3 hits.
# Second pass changed: note only; no citation cut, keys unchanged. (a) EJ's 622 dates the finding of the book, not the reform (EJ “The Reform and Its Historical Antecedents”: “good reasons for antedating Josiah's reform to the discovery of the book”), so “His reform is dated to around 622 BCE, the eighteenth year of his reign” became “Hayes dates his reform around 622 BCE … EJ dates the finding of the book of the law to his eighteenth year, 622”; the other reform years are attributed by name (Britannica about 621, HarperCollins ca. 620). (b) Unattributed “How much of the reform took place is debated” dropped: no source says the extent is debated; Pakkala calls the 2 Kings 23 text “debated”, now in his words. (c) Coogan and Chapman narrowed to the reign: their “idealized” and “some substance” sentences are about the accounts and portrait of his reign (substance from archaeology of influence, building and borders), not the reform's extent, so they are no longer set beside Pakkala as a reform position. Title, display, from/to, triggers and sources unchanged.
# Second pass flags: (1) display “640–609 or 639–609 BCE” kept; #99 settles it (sources differ → show both); not open. (2) HarperCollins prints no reign span (639 accession, 609 death); EJ Kingdoms is the only source with 639–609 outright; kept as start and end dates. (3) Title “reign and reform” kept: four Reference sources date a reform; Pakkala (Scholarly) doubts it in the 2 Kings sense, attributed. With Coogan narrowed to the reign, no cited source states a minimum-reform position (Uehlinger stays a Lead); publisher may want one. (4) check:timeline returns before the publish gate for a draft entry; critical/N and trigger keys were checked against the entry by script separately (14 citations, 3 triggers).
