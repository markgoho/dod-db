# Review record for the Timeline Entry `isaiah-40-55` (/timeline/#isaiah-40-55; #93 shape). Not rendered.
# Issue #227 (from #108). Issue notes: Tradition as stated is the 8th-century prophet Isaiah; the show rejects an 8th or 7th century date without calling it traditional, so a Tradition Date needs a trigger that names the tradition's side. #99 inconsistency in the show: 'exilic' (E113), 'post-exilic' (E104), 'around 520 BCE' (E43), 'late 6th or 5th century' (E90, E182); use the sourced value. Overlaps: must sit before `isaiah-56-66` ("After 515 BCE", same `deutero-isaiah` tag and topic); relate to `cyrus-babylon` (539) and `second-temple` (515); consider `anchor` to `cyrus-babylon` if the sources date it relative to Cyrus. Covers chapters 40–55 only. Setting optional.
# Shape chosen: one `critical` range, "Approximately 550–538 BCE", from -550 / to -538, placed by its start. New Catholic Encyclopedia (W. Hill) dates ch. 40 to 55 "oracles of the Exile (550–538)" in a sentence that says the sections are "approximately dated"; the display keeps "Approximately". Encyclopaedia Judaica (Theodore Friedman) dates the prophet's utterances "with approximate accuracy to 540 b.c.e.", alluding to Cyrus's impending conquest of Babylonia (539): inside the NCE range, so no split (#99), and given in the note. Coogan ch. 21 ("sometime in the sixth century in Babylon") and NABRE ("generally attributed to an anonymous poet who prophesied toward the end of the Babylonian exile") agree and are in the note, each as its source's.
# Anchor check: no `critical.anchor: cyrus-babylon`. The entry has sourced years of its own (550–538); an anchor would replace them with 539 in placement (#210 note on `isaiah-56-66`: an anchor fits only an entry with no sourced date). The EJ quote names Cyrus's 539 conquest as what the prophet alludes to, and the note says so. No `seeAlso`: it takes one id, and `cyrus-babylon` and `isaiah-56-66` sit a few rows away anyway.
# Overlaps checked: `isaiah-56-66` (after 515) sits after this entry's 550–538; Coogan ch. 22 (cited there) says Third Isaiah dates "after the exilic period, when Second Isaiah was written", consistent. `cyrus-babylon` (539) falls inside 550–538, consistent with EJ's "impending conquest" and NABRE's "toward the end of the Babylonian exile"; NCE's 538 is the year Cyrus let the Jews return (same NCE article, uncited). `second-temple` (515) not contradicted: nothing here says 40–55 is after the return.
# #99 on the show: Trigger Claims kept: E43@00:45:20 (critical: "around 520 BCE … after the return", the first layers), E90@00:39:52 (critical: "late 6th or 5th century BCE"), E43@00:49:42 (tradition: Beecher reading Got Questions, which holds a single author). The show's 520 / "after the return" and 5th-century options differ from the sources' exilic 550–538; the gap is left unexplained (#99, #86). Not stored: E43@00:48:54 (rejects the 8th or 7th century date but names no one holding it; the issue rules it out as a tradition trigger), E104@00:50:52 ("This is post-exilic"), E113 (says only "the exilic period" for a theme, not 40–55's date), E179@00:42:16 ("40-55 added later", no date), E182 (no Isaiah 40–55 dating line found in the final Transcript; its "post-exilic Judaism" at 00:44:23 is not about Isaiah).
# Tradition: E43@00:49:42 names the tradition's side (Got Questions: "the theory of multiple Isaiahs is one example of skepticism"); the sentence is verbatim on Got Questions' "What is the Deutero-Isaiah theory?" page (last updated March 12, 2024), which gives no date for chapters 40–55. The date comes from Got Questions' "When was Isaiah written?" (last updated March 25, 2025): "Chapters 40—66 of Isaiah were composed between approximately 700 and 680 BC." Its scope is 40–66, wider than this entry, so the display says "for chapters 40–66". Middles −544 and −690 are 146 years apart: the Tradition Date gets its own row (#214).
# Setting skipped: the issue's "the prophet's 8th-century Jerusalem" is not what these sources say 40–55 addresses (Coogan: "in Babylon, not in eighth-century Jerusalem"; EJ: "an unknown prophet of the Babylonian Exile").
# agent: the first pass (2026-11-26, lead agent). Pages fetched by curl (browser UA) into the lead's scratch folders (first: OUP Coogan ch. 21–22, USCCB NABRE Isaiah intro, Yale RLST 145 lectures 19–20; tradition: Got Questions pages) and one critical-side research agent's own folder (critical-agent); Britannica read in Claude in Chrome (refuses scripts) and the article text saved from the DOM (critical-chrome; uncited). NCE and EJ fetched by the research agent from encyclopedia.com (ec-isaiah-book, ej-isaiah). One script matched every quote against its saved text (NFKC, whitespace, quotes, dashes and HTML entities normalised): 5/5 hits, 0 misses, each once; all 3 Trigger Claims matched as substrings of their Transcript lines at timestamp and speaker.
# owner: empty (""). The owner delegated the publish review (#93; extended to the Timeline, #110, 2026-11-23); a `delegation` block is added when the independent second agent pass has run.
# Flags for the second pass: (1) Trigger E43@00:49:42 is Dan Beecher reading a Got Questions sentence; it states the tradition's side on authorship, not a year. If it does not count as stating the tradition's side, cut the trigger and the whole `tradition` block; the entry stands on its critical side. (2) Tradition scope: Got Questions dates 40–66, not 40–55; display carries the scope. (3) EJ's 540 is said of "Chapters 40–66" taken together ("for purposes of this article they will be considered in conjunction with them"), though its evidence (45:1; 47:1) is in 40–55; the note says "the prophecies". Narrow or cut if it reads as dating 40–55 alone. (4) NCE edition and year are not printed on the encyclopedia.com page (registry year null, as for jensen-nce-flood); bibliography and signature "[w. hill]" only. If it falls outside #86's window, the display falls back to Coogan's "6th century BCE" (from -600 / to -501). (5) NCE's "approximately dated" scopes all four sections; check the display's "Approximately" is no stronger or weaker. (6) Note wording: check each clause against its source ("anonymous prophet": NABRE's "anonymous poet"; "Oracles of the Babylonian exile": NCE's "oracles of the Exile").
