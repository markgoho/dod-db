# Second pass changed (entry note only; title, display, from/to, tradition display and holder unchanged; no citation or Trigger Claim cut). Before: “Oracles of the Babylonian exile, by an anonymous prophet. Another source dates the prophecies to about 540 BCE, alluding to Cyrus's impending conquest of Babylon (539); others say the sixth century, in Babylon, and that the poet prophesied toward the end of the exile.” After: “Oracles of the Babylonian exile. Encyclopaedia Judaica, treating chapters 40–66 together, dates the prophet's utterances with approximate accuracy to 540 BCE, from his allusions to Cyrus's impending conquest of Babylonia (539). Coogan and Chapman's summary says Second Isaiah was composed sometime in the sixth century, in Babylon; the NABRE's introduction says chapters 40–55 are generally attributed to an anonymous poet who prophesied toward the end of the Babylonian exile.” Why: “by an anonymous prophet” was no cited source's wording; EJ's date was said of 40–66 taken together and of Babylonia; “alluding” dangled onto the source; “others” folded two single-source statements together; NABRE's “generally attributed” hedge was dropped. Review notes corrected: E90 trigger is the sixth and seventh sentences of its line; E43@00:49:42 is the first sentence of its turn, not the whole turn.
# Second-pass rulings on the first pass's flags: (1) Kept. #80 makes a Trigger Claim any substantive assertion by a Speaker about the subject; Beecher relays a named holder's position (precedent: bible-composition's E175@00:15:14, McClellan relaying what “they” say), and the Transcript ties it to the date: McClellan says at 00:48:54 that 40 to the end were “absolutely not written in the 8th or even the 7th century BCE”, Beecher answers at 00:49:27 that he found articles “skeptical of this claim”, then reads Got Questions against multiple Isaiahs. So it states the tradition's side of the dating question (#99: “a datable verdict”). Support only, not read on air: the Got Questions page frames multiple authorship as “re-dating” the prophecies. Weak points (lead flag 1): it is a question, relays a third party, and speaks of authorship, not a year. (2) Accepted: the display carries “for chapters 40–66”. (3) Kept, narrowed: the note now states EJ's 40–66 scope. (4) Accepted, not confirmed: bibliographies run to 1998 (NCE) and 2005 (EJ), so both are likely 2nd-edition text (NCE 2003, EJ 2007) and inside #86's 30-year window, the same inference as jensen-nce-flood (“likely the 2nd ed., 2003; not confirmed”); NCE's body still recommends a 1961 translation, so at best a revision of older text; years stay null (lead flag 2). (5) Accepted: “approximately dated” scopes all four sections, including ch. 40 to 55; “Approximately” is no stronger or weaker. (6) Fixed: “anonymous prophet” cut; NABRE's “generally attributed … anonymous poet” now carried as NABRE's; “Oracles of the Babylonian exile” kept for NCE's “oracles of the Exile”.
# Flags for the lead: (1) If a tradition trigger must itself state a date or period, cut E43@00:49:42 and the whole `tradition` block; the critical side still meets the entry rule (four Reference sources: NCE, EJ, Coogan summary, NABRE; NCE alone carries 550–538). (2) The display's 550–538 rests on NCE alone; if NCE's likely-2nd-edition inference (bibliography only) is not enough for the window, the display falls back to Coogan's sixth century (from -600 / to -501), with EJ's 540 and NABRE in the note.
