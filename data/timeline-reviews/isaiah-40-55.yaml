leads:
  - "Yale Divinity School study guide on Isaiah, reportedly “around 538-539 B.C.” (search snippet; PDF 404): not read."
  - "A commentary (likely McKenzie, Anchor Bible 1968, or Westermann, OTL), reportedly “some time after 550, the year which saw the beginning of the victorious campaign of Cyrus” (search snippet): not read; outside #86's window either way."
  - "BAS Library “Who Wrote Second Isaiah?” (403) and Oxford Bibliographies “Second Isaiah” (Cloudflare check): not read."
  - "Tiemeyer, “The Book of Isaiah and the Neo-Babylonian Period”, Cambridge Companion to the Book of Isaiah, ch. 3: only the free summary read (support of Cyrus “should not be used without reflection as dating criteria”); the chapter itself not read."
uncited:
  - "Britannica “Book of Isaiah” (read in Chrome, saved from the DOM): “Deutero-Isaiah (40–55) … dates from the Babylonian Exile (6th century BC). The anonymous prophet is in exile”. Agrees; redundant with Coogan for the century, and NCE and EJ give the years."
  - "Williamson, Bible Odyssey “How Many Isaiahs Were There?” (2015): Isa 45:1 refers to Cyrus “looking forward to his capture of Babylon in 539 B.C.E.”; the writer “looks forward to the imminent arrival of Cyrus”. Relative and agrees with EJ; adds no date."
  - "Shaked, Encyclopaedia Iranica “Isaiah, Book of” (2006): places 40–66 against the exile of “587-582 B.C.E.” and says the author “may have been active among the Jewish population who remained in Judah”. Broad, 40–66, and a setting rather than a composition date."
  - "Avishur, EJ “Deutero-Isaiah” section: a background “more than 150 years later than the time of Isaiah son of Amoz”; the prophet appeared “about 20 years” after Ezekiel's vision. Relative only."
  - "NCE, same article, ¶ beginning “Though admittedly it is difficult”: the poet-prophet applied Isaiah's message “to the situation of the Exile and the return (537 b.c.)”. Its 537 differs from its own 538 for the return; neither is the composition date, so not used."
  - "Couey, Bible Odyssey “Isaiah”: 40–66 “was written after the time of the historical prophet”. No date."
  - "Got Questions “Summary of the Book of Isaiah”: “The book of Isaiah was written between 739 and 681 B.C.” The whole book, not 40–55; the “When was Isaiah written?” page it links to dates 40–66 separately."
  - "Got Questions “What is the Deutero-Isaiah theory?”: the page Beecher reads (E43@00:49:42); “Most conservative Bible scholars are in agreement that Isaiah was the sole author”. Authorship only, no date."
  - "Britannica “Book of Isaiah”: “Chapters 40–66 are much later in origin and therefore known as Deutero-Isaiah (Second Isaiah).” Wider than 40–55 and no date."
  - "Hayes l19 ch. 4: “It's clear, first of all, that these parts of Isaiah were written after the Exile . Parts of Third Isaiah were written after the Exile, [and] all of second Isaiah”. The transcript line is garbled and the same paragraph says “The audience that's addressed is living in exile”; citing it would manufacture an exilic / post-exilic split. Ch. 5 calls it “a wholly post destruction work” (after 586, not a date)."
  - "Coogan ch. 22 OUP summary, section “Third Isaiah”: Third Isaiah dates “to a period after the exilic period, when Second Isaiah was written”. Relative and in a section on 56–66; Coogan ch. 21 carries the date."
