# Review record for the Timeline Entry `aramaic-script` (/timeline/#aramaic-script; #93 shape). Not rendered.
# Issue #218 (follow-on from #217, Old Hebrew script, blocked on a Trigger Claim), retitled “Timeline Entry: Hebrew writers adopt the Aramaic square script”. Issue notes: keep separate from `hebrew-writing`, `hebrew-language` and #217; the two Trigger Claims differ (“after the Babylonian Exile” vs “while they were exiles”), apply #99 if sources split. No Tradition Date expected.
# Scope chosen: Judean scribes taking up the Aramaic script in place of the Old Hebrew script. Title drops “square”: the sources treat the Jewish (“square”) script as a later development out of the Aramaic script, from the third century BCE (Richelle, Introduction ¶1: Dead Sea scrolls' “Jewish script”, third century BCE – first century CE; Eshel 2014 Archaic book hand ca. 275–150 BCE; Posen guide), so “adopt the square script” would date something different. Id `aramaic-script` (not `-tradition`).
# Two subjects kept apart: (A) Judean scribes take up the Aramaic script at all; (B) Hebrew texts are written in it instead of Old Hebrew. Richelle Introduction ¶1 is A (“Judean scribes adopted the latter likely in the sixth century BCE”); Schniedewind p. 139 is A/B (the Hebrew script “is replaced by Aramaic script” in the Persian period, inside a language-shift argument); Longacre p. 11 is B outright (“even for Hebrew texts”, starting in Persian-period Yehud). Naveh's third-century view, reported by Richelle §2.3.3, is about B only, and is shown as Richelle's report, opposite Mizrahi's Persian-period process. Title follows A, which all three outright cites support; B goes in the note, attributed.
# Sourcing test, 2026-11-26: met as critical, split shown (#99). Richelle 2026 (Scholarly, Cambridge Elements) “likely in the sixth century BCE”; Schniedewind 2006 (Scholarly, OI Seminars 2) “in the Persian period”; Longacre 2021 (Scholarly, COMSt Bulletin) “Starting in Persian-period Yehud … gradually”. “Likely” and “gradually” are hedges, not conditions (cf. hezekiah-reform's “if the reform was an actual historical event”), so this is a Critical Date, shown in each side's own words. Either Schniedewind or Longacre alone meets the entry rule if Richelle is cut.
# Placement: from -600 (start of Richelle's sixth century, the earlier side), to -330 (end of the Persian empire per Richelle's own “ca. 539–330 BCE”, which matches cyrus-babylon's 539), precision period. The note says where it is placed. Placing from -539 (anchor cyrus-babylon) would take the Persian-period side; flag for the second pass. Check minimap crowding near fall-of-jerusalem (587/586) at preview (#175).
# Consistency: fall-of-jerusalem (587 or 586) and cyrus-babylon (539) agree with Richelle's Neo-Babylonian (ca. 612–539) and Persian (ca. 539–330) ranges. hebrew-writing (earliest Hebrew writing, ca. 1000 BCE) and hebrew-language (undated) are different subjects; nothing here dates them. No anchor or seeAlso (none needed; cyrus-babylon is published if the second pass prefers an anchor).
# Trigger Claims: E152@00:37:40.218 (trimmed from the turn's opening “Absolutely. And the first thing to note …”; no hedge dropped; read 00:35:43 to 00:40:58; 00:38:30 adds that square-script letter confusions “would have had to have happened after the Babylonian Exile”, and 00:39:31 that most Hebrew Dead Sea scrolls are in square script, context only) and E43@00:45:20.710 (trimmed from a turn on Aramaic loanwords in Isaiah 40–55; no hedge dropped; read 00:43:07 to 00:46:47). Both Dan McClellan, both states: critical. They differ (“after” vs “while they were exiles”); per #99 both are shown verbatim and the gap is left unexplained; the entry's sides (sixth century, Persian period) follow the sources, not the show. Not stored: E52@00:10:04.930 (“the Hebrew Bible would not begin to be written down in the Aramaic square script until the post-exilic period”): its subject is copying the Hebrew Bible in square script (subject B, narrower), and two claims already cover the entry's subject; E152@00:38:30 (relative, textual-criticism aside).
# agent: the first pass (2026-11-26). Two research agents, both on the critical side (no Trigger Claim states a tradition's side; an event has no setting): one on reference works, one on scholarly works, each saving every fetched page to its own scratch folder; quotes copied from saved text only. Richelle re-fetched by the lead with a clean anonymous curl: full text present (quote found), no login. Quotes script-matched against the saved text (whitespace, quotes, dashes, entities, soft and line-break hyphens, Cambridge's inline “Reference …” citation pop-ups normalised): 5 hits, 0 misses. Trigger Claims matched by script as substrings of their Transcript lines at timestamp and speaker: 2 hits.
# owner: empty (""). The owner delegated the publish review (#93; extended to the Timeline, #110, 2026-11-23); a `delegation` block is added when the independent second agent pass has run.
# Flags for the second pass: (1) Richelle's page states no open-access licence; it opened in full without login on 2026-11-26 but may be a time-limited free view. (2) Schniedewind p. 139 sits in a language-shift argument: does “is replaced by Aramaic script” date the script change, or Aramaic writing displacing Hebrew writing? (3) Display “Likely the 6th century BCE, or starting in the Persian period”: the sides overlap (539–501); check the “or” is fair and neither side overstated. (4) Placement from -600 picks the earlier side; consider anchor cyrus-babylon. (5) Longacre's venue (COMSt Bulletin, Hamburg) for the Scholarly class; author at the Qumran Institute, Groningen. (6) Zissu & Abadi 2014 (“During the Babylonian exile, the Jews adopted the “square Hebrew” script”) left uncited though it is the only unhedged exile-date source; confirm.
