leads:
  - "Naveh, Early History of the Alphabet, 2nd ed. 1987, p. 117: Paleo-Hebrew still regularly used for Hebrew texts until the third century BCE. Known via Richelle §2.3.3; archive.org copy borrow-only. Pre-1996."
  - "Mizrahi 2017, “Script-Switching …”, KUSATU 22: 101–123: switch a process starting in the Persian period. Via Richelle; academia.edu blocked."
  - "Würthwein, The Text of the Old Testament (Eerdmans): transition “between the fourth and second centuries B.C. — it is impossible to be more precise”; Ezra c. 430 B.C. as Jewish tradition. Seen only on a bookseller listing. Pre-1996 edition."
  - "Yardeni in Scrolls from the Dead Sea (1993) p. 130: post-exilic, the Aramaic cursive gradually replaced the ancient Hebrew script. Via Jewish Link (non-scholarly). Pre-1996."
  - "Koller, TheTorah.com (2025), “The Transformation of Hebrew Script: From Paleo-Hebrew to Aramaic”: body text loads by script, not read; standfirst only."
  - "Hamilton, “Paleo-Hebrew Texts and Scripts of the Persian Period”, in An Eye for Form (2014) pp. 253–290; Vanderhooft on Yehud scribes; Perrot & Richelle 2022; Gzella (Tübingen repository, timed out): not obtained."
  - "Cross 1961, “The Development of the Jewish Scripts”: cited by Lexham and EJ; not open; pre-1996."
  - "Britannica “Hebrew alphabet”: search snippets only (Square Hebrew traced from the 3rd century BCE); pages 403."
uncited:
  - "Zissu & Abadi 2014, Journal for Semitics 23/2i p. 654: “During the Babylonian exile, the Jews adopted the “square Hebrew” script …”. Peer-reviewed and unhedged, but dates the “square Hebrew” / “Jewish” script, which Richelle and Eshel date from the third century BCE: it conflates the Aramaic script with the later Jewish script. Left out."
  - "Moore 2023, N.A.B.U. 2023/1 note 28 pp. 66–68: al-Yahudu epigraphs switch from Hebrew (latest 550 BCE) to Aramaic (from 538 BCE). One exile community's administrative language and script together; not Judean scribes generally. Same evidence reported by Richelle §2.3.1 as “tempting … although more evidence would be required”."
  - "Encyclopaedia Judaica, “Alphabet, Hebrew” (encyclopedia.com), Naveh: “It seems likely that in the Persian period the Aramaic script was used for writing Aramaic texts only …”; Birnbaum: the new script “adopted by the Jews in Babylonia and elsewhere, and later penetrated Palestine”. Content from the 1971 edition (bibliography to 1968), outside the 30-year window; hedged; Naveh's view shown via Richelle instead. Also carries the Talmudic tradition (Sanh. 21b) crediting Ezra."
  - "Posen Library guide, “Ancient Israelite Languages and Writing Systems”: “Later, in the Persian period, as Jews adopted the Aramaic language, they used its script …”. Unsigned; page partly gated for non-members."
  - "Lexham Bible Dictionary, “Aramaic Script” (2016): “the Aramaic script gradually replaced the Hebrew abjad in the postexilic period”. Unsigned; evangelical publisher (Faithlife); not used."
  - "BiblicalTraining.org, “Scripts”: “During and after the Babylonian exile, Jews increasingly wrote Hebrew in Aramaic letters.” Unsigned; confessional."
  - "Eshel 2014 (An Eye for Form) and Longacre 2021 abstract: the Jewish formal hand from ca. 275 BCE; Greek reed pen in the third century BCE. The later Jewish script, a different subject."
  - "Jewish Encyclopedia (1901), Lidzbarsky, “Alphabet, the Hebrew”: gradual adoption; Ezra tradition “certainly not correct”. Far outside the window."
  - "Bible Odyssey (Perrin, Silverman, Breed ×2, Rubin, Tzoref, Davidson, Keddie “Money”, Young “Yahweh”): Aramaic language spread or Paleo-Hebrew persistence (Yehud coins); no date for the script change."
  - "Tov 1996 (Scripta Classica Israelica 15) p. 268: Paleo-Hebrew Qumran texts written relatively late; no adoption date."
  - "Rollston 2010 (SBL ABS 11): Iron Age only; nothing on the change."
