# Review record for the Timeline Entry `death-of-james` (/timeline/#death-of-james; #93 shape). Not rendered.
# Issue #233 (from #108), “Timeline Entry: The death of James, brother of Jesus”. Issue notes: kind event; tradition as stated “c. 69 CE, during the siege (Hegesippus, Clement, Eusebius)”; critical as stated “c. 62 CE (Josephus)”; lead E99 00:14:46, both sides; the tradition here is early Christian historiography, not modern apologetics; a Tradition Date needs a Tradition source holding 69 CE in its own words (check whether Eusebius quoting Hegesippus meets the Tradition source rule); the Critical Date needs a Scholarly or Reference source reading Ant. 20.200 as 62 CE; overlaps `temple-destruction` (70 CE; revolt from 66): keep wording consistent; keep separate from `letter-of-james` (composition of the letter); crowding of CE entries is #175.
# Shape decision (step 2): `critical`, display “c. 62 CE”, `from: 62`, `precision: year`; no `tradition` block; no anchor, no seeAlso. Britannica (Reference) gives “died 62 CE” flat in its lede; Schmidt (Scholarly, OUP 2025) says “likely executed in 62 ce” and “around 62 ce”; Jackson-McCabe (Reference, Bible Odyssey) “reportedly … around 62 C.E.”. “c.” keeps the display no stronger than the two hedged sources; the note carries their hedges. Title is worded for the death; Britannica and Schmidt also give the manner (put to death, executed, stoned), shown attributed in the note.
# #99: no Scholarly or Reference source read gives a different year in its own voice, so no split. The 69 CE side enters the note only as Schmidt's report of what Christian tradition holds (p. 232), attributed to him by name, with his n. 12 for what Hegesippus and Clement (via Eusebius) say: a sequence (“immediately before Vespasian's siege”), no year. The note adds no year to Vespasian's siege and words the 69 as the date of James's death in that tradition, never of the destruction (`temple-destruction` keeps 70 CE).
# Tradition Date dropped (sourcing test): the Trigger Claims state the tradition's side as 69 CE, held by early Christian authors. No Tradition-class source read holds 69 in its own words: Got Questions (“about A.D. 62”), the Orthodox Church in America's Lives of the Saints (“about 63 A.D.”), Catholic Answers / Akin 2013 (“A.D. 62”) and Benedict XVI's 2006 audience (“in the year 62”) all give 62 or 63, which is not the side the Trigger Claims state (uncited). Eusebius HE 2.23 (read at New Advent by the tradition agent) gives no year, only the sequence; Clement gives no date. No existing entry uses an ancient author as a Tradition source or holder (all `holder:` lines are modern bodies), so Eusebius/Hegesippus are not made one. McGiffert's 1890 NPNF note says he can “find no reason for asserting that Hegesippus assigns the martyrdom to 69” (uncited: 1890, outside the ~30-year window; Schmidt carries the report).
# Trigger Claims (#99, three of four found): 99@00:14:46 (both; “either in 62 CE or in 69 CE, depending on who you're listening to”), 99@00:17:55 (critical; “around 62 CE”, after reading Ant. 20.200), 99@00:18:41 (both; Josephus “around 62 CE”; Clement, Eusebius, Hegesippus “insist that James was killed around 69 CE in the hullabaloo of the Roman siege”). `states: both` is what the quotes say; there is no tradition block because no Tradition source holds 69, not because the side is unstated. Hedges dropped by trimming: 14:46 opens “But we have. It looks like Herod Agrippa …” and the date sentence carries “it seems”; after 18:41 McClellan says (00:19:46) “It's up in the air. I think most scholars would probably say of all these folks, Josephus is probably the closest to the events and is probably to be trusted the most.” Read: E99 00:12:36–00:21:30.
# Dropped Trigger Claim leads: 99@00:20:21 (“probably somewhere around 62 CE, he's out of the picture”; repeats 17:55; three suffice). E69@00:57:06 (Kok, “James is killed too early, like around 40 CE”): the son of Zebedee, not the brother of Jesus; the inventory's “also 69” is that trap or E86@00:41:34 (“in 69 CE, Vespasian becomes Emperor”, not James). E86@00:45:34, E140@00:24:43, E170@00:10:01 and E54@00:19:36 mention James's execution or death with no year.
# agent: the first pass (2026-11-26). Two research agents (critical side, james-critical; tradition side, james-tradition) saved every fetched page into their own scratch folders and copied quotes only from the saved text; no setting agent (an event). The lead read Britannica (/biography/Saint-James-the-Lords-brother; the hyphenated “Lord-s” URL errors) and Bible Odyssey /articles/james/ in Claude in Chrome (both refuse scripted requests), and Schmidt's open-access PDF in OAPEN's pdf.js viewer (curl gets 403); in-tab counts against the whitespace-normalised text: 1 each for all seven quotes. Schmidt p. 232: the text layer reads “shortly be-” at a line end (item ends at x≈388, next line starts at the left margin) and “cause of )” (kerning space), quoted as “before” and “of)”: normalised count 1, raw count 0. Britannica JSON-LD on this load: author “Britannica Editors”, datePublished 1998-07-20, dateModified 2026-10-17; the lede is p.topic-paragraph 1; a Britannica AI Q&A block above the article also says 62 and is not cited. Trigger Claims script-matched as substrings of their final Transcript lines at timestamp and speaker: 3 hits, each once.
# owner: empty (""). The owner delegated the publish review (#93; extended to the Timeline, #110, 2026-11-23); a `delegation` block is added when the independent second agent pass has run.
# Flags for the second pass: (1) Display “c. 62 CE”: Britannica is flat (“died 62 CE”), Schmidt and Jackson-McCabe hedge; check “c.” and the note's hedges. (2) Schmidt p. 232 quote: confirm the dehyphenation (“be-fore” at a line end) and “of)”; the sentence's “around 69 ce” follows “the destruction of Jerusalem”: check the note reads it as Schmidt's date for James's death in Christian tradition (the sentence's subject is “it”, James's death), and that nothing dates the destruction to 69. (3) Note paraphrase of Schmidt n. 30 (“in the interval after … Festus had died and before his successor arrived”): his words are “during the intervening moment when the Roman governor Festus had died and his replacement had not yet arrived”; the quote is trimmed at “had died”. (4) Jackson-McCabe's “reportedly” may scope both the agent and the date; the note keeps it on the clause. (5) Britannica's “reputedly” scopes the manner, not the year; check. (6) `states: both` on 14:46 and 18:41 with no tradition block. (7) Jackson-McCabe is Reference per #86's per-author rule (associate professor, Cleveland State University; author page).
# Second agent pass, 2026-11-27 (fresh agent; did not build the entry; read none of the first pass's scratch folders or files; the folder name first assigned, james-p2, already held other files, unread; this pass used james-p2-second). Re-fetched: Bible Odyssey article and author page by curl (200); Britannica (curl 403) and Schmidt's OAPEN PDF (curl 403, handle and bitstream) read in Claude in Chrome in this pass's own tab (closed after); Britannica JSON-LD on this load: author Britannica Editors, datePublished 1998-07-20, dateModified 2026-10-17; Schmidt text via pdf.js getTextContent on all 337 pages; passages saved.
# Match counts: 7 of 7 quotes found once each at their locators (Britannica in-tab innerText 1/1; Schmidt 1/1/1 raw, p. 232 ¶ 2 raw 0 and 1 after joining “be-fore” and “of )”; Jackson-McCabe 1). Trigger Claims: 3 of 3 exact substrings of the final Transcript lines at timestamp and speaker (Dan McClellan); E99 00:12:36–00:21:31 read.
# Second pass changed: entry note “Jackson-McCabe puts the death, reportedly at the hands of an interim Judean authority, around 62 CE.” → “Jackson-McCabe says James died, reportedly at the hands of an interim Judean authority around 62 CE.” (his “reportedly” may scope the date; the old commas fenced it off the date). No citation cut; no Trigger Claim cut; keys unchanged; registry unchanged.
# Second-pass rulings on the first-pass flags: (1) “c. 62 CE” kept: Britannica flat, Schmidt “likely”/“around”, Jackson-McCabe “reportedly … around”; “c.” is no stronger than the weakest backing source and the note carries the hedges. (2) Pass: “be-fore” is a line-end hyphen; the subject of “puts it … around 69 ce” is James's death; nothing dates the destruction to 69. (3) Pass: paraphrase faithful. (4) Narrowed (see change). (5) Pass: “reputedly” scopes the manner. (6) Pass: both lines state 62 and 69. (7) Pass: author page confirms.
# Flags for the lead: (1) Schmidt's “around 69 ce” for Christian tradition rests on sources (his n. 12) that give no year; the note attributes it to him (“he says”), and McGiffert 1890 (uncited) disputes that Hegesippus gives 69; acceptable as attributed, but don't upgrade it to a Tradition Date. (2) The note's “Vespasian's siege” is Hegesippus via Schmidt; `temple-destruction` names neither Vespasian nor Titus, so no conflict, but the Romans' 70 CE siege was led by Titus; leave as attributed. (3) The 18:41 Trigger Claim puts 69 “in the hullabaloo of the Roman siege of Jerusalem and the destruction of the temple”: shown verbatim and apart; the entry text dates nothing else. (4) Not re-fetched: the uncited items and leads; they back nothing on the page.
# Publish resolutions, 2026-11-27 (lead agent, on the second pass's flags, conservatively): (1) The 69 stays only as Schmidt's attributed report (“he says”) of Christian tradition; no Tradition Date is made from it, and the McGiffert 1890 dispute stays uncited (outside the window). (2) “Vespasian's siege” stays inside the attributed Hegesippus clause as Schmidt n. 12 words it; no year or commander is added; `temple-destruction` (70 CE) is not contradicted. (3) The 18:41 Trigger Claim is shown verbatim and apart (#99); the entry dates only James's death. Second-pass change to the Jackson-McCabe clause accepted. Delegated review (owner's delegation, #93/#110; no owner check).
