# Review record for the Timeline Entry `acts` (/timeline/#acts; #93 shape). Not rendered.
# Issue #228 (from #108), “Timeline Entry: Acts”. Issue notes: kind composition; tradition as stated “Luke; early-date camp puts it before 64 CE, because the book ends before Paul's death”; critical as stated “80–90 CE (mid-range view); or early 2nd century, after Josephus's Antiquities (94/95 CE); as late as the 110s”; sides both, weakly (the inventory: “before 64 CE” is described on the show as a scholarly or conventional position, not an apologetic one), so a Tradition Date needs a Tradition source holding the early date in its own words; NABRE NT introductions are outside the 30-year window (#86); Acts' date hangs on Luke's and the show is internally inconsistent on Luke (#99); the critical side is itself a spread, so the Critical Date may be a range; avoid quoting the E80 slip putting the Jerusalem Council in “the 30s CE”; overlaps: none published in the 1st century except `temple-destruction` (70 CE) and `revelation`; CE crowding is #175. Neither overlap entry is contradicted: `temple-destruction` dates Jerusalem's fall to 70 CE, which Tyson's reason (critical/3) restates; `revelation` dates another book. No `anchor` or `seeAlso`.
# Sourcing test, 2026-11-26: met, as a `critical` entry with alternatives (#99). No source read dates Acts outright to a single year or range as the field's settled answer; they report a spread and differ on its middle. Outright or state-of-field statements: Seccombe (Tyndale Bulletin 2020, Scholarly, peer-reviewed): “A majority of scholars favour a date between 70 and the early 90s” and post-70 first-century dating “is the majority view”; Tyson (The Bible and Interpretation, 2011, Reference, as silverman-2011-iranian-influence): most modern scholars favour “c. 80-c. 90 CE”; Armstrong (JGRChJ 2017, Scholarly): the middle group (post-70 to about 80) “seems to represent the current majority opinion”; Britannica's editors: “perhaps between 70 and 90 CE” (hedged). Late view: Fredriksen (Bible Odyssey, 2019) dates Acts to the early second century outright; Tyson: a growing number prefer c. 110–120 CE. Display “70 to the early 90s CE, or the early 2nd century CE”: the first alternative is Seccombe's majority range, which contains Tyson's, Armstrong's and Britannica's; the second is Fredriksen's outright date and Tyson's growing late view. Not harmonised into one span: shown as alternatives, each cited. `from: 70`, `to: 120`, `precision: period` are placement years for the two alternatives' outer bounds (120 is Tyson's late bound), not one source's range.
# State of the field (#80): Seccombe, Tyson and Armstrong each give a majority view and differ on its range (70–early 90s; c. 80–90; post-70 to about 80), so the display carries no consensus word and the note attributes each by name. The one majority claim the note states (Seccombe's 70–early 90s) is attributed to him, and he is named as an early-date advocate so the reader sees who says it. Reasons (#86 rule: when a source gives them): Tyson's sentence on Jerusalem's destruction (critical/3) follows; Seccombe's own reason (“primarily, I think, because of a difficulty with dating Mark”) is his opinion of why others hold it: uncited.
# Early date: held by Armstrong and Seccombe in peer-reviewed venues, and reported by Tyson (“Some scholars prefer an early date”) and Britannica (“some think a slightly earlier date is also possible”). So the early date is in the note as a scholarly minority view, attributed (#80 “dissenting view … attributed by name”), and also, separately, as a Tradition Date held by a ministry. The Tradition Date is shown as what that tradition holds, not as one side of the scholarly debate.
# Setting: “from the church's beginnings in Jerusalem, after Jesus's resurrection, to Paul in Rome”, no year (#167 §4: no span on the minimap). Ehrman ch. 10 summary (Reference) and Martin RLST 152 l9 (Reference). The display drops Ehrman's “the arrest of the Apostle Paul in Rome” (in Acts Paul is arrested in Jerusalem and taken to Rome; Martin l9 says so) and his preceding sentence calling Acts “the first history of the Christian church”.
# Tradition: Trigger 189@00:35:59 has `states: both`: the same trimmed span gives the 80–90 “mid range” and “people who will date Acts very early, that is prior to 64 CE”, and the next turn (00:37:00) gives the house-arrest argument (“the book ends with Paul on house arrest … Acts is pre-64”). Weak, as the issue says: Patel calls the early daters “people”, not a tradition, and the early date is also a scholarly minority view (above). Kept because the side she states is the position, and the argument, that the Tradition source holds in its own voice. Cited: Insight for Living's Acts overview (© 2010 Charles R. Swindoll, Inc.): Acts “ends abruptly with Paul imprisoned in Rome … More than likely, Luke completed the book … sometime between AD 60 and AD 62”. Holder in the ministry's own words from its About page and site banner, “The Bible-Teaching Ministry of Pastor Chuck Swindoll”. Alternative (uncited): Got Questions gives two different ranges on two pages (61–64 and 58–62). Tradition middle (61) and Critical middle (95) are more than 30 years apart, so the Tradition Date sits at its own year (#214).
# Trigger Claims (#99, one to three): E189 00:35:59 (both), E189 00:40:25 (critical, “perhaps … early second century”), E80 00:45:22 (critical, “as late as the 110s CE”). Shown verbatim. Hedges dropped by trimming: E189 00:35:59 drops the lead-in “Right. And then from there, if you think that Luke and Acts are written by the same person … Some scholars will put it at five years after Luke.” (the 80–90 is derived from Luke's date) and the rest of the turn (the house-arrest argument, Paul “martyred in Rome under Nero in 64” as “conventional wisdom”); the next turn says “these arguments for dating are sort of shaky … the most honest answer is we don't know” and that she favours a later date. E189 00:40:25 drops the rest of the turn (“It depends on … what evidence you want to prioritize … the honest answer is we don't really know”). E80 00:45:22 is about Luke-Acts, after McClellan's “we talked with … Helen Bond, about the dating of Luke-Acts” (00:44:55); it drops the second sentence (“So that would have been, you know, a good 75, maybe 80 years after this Council of Jerusalem would have taken place”), the issue's 30s-CE slip.
# Dropped Trigger Claim leads: E189 00:38:01 (“if you think the author of Acts used Josephus, that's clearly going to push the date back maybe early second century”: conditional; 00:40:25 states the late view); E189 00:33:49 (Mark and Luke dating, not Acts); E69 00:51:50 (Michael Kok, Luke-Acts “in the second century … a bit earlier than Marcion”; the inventory's E69; two late-view claims already kept); E48 00:29:26 and 00:30:27 (Helen Bond, Luke, “95 and 105 CE”, Josephus: Luke, not Acts); E43 00:23:29 and E112 00:43:04 (Luke early 2nd century: Luke only); E16, E35, E54, E148 (no date for Acts found in the transcript: E16 Peter's name “by the end of the first century”; E35 the Gospels' titles and Irenaeus; E54 Acts 15 and Amos; E148 Acts of Paul); E80 00:44:55 (authorship only).
# agent: the first pass (2026-11-26). Three research agents (critical, tradition, setting) saved every fetched page into their own scratch folders; the lead agent read Britannica “Acts of the Apostles” in Claude in Chrome (curl 403; the old URL /topic/Acts-of-the-Apostles-New-Testament is an error page; the live page is /topic/The-Acts-of-the-Apostles-New-Testament), saving the page's own `article` p/h2 innerText (1213 characters; quote also matched with includes() in the tab). Quotes script-matched by the lead agent from the entry file against the named saved copies (whitespace, quotes, dashes, entities, soft hyphens normalised): 13 hits, 0 misses. Trigger Claims matched by script as substrings of their final Transcript lines at timestamp and speaker: 3 hits; E189 00:33:34–00:42:37 and E80 00:43:21–00:47:58 read.
# owner: empty (""). The owner delegated the publish review (#93; extended to the Timeline, #110, 2026-11-23); a `delegation` block is added when the independent second agent pass has run.
# Flags for the second pass: (1) Display as alternatives vs a single span: is “70 to the early 90s CE, or the early 2nd century CE” the right weight, given Seccombe's majority sentence and Fredriksen's single outright late date? (2) Tyson in The Bible and Interpretation: an op-ed by a professor emeritus (SMU), classed Reference as the registry does for Silverman 2011; check. (3) Seccombe's PDF gives no post (email only); classed Scholarly by venue (Tyndale Bulletin, peer-reviewed). (4) Britannica's datePublished is 1998-07-20 with no modified date: inside the ~30-year window only just; its sentence is hedged (“apparently … perhaps”) and backs the note only. (5) E189 00:35:59 `states: both`: the tradition half is weak (above); cut the Tradition Date if in doubt. (6) Tyson ¶ 4's next sentence “But Acts could not have been written before c. 90 CE” contradicts his own 80–90 and reads as a slip for “after”: uncited; check the cited span stops before it. (7) Fredriksen's dating sentence is a passing remark in a “Did You Know?” box on the word “Christian”; check it carries the late alternative together with Tyson's “growing number”. (8) Insight for Living's page is unsigned; author set to Charles R. Swindoll from the copyright line and author box.
