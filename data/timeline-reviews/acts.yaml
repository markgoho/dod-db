# Independent second agent pass 2026-11-26 (#93 delegation, #110; an agent that built neither the entry nor the first pass; the first pass's scratch files not read). Re-fetched into a fresh scratch folder by curl (browser User-Agent) from the registry URLs, all 200: Seccombe and Armstrong PDFs (pdftotext, plain and -layout), Tyson (Bible and Interpretation), Fredriksen (Bible Odyssey), Ehrman ch. 10 summary, Martin RLST 152 l9, Insight for Living (301 to /resources/bible/the-history-of-the-early-church/acts). HTML stripped (inline tags removed, entities decoded). Britannica refused scripts as before; read in Claude in Chrome in a new tab of this pass's own: the page's `article` p/h2 innerText (1213 characters, saved in two returns and joined; byte count 1218 with the file's newlines and curly quotes ties out), h1 “Acts of the Apostles”, byline “Britannica Editors”, JSON-LD datePublished 1998-07-20, no dateModified; tab closed.
# Quotes re-matched by script, read from the entry file as received (git HEAD) and as edited (whitespace, quotes, dashes, NFKC, soft hyphens and line-break hyphens normalised), with the surrounding passage printed and read: 13 of 13 hit as received; 12 of 12 remain after the cut of tradition/1. critical/2 first missed against plain pdftotext, which fuses the line-break compound “first-/century” to “firstcentury”; matched by the re-run against the -layout text with a line-end hyphen kept, so the quote's “first-century” is right. Locators checked by position: Seccombe pp. 208 and 210 and Armstrong pp. 101 and 109 from running heads and page numbers; Tyson ¶ 2, 4, 6 and last paragraph by paragraph order (¶ 1 “The range of proposed dates …”); Martin quote before the ch. 2 heading [00:17:35]; Ehrman under “Luke’s Second Volume: The Book of Acts”; Fredriksen in “Did You Know?”. Trigger Claims script-matched as substrings of their final Transcript lines at timestamp and speaker: 3 hits; E189 00:33:34–00:42:37 and E80 00:43:21–00:47:58 read.
# Second pass changed: (a) Tradition Date cut. The `tradition:` block (display “60–62 CE”, holder Insight for Living, tradition/1) removed from the entry; trigger 189@00:35:59 `states: both` → `critical`; registry entry `insight-swindoll-acts` removed (nothing else cites it); its quote moved to `uncited`. Reason: Patel frames the pre-64 date among “the scholarly arguments for dating Acts” (00:33:49) and calls its holders “people”; no turn in the window names a tradition, and the cited sources report the early date as a scholarly minority view. CONTEXT.md shows a Tradition Date only when a Trigger Claim states the tradition's side; in doubt, cut. Tradition and Critical middles no longer apply (#214 moot). (b) Critical note, from “Seccombe, who argues for an early date himself, says a majority of scholars favour a date between 70 and the early 90s. The sources differ on the range within it: Tyson puts the intermediate date at about 80–90 CE, Armstrong's middle group dates it from after 70 to about 80, and Britannica's editors say perhaps between 70 and 90 CE. Tyson gives as one reason that the destruction of Jerusalem in 70 is not mentioned in Acts but is probably alluded to in Luke 21:20–24. … Tyson says some scholars prefer the early 60s, a view Armstrong and Seccombe argue for. …” to “Seccombe, who argues for an early date himself, describes the post-70 first-century view as a date between 70 and the early 90s. The sources differ on the range: Tyson puts the intermediate date at about 80–90 CE, Armstrong's middle group dates it from after 70 to about 80, and Britannica's editors say perhaps between 70 and 90 CE. Tyson says those who favour the intermediate date cite, among other factors, that the destruction of Jerusalem in 70 is not mentioned in Acts but is probably alluded to in Luke 21:20–24. … Tyson says some scholars prefer the early 60s; Armstrong argues for a date as early as 62–63 CE and no later than 70. …” Reasons: #80 (two sources disagree about the state of the field → drop the consensus word): Seccombe, Tyson and Armstrong each name a majority and disagree on its range, so no “majority” on the page; the Jerusalem reason is what the intermediate-date scholars cite in Tyson, not Tyson's own; Armstrong's cited range runs to 70, and no Seccombe sentence of his own date is cited. (c) Setting display “from the church's beginnings …” → “from Christianity's beginnings …”: the cited Ehrman sentence says “traces Christianity from its beginnings”. Display, title, from/to/precision unchanged.
# Second-pass rulings on the first-pass flags: (1) Display kept as two alternatives. It is worded without a consensus word and contains every source's middle range; the late alternative rests on Fredriksen's own-voice date with Tyson's “growing number”. But the asymmetry is real: the early date is held in their own voice by two Scholarly sources (Armstrong, Seccombe) and reported by Tyson and Britannica as “some”, and Tyson calls three dates (early, intermediate, late) “prominent in the scholarly literature”; under #99 the early 60s could be a third alternative. Not changed by this pass (a widening, not a cut); publish flag 1. (2) Tyson kept as Reference: same venue as silverman-2011-iranian-influence; byline confirms a professor emeritus; it backs reports of what scholars prefer and the uncertainty sentence only. (3) Seccombe kept as Scholarly by venue (#80 “classed by venue”); no post on the PDF, confirmed. (4) Britannica kept: datePublished 1998-07-20 is inside the ~30-year window in 2026; hedged, note only. (5) Cut the Tradition Date (above). (6) Confirmed: critical/3's span ends before “But Acts could not have been written before c. 90 CE”; that sentence stays uncited. (7) Fredriksen kept: an own-voice outright date by a professional scholar in an SBL-hosted signed article (#86 per author); a passing remark, so it carries the late alternative only together with Tyson's “growing number”. (8) Moot after the cut; Insight left the entry and the registry.
# Flags for publish: (1) Display vs Tyson's three “prominent” dates: consider whether the early 60s (critical/8–9) should be a third alternative, or the display left as is with the early date in the note; this pass did not widen it. Weightier after the Tradition cut: before it the early 60s showed on the Timeline as the Tradition Date; now it has no date on the entry, only a note sentence, while the late view is in the display on one Reference passing remark (Fredriksen) plus Tyson's report, and the early view has two Scholarly own-voice sources (Armstrong; Seccombe, whose own-date sentences are uncited) plus Tyson's “Some scholars”. (2) The note's first sentence still calls Seccombe an early-date advocate on the strength of his title (“Further Arguments for an Early Date”); his own-date sentences were read but are uncited. (3) Armstrong's middle-group range “after 70 to about 80” is his heading's (and p. 83's) wording; his next sentence (“after 90 is too late”) is looser. (4) `watch` still lists “house arrest” (the early-date argument); harmless, but it no longer maps to a shown date.
