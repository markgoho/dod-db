uncited:
  - "Tyson ¶ 4: “But Acts could not have been written before c. 90 CE, since the author seems to be ignorant about Paul's letters, which were not collected and circulated before that date.” Contradicts his own c. 80–90 in the previous sentence; reads as a slip for “after”."
  - "Tyson ¶ 6: “If the author of Acts knew of some pieces from this document, he could not have written his book before that date.” Conditional (Josephus, 93–94 CE)."
  - "Seccombe p. 208: “primarily, I think, because of a difficulty with dating Mark early enough to allow a 60s date for Luke” — his opinion of why the majority holds its view, not a reason the majority gives."
  - "Seccombe p. 208: “The present century has brought with it a new push for a second-century dating.” Agrees with Tyson's growing late view; critical/6–7 carry it."
  - "Armstrong p. 83: three groups “early (pre-70 CE), middle (post-70 CE to around 80 CE) or late dating (90–130 CE)” — the bands; critical/4 carries the majority claim with the middle band."
  - "Porter, Bible Odyssey “Ephesus”: “The early second-century Acts of the Apostles …” — author a PhD candidate at the time (page bio), fails the per-author test (#86)."
  - "Lopez, Bible Odyssey “Paul” (2016): “Acts is also thought to have been composed well after Paul’s death” — relative, no date."
  - "Penner, Bible Odyssey “Paul and Acts” (2015): “others … suggesting that Acts was composed in the second century” — reports a view; no post on the page."
  - "Ehrman ch. 4 summary: “Matthew and Luke were written around 80 or 85 CE” — Luke, not Acts; no Luke entry is published, so Acts cannot be dated relative to it."
  - "Martin RLST 152 l9 ch. 1: “Some people even say they think Acts was written a good bit after the Gospel of Luke” — relative; l9 ch. 3 and l5 ch. 3 relative only."
  - "Bond, Bible Odyssey “The Nativity”: “Most scholars date these texts to 80-100 C.E.” — the birth narratives of Matthew and Luke, not Acts."
  - "Bible Odyssey dictionary (HarperCollins) “Acts of the Apostles, The”, “Luke”: authorship and outline, no date."
  - "Got Questions “Summary of the Book of Acts”: “The book of Acts was likely written between AD 61 and 64.” and “When was Acts written?”: “likely between AD 58 and 62” — the ministry's two pages differ; Insight for Living gives one range with the house-arrest argument."
  - "Ehrman ch. 10 summary ¶ 1, first sentence: “The book of Acts is the first history of the Christian church.” Treats the narrative as history; setting/1 uses the next sentence."
  - "HarperCollins dictionary “Rome” (Bible Odyssey): “The book of Acts relates that Paul was taken to Rome as a prisoner and held there for two years under house arrest” — agrees with setting/2; not needed."
