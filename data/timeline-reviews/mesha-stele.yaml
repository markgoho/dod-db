  - "Hayes RLST 145 l12 and l14: Mesha inscription “from the ninth century BCE”, on the ban and on Omri; not about Yahweh's attestation."
  - "Erasmus Gass, Bible Odyssey “The Mesha Stela”: “cultic equipment or symbols of Yahweh”; no date, no “earliest”; author bio page 404."
  - "Britannica “Moabite Stone”: only an AI quick summary loaded, no article text; Britannica “Yahweh”: no attestation content."
