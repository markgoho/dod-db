# Review record for the Timeline Entry `mesha-stele` (/timeline/#mesha-stele; #93 shape). Not rendered.
# Issue #234 (from #108), "Timeline Entry: YHWH first attested as Israel's god". Issue notes: date the first attestation (c. 850–825 BCE per the show), not the "arrival" window between 1208 and 850–800 BCE; Transcripts render the divine name as "Adonai"; the lower bound is `merneptah-stele`; keep consistent with `hebrew-writing` if the attestation is an inscription; the Shasu texts and the El merger go in the note at most. Related Scholarship Page #151; the published Scholarship Page `the-origins-of-yahweh` (statement `attestation`) already says "around 840 BCE" on Fleming 2021 with the Shasu exception.
# Id `mesha-stele`: the sources date the inscription, so the entry is named for it, as `merneptah-stele` is. Title worded for what the sources date: the earliest reference outside the Bible to Yahweh as Israel's god (Fleming p. 3 "oldest non-biblical reference to Yahweh"; Frevel ¶31 "first mention of the deity YHWH"; Tebes 2021 ¶3 "the cult of Yahweh as the national god of Israel"). Not "the earliest reference to the name Yahweh": Tebes 2021 ¶23 says the 14th–13th-century Egyptian Shasu lists with high probability refer to the name, so the name claim is contested; the "as Israel's god" scope is the one all three sources support (Fleming p. 1 and Frevel ¶31 tie the Mesha reference to Israel).
# Sourcing test, 2026-11-27: met. Three Scholarly sources (two independent authors' articles plus Fleming's book) date the earliest extra-biblical reference outright, none conditionally: Fleming "around 840" and "mid-9th century BCE"; Frevel "the middle of the ninth century BCE"; Tebes "the ninth-century BCE". Display "Mid-9th century BCE" is Fleming's and Frevel's shared wording; Tebes's century contains it; Fleming's 840 is in the note. Not a split under #99: 840 sits inside mid-9th century; no source gives a different year.
# The arrival window (E1 00:47:37, the inventory's lead quote) is not a Trigger Claim here: it bounds an arrival by two other events and the issue says not to date it. The show's "850–825ish" (E66 00:43:53) and "a few years before 800" are the show's own, not source dates; kept only inside the verbatim Trigger Claims. E66 00:43:53 not stored (#99: one to three claims; 00:41:41 states the same attestation with Mesha named). E7 00:17:00 is about the Tel Dan inscription and the house of David, not this subject.
# Consistency: `merneptah-stele` (late 13th century, Israel without Yahweh) is earlier and untouched. `hebrew-writing` dates Hebrew writing; the Mesha stele is a Moabite inscription, so no overlap or contradiction. `david-and-solomon` not touched. No anchor or seeAlso (neither is needed; Tel Dan has no entry).
# Shasu texts in the note only, as the issue asks, cited both ways (Tebes ¶23 "with high probabilities"; Frevel ¶31 "no reliable extra-biblical link"). El merger left out: no source read dates it.
# agent: the first pass (2026-11-27). Research agent saved every source page; quotes script-matched against the saved text (whitespace, quotes, dashes, ligatures, entities, line-break hyphens and paragraph numbers normalised): 8 hits, 0 misses; Tebes ¶23 matched as two halves either side of the pp. 7–8 page break (footnote 8, running head and the Figure 1 caption between). Trigger Claims matched by script as substrings of their Transcript lines at timestamp and speaker: 3 hits.
# owner: empty (""). The owner delegated the publish review (#93; extended to the Timeline, #110, 2026-11-23); a `delegation` block is added when the independent second agent pass has run.
# Flags for the second pass: (1) Tebes 2021 ¶3's sentence sits in his summary of "conventional accounts" of the Midianite-Kenite hypothesis, which the article goes on to turn around; is the Mesha sentence his own statement or only part of the view he reports? If only reported, cut it. (2) Fleming p. 1 hedges ("no certain evidence … before"); p. 3 is flat. Does the unqualified title "earliest reference" outrun the "certain" hedge, given the note carries the Shasu lists? (3) Title "as Israel's god": Fleming p. 1 says "Yahweh is identified with that enemy" (Israel) and Frevel ¶31 "a kind of 'national' God … associated … with Israel"; only Tebes ¶3 says "national god of Israel" in the same sentence as the date. (4) Note's "very probably" paraphrases Tebes's "with high probabilities". (5) Frevel and Tebes co-edited Entangled Religions 12.2; their articles are separately authored.
# Independent second agent pass 2026-11-27 (#93 delegation, #110): every source re-fetched into a fresh scratch folder (Fleming excerpt PDF by curl; Frevel and Tebes PDFs via their registry DOIs in Chrome); quotes parsed from the entry and re-matched by script per PDF page (whitespace, quotes, dashes, ligatures, entities, line-break hyphens normalised): 8 of 8 hits at their locators before the cut, Tebes ¶23 as two halves split at “if / not” across pp. 7–8 (footnote 8, margin numbers, running head and Figure 1 caption skipped). ¶ numbers confirmed in pdftotext -layout. Trigger Claims parsed from triggers.yaml and re-matched by script (text a substring of the turn at that timestamp and speaker; states critical), about two minutes either side read in full: 3 hits.
# Second pass changed: cut Tebes ¶3 (was critical/6) to `uncited` (flag 1); old critical/7 and critical/8 renumbered to critical/6 and critical/7. So two sources, not three, now date the stele; the sourcing-test line above ("Three Scholarly sources … Tebes 'the ninth-century BCE'") is superseded: Fleming and Frevel date it outright, which meets the entry rule. Note, sentence 2: "It is the oldest reference to Yahweh outside the Bible, and in it Yahweh is identified with Israel, the rival kingdom Mesha's campaign expelled." became "Two sources call it the oldest reference to Yahweh outside the Bible; in it Yahweh is identified with Israel, the rival kingdom Mesha's campaign sought to expel from the region north of Dibon." (attributed, since Tebes ¶23 is in the same note; Fleming says "a campaign to expel"). Shasu sentences: "Two older Egyptian lists of Shasu lands, from about 1380 and 1270/1250 BCE, name a land yhw. One source says they very probably refer to the name Yahweh; another finds no reliable link between them and the Yahweh of Israel and Judah." became "Two older Egyptian topographical lists depicting Shasu people date from about 1380 and 1270/1250 BCE. One source says they refer with high probability to the name Yahweh; another finds no reliable extra-biblical link between that evidence and the Yahweh of Israel and Judah." ("Shasu lands"/"a land yhw" rested on Tebes's unquoted next sentence; "extra-biblical" is Frevel's). Title, display, from/to and Trigger Claims unchanged.
# Answers to the five flags: (1) cut, see `uncited` (cut on doubt; the sentence is inside his summary of the conventional view). (2) Title kept: its "as Israel's god" scope sidesteps Fleming's "no certain evidence … before" hedge, which concerns the Shasu Yhwȝ reference Fleming raises in his next paragraph (pp. 1–2); Fleming pp. 1–2 calls the Shasu Yhwȝ reference "certainly without connection to Israel", so it is no counter-example to the title; the hedge bit the note's flat "It is the oldest reference to Yahweh", now attributed to two sources. (3) Title kept but now a combination: no remaining cited sentence says "as Israel's god" with the date; Fleming p. 3 (date) + p. 1 (identified with Israel) and Frevel ¶31's two sentences (date; "a kind of 'national' God … associated … with Israel") carry it. Narrower than both sources' unqualified claim, so allowed; publisher may prefer "earliest reference outside the Bible to Yahweh" plus the note. (4) "very probably" changed to "with high probability" (Tebes's "with high probabilities"). (5) Moot for the date, which now rests on Fleming and Frevel; Tebes is cited only for the Shasu sentence; the articles are separately authored.
# Flags for publish: (a) E182 00:21:35's date is for Adonai's appearance "before the middle of the 9th century"; only "by the 9th century BCE we have the Mesha inscription" dates this subject; kept under #99 (verbatim, datable statement), cut it if the publisher wants Trigger Claims to date the row's subject in their main clause. (b) from -850 to -840 with display "Mid-9th century BCE": the range is the first pass's; neither source gives a span, and Fleming's 840 is "around". (c) Title combination (flag 3).
# Publish resolutions, 2026-11-27: (1) E182 00:21:35 kept: its “by the 9th century BCE we have the Mesha inscription talking about Adonai” dates this subject, and #99 shows Trigger Claims verbatim. (2) from -850 / to -840 kept as data only (not rendered; the display is the sources' “Mid-9th century BCE”); it spans Frevel's “middle of the ninth century” to Fleming's “around 840” and places the entry. (3) Title kept as “… Yahweh as Israel's god”: the wider alternative (“earliest reference outside the Bible to Yahweh”) is the claim Tebes ¶23 contests for the name, so the narrower scope is the conservative one; it rests on Fleming pp. 1 and 3 and Frevel ¶31, both cited. No cut breaks the entry rule: two Scholarly sources date it outright.
