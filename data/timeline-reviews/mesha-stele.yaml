  - "Tebes 2021 ¶3, p. 2 (was critical/6, cut by the second pass): “The oldest extra-biblical source demonstrating the cult of Yahweh as the national god of Israel comes from the ninth-century BCE (the Moabite stele of king Mesha, Tebes 2018)”. Cut on doubt: the sentence sits in Tebes’s summary of what “conventional accounts” of the Midianite-Kenite hypothesis “generally agree” (“First, it is normally assumed …”), and its “and therefore …” is that view’s inference; the self-citation makes the premise plausibly his own, but whether he asserts or reports it is not settled by the text."
  - "Tebes 2018, “The Mesha Inscription and Relations with Moab and Edom”, in Behind the Scenes of the Old Testament (Baker Academic), p. 286: “the earliest extrabiblical attestation of Yahweh as Israel's god”, with “Mesha (ca. 850 BCE)” earlier in the paragraph. Not cited: the publication year is unconfirmed from the scan, the OCR is broken at the gutter of the sentence, and the date is not in the cited sentence; Tebes 2021 carries the same author's point. p. 292: “almost unmistakably the earliest reference to the name “Yahweh” as a deity outside the Hebrew Bible”, undated."
  - "Fleming p. 5: the Egyptian Shasu exception is “mysterious and open to debate” (cited on the-origins-of-yahweh); not needed here, Tebes ¶23 and Frevel ¶31 carry the Shasu sentence."
  - "Frevel ¶32: Tel Dan “dated a bit later”; “all our oldest evidence for YHWH comes from the North or is related to the Omrides”. Not needed for the date."
  - "Sperling 2005 (Encyclopedia of Religion): the tetragrammaton “also occurs on the Moabite Stone (ninth century bce)”. Dates the stele, never calls it the earliest."
