# Issue #209 (follow-on from #189, `sennacherib-campaign`), retitled “Timeline Entry: Hezekiah's reform”. Issue notes: likely undated; the only source read in #189 that dates the reform (Faust 2026) does so only on a condition. Owner rules for this run: an undated entry whose statement keeps the condition is allowed if the sources support it; never reword to fit. No id ending in “-tradition”. Related published entries `sennacherib-campaign` and `josiah` must not be contradicted.
# Sourcing test, 2026-11-26: met as undated (verdict no-firm-date). No Scholarly or Reference source read dates the reform outright. Faust 2026 (Scholarly) dates it only on stacked conditions: that the reform was historical (p. 53 “if the reform was an actual historical event”), that the Tel ‘Eton dismantling belongs to it (p. 51 “we tend to associate it”; n. 16 “Or to disassociate the two”), and that Tel ‘Eton fell to Sargon II in 712/711 (p. 54 “Should this dating be accepted”; “This, of course, is not certain”). Per conditional-not-critical, 712/711 is not a Critical Date; the statement keeps the condition. Pakkala 2017 (Scholarly) and Moulis 2019 (Scholarly) back the two sides of the historicity question; neither dates it. Kind: event. No Tradition Date: no Trigger Claim states the tradition's side. No setting (event entry). No anchor, no seeAlso (seeAlso is used only for a composition an entry contains, creation→priestly-genesis-1).
# Placement: undated with no Tradition Date, so the entry sits in the unplaced list, as `hebrew-language` does. Adds no minimap tick.
# Consistency: `josiah` cites the same Pakkala p. 271 sentence and words it “very unlikely that the reforms took place in the sense 2 Kings intends”; this entry says “very unlikely that any reform took place in the sense 2 Kings 18:4 intends”, same strength. `sennacherib-campaign` dates the campaign 701; this entry says nothing about the reform's relation to 701 (Moulis's abstract “might have been finished before Assyria's campaign against Judah in 701 BCE” and Faust's “before the house was destroyed by the Assyrian army” are uncited).
# Dropped: Moulis p. 170's relay of the Arad excavators' date (“around 715 BCE in the first year of Hezekiah's reign”), which dates the Arad temple's decommissioning by the excavators' stratigraphy and which Herzog revised (same page); it matches Chronicles' own “first year” (2 Chr 29:3) and is not Moulis's own date for the reform. Accession years (NABRE 715; EJ 727/6 or 715/4; HarperCollins 727–698; Price 727–698 or 715–686) date the reign, not the reform. Hayes l11 “in the eighth century” is a century-level aside in a lecture on Deuteronomy, unhedged but undiscussed; uncited to keep the statement to sources that discuss the question.
# Trigger Claims: E13@00:16:37 (Arad's excavators attributed the temple's end to Hezekiah's reforms; the speaker's hedge “I think this was Yigael Yadin” is kept; the next turn, 00:17:50, gives the competing Sennacherib theory, not stored). E88@00:27:48 (“reforms that were said to have happened under Hezekiah”; trimmed before “but it says he didn't put an end to the worship of. Of Asherah and Baal”, which garbles 2 Kgs 18:4 and is about Josiah's contrast). E88@00:39:38 (the excavators' attribution, with “if you take those reforms as historical” kept; trimmed after the turn's “somewhere around 700 BCE, somewhere around the reign of Hezekiah”, which dates Arad's burial, not the reform). All state critical. Not kept: E7@00:28:02 (the issue's lead: Hezekiah's revolt and Sennacherib, no reform); E88@00:05:22 and 00:38:15 (de facto cult centralization caused by Sennacherib, the rival explanation, not a claim about the reform); E72@00:57:05 (Josiah's reform); E125@00:07:44, E177@00:24:25, E134@00:27:32 (Hezekiah removing cult objects, in passing). The show gives no date for the reform, so #99 does not apply.
