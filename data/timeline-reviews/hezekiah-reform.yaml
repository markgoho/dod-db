ezekiah”) is weaker still and stays uncited. New cites appended so undated/1–10 keep their keys. (c) Britannica “Hezekiah” read in Chrome (page text saved as a retyped excerpt, not a raw capture): reign “about 715 to about 686 BC” with a wide range; “In his religious reforms, Hezekiah asserted Judah's inherited Hebrew traditions”. No date for the reform, assumes it; uncited. (d) Other leads tried once each, still not openly readable: Herzog 2010 (academia.edu 23190922 opened in Chrome: abstract only, full PDF behind sign-up); Ganor and Kreimerman 2019 (BASOR 381: catalogue records only; BAR 2017 popular version members-only); Kleiman 2020 (Tel Aviv 47, “The Iron IIB Gate Shrine at Lachish: An Alternative Interpretation”, DOI 10.1080/03344355.2020.1707447: abstract only); Fried 2002 (JAOS 122.3: JSTOR only); Handy 1988 (ZAW 100: no copy found); Herzog 2002 (Tel Aviv 29: no copy found); Na'aman 2002 and Edelman 2008: no copy found; Grabbe 2003: catalogue records and unlicensed uploads only. Kept in `leads`. Moulis's 2017 thesis not tried (not an issue lead). All 15 quotes script-matched against the saved text, split by page, at each locator's page (NFKC, whitespace, quotes, dashes, line-break hyphens, footnote markers normalised): 15/15, zero misses, each found once. Title, verdict, triggers, registry unchanged; card key (title, kind, verdict) unchanged, so the card is not stale.
