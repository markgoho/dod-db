# Review record for the Timeline Entry `hezekiah-reform` (/timeline/#hezekiah-reform; #93 shape). Not rendered.
# Issue #209 (follow-on from #189, `sennacherib-campaign`), retitled “Timeline Entry: Hezekiah's reform”. Issue notes: likely undated; the only source read in #189 that dates the reform (Faust 2026) does so only on a condition. Owner rules for this run: an undated entry whose statement keeps the condition is allowed if the sources support it; never reword to fit. No id ending in “-tradition”. Related published entries `sennacherib-campaign` and `josiah` must not be contradicted.
# Sourcing test, 2026-11-26: met as undated (verdict no-firm-date). No Scholarly or Reference source read dates the reform outright. Faust 2026 (Scholarly) dates it only on stacked conditions: that the reform was historical (p. 53 “if the reform was an actual historical event”), that the Tel ‘Eton dismantling belongs to it (p. 51 “we tend to associate it”; n. 16 “Or to disassociate the two”), and that Tel ‘Eton fell to Sargon II in 712/711 (p. 54 “Should this dating be accepted”; “This, of course, is not certain”). Per conditional-not-critical, 712/711 is not a Critical Date; the statement keeps the condition. Pakkala 2017 (Scholarly) and Moulis 2019 (Scholarly) back the two sides of the historicity question; neither dates it. Kind: event. No Tradition Date: no Trigger Claim states the tradition's side. No setting (event entry). No anchor, no seeAlso (seeAlso is used only for a composition an entry contains, creation→priestly-genesis-1).
# Placement: undated with no Tradition Date, so the entry sits in the unplaced list, as `hebrew-language` does. Adds no minimap tick.
# Consistency: `josiah` cites the same Pakkala p. 271 sentence and words it “very unlikely that the reforms took place in the sense 2 Kings intends”; this entry says “very unlikely that any reform took place in the sense 2 Kings 18:4 intends”, same strength. `sennacherib-campaign` dates the campaign 701; this entry says nothing about the reform's relation to 701 (Moulis's abstract “might have been finished before Assyria's campaign against Judah in 701 BCE” and Faust's “before the house was destroyed by the Assyrian army” are uncited).
# Dropped: Moulis p. 170's relay of the Arad excavators' date (“around 715 BCE in the first year of Hezekiah's reign”), which dates the Arad temple's decommissioning by the excavators' stratigraphy and which Herzog revised (same page); it matches Chronicles' own “first year” (2 Chr 29:3) and is not Moulis's own date for the reform. Accession years (NABRE 715; EJ 727/6 or 715/4; HarperCollins 727–698; Price 727–698 or 715–686) date the reign, not the reform. Hayes l11 “in the eighth century” is a century-level aside in a lecture on Deuteronomy, unhedged but undiscussed; uncited to keep the statement to sources that discuss the question.
# Trigger Claims: E13@00:16:37 (Arad's excavators attributed the temple's end to Hezekiah's reforms; the speaker's hedge “I think this was Yigael Yadin” is kept; the next turn, 00:17:50, gives the competing Sennacherib theory, not stored). E88@00:27:48 (“reforms that were said to have happened under Hezekiah”; trimmed before “but it says he didn't put an end to the worship of. Of Asherah and Baal”, which garbles 2 Kgs 18:4 and is about Josiah's contrast). E88@00:39:38 (the excavators' attribution, with “if you take those reforms as historical” kept; trimmed after the turn's “somewhere around 700 BCE, somewhere around the reign of Hezekiah”, which dates Arad's burial, not the reform). All state critical. Not kept: E7@00:28:02 (the issue's lead: Hezekiah's revolt and Sennacherib, no reform); E88@00:05:22 and 00:38:15 (de facto cult centralization caused by Sennacherib, the rival explanation, not a claim about the reform); E72@00:57:05 (Josiah's reform); E125@00:07:44, E177@00:24:25, E134@00:27:32 (Hezekiah removing cult objects, in passing). The show gives no date for the reform, so #99 does not apply.
# agent: the first pass (2026-11-26). One research agent (critical side; no Trigger Claim states the tradition's side and an event has no setting) fetched every source by curl into its own scratch folder (pdftotext for PDFs, HTML stripped for web pages); quotes copied from saved text only. Every cited quote script-matched by the lead agent against the saved text (NFKC, whitespace, quotes, dashes, entities, line-break hyphens normalised): 10/10, zero misses, each found once. Trigger Claims matched by script as substrings of their Transcript lines at timestamp and speaker: 3/3.
# owner: empty (""). The owner delegated the publish review (#93; extended to the Timeline, #110, 2026-11-23); a `delegation` block is added when the independent second agent pass has run.
# Flags for the second pass: (1) Faust's 712/711 is the entry's only date and rests on his own preferred attribution (p. 54 “an attribution to Sargon II is most likely”); check the statement's “only if Tel ‘Eton's destruction belongs to Sargon II's campaign of those years, which he says is not certain” matches p. 54's “Should this dating be accepted” and “This, of course, is not certain” in scope (the latter sentence introduces the Azeka inscription's other attributions). (2) “If it was historical” rests on p. 53's opening question; Faust himself leans to historicity (p. 50 “most scholars insist that the archaeological evidence supports the historicity of the reform”, uncited as one author's count of the field). (3) Moulis: the SBL full-volume PDF carries “All rights reserved” and no open-access statement, but is publisher-hosted and readable in full at a public URL; class Scholarly, kind book (chapter in an edited volume). Confirm access and pages 167–180. (4) Faust's registry publisher “The Hebrew University of Jerusalem” is from the journal's host (jjar.huji.ac.il); the PDF gives the author's affiliation (Bar-Ilan) and no publisher line; check. DOI 10.52486/01.00009.3 per the research agent, not recorded. (5) “whether it happened is debated” summarises Faust pp. 31, 46 and Pakkala vs Moulis; narrow if it reads stronger than the cited quotes. (6) Moulis's “cultic eliminations he surveys”: p. 180's “these cultic eliminations” refers to the sites his chapter reviews (Arad, Beersheba, Lachish, Moza, Tel ‘Eton etc.); check the referent.
# Independent second agent pass 2026-11-26 (#93 delegation, #110): a fresh agent that did not build the entry, working from its own scratch folder only (first-pass scratch not read). Re-fetched all three sources from their registry URLs by curl: Faust (jjar.huji.ac.il PDF; a bare user agent gets the HUJI firewall's “Something went wrong” page, a browser user agent gets the 30-page PDF), Moulis (SBL full-volume PDF, 324 pp.; chapter pp. 167–180 = PDF pp. 177–190), Pakkala (Helda reprint); pdftotext, split by page. Quotes re-matched by one script (NFKC, whitespace, curly quotes, dashes, entities, soft and line-break hyphens normalised): 10/10, 0 misses, each found once in its source and on the page its locator names (Faust p. 31 = PDF p. 1, p. 46 = 16, p. 53 = 23, p. 54 = 24; Pakkala printed p. 271 = PDF p. 8; Moulis p. 180 = PDF p. 190). Paragraph positions on Faust p. 54 checked by reading: first paragraph (“Given the similarity …”), third (“This, of course, is not certain …”), last (“Still, as noted …”). Trigger Claims re-matched by script as normalised substrings of the line at their timestamp and speaker in the final Transcripts (E13 2023-07-03-episode-13-…-does-god-regret-this-podcast.txt; E88 2024-12-09-episode-88-…-josiah-the-cult-killer.txt): 3/3; read about two minutes either side (E13 00:14:25–00:18:53; E88 00:25:03–00:29:55 and 00:37:03–00:41:08).
# Second pass changed: (a) statement “If it was historical, he places it in the years before 712/711 BCE” became “If it was historical, he suggests it took place in the years before 712/711 BCE”: Faust's own verb (p. 54 “suggesting that Hezekiah's reform took place”); “places” read firmer than a conditional suggestion. (b) Moulis locators (undated/9, undated/10) “p. 180, conclusion” became “p. 180, end of section 7.7 “Summary””: the chapter has no section headed Conclusion; the quotes sit at the end of 7.7. (c) Registry `faust-2026-tel-eton` publisher “The Hebrew University of Jerusalem” became “Institute of Archaeology, The Hebrew University of Jerusalem” (JJAR About page: “Publisher: Institute of Archaeology, the Hebrew University of Jerusalem”). (d) Registry `moulis-2019-hezekiah-cultic-reforms` access “Full-volume PDF hosted by the Society of Biblical Literature, open” became the six sibling SBL entries' wording (“Full-text PDF in SBL's International Cooperation Initiative online books repository, which SBL offers to readers in qualifying lower-income countries; opens without login”): the volume is listed on SBL's ICI repository page for Ancient Israel and Its Literature (AIL 37), and the PDF's copyright page reads “All rights reserved”, so “open” overstated it. No citation cut; nothing moved to uncited; no citation added; no Trigger Claim changed; title and verdict unchanged; undated/<n> keys unchanged (cite order unchanged).
# Second-pass rulings on the first pass's flags: (1) Passes. p. 54's “This, of course, is not certain” follows “Thus, if we opt for 712 or 711 BCE for the destruction, then the reform must have taken place between Hezekiah's ascendance to the throne … and this date”, and goes on to the Azeka inscription's other attributions (Sennacherib 701; Sargon 720): what is not certain is the 712/711 date of Tel ‘Eton's destruction, the statement's “which he says is not certain”. “Should this dating be accepted” (first paragraph) is the same condition. (2) Kept. p. 53 poses the dating on “if the reform was an actual historical event”; Faust leaning to historicity (p. 48 “broadly accepted material evidence”, p. 50 “most scholars insist”, p. 51 “we tend to associate it with Hezekiah's reform”) does not make the condition his rhetoric only, and the statement attributes no view on historicity to him beyond the two camps. (3) Confirmed with a correction: pp. 167–180 = PDF pp. 177–190 (chapter title on 177, next chapter, Briffa, on 191). Publisher-hosted, opens without login, but through SBL's International Cooperation Initiative repository, not an open-access licence; registry access reworded to the sibling entries' line (change d). Class Scholarly, kind book, fine. (4) Corrected: publisher per the journal's About page (change c). DOI 10.52486/01.00009.3 printed on p. 31 (citation line), confirmed; the registry has no DOI field, not recorded. (5) Kept. Faust p. 31 calls the historicity itself “a hotly debated topic” and p. 46 names both camps; “whether it happened is debated” is no stronger. (6) Confirmed, with a correction to the flag's site list: p. 180's “these cultic eliminations” refers back to section 7.7's four types of cultic change at Arad, Moza, Beersheba and Lachish (Tel Halif the tolerated exception); Moulis's chapter never mentions Tel ‘Eton. “the cultic eliminations he surveys” fits.
# Flags for publish: (1) Faust's 712/711 rests on a third condition the statement does not name: that the dismantling of Tel ‘Eton's standing stone belongs to Hezekiah's reform (p. 51 “we tend to associate it with Hezekiah's reform”; p. 45 “they are insufficient for us to suggest that the dismantling actually did take place at the time of Hezekiah”; n. 16 “Or to disassociate the two”). Uncited, so the second pass could not add it; the statement's “only if” names one necessary condition and does not claim it is the only one. The publisher may cite p. 51 and add “and if the dismantling there was part of it”. (2) #99 and the show's “around 700”: E13@00:15:30 (“decommissioned out of service somewhere around the year 700 BCE”) and the cut start of E88@00:39:38 (“somewhere around 700 BCE, somewhere around the reign of Hezekiah, suddenly it just stops”) date Arad's temple going out of use, which the same turns credit to Hezekiah's reforms; #209's inventory row glosses this as “Hezekiah's reforms c. 700 BCE if historical”. The show never states a date for the reform itself, so the first pass's “#99 does not apply” holds for stated dates; but the stored E88 text is trimmed before the show's implied date, and c. 700 sits in mild tension with Faust's conditional “before 712/711”. #99 shows Trigger Claims verbatim even when they disagree; the second pass cannot lengthen a Trigger Claim. The publisher may keep the trim (date is Arad's, not the reform's) or restore it. (3) Moulis's abstract (p. 167) bounds the dismantling, not the reform: “No later than the end of the eighth century BCE, shrines were dismantled … probably Hezekiah's … centralization”, “might have been finished before Assyria's campaign against Judah in 701 BCE”. Hedged (“probably”, “might”), a terminus for the sites, so “The sources give it no firm date” survives; recorded in uncited by the first pass. (4) Scratch hygiene: the second pass's first curl wrote into a pre-existing scratch folder from the sennacherib-campaign second pass (second-pass/src) and re-ran pdftotext over its ussishkin.pdf, overwriting its ussishkin.txt with the same PDF's layout text; the hezekiah files were removed from it. Not this entry's sources.
# Publish resolutions, 2026-11-26 (lead agent, on the second pass's flags): (1) Statement kept. “only if” names a necessary condition, which stays true with Faust's further condition (the Tel ‘Eton dismantling belonging to the reform, p. 51, uncited) unnamed; the verdict is no firm date and “If it was historical … he suggests” already keeps the date conditional. No citation added after the second pass. (2) E88@00:39:38 trim kept: the show's “around 700 BCE” dates Arad's temple going out of use, not the reform; the show gives the reform no date, so #99 does not apply. Not in tension with the entry's statement, which gives Faust's date only on its condition. (3) Moulis p. 167 stays uncited. (4) Scratch only; no effect. draft dropped; sourcesRead, review and secondPass all 2026-11-26.
