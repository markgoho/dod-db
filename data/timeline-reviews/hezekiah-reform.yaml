uncited:
  - "Faust 2026 p. 45: the reform “was supposed to have taken place in the late 8th century BCE”; “the mere historicity of Hezekiah's reform is questioned”. Relays a supposition; the statement already carries the debate from pp. 31, 46."
  - "Faust 2026 pp. 48, 50: Lachish, Arad and Beersheba as “broadly accepted material evidence of the historicity of Hezekiah's reform”; “despite the doubts, most scholars insist that the archaeological evidence supports the historicity of the reform”; p. 49 middle position (religious changes, not a planned reform: Edelman, Fried, Handy). One author's count of the field; not needed (flag 2)."
  - "Faust 2026 p. 54: accession dates 716/715 (Thiele; Rainey and Notley), 726 (Galil), 727 (Oded; Miller and Hayes; Na'aman 2024). Reign, not reform."
  - "Moulis 2019 p. 167 (abstract): “No later than the end of the eighth century BCE, shrines were dismantled … probably Hezekiah's religious, military, and economic centralization”; “might have been finished before Assyria's campaign against Judah in 701 BCE”. Hedged terminus for the dismantling, not a date for the reform; kept out so the entry asserts nothing about 701 (sennacherib-campaign)."
  - "Moulis 2019 p. 170: “The Arad researchers later moved the decommissioned temple and the altar to the same time as Stratum VIII at around 715 BCE in the first year of Hezekiah's reign”, then Herzog's revision to Strata X–IX. The excavators' date for one temple, revised; not a date for the reform (see header). pp. 171–72: Na'aman and Edelman dissent on Arad; “most scholars agree that it was abandoned in the second half of the eighth century BCE” (Arad). p. 180: “some cultic changes also happened before Hezekiah became the king of Judah (Lachish and Moza)”."
  - "Pakkala 2017 pp. 271–72: reform accounts “projections of later, post-monarchic bce religious ideals”; Hezekiah's reform “only mentioned in one verse (2 Kings 18:4), which many scholars have argued to be a late addition”. Not needed beyond p. 271."
  - "NABRE Isaiah intro ¶¶ 4–5: “When Hezekiah came to the throne in 715 B.C. … he undoubtedly supported the religious reform that Hezekiah undertook.” Accession year; reform undated, assumed."
  - "EJ “Hezekiah” (Oded and Sperling), ¶¶ 1–2: accession 727/6 or 715/4; “It seems that there were also some political aspects to this religious reform”; “if there is any historical basis to the account in ii Chronicles 30:1–10”. Reform undated; the hedge is about Chronicles' letters."
  - "HarperCollins “Hezekiah” and “Nehushtan” (Bible Odyssey): king 727–698 BCE; “highly praised in the book of Kings (2Kgs 18:3-6) for his destruction of high places”. Regnal span; reports the Bible only."
  - "Price, Bible Odyssey “Hezekiah” (2020): rule “ca. 727-698 BCE or ca. 715-686 BCE”; “commended for purging illicit worship from Judah (2Kgs 18:4)”. Reign only; reports the Bible."
  - "Coogan and Chapman ch. 18 summary: “As part of this patriotic revival came religious reforms that stressed the worship of Yahweh exclusively”. No date; assumed."
  - "Hayes RLST 145 l15 ch. 1 (the Deuteronomist's judgement of Hezekiah: “instituted sweeping reforms”) and l11 ch. 3 (“the major religious reforms that were carried out in the eighth century by King Hezekiah”). l15 reports the biblical writer's view; l11 is a century-level aside; not needed (see header). l14: reform not mentioned."
  - "Kleiman 2022, TheTorah.com “Hezekiah's Reform: The Archeological Evidence”: “15 years after the suggested time of Hezekiah's reform”; Beersheba “nothing suggests that it be specifically connected to Hezekiah's reform”; reform as a reinterpretation of de facto centralization after 701. Popular-academic site; Reference status unsettled under #86; not cited."
  - "Bible Odyssey dictionary “Arad”: nothing on Hezekiah."
