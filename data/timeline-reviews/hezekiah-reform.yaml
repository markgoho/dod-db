# Second-pass rulings on the first pass's flags: (1) Passes. p. 54's “This, of course, is not certain” follows “Thus, if we opt for 712 or 711 BCE for the destruction, then the reform must have taken place between Hezekiah's ascendance to the throne … and this date”, and goes on to the Azeka inscription's other attributions (Sennacherib 701; Sargon 720): what is not certain is the 712/711 date of Tel ‘Eton's destruction, the statement's “which he says is not certain”. “Should this dating be accepted” (first paragraph) is the same condition. (2) Kept. p. 53 poses the dating on “if the reform was an actual historical event”; Faust leaning to historicity (p. 48 “broadly accepted material evidence”, p. 50 “most scholars insist”, p. 51 “we tend to associate it with Hezekiah's reform”) does not make the condition his rhetoric only, and the statement attributes no view on historicity to him beyond the two camps. (3) Confirmed with a correction: pp. 167–180 = PDF pp. 177–190 (chapter title on 177, next chapter, Briffa, on 191). Publisher-hosted, opens without login, but through SBL's International Cooperation Initiative repository, not an open-access licence; registry access reworded to the sibling entries' line (change d). Class Scholarly, kind book, fine. (4) Corrected: publisher per the journal's About page (change c). DOI 10.52486/01.00009.3 printed on p. 31 (citation line), confirmed; the registry has no DOI field, not recorded. (5) Kept. Faust p. 31 calls the historicity itself “a hotly debated topic” and p. 46 names both camps; “whether it happened is debated” is no stronger. (6) Confirmed, with a correction to the flag's site list: p. 180's “these cultic eliminations” refers back to section 7.7's four types of cultic change at Arad, Moza, Beersheba and Lachish (Tel Halif the tolerated exception); Moulis's chapter never mentions Tel ‘Eton. “the cultic eliminations he surveys” fits.
# Flags for publish: (1) Faust's 712/711 rests on a third condition the statement does not name: that the dismantling of Tel ‘Eton's standing stone belongs to Hezekiah's reform (p. 51 “we tend to associate it with Hezekiah's reform”; p. 45 “they are insufficient for us to suggest that the dismantling actually did take place at the time of Hezekiah”; n. 16 “Or to disassociate the two”). Uncited, so the second pass could not add it; the statement's “only if” names one necessary condition and does not claim it is the only one. The publisher may cite p. 51 and add “and if the dismantling there was part of it”. (2) #99 and the show's “around 700”: E13@00:15:30 (“decommissioned out of service somewhere around the year 700 BCE”) and the cut start of E88@00:39:38 (“somewhere around 700 BCE, somewhere around the reign of Hezekiah, suddenly it just stops”) date Arad's temple going out of use, which the same turns credit to Hezekiah's reforms; #209's inventory row glosses this as “Hezekiah's reforms c. 700 BCE if historical”. The show never states a date for the reform itself, so the first pass's “#99 does not apply” holds for stated dates; but the stored E88 text is trimmed before the show's implied date, and c. 700 sits in mild tension with Faust's conditional “before 712/711”. #99 shows Trigger Claims verbatim even when they disagree; the second pass cannot lengthen a Trigger Claim. The publisher may keep the trim (date is Arad's, not the reform's) or restore it. (3) Moulis's abstract (p. 167) bounds the dismantling, not the reform: “No later than the end of the eighth century BCE, shrines were dismantled … probably Hezekiah's … centralization”, “might have been finished before Assyria's campaign against Judah in 701 BCE”. Hedged (“probably”, “might”), a terminus for the sites, so “The sources give it no firm date” survives; recorded in uncited by the first pass. (4) Scratch hygiene: the second pass's first curl wrote into a pre-existing scratch folder from the sennacherib-