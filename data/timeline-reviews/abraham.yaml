# Review record for the Timeline Entry `abraham` (/timeline/#abraham; #93 shape). Not rendered.
# Issue #187 (from #108). Issue notes: likely `undated`, placed by its Tradition Date (#162), like `exodus`; overlaps Scholarship issue #153 (Abraham, Isaac and Jacob), which has no sources yet, so nothing was reused from it.
# Sourcing test, 2026-11-25: met as `undated` (verdict no-firm-date). No Scholarly or Reference source read dates Abraham or the patriarchs outright. Coogan and Chapman: a secure date is “impossible to pinpoint”; Hendel: existence unknown; NABRE: scholars “have traditionally dated” the stories to the first half of the second millennium, a few late and fictional, no extra-biblical evidence either way. The NABRE's traditional dating is reported inside the statement, not as a Critical Date: the source frames it as what scholars traditionally held, beside the late-and-fictional view and the lack of evidence.
# Verdict no-firm-date, not not-historical: Hendel says only that “we do not know whether Abraham actually existed”; Coogan reports that “some scholars” call the narratives late fiction. No source read says outright that Abraham did not exist.
# Tradition Date: ABR (Wood 2009) “Abraham was born in 2166 BC”, birth. Chosen over AiG's Ussher table (Pierce 2006: born 1996 BC, enters Canaan 1921 BC) because ABR states it in prose; the AiG figures exist only as table cells. Neither matches the show's “like 1900” / “2000 ish”; per #99 the Trigger Claims are shown verbatim and the gap is left unexplained.
# Philistines (E121's anachronism point): no source read mentions them, so the entry says nothing about them. Their twelfth-century arrival would date the Philistines, not Abraham, and could not be a Critical Date for this entry.
# Composition dates of Genesis (J/E, exilic layers; inventory line 85) are a separate subject and are not used.
# Trigger Claims kept (#99: one to three): E121 (both: the “supposed to be … 1900 BCE” tradition side and the anachronism), E64 (critical: the common-ancestor scheme as “later fictional literary creation”, both “probably” kept), E187 (tradition: “where a lot of people want Abraham to be located”). Trimmed E187 at “1550 BCE.”: the 2000–1550 range is the Middle Bronze Age, not an Abraham range. Not kept: E76 (Melchizedek tithe, no dating claim); E20 00:20:28 (“patriarchs” there are the antediluvians).
# agent: the first pass (2026-11-25). Quotes script-matched against saved copies of each source (whitespace, quotes, dashes, entities and Markdown links normalised): 6 hits, 0 misses. Trigger Claims matched by script as substrings of their Transcript lines at their timestamps: 3 hits.
# owner: empty (""). The owner delegated the publish review (#93; extended to the Timeline, #110, 2026-11-23); a `delegation` block is added when the independent second agent pass has run.
# Flags for the second pass: (1) is the NABRE's “traditionally dated … first half of the second millennium” rightly kept out of a Critical Date? (2) Coogan's “help to support the contention” (undated/4) is reported as “note support for the view”; check that it is no stronger. (3) NABRE is a Church-published Bible, classed Reference as on `adam` (its notes are by a scholarly association, CONTEXT.md). (4) The EJ entry's biblical sections are signed Sarna / Sperling (2nd ed.); the cited sentence is in the biblical part, before the Aggadah section by Harry Freedman.
# Independent second agent pass 2026-11-25 (#93 delegation, #110): every source re-fetched from its registry URL (USCCB /bible/genesis/0 returned 200 and was matched; /0.md returned 403 this time); all six quotes re-matched by script (whitespace, quotes, dashes, entities, Markdown links normalised): 6 hits, 0 misses, each at its locator (Coogan sections “Ancestors as History?” and “Form Criticism”; Hendel “Did Abraham actually exist?”; NABRE ¶ 7 counting from “Genesis is the first book”; EJ “The Chronological Background”, inside the Sarna / Sperling part; Wood's opening paragraph, author and 25 August 2009 confirmed). Every “…” fragment in the statement is a substring of its cited quote. All three Trigger Claims re-matched by script (timestamp, speaker, verbatim substring of the line): 3 hits; about two minutes either side read.
# Second pass changed (statement only, all narrowings to the quotes; no citation cut, nothing moved to uncited): (a) Hendel “most details” → “many or most details” (his “many (or most)”); (b) NABRE “no evidence outside the Bible” → “no direct evidence outside the Bible” (its “no direct extra-biblical evidence”; the next sentence gives indirect second-millennium affinities, so “direct” matters); (c) Coogan “note support for the view” → “say etiologies in the stories help support the contention” (their “such etiologies help to support the contention”; the support is from etiologies, not stated outright); (d) EJ “calls them reflections” → “says that in general the patriarchs and their activities are reflections” (restores its “In general” hedge).
# Title “Abraham and the patriarchs”, verdict no-firm-date, tradition display “2166 BCE (Abraham's birth)” and holder (= registry `tradition:`, ABR's About-page wording) re-checked against their sources: kept. The title names the subject the sources discuss (Abraham; Coogan, NABRE and EJ speak of the patriarchs/ancestral stories) and claims no date.
# First-pass flags answered: (1) NABRE's “traditionally dated … first half of the second millennium” stays out of a Critical Date: NABRE reports it as what scholars traditionally held beside a minority and no direct evidence, not as its own date. (2) “note support for the view” was a little loose (it dropped the etiologies basis); now Coogan's own “help support the contention”. (3) NABRE as Reference: same id and class as `adam` and `flood`; fits. (4) Confirmed on the fetched page: the biblical sections end with the signature “[Nahum M. Sarna / S. David Sperling (2nd ed.)]” before “Patriarchs and Matriarchs in the Aggadah”, which is signed “[Harry Freedman]”; the cited sentence is before both.
# Flags for publish: (1) NABRE ¶ 7 ends with its own lean, not cited: “Given the lack of decisive evidence, it is reasonable to accept the Bible’s own chronology that the patriarchs were the ancestors of Israel and that they lived well before the exodus that is generally dated in the thirteenth century.” A relative date, but conditional on accepting the Bible's chronology, so not a Critical Date (conditional-not-critical); the statement reports NABRE's survey but not this lean. Adding it is a new citation, left to the publisher. The verdict enum has only no-firm-date and not-historical, so no-firm-date stands either way. (2) “Coogan and Chapman” attributes a publisher student summary (kind publisher-summary) to the book's authors; same wording as published `creation`, `flood` and `adam`, so kept. (3) E187's trimmed text keeps “down to about 1550 BCE”, the Middle Bronze Age's lower bound, so on its own it can read as an Abraham range; verbatim per #99, kept. (4) E121's critical side (Philistines arrive later) is backed by no cited source; the entry says nothing about Philistines (CONTEXT: worded for what its sources date), so the Trigger Claim is shown verbatim only. (5) `sourcesRead` is empty; it must be set to 2026-11-25 (= delegation secondPass) at publish. check:timeline returns before the publish gate for a draft, so its pass does not check this file; the file was checked separately by yaml load.
