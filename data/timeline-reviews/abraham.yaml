# Review record for the Timeline Entry `abraham` (/timeline/#abraham; #93 shape). Not rendered.
# Issue #187 (from #108). Issue notes: likely `undated`, placed by its Tradition Date (#162), like `exodus`; overlaps Scholarship issue #153 (Abraham, Isaac and Jacob), which has no sources yet, so nothing was reused from it.
# Sourcing test, 2026-11-25: met as `undated` (verdict no-firm-date). No Scholarly or Reference source read dates Abraham or the patriarchs outright. Coogan and Chapman: a secure date is “impossible to pinpoint”; Hendel: existence unknown; NABRE: scholars “have traditionally dated” the stories to the first half of the second millennium, a few late and fictional, no extra-biblical evidence either way. The NABRE's traditional dating is reported inside the statement, not as a Critical Date: the source frames it as what scholars traditionally held, beside the late-and-fictional view and the lack of evidence.
# Verdict no-firm-date, not not-historical: Hendel says only that “we do not know whether Abraham actually existed”; Coogan reports that “some scholars” call the narratives late fiction. No source read says outright that Abraham did not exist.
# Tradition Date: ABR (Wood 2009) “Abraham was born in 2166 BC”, birth. Chosen over AiG's Ussher table (Pierce 2006: born 1996 BC, enters Canaan 1921 BC) because ABR states it in prose; the AiG figures exist only as table cells. Neither matches the show's “like 1900” / “2000 ish”; per #99 the Trigger Claims are shown verbatim and the gap is left unexplained.
# Philistines (E121's anachronism point): no source read mentions them, so the entry says nothing about them. Their twelfth-century arrival would date the Philistines, not Abraham, and could not be a Critical Date for this entry.
# Composition dates of Genesis (J/E, exilic layers; inventory line 85) are a separate subject and are not used.
# Trigger Claims kept (#99: one to three): E121 (both: the “supposed to be … 1900 BCE” tradition side and the anachronism), E64 (critical: the common-ancestor scheme as “later fictional literary creation”, both “probably” kept), E187 (tradition: “where a lot of people want Abraham to be located”). Trimmed E187 at “1550 BCE.”: the 2000–1550 range is the Middle Bronze Age, not an Abraham range. Not kept: E76 (Melchizedek tithe, no dating claim); E20 00:20:28 (“patriarchs” there are the antediluvians).
# agent: the first pass (2026-11-25). Quotes script-matched against saved copies of each source (whitespace, quotes, dashes, entities and Markdown links normalised): 6 hits, 0 misses. Trigger Claims matched by script as substrings of their Transcript lines at their timestamps: 3 hits.
# owner: empty (""). The owner delegated the publish review (#93; extended to the Timeline, #110, 2026-11-23); a `delegation` block is added when the independent second agent pass has run.
# Flags for the second pass: (1) is the NABRE's “traditionally dated … first half of the second millennium” rightly kept out of a Critical Date? (2) Coogan's “help to support the contention” (undated/4) is reported as “note support for the view”; check that it is no stronger. (3) NABRE is a Church-published Bible, classed Reference as on `adam` (its notes are by a scholarly association, CONTEXT.md). (4) The EJ entry's biblical sections are signed Sarna / Sperling (2nd ed.); the cited sentence is in the biblical part, before the Aggadah section by Harry Freedman.
