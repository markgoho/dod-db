# Review record for the Timeline Entry `second-temple` (/timeline/#second-temple; #93 shape). Not rendered.
# Issue #192 (from #108). Issue notes: sources commonly give 520–515 BCE; `isaiah-56-66` dates “after 515 BCE” (Coogan ch. 22, “after the Temple was completed in 515 BCE”); show the split if sources split (#99) and keep consistent with that entry. “Traditional” in E115 is conventional scholarship, not a Tradition Date. No anchor/seeAlso: isaiah-56-66 is left unchanged.
# Sourcing test, 2026-11-26: met. Every in-class source that gives a completion or dedication year gives 515 (Coogan ch. 22, Porten EJ, Britannica; also Schiffman and Chan on Bible Odyssey, Schiffman/COJS, Hayes l22 “we think, about 515”). Only Eskenazi (Bible Odyssey) gives the dual form “516/515”. No source dates the rebuilding as one range except Hayes l22 (“somewhere between 520, 515, we're not really sure”, hedged), so no dash range is stitched from two sources: the entry is worded for what the sources date outright, the completion (title “Second Temple completed”, display “515 BCE”), with the 520 resumption in the note (NABRE Haggai). Start year varies across sources (520 NABRE/EJ/Coogan; 521 Schiffman; 519 Jewish Encyclopedia 1906), hence note only, cited to NABRE.
# The show's 519 is in no completion source; Trigger Claims are shown verbatim and the gap is left unexplained (#99). “Stood until 70 CE” (issue) is a different subject; not dated here.
# Dropped Trigger Claim leads: E115 00:40:52 (“around 520 BCE”) dates Haggai's oracle, not the Temple; E59 has no claim (Elephantine temple); E187 00:55:30 (“from 519 on”) dates the Second Temple period, and E187's “Five nineteen ish” (00:55:28) is a three-word reply, so E187 00:55:06 (“twenty years ish after Cyrus”) is kept instead.
# Hedges dropped by trimming: E130 keeps “like 519”; E115 keeps “I think, I think”; E187's “ish” is kept, the “Five nineteen ish” year is in the next turn and not stored.
# agent: the first pass (2026-11-26). Quotes script-matched against saved copies of each source (whitespace, quotes, dashes, entities normalised): 4 hits, 0 misses. USCCB and Britannica refuse scripted requests; both captured as page text via Claude in Chrome. Trigger Claims matched by script as substrings of their Transcript lines: 3 hits.
# owner: empty (""). The owner delegated the publish review (#93; extended to the Timeline, #110, 2026-11-23); a `delegation` block is added when the independent second agent pass has run.
# Flags for the second pass: (1) Eskenazi's “Most scholars date the actual completion of the restored temple to 516/515 B.C.E.” is uncited; is “515 BCE” right, or does #99 require “516/515 or 515”? (2) Coogan's quote says dedication, Porten and Britannica say completed; the title says completed. (3) Porten's sentence names “Darius” only; the note says “the sixth year of Darius”, not Darius I. (4) Hayes and Porten (EJ Zerubbabel) call the chronology uncertain; the entry carries no uncertainty note.
