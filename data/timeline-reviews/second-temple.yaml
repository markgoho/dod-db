# Review record for the Timeline Entry `second-temple` (/timeline/#second-temple; #93 shape). Not rendered.
# Issue #192 (from #108). Issue notes: sources commonly give 520–515 BCE; `isaiah-56-66` dates “after 515 BCE” (Coogan ch. 22, “after the Temple was completed in 515 BCE”); show the split if sources split (#99) and keep consistent with that entry. “Traditional” in E115 is conventional scholarship, not a Tradition Date. No anchor/seeAlso: isaiah-56-66 is left unchanged.
# Sourcing test, 2026-11-26: met. Every in-class source that gives a completion or dedication year gives 515 (Coogan ch. 22, Porten EJ, Britannica; also Schiffman and Chan on Bible Odyssey, Schiffman/COJS, Hayes l22 “we think, about 515”). Only Eskenazi (Bible Odyssey) gives the dual form “516/515”. No source dates the rebuilding as one range except Hayes l22 (“somewhere between 520, 515, we're not really sure”, hedged), so no dash range is stitched from two sources: the entry is worded for what the sources date outright, the completion (title “Second Temple completed”, display “515 BCE”), with the 520 resumption in the note (NABRE Haggai). Start year varies across sources (520 NABRE/EJ/Coogan; 521 Schiffman; 519 Jewish Encyclopedia 1906), hence note only, cited to NABRE.
# The show's 519 is in no completion source; Trigger Claims are shown verbatim and the gap is left unexplained (#99). “Stood until 70 CE” (issue) is a different subject; not dated here.
# Dropped Trigger Claim leads: E115 00:40:52 (“around 520 BCE”) dates Haggai's oracle, not the Temple; E59 has no claim (Elephantine temple); E187 00:55:30 (“from 519 on”) dates the Second Temple period, and E187's “Five nineteen ish” (00:55:28) is a three-word reply, so E187 00:55:06 (“twenty years ish after Cyrus”) is kept instead.
# Hedges dropped by trimming: E130 keeps “like 519”; E115 keeps “I think, I think”; E187's “ish” is kept, the “Five nineteen ish” year is in the next turn and not stored.
# agent: the first pass (2026-11-26). Quotes script-matched against saved copies of each source (whitespace, quotes, dashes, entities normalised): 4 hits, 0 misses. USCCB and Britannica refuse scripted requests; both captured as page text via Claude in Chrome. Trigger Claims matched by script as substrings of their Transcript lines: 3 hits.
# owner: empty (""). The owner delegated the publish review (#93; extended to the Timeline, #110, 2026-11-23); a `delegation` block is added when the independent second agent pass has run.
# Flags for the second pass: (1) Eskenazi's “Most scholars date the actual completion of the restored temple to 516/515 B.C.E.” is uncited; is “515 BCE” right, or does #99 require “516/515 or 515”? (2) Coogan's quote says dedication, Porten and Britannica say completed; the title says completed. (3) Porten's sentence names “Darius” only; the note says “the sixth year of Darius”, not Darius I. (4) Hayes and Porten (EJ Zerubbabel) call the chronology uncertain; the entry carries no uncertainty note.
# Independent second agent pass 2026-11-26 (#93 delegation, #110): all four sources re-fetched from their registry URLs into a fresh folder (Coogan and Porten by curl; Britannica and USCCB through Claude in Chrome, page text saved); Eskenazi (Bible Odyssey, uncited) also re-fetched for flag 1. All four quotes re-matched by script against the saved copies, read from the entry file (whitespace, quotes, dashes, entities, soft hyphens normalised): 4 hits, 0 misses, each at its locator (Coogan under the “Ezra 3–6” heading; Porten ¶ 6 counted from “The Temple of Zerubbabel”, subsection signed [Bezalel Porten]; Britannica's “Cyrus II” paragraph; NABRE intro ¶ 1). All three Trigger Claims re-matched by script (timestamp, speaker, verbatim substring of the line): 3 hits; about two minutes either side read (E130 00:12:21–00:16:56; E115 00:46:24–00:54:39; E187 00:52:35–00:56:50).
# Second pass changed: nothing in the entry, triggers or registry; title, display “515 BCE”, from/precision and note all hold against the cited sources' strength and scope. No citation cut; nothing moved to uncited. Review notes updated; Eskenazi's uncited line now carries her second sentence too.
# Second pass on the first-pass flags: (1) Eskenazi, re-read: says 516/515 twice (“Most scholars date the actual completion of the restored temple to 516/515 B.C.E.”; “the temple was completed in 516/515 B.C.E”). Uncited, so split-shown passes on the cited set; no citation added. Not a disagreement on the event: Porten's 3 Adar = March 12, 515 falls inside the regnal/civil year written 516/515, and #99 says a one-year calendar difference is no debate. Keep “515 BCE”. (2) Coogan's cited sentence says dedication, but the same page says “it was completed by 515 BCE” (paragraph just before the heading) and “after the Temple was completed in 515 BCE” (Third Isaiah), so the source dates completion too; Porten puts the dedicatory sacrifices right after completion. Title kept; quote left as is. (3) Note's “sixth year of Darius” is Porten's wording verbatim; NABRE ¶ 1 (cited) and Coogan name Haggai's Darius as Darius I. Kept unqualified. (4) Coogan, next to the cited sentence, calls Ezra 3–6 “Chronologically ... highly confused” and the period's sources too inconsistent for “any definitive conclusions”; so a cited source hedges the narrative, while giving 515 flatly three times. Porten's Zerubbabel uncertainty is about the actors, not the year. No uncertainty note added (none would date anything differently).
# Flags for publish: (1) Eskenazi's 516/515 (“Most scholars”) is the only in-class dual form; adding her would be a new citation and, under #99, make the display “516/515 or 515 BCE”; second pass recommends keeping “515 BCE” (see above). Publisher's call. (2) Coogan's quote could be swapped to “it was completed by 515 BCE” to match the title; left to the publisher (same source, different sentence). (3) Coogan's chronology hedge is in critical/1's note only; not shown on the entry. (4) The show's 519 (all three Trigger Claims) is in no cited source; kept verbatim per #99. (5) check:timeline returns before the publish gate for a draft entry, so its pass does not check this file; the file was checked separately by YAML load. Encyclopedia.com prints no EJ edition or year (citation line blank), so registry year/edition null stays.
# Publish resolutions, 2026-11-26: (1) display kept “515 BCE”: Eskenazi stays uncited; her 516/515 is a calendar dual form containing Porten's March 515, not a debate (#99), and citing her would be a new citation after the second pass. (2) Coogan's cited sentence kept (dedication in 515); the title says completed, as Porten and Britannica do and as Coogan's same page does elsewhere; no post-pass quote swap. (3) No uncertainty note: Coogan's “highly confused” is about Ezra 3–6's order of events, and every cited source gives 515 outright; hedge stays in the review note. (4) The show's 519 kept verbatim (#99). (5) Publish gate now checks this file (draft dropped). (6) Porten registry year/edition stay null (not printed).
# #210 anchor check, 2026-11-26 (first pass): no `critical.anchor: cyrus-babylon`. Its sources date the event outright (515; Porten “the sixth year of Darius”, Haggai 520 for resumption). Only the Trigger Claim (E187 00:55:06, “twenty years ish after Cyrus the Great conquers Babylon”) dates it relative to Cyrus. The cited sources give 515 outright, not as an interval after the conquest; Porten and Britannica do name Cyrus just before (Porten: the rescript “Issued in 538 b.c.e., after his conquest of Babylon”; Britannica: Cyrus’s 538 order, then “Work was completed in 515 BCE.”). It has its own year, -515. An `anchor` sets the entry's placement year to the anchored entry's (timeline-placement.html), so it fits only an entry with no sourced year of its own (as priestly-genesis-1 → fall-of-jerusalem); here it would replace a sourced `from` and is not added. Entry unchanged.
# #210 anchor check, second pass, 2026-11-26: agree, no anchor: every cited source gives 515 (or 520 for the resumption) outright; an anchor would replace a sourced -515 with -539. Corrected the first-pass line: “the cited sources do not” was too broad; re-fetched Porten and Britannica both name Cyrus’s 538 rescript before the completion, though neither dates the completion from it. NABRE Haggai re-read: names the Persian province and Darius I, not Cyrus. Coogan ch. 22: names Darius, not Cyrus.
