# Flags for the second pass: (1) The note's “By August 70 the Romans had breached Jerusalem's final defenses” paraphrases Britannica Siege (“the final defenses”); check it says no more. (2) Day of Av: Britannica gives “9th/10th”, Avi-Yonah attributes tenth to Josephus and ninth to the Talmud; the note follows Avi-Yonah's attribution. Is a one-day split worth the note at all? (3) Martin l4's quote is a trimmed sentence (substring); check the trim keeps its sense. (4) Avi-Yonah's subsection is on the same Encyclopedia.com page as porten-ej-temple; signature “[Michael Avi-Yonah]” closes it; new id so the two authors stay apart. (5) Britannica Siege byline: Kate Lohnes; check the registry author.
# Independent second agent pass 2026-11-26 (#93 delegation, #110): all five sources re-fetched from their registry URLs into a fresh folder (Avi-Yonah EJ, Martin l4 and Bible Odyssey by curl; both Britannica pages through Claude in Chrome, located paragraph text saved and the quote also checked in the live page by a normalised includes test). All five quotes re-matched by script against the saved copies, read from the entry file (whitespace, quotes, dashes, entities, soft hyphens normalised): 5 hits, 0 misses, each at its locator (Britannica Temple paragraph opening “The Herodian Temple was again the centre”; Avi-Yonah last ¶ of “From the Roman Conquest until the Destruction” under SECOND TEMPLE / history, followed by the ¶ “[Michael Avi-Yonah]”; Britannica Siege ¶ 2 of 2 under “The fall of Jerusalem”; Martin ch. 4 [00:36:40] ¶ 5; Bible Odyssey gallery introduction). All three Trigger Claims re-matched by script (timestamp, speaker, verbatim substring of the line): 3 hits; about two minutes either side read in full (E143 00:21:39–00:25:12; E119 00:03:40–00:07:48; E96 00:28:39–00:31:25).
# Second pass changed: the entry note's Av clause, from “Avi-Yonah gives the tenth of Av by Josephus's reckoning and the ninth by the Talmud's” to “Avi-Yonah puts the burning of the Temple on the tenth of Av according to Josephus and on the ninth according to the Talmud”: the source's own attribution (“According to Josephus … according to the Talmud”), and the clause now names what the day dates, as far as Avi-Yonah's paragraph does (the building “went up in flames”; “the catastrophe occurred on the tenth of Av”). Nothing else in the entry; triggers and registry unchanged. E119's review note corrected (the claim comes after the preterism definition, not before it). No citation cut; nothing moved to uncited.
# Second pass on the first-pass flags: (1) “By August 70 CE the Romans had breached the final defenses” is Britannica Siege's own sentence, in its Jerusalem section; the note's “Jerusalem's final defenses” says no more. Kept. (2) Kept. #99: where sources differ, show both, each attributed; Britannica gives the dual form “9th/10th of Av” and Avi-Yonah attributes each day. The display is the year, on which all agree, so the day split stays in the note only, attributed. (3) Martin's trim ends before “because a lot of important things in Christianity … happened either before 70”; the kept clause dates the destruction to 70 on its own. The quote has no “CE”, but the same ¶ opens “Now we're in the Common Era”. Kept. (4) Confirmed: heading “From the Roman Conquest until the Destruction” follows the ¶ “[Yehoshua M. Grintz]”, and the subsection ends with the ¶ “[Michael Avi-Yonah]”; separate id right. (5) Confirmed: the page reads “Written by Kate Lohnes”; registry author matches. Also: Britannica Temple reviser line reads “most recently revised and updated by Adam Zeidan” (registry edition matches); Martin's registry year 2009 is from the OYC course page (“recorded for Open Yale Courses in Spring 2009”); the lecture page prints none; Bible Odyssey's page metadata gives modified 2024-02-02.
# Second pass on E119: kept. The 70 CE events are given in the speaker's own voice (“the events that are being described sound an awful lot like what happened around the year 70 CE when Rome … destroyed the temple in Jerusalem”), as history the preterist reading then uses (00:06:16). E32 was dropped for a different reason: its date sits inside the description of what preterists hold.
# Flags for publish: (1) The show's “summer of 70 CE” (E143) is in no cited source's words (Britannica Siege “By August 70 CE”, Av in Britannica Temple and Avi-Yonah); summer is consistent; kept verbatim per #99. (2) E119 sits in a preterism discussion; kept as the speaker's own historical claim (see above); the publisher may prefer E143 and E96 alone (two triggers still meet the entry rule). (3) Martin's quote has no era marker; the same ¶ gives the Common Era. (4) Britannica Temple's top summary (“marking the end of the First Jewish Revolt”, apparently Britannica AI) conflicts with the 73/74 sources for the war's end; uncited; the war span is not shown. (5) check:timeline returns before the publish gate for a draft entry, so its pass may not check this file; it was also YAML-loaded separately.
# Publish resolutions, 2026-11-26: (1) E143's “summer of 70 CE” kept verbatim (#99); consistent with August/Av. (2) E119 kept: the 70 CE events are stated in the speaker's own voice as history, not as what preterists hold; three triggers stay. (3) Martin's quote kept; the year 70 is unambiguous in context (same ¶ “Now we're in the Common Era”). (4) Britannica's top summary stays uncited; no war span shown; Masada / war end left as a lead. (5) Publish gate now checks this file (draft dropped).
