# Review record for the Timeline Entry `temple-destruction` (/timeline/#temple-destruction; #93 shape). Not rendered.
# Issue #194 (from #108). Issue notes: critical as stated “Jewish War 66–70 CE; Temple destroyed summer 70 CE”; sides: critical only; check the minimap (#175) after it lands (not the first CE entry: christian-canon, 367 CE, is already placed). No anchor/seeAlso: second-temple (515 BCE) is the completion, a different event, and is left unchanged.
# Sourcing test, 2026-11-26: met. Every in-class source read dates the destruction to 70 CE outright (Britannica “Temple of Jerusalem” and “Siege of Jerusalem”, Avi-Yonah EJ, Martin RLST 152 l4, Bible Odyssey Second Temple timeline; also Ehrman ch. 3 summary, Henze–Werline chronology, Stern EJ, Rogers BO). Display “70 CE”, worded for the destruction (title “Second Temple destroyed”, parallel to “Second Temple completed”). Month and day go in the note only, as sources give them: August 70 (Britannica Siege), 9th/10th of Av (Britannica Temple), tenth by Josephus / ninth by the Talmud (Avi-Yonah). The war's start (66) in the note, cited to Britannica Temple.
# Dropped: the Jewish War as a span. Every source starts it in 66, but sources end it differently: 70 (Henze chronology “66–70 Jewish revolt against Rome”; Britannica Siege “four-year campaign”; Stern “in effect terminated the war”), 73 (Britannica Masada, Stern, BO timeline “66-73 C.E.”), 73/74 (Stiebel EJ Masada, Henze chronology), 74 (Martin l4 “by most people to 74”, Seeman in Henze “66–74 CE”, Rogers BO “66–74 CE”). The issue's “66–70” is one of these; no war span is shown, and the end-year split is left for a possible Masada entry (lead).
# The show's “summer of 70 CE” (E143) is not in any source's words (sources say August or Av); shown verbatim (#99). E96 and E119 say “around 70 CE”.
# Trigger Claims kept (3, #99): E143 00:23:32, E119 00:05:42, E96 00:30:12. All states: critical. No Tradition Date: no Trigger Claim states a tradition's side; the preterist passages (E32 00:06:08, E39, E119) describe a reading of prophecy that uses the same 70 CE, not a tradition's date for the event.
# Dropped Trigger Claim leads: E32 00:06:08 (“culminated with the destruction of the Temple in 70 CE”, inside a description of preterism); E39 (preterist framing of Revelation's date); E43, E123, E172, E185 (no date for the event, or dating a text); E45 00:24:18 (Kipp Davis, “the theory is”, about the Essenes and Qumran) and 00:26:14 (68–70 is the scrolls' cut-off); E69 (Luke's date); E86 (“the Jewish War” is Josephus's book, c. 75 CE); E115 00:56:44 (“lasted until 70 CE”, Zerubbabel's temple); E140 (no hit); E165 (“over around 70 CE”, hedged aside); E187 00:55:30 (“68 to 70 CE”, end of the Second Temple period); E189 (dates Mark 65–70).
# Hedges dropped by trimming: E143 keeps “I think most scholars would say”, drops the opening “Uh, no, probably 40. So it is— yeah,” (answer about Mark's date); E119 drops the turn's opening sentence about the Olivet Discourse; E96 drops the Pharisees definition before it.
# agent: the first pass (2026-11-26). One critical-side research agent saved every page to its own scratch folder; quotes script-matched against the saved copies (whitespace, quotes, dashes, entities, soft hyphens normalised): 5 hits, 0 misses. Britannica pages refuse scripted requests; captured as page text via Claude in Chrome. Trigger Claims matched by script as substrings of their Transcript lines at timestamp and speaker: 3 hits.
