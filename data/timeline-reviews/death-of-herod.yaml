leads:
  - "Andrew E. Steinmann, “When Did Herod the Great Reign?”, Novum Testamentum 51 (2009): argues for 1 BC (cited by De Caro et al., ref. 24, and on the Bible History Daily page below). Not openly readable; not read."
  - "W. E. Filmer, “The Chronology of the Reign of Herod the Great”, JTS 17 (1966): the 1 BC case De Caro et al. report. Not read."
  - "Bible History Daily (BAS), “Herod's Death, Jesus' Birth and a Lunar Eclipse” (BAS Staff; letters by John A. Cramer, Jeffrey R. Chadwick, Andrew Steinmann): sets the 4 BC and 1 BC eclipse arguments side by side; its intro calls the 4 BC eclipse “generally regarded as” Josephus's. Refuses curl; only partly read in Chrome (truncated slices), so a lead, not uncited. A staff-compiled letters page near the excluded blog class (#80, #86); not citable as is."
uncited:
  - "Bible Odyssey, Morten Hørning Jensen, “Herod the Great”: “Herod ruled from the year 40-4 BCE but first captured the throne in 37 BCE.” Dates the reign (from the Senate's grant in 40), not the death; agrees on 4. Not needed beside the three death-dating sources."
  - "Britannica “Herod”, paragraph beginning “In his last years”: Matthew's slaying of the infants “not corroborated by any other contemporary witness”; “After an unsuccessful attempt at suicide, Herod died.” No year; concerns `birth-of-jesus`, not this entry."
  - "Henze and Werline body, section 3.3 “Provincia Iudaea?”: “The death of Herod the Great provoked contention over Judea’s future.” No year; the chronology row carries it. Row “4 BCE–6 CE Archelaus rules Judea, Idumea, and Samaria”: succession, not the death."
  - "EJ “Herod I”: illnesses “from around 7 b.c.e.”, “cardio-renal failure”; the will dividing the kingdom among Archelaus, Antipas and Philip. Context; not needed."
  - "De Caro et al., section 2 list of eclipses proposed (Barnes 5 BC, Schürer 4 BC, Filmer and Pratt 1 BC, Fedalto 2 AD) and section 1 on Schürer's 4 BC. Carried by critical/6–8; not quoted further."
