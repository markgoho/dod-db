# Review record for the Timeline Entry `death-of-herod` (/timeline/#death-of-herod; #93 shape). Not rendered.
# Issue #237 (from #108), “Timeline Entry: The death of Herod the Great”. Issue notes: kind event; critical as stated 4 BCE (inventory event spine, no row); sides critical only; date Herod's death, not his reign (37–4 BCE), the reign may go in the note; check the Speaker of E144 00:09:33 (inventory credits Dan Beecher, transcript shows Dan McClellan); check E187's “Lay of the Land”; overlaps: bounds Matthew's dating in `birth-of-jesus` (open #201), keep naming consistent with `temple-destruction` (“Herodian Temple”), `hasmonean-state` ends before Herod. Lead brief: stay consistent with `birth-of-jesus` (c. 6–4 BCE, Britannica's “death of Herod the Great … in 4 BCE”), `hasmonean-state` (Hasmonean rule ends 37 BCE) and `maccabean-revolt`; apply #99 if sources split (4 vs 1 BCE).
# Id `death-of-herod` (as `death-of-james`); title “The death of Herod the Great”, the name every cited source and `birth-of-jesus` use.
# Sourcing test, 2026-11-27: met. Three sources date the death to 4 BCE in their own voice: Henze and Werline 2020 Chronology (Scholarly, in window; row “4 Herod the Great dies”), Britannica “Herod” (Reference; “died March/April, 4 BCE, Jericho”), Encyclopaedia Judaica “Herod I” (Reference, credited “[Shimon Applebaum]”; “(73?–4 b.c.e.)”). Kind: event. No Tradition Date: every Trigger Claim states critical. No setting (event entry). No anchor. No seeAlso: no published composition entry is the account of this event (`birth-of-jesus` is an event entry).
# #99 and the dissent: De Caro, La Greca and Matricciani 2021 (MDPI Histories, peer-reviewed; class Scholarly by the registry's MDPI precedent, krajewski-2026, karapanagiotis-2025) argue for a death early in 3 CE and report Filmer's 1 BC. Their own abstract says “most scholars still assume” the 13 March 4 BC eclipse, i.e. they frame their date as against the majority. Ruled (lead, first pass): display stays “4 BCE”, not “4 BCE or 3 CE”: #80 says “No equal space by default; weight follows the sources” and that a minority view is characterised in a source's own words; here three in-window sources give 4 BCE flat and the one dissenting source itself reports the majority. The dissent is shown in the note, attributed by name, with its own “most scholars” sentence quoted (critical/6), per #80 (“Where sources show a split, the page shows the split”; “A dissenting view appears only if a Scholarly or Reference source holds or reports it, attributed by name”). Filmer's 1 BC enters only as De Caro et al.'s report (critical/8); Filmer himself not read (lead). No “contested” label: no source read calls the date debated in those words. See flag 1.
# Consistency: `birth-of-jesus` (Britannica “Jesus”: Herod's death in 4 BCE; Landau 4 B.C.E.) agrees. `hasmonean-state` (Stern: Antigonus's death in 37 brought Hasmonean rule to a close, “prepared the way for Herod”) agrees with Herod king from 37 (Henze and Werline row 37; Britannica 37–4; EJ from 37). `temple-destruction` untouched (no Temple named here). `maccabean-revolt` untouched.
# Trigger Claims (#99: three kept; all agree with the display): E144 00:08:33 (“Herod the Great who dies in 4 BCE”; trimmed before the turn's trailing “And Herod—”), E144 00:09:33 (Antipas rules “from 4 BCE when his father dies to 39 CE”; trimmed before “Oh wow”, Dan Beecher's interjection merged into the turn), E141 01:05:18 (Luke 1 has the birth during Herod's reign “or very shortly after his death in 4 BCE”; the same sentence is a Trigger Claim of `birth-of-jesus`). Speaker of E144 00:09:33: Dan McClellan in both the final and the raw Transcript; the turn is the explainer's (McClellan lays out the Herodian family from 00:08:03 on); the inventory's Beecher credit (its line 32 note on mislabelled turns) does not hold here. Not kept: E87 00:28:50 (“depending on when you date it, if it's after Herod's died, so it's after 4 BCE”, McClellan; hedged, the year is a premise for Jesus's age; three suffice); E141 00:48:54 and 01:00:02 (Herod's death, no year); E87 00:23:25 and 00:25:09 (Beecher retelling Matthew, no year); E37 00:12:34 (“time traveled to 4 BCE”, Aaron Adair, a joke about the star, not a dating). E187 Lay of the Land (00:34:19–01:03:57): read; it runs Persian 539–332, Hellenistic from 332, then the Roman period, and never names Herod or 4 BCE; no Trigger Claim.
# agent: the first pass (2026-11-27), lead agent alone (one side: critical). Saved into scratchpad/herod-p1: Henze and Werline PDF (curl; pdftotext -layout and plain), EJ “Herod I” at Encyclopedia.com (curl, HTML stripped; Hebrew characters come out as “?”, none quoted). In Claude in Chrome: Britannica “Herod” (lede, Quick Facts and the paragraph beginning “In his last years”, transcribed from innerText; the saved last paragraph carries a “...” elision, nothing quoted across it); Bible Odyssey “Herod the Great” (Jensen; get_page_text, cited-candidate lines saved); MDPI Histories article (get_page_text; abstract, list in section 2, section 5.2 ¶ 1 and conclusions transcribed). Every cited quote script-matched against the saved text (NFKC, entities, whitespace, curly quotes, dashes normalised): 8/8 found, once each. Trigger Claims matched by script as substrings of the only turn at that timestamp and speaker in each final Transcript (episode per processed-videos.json): 3/3; context read about two minutes either side.
# owner: empty (""). The owner delegated the publish review (#93; extended to the Timeline, #110, 2026-11-23); a `delegation` block is added when the independent second agent pass has run.
# Flags for the second pass: (1) The #99/#80 ruling above: is “4 BCE” with the 3 CE dissent in the note right, or should the display show “4 BCE or 3 CE”? Is MDPI Histories / these authors (De Caro, CNR crystallographer; La Greca, historian, Salerno; Matricciani, engineer, Politecnico di Milano, as the lead understands them; not stated on the saved page) Scholarly? If not, cut critical/6–8 to `uncited` and drop the note's last sentence. (2) critical/6 says most scholars assume the 4 BC eclipse, not in so many words the 4 BC death; the note says “placed the lunar eclipse … on 13 March 4 BC”, keeping their scope; check. (3) “early in 3 CE” renders “in the first month of 3 AD”. (4) EJ text: the 2nd-ed. entry credited to Applebaum, registry year null as for the other EJ entries; the “Herod apparently died of cardio-renal failure” sentence and the add. bibliography mark the 2007 revision; in window? (5) Britannica's byline (Stewart Henry Perowne, Britannica Editors) rotates; attributed to “Britannica”, author null. (6) Britannica's 37–4 and Henze and Werline's row 37 carry the reign in the note (issue: reign only in the note).
# Independent second agent pass 2026-11-27 (#93 delegation, #110): a fresh agent that did not build the entry, working only in its own scratch folder scratchpad/herod-p2 (herod-p1 and its match script not read). Re-fetched: Henze and Werline PDF from the registry URL (curl, browser UA; pdftotext -layout; Chronology p. xi read in full); EJ “Herod I” at Encyclopedia.com (curl, browser UA; HTML stripped; history and arts sections and credits read). In Claude in Chrome (own tab, closed after): Britannica “Herod” (innerText: Quick Facts, lede, every sentence with “4 BCE”, “Jericho”, “death” or “Herod died”); MDPI Histories article (innerText: affiliations, publication history, abstract in full, section 5.2 ¶¶ 1–2, a scan for sentences with “most scholars”, “majority”, “consensus”, “scholars” or “generally accepted”, capped at 15 hits, of which the first 6 were read in full and the output was truncated after the 7th). The browser text was saved as transcribed excerpts of what the page returned, not the full page.
# Second pass matches: quotes 8/8 found once each by script (NFKC, entities, whitespace, curly quotes, dashes normalised): Henze 2/2 and EJ 2/2 against the full fetched text; Britannica 1/1 and De Caro 3/3 against the saved excerpts and again by an in-page normalised occurrence count over document.body.innerText (each found once). Locators all find their quote. Trigger Claims 3/3 by script (exactly one line at the timestamp, speaker as stored, text a substring) in the final Transcripts per processed-videos.json; about two minutes read either side. E144 00:09:33 Speaker: Dan McClellan in final and raw Transcript; inventory's Beecher credit does not hold. E187 Transcript: no “Herod” or “4 BCE” anywhere, agreeing with the first pass.
# Second pass changed (note only; display, from, to, precision, cites, triggers and registry unchanged): (a) “has the aged king die in his palace at Jericho five days after the execution of his son Antipater” → “has the aged king lying in his palace at Jericho when his son Antipater was executed, and dying five days later” (EJ has him lying in the palace, not dying there). (b) “most scholars have placed the lunar eclipse that Josephus puts before Herod's death on 13 March 4 BC” → “most scholars still assume that the lunar eclipse Josephus puts before Herod's death occurred on 13 March 4 BC” (source's verb). (c) “died early in 3 CE” → “died in the first month of 3 CE” (source's words). (d) “Filmer's earlier case” → “Filmer's case” (Filmer's date not read).
# Second pass rulings on the first-pass flags: (1) Display stays “4 BCE”; dissent stays in the note only. #99 says sources that differ are both shown and the row “does not pick one”; the second pass reads that as written for sources of comparable standing (its example: 587 vs 586), and a lone dissent that itself reports the majority is governed by #80's Disagreement section (attributed by name in the text, which a display cannot do; “weight follows the sources”), and three in-window sources give 4 BCE flat. De Caro et al. is Scholarly under #80's definition (“works by professional scholars from … peer-reviewed journals”); #80's “Scholars are classed by venue, not confession” concerns confession, not field, so it does not by itself settle the two out-of-field authors: affiliations CNR, Salerno (humanities) and Politecnico di Milano, and an editor-and-review publication history, read on the page; registry precedent de-caro-2022-xray-dating (MDPI Heritage, Scholarly); the first pass's precedent ids “krajewski-2026” and “karapanagiotis-2025” are registered as krajewski-2026-israelites-number and karapanagiotis-2025-shroud-overview. Kept. (2) Scope: the source says most scholars assume the eclipse date, not the death date; the note keeps the eclipse scope and now uses the source's verb. (3) Now “in the first month of 3 CE”. (4) EJ 2nd ed., year null as for the other EJ entries (house pattern); the edition's year was not read on the page; no state-of-the-field claim rests on EJ, and the display stands on Henze and Werline (2020) and Britannica without it. Kept. (5) Britannica: author null as for the other britannica-* entries; page shows Perowne and Britannica Editors. Kept. (6) Reign only in the note; agree.
# Flags for the lead: (1) The De Caro et al. dissent is a single 2021 paper whose authors are two outside history (crystallography, electronic engineering); it is Scholarly by venue as #80 classes it, but if the lead prefers a stricter reading, cutting critical/6–8 to `uncited` and the note's last sentence leaves the entry valid on three sources. The literal alternative reading of #99 would make the display “4 BCE or 3 CE”; the second pass rejects it (ruling 1), but it is a tension between two recorded decisions (#80 Disagreement vs #99) that the lead may want ruled. (2) critical/6 is a “most scholars” sentence; #80 wants reasons after it: the note's eclipse clause is the basis (Josephus's eclipse before the death), no further reasons quoted. (3) The edited note sentence mixes “4 BC”/“1 BC” (the source's era) with “3 CE” (rendering its “3 AD”); `alexander` keeps a source's “BC” when attributed; left as the first pass had it. (4) At publish the gate requires `sourcesRead` to equal `delegation.secondPass` (2026-11-27).
