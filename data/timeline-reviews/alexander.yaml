  - "Esler, in Henze and Werline 2020, p. 57: “In the Hellenistic period, beginning in the late fourth century BCE”. No year; not needed."
  - "Henze and Werline 2020 Chronology: “63 Pompey captures Jerusalem; Roman rule of Judea begins”. Not needed; the Bible Odyssey timeline gives 63 for the note."
  - "Bible Odyssey timeline, entries “Alexander the Great conquers the Persian Empire” (Issus 333, “allowing Alexander to take control of Syria, Palestine (including Judea), and Egypt”), “Alexander dies in Babylon” (323), “Court Tales in Daniel 1-6” (“early Hellenistic (333-168 B.C.E.)”), “Pompey invades Palestine” (63). Not needed; see flag 4 on the Issus entry."
  - "Bible Odyssey “Persian Empire Map”: empire endured “until Alexander the Great's conquest of the ancient Near East in 333 B.C.E.”. Unsigned; dates the Persian Empire's end broadly, not Judea."
  - "Silverman, Bible Odyssey “The Persian Period” (registry silverman-bo-persian-period): Persian control of the Levant to “Darius III’s defeat by Alexander III “the Great” (334–330 BCE)”. A range for Darius's defeat; already in cyrus-babylon's note; not needed."
  - "Rhyder, Bible Odyssey: “During the Hellenistic period (ca. 323–31 BCE)”. Hedged."
  - "HarperCollins (Bible Odyssey): “Persia” (“ca. 330 BCE”, hedged); “Alexandria” (“Founded in 332 BCE”, dates the city); “Tyre” (“late fourth century BCE”); “Seleucids” (no year)."
  - "Eastman, Bible Odyssey “Alexandria”: conquest of Egypt “(331 B.C.E.)”; Lenzi, Bible Odyssey “Babylon”: took Babylon “in 331 B.C.E.”. Other places; not needed."
  - "Hayes, RLST 145 lecture 23 (2006): Macedonian Greece “conquered the Ancient Near East in the 330's”. Decade only."
  - "Martin, RLST 152 lecture 3 (2009): Granicus 334, died 323 in Babylon; same paragraph says “Darius II” for Darius III. Not needed."
  - "Ehrman, Brief Introduction to the NT 5e ch. 2 and 3 summaries: “Alexander the Great (356–323 BCE)”; Romans conquered Israel in 63 BCE. Not needed."
  - "Bugh (ed.), Cambridge Companion to the Hellenistic World (2006) introduction: Alexander “(d. 323)”; most scholars end the period with Kleopatra's death in 30 b.c. Not needed; Austin carries the 30 BC end."
  - "Posen Library (Bakhos, 2025), “Hellenistic Conquest of the Levant”: Issus 333, then most of Syria fell; Tyre and Gaza “besieged and overtaken within months”; no year for Judea. “The Hellenistic Period in History and Memory”: “conquest of the Persian Empire in 331 BCE”. Not needed."
