  - "Magness, The Archaeology of the Holy Land (2012), ch. 4 “The Early Hellenistic Period (332–167 B.C.E.)”: Cambridge Core summary only; not read."
  - "Kee et al., Cambridge Companion to the Bible 2nd ed. (2007), “Jewish Responses to Greek and Roman Cultures, 322 b.c.e. to 200 c.e.”: Cambridge Core summary only (“A year later he took Egypt as well as the Mediterranean coast, and Jerusalem ... submitted”); not read."
  - "Hengel, Cambridge History of Judaism vol. 2 ch. 2, “Alexander's campaign and Palestine (333–331 b.c.e.)”: summary only; 1990 print."
  - "Meyers and Chancey, Alexander to Constantine (Yale 2012); Shipley, The Greek World after Alexander 323–30 BC (2000): cited in other works; not read."
  - "Met Heilbrunn essays, Oxford Classical Dictionary, Smarthistory, Britannica: blocked (429/403); not read."
uncited:
