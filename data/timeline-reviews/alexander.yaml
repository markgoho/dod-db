  - "Encyclopaedia Judaica “Alexander the Great” (Schalit) and “Hellenism” (Momigliano, 323–30 b.c.e.): 1971 text; outside the window."
  - "Griffiths, Encyclopedia of Religion “Hellenistic Religions” (1987): early phase began “with the conquests of Alexander the Great in 334 bce”. Outside the window."
