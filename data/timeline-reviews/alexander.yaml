# Review record for the Timeline Entry `alexander` (/timeline/#alexander; #93 shape). Not rendered.
# Issue #193 (from #108), “Timeline Entry: Alexander and the start of the Hellenistic period”. Issue notes: date Alexander's conquest of the Levant; the period's span goes in the note; critical side only.
# Sourcing test, 2026-11-26: met. Two Scholarly sources inside the 30-year window date the conquest outright to 332 BCE: Honigman 2021 (“Alexander’s conquest of the region in 332 BCE”, the region being Judea: the volume and conference are on Judea) and Henze and Werline 2020, Chronology (“332 Greek rule under Alexander begins”, beside “539 Persian rule of Judea begins”). A Reference source agrees (Bible Odyssey Second Temple timeline: Persians 538–332, Hellenistic kingdoms 332–63). Kind: event. No Tradition Date: every Trigger Claim states: critical. No setting (event entry).
# Wording (CONTEXT.md: worded for what its sources date): the issue asks for the Levant; the 332 sources date the conquest of Judea (Honigman's “the region”) and Greek rule in a chronology of Judea, so the title says Judea. Newman (Bible Odyssey) puts the Levant march after Issus 333 with no year of its own; it is in the note, not the display.
# Split (#99): the Hellenistic period's bounds differ by source. Bible Odyssey's timeline gives 332–63 BCE (Jewish life under the Hellenistic kingdoms, then Roman rule); Austin 2006 gives the period “as conventionally understood” from the invasion (334–323 BC) to the Roman take-over, “not complete till 30 BC”. Both are in the note, each attributed. Other bounds read and not cited: Rhyder (Bible Odyssey, “ca. 323–31 BCE”, hedged); Bugh 2006 (Alexander to Kleopatra, “30 b.c.”); Seeman 2020 (conquest “334–324 BCE”); Bible Odyssey Persian Empire map and the timeline's own Daniel entry (333). The Levant conquest year itself: no source read gives another year (Issus 333 is a battle date; Posen 333 then “within months”; Eastman and Lenzi give 331 for Egypt and Babylon).
# Trigger Claims (#99: one to three): E187 00:55:43 (issue lead: 332, Hellenistic period 332 to 63 BCE; hedge kept inside the quote: “drinks himself to death or something like that”; the turn compresses 332 with the march to Babylon and his death), E71 00:52:25 (“in the late 300s BCE”), E11 00:07:34 (death “around 323 BCE”; the hedge “around” is kept in the quote). Not kept: E187 00:53:37 (already a Trigger Claim of cyrus-babylon; dates the Persian period's end, and Alexander is named only in the 00:54:01 reply); E187 00:57:12 (Job; 332 as the Persian period's end); E115 00:52:56 (“down until around the, the second half of the fourth century BCE”, hedged, dates the Persian overthrow); E62 00:09:10 and E123 00:39:19 (no year for Alexander).
# Dropped: the exact day of Alexander's death (Bugh “June 11, 323”; other pages June 10 or 13) and the months of Tyre and Gaza (only an unsigned Warwick chronology and a Durham MA thesis give them). Out of scope.
# agent: the first pass (2026-11-26). Two research agents (registry families; new open sources) fetched every page by curl into separate scratch folders, HTML stripped, entities decoded, pdftotext for PDFs (-layout for the Henze and Werline chronology, whose columns pair year and event). Britannica, Met Heilbrunn (429), Oxford Classical Dictionary (403), Smarthistory (403) not read. Every cited quote script-matched by the lead agent against the saved text (NFKC, whitespace, quotes, dashes, soft hyphens, entities normalised): 6/6, zero misses, each found once. Trigger Claims matched by script as normalised substrings of their Transcript lines at timestamp and speaker: 3/3.
# owner: empty (""). The owner delegated the publish review (#93; extended to the Timeline, #110, 2026-11-23); a `delegation` block is added when the independent second agent pass has run.
# Flags for the second pass: (1) Honigman's year: 2021 is from the volume's publication (the sample PDF carries 2020/2021 file dates, not a printed year); confirm. (2) Austin: the excerpt confirms a second edition (“When the first edition…”); 2006 is from the ISBN, not printed in the excerpt; confirm. Austin's work is a sourcebook; the cited sentence is the editor's own introduction. (3) Henze and Werline Chronology: the editors' table; row 332 does not name Judea itself (the 539 row does). Enough for “Alexander conquers Judea”? (4) Bible Odyssey timeline: the intro text is served by the embedded Tiki-Toki timeline (https://www.tiki-toki.com/timeline/embed/53310/6300800090/), not in the gallery page's HTML; registry URL is the gallery page. Unsigned (author line “Bible Odyssey”); its Issus entry (“in 333 B.C.E., allowing Alexander to take control of Syria, Palestine (including Judea), and Egypt”) could be read as dating control of Judea to 333: is that a split to show? (5) Newman opening gives his life span (356–323 BCE), used for “He died in 323 BCE.”. (6) Note says “went down the coast of the Levant” for Newman's “plunged down the coast of the Levant”.
