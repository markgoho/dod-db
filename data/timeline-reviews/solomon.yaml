# Review record for the Timeline Entry `solomon` (/timeline/#solomon; #93 shape). Not rendered.
# Issue #274, “Timeline Entry: split Reigns of David and Solomon into David and Solomon”. Issue notes: the published `david-and-solomon` row held two subjects against CONTEXT.md's “One subject on the Timeline”; the owner kept that id for David (#219) and Solomon gets this entry. Run the sourcing test for Solomon alone: `critical` only if a Scholarly or Reference source dates him outright, else `undated`; tradition only if a Trigger Claim states it.
# Trigger Claims: E139 00:54:50 (“certainly plausible that there was a historical Solomon”; the turn before opens “The scholars are a bit divided on that”, and at 00:55:59 “Rehoboam, Jeroboam, more likely probably, I think, than Solomon to be historical”); E154 00:04:07 (critical scholars who would say there probably was a Solomon; the same turn goes on “And there are other scholars who will say, ‘No, there was never any historical Saul, Solomon, or David.’ So we're a little split”). E133 00:35:57 (“traditionally to Saul and David and Solomon”) states the tradition's side; it is also on `david-and-solomon`. #99: the show gives no date for Solomon in these claims, only verdicts; no contradiction to resolve.
# Sourcing test, 2026-11-28: met. HarperCollins (Reference) dates Solomon's reign to “the second third of the tenth century BCE” and Malena (Bible Odyssey, Reference) to the “mid-tenth century BCE”, both in their own voice. Display is the umbrella “10th century BCE”, `from: -1000`, `precision: century`, as on `david-and-solomon`. Historicity is shown in the note, by name: EJ reports the split (some scholars despair of recovering the historical Solomon, others question his existence); Finkelstein accepts him; Sergi casts doubt on the narrative of the united-monarchy reigns. The note says no more than each source.
# Dropped as conditional or attributed (conditional-not-critical): Coogan and Chapman ch. 15 (“some likelihood that there was a historical Solomon who reigned from approximately 968 to 928 BCE”: hedge governs the date); Bowker's years (“According to the biblical account … c.967–c.928”); Mazar pp. 117, 122 (“supposed time”; “attributed to David and Solomon in traditional historical reconstructions”); Cline (“the traditional chronology”). All under `uncited`.
# agent: the first pass (2026-11-28). Research agent fetched each source into its own scratch folder; quotes script-matched against the saved text (whitespace, quotes, dashes, entities, soft and line-break hyphens normalised): 6 hits, 0 misses. Pages from the PDF running heads (Quest: printed = PDF − 11; Sergi: printed = PDF − 22). Trigger Claims matched by script as substrings of their Transcript lines: 3 hits.
# owner: empty (""). The owner delegated the publish review (#93; extended to the Timeline, #110, 2026-11-23); a `delegation` block is added when the independent second agent pass has run.
# Flags for the second pass: (1) Malena's date sits in a parenthetical inside a concessive clause (“Despite the challenging fact that we do not have any evidence of Solomon from his own day (mid-tenth century BCE)”); taken as flat and her own. (2) HarperCollins's “forty years” is the Bible's figure; the century is the dictionary's own. (3) EJ: year and edition from the page's byline “(2nd ed.)”; the 2nd edition is 2007 (Macmillan Reference USA) but the page doesn't print it, so `year: null`, as for other EJ entries. (4) Sergi p. 9 is on the narrative of the reigns over the united monarchy, not on Solomon's existence; the note keeps that scope. (5) Tradition 971–931 against the century's middle: under 30 years apart, so it stays beside the entry (#214).
