uncited:
  - "Encyclopedia of Religion (Van Seters), “Solomon”: “third king of Israel and Judah (c. 960–920 bce)”. Flat exact years; not needed beside the century display, and New Catholic Encyclopedia gives c. 961–922, so citing either would need a split."
  - "New Catholic Encyclopedia, “Solomon”: “Son and successor of david as king (c. 961-922 b.c.)”. Edition unclear (bibliography to 1965)."
  - "Hayes l14 ch. 3: “So, when Solomon died in 922 …”. End year only; Hayes calls the years approximate."
  - "EJ “Solomon” opening: “tenth century b.c.e.”. Flat, but the Hebrew in the same parenthesis is garbled in the page text; HarperCollins and Malena carry the date."
  - "Coogan and Chapman, OUP ch. 15 summary: “there is some likelihood that there was a historical Solomon who reigned from approximately 968 to 928 BCE”. Hedge governs the date (as ch. 14 was cut on `david-and-solomon`)."
  - "Bowker, Concise Oxford Dictionary of World Religions, “Solomon”: “According to the biblical account … he reigned c.967–c.928 BCE”. The Bible's date."
  - "Mazar 2007, p. 117: “the supposed time of David and Solomon”; p. 122: “the time frame attributed to David and Solomon in traditional historical reconstructions”. Marked or attributed by the author."
  - "Mazar 2007, p. 129: “a power base for local rulers like David and Solomon”. Accepts them as local rulers; the note uses EJ, Finkelstein and Sergi for historicity."
  - "Cline 2009, Bible and Interpretation: “the traditional chronology—which places the dates of the reigns of David and Solomon in the tenth century BCE” and “It is fair to say that they most likely did”. Attributed date; verdict not needed beside EJ."
  - "Schmidt 2007, p. 101: “While Finkelstein upholds the historicity of David and Solomon …”. Finkelstein p. 108 cited directly instead."
  - "Sergi 2023, pp. 3–4: some scholars argued Saul, David and Solomon “were fictional characters in a legendary narrative composed no earlier than the Hellenistic period”; p. 250 n. 1: the days of Solomon “reflect a late Iron Age reality”. Reports of others' views; p. 9 is Sergi's own."
  - "Encyclopedia of World Biography, “Solomon”: “reigned ca. 965-ca. 925 B.C.”. Bibliography to 1958; low value."
  - "EJ “Solomon”, biblical section, paragraph under “The Kingdom of Solomon”: “Solomon reigned jointly with his father apparently from 967 to 965 b.c.e. and on his own from 965 to 928 b.c.e.”. Hedged by “apparently”; not needed beside the century display (second pass 2026-11-28)."
