# Review record for the Timeline Entry `solomon` (/timeline/#solomon; #93 shape). Not rendered.
# Issue #274, “Timeline Entry: split Reigns of David and Solomon into David and Solomon”. Issue notes: the published `david-and-solomon` row held two subjects against CONTEXT.md's “One subject on the Timeline”; the owner kept that id for David (#219) and Solomon gets this entry. Run the sourcing test for Solomon alone: `critical` only if a Scholarly or Reference source dates him outright, else `undated`; tradition only if a Trigger Claim states it.
# Trigger Claims: E139 00:54:50 (“certainly plausible that there was a historical Solomon”; the turn before opens “The scholars are a bit divided on that”, and at 00:55:59 “Rehoboam, Jeroboam, more likely probably, I think, than Solomon to be historical”); E154 00:04:07 (critical scholars who would say there probably was a Solomon; the same turn goes on “And there are other scholars who will say, ‘No, there was never any historical Saul, Solomon, or David.’ So we're a little split”). E133 00:35:57 (“traditionally to Saul and David and Solomon”) states the tradition's side; it is also on `david-and-solomon`. #99: the show gives no date for Solomon in these claims, only verdicts; no contradiction to resolve.
# Sourcing test, 2026-11-28: met. HarperCollins (Reference) dates Solomon's reign to “the second third of the tenth century BCE” and Malena (Bible Odyssey, Reference) to the “mid-tenth century BCE”, both in their own voice. Display is the umbrella “10th century BCE”, `from: -1000`, `precision: century`, as on `david-and-solomon`. Historicity is shown in the note, by name: EJ reports the split (some scholars despair of recovering the historical Solomon, others question his existence); Finkelstein accepts him; Sergi casts doubt on the narrative of the united-monarchy reigns. The note says no more than each source.
# Dropped as conditional or attributed (conditional-not-critical): Coogan and Chapman ch. 15 (“some likelihood that there was a historical Solomon who reigned from approximately 968 to 928 BCE”: hedge governs the date); Bowker's years (“According to the biblical account … c.967–c.928”); Mazar pp. 117, 122 (“supposed time”; “attributed to David and Solomon in traditional historical reconstructions”); Cline (“the traditional chronology”). All under `uncited`.
# agent: the first pass (2026-11-28). Research agent fetched each source into its own scratch folder; quotes script-matched against the saved text (whitespace, quotes, dashes, entities, soft and line-break hyphens normalised): 6 hits, 0 misses. Pages from the PDF running heads (Quest: printed = PDF − 11; Sergi: printed = PDF − 22). Trigger Claims matched by script as substrings of their Transcript lines: 3 hits.
# owner: empty (""). The owner delegated the publish review (#93; extended to the Timeline, #110, 2026-11-23); a `delegation` block is added when the independent second agent pass has run.
# Flags for the second pass: (1) Malena's date sits in a parenthetical inside a concessive clause (“Despite the challenging fact that we do not have any evidence of Solomon from his own day (mid-tenth century BCE)”); taken as flat and her own. (2) HarperCollins's “forty years” is the Bible's figure; the century is the dictionary's own. (3) EJ: year and edition from the page's byline “(2nd ed.)”; the 2nd edition is 2007 (Macmillan Reference USA) but the page doesn't print it, so `year: null`, as for other EJ entries. (4) Sergi p. 9 is on the narrative of the reigns over the united monarchy, not on Solomon's existence; the note keeps that scope. (5) Tradition 971–931 against the century's middle: under 30 years apart, so it stays beside the entry (#214).
# Independent second agent pass 2026-11-28 (#93 delegation, #110; a fresh agent that didn't build the entry, never reading the first pass's files): every source re-fetched from its URL into its own folder (Bible Odyssey /dictionary/solomon/ and /articles/solomon/; Encyclopedia.com EJ “Solomon”; Got Questions kings page and About page; SBL ICI PDFs FinkelsteinMazar.pdf and 9781628373431_txt.pdf via pdftotext, page by page). All six quotes re-matched by script (whitespace, quotes, dashes, entities, inline tags, space before punctuation, soft and line-break hyphens normalised): 6 hits, 0 misses, each at its locator. Page offsets re-derived from running heads: Quest PDF p. 119 head “108 / The Quest for the Historical Israel” (printed = PDF − 11); Sergi PDF p. 31 head “1. The Early Israelite Monarchy 9” (printed = PDF − 22). All three Trigger Claims re-matched by script (timestamp, speaker, verbatim substring of the line), about two minutes either side read: 3 hits. Holder re-checked against the registry and the About page (“Christian, evangelical, theologically conservative, and nondenominational”). Recency (#80): EJ's state-of-the-field sentence is 2nd-edition text (it refers to the time “since the appearance of the first edition”), so inside the 30-year window though `year: null`.
# Second pass changed: (a) EJ locator (critical/3) now names the subheading: “biblical section, under “The Kingdom of Solomon”, paragraph beginning …” (an h2 on the page); quote and note unchanged. (b) `uncited` gains EJ's own years from the same paragraph (“apparently from 967 to 965 … 965 to 928 b.c.e.”), missed by the first pass. Title, display, `from`, `precision`, note, tradition and holder unchanged: each note clause says no more than its source (HarperCollins “second third of the tenth century”; Malena “mid-tenth century” and “we do not have any evidence of Solomon from his own day”; EJ's “Some scholars despair … others call his very existence into question”, a report of others; Finkelstein's “I contend”; Sergi's doubt is on the narrative of the reigns, and the note narrows his “Saul, David, and Solomon” to “their”). No citation cut.
# First-pass flags resolved: (1) Malena kept: the concessive clause hedges the evidence, not the date; “(mid-tenth century BCE)” is her own, unhedged gloss on “his own day”, the Finkelstein/Sergi subordinate-phrase case on `david-and-solomon`, not the Coogan case (where “it is likely that” governed the date). HarperCollins alone meets the sourcing test either way. (2) HarperCollins: “forty years” is the Bible's figure, the century is the dictionary's own; kept. (3) EJ `year: null` kept, as for the other EJ ids. (4) Sergi scope kept; the quote ends its paragraph (next line indented, “In this context”). (5) Tradition middle 951 BCE vs critical century's middle 950 BCE: under 30 years, stays beside the entry (#214).
# Flags for publish: (1) No critical-side Trigger Claim gives a date: E139 and E154 are verdicts on Solomon's historicity (#99's “datable verdict on the row's subject”); unlike `david-and-solomon` (E181), there is no dated claim to fall back on if #99 is read narrowly. (2) `solomon` and `david-and-solomon` now share display “10th century BCE” and `from: -1000`, so the two cards sit at the same point on the axis; check the /timeline/ preview. (3) At publish, `sourcesRead` and `review:` must both be 2026-11-28 to match `delegation.secondPass` (#135); check:timeline skips the publish gate for a draft, so this file's keys were checked by script against the entry (critical/1–5, tradition/1, the three trigger keys, the five TIMELINE_RULES, the six cited source ids). (4) Display is flat while the note shows a historicity split (EJ, Sergi); same shape as the published David entry.
# Publish resolutions, 2026-11-28: (1) E139 and E154 kept as datable verdicts on the row's subject (#99), as E64 is on `david-and-solomon`; the entry rule needs one Trigger Claim and one Scholarly or Reference source, both met. (2) Shared “10th century BCE”/`from: -1000` with `david-and-solomon` checked in the /timeline/ preview (below). (3) `sourcesRead` and `review:` set to 2026-11-28. (4) Flat century kept: HarperCollins and Malena date it in their own voice; the note carries the historicity split by name. Display-level historicity is #275's scope.
# Historicity (#275) second pass 2026-11-28 (independent agent, #93 delegation, #110): historicity/1–4 checked by script identical (source, locator, quote) to critical/2–5; not re-fetched, since critical/2–5 were re-matched in this file's #110 second pass the same day. Statement edited: its first sentence gave Finkelstein Malena's claims (“lies behind the legend”, no evidence from his own day); now the historical core and the no-evidence clause are Malena's, and Finkelstein has only his “I contend that David and Solomon are historical figures”; Sergi's “the historicity of” the narrative restored. Point `debated` kept: no cite says “debated” in so many words; it rests on the EJ's report of the split (some despair of recovering him, others question his existence), with Malena and Finkelstein on one side and Sergi on the other. delegation.secondPass and sourcesRead untouched.
