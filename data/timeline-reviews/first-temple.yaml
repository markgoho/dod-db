# Review record for the Timeline Entry `first-temple` (/timeline/#first-temple; #93 shape). Not rendered.
# Issue #278, “Timeline Entry: The First Temple built”. Issue notes: gap beside `fall-of-jerusalem`, `second-temple`, `temple-destruction`; `solomon` doesn't mention the temple. Critical first; a Tradition Date only if a Trigger Claim states the tradition's side; keep consistent with `solomon` (10th century BCE) and `fall-of-jerusalem`. The issue's “expect … ʿAin Dara” notes were recall, not sources; not relied on.
# Trigger Claims: E2 00:35:31 (Stavrakopoulou: “you can't go digging up the Temple Mount to find the remains of the First Temple, you know, the Solomon's Temple.”; the transcript has no milliseconds, stored as .000). E176 00:39:17.920 (McClellan: “Solomon builds the temple”), inside a sketch of Zion's history from 2 Samuel 5 onward. Neither gives a date; both are critical-side statements on the subject. No tradition-side claim: the dating-claims inventory (line 227) says “No traditional date is stated … for Solomon's Temple”, and a grep of every final Transcript found none. #99: no show date to contradict.
# Not used as Trigger Claims: E87 00:37:34 (“That was Jerusalem before, like, the temple was built”; relative aside on the City of David); E43 00:13:58 (the First Temple's destruction in 587, which is `fall-of-jerusalem`'s subject); E88, E102, E103 (temples of the First Temple period at Arad and Tel Motza, not this building); E102 00:50:34 (“we ought to do a show on the First Temple”, no claim).
# Sourcing test, 2026-11-28: met. Britannica (Reference) dates the completion in its own voice: “completed in 957 BCE”. Title and display are for completion, as on `second-temple` (“Second Temple completed”, 515 BCE). The note carries the evidence by name: Pioske (Bible Odyssey, Reference) says no trace has been unearthed and the Temple Mount can't be excavated; Mazar (Scholarly) has no doubt a temple stood before the Babylonian conquest, doubts Solomon's kingdom could afford the buildings described, and does not exclude a tenth-century founding; NABRE's note on 1 Kgs 6:1 calls the Bible's figures schematic and advises caution. 957 sits inside `solomon`'s “10th century BCE”.
# Dropped as attributed or hedged (conditional-not-critical): Pioske's “According to the Bible … (ca. 950 BCE)”; EJ Grintz and Yadin's regnal years (the Bible's 4th–11th years, and EJ 1st-edition text without a “(2nd ed.)” marker, outside #80's window); HarperCollins “Temple, The” “(tenth century BCE)” (glosses the monarchy, in a sentence spanning to 70 CE: critical-scope); Solomon reign dates (EJ “apparently”, Coogan ch. 15 “some likelihood”, Hayes's 922 death year). All under `uncited`.
# agent: the first pass (2026-11-28). Research agent fetched each source into its own scratch folder by curl; Britannica refused curl (403) and was read in Claude in Chrome (page text saved), as on `second-temple`. Quotes script-matched against the saved text (whitespace, quotes, dashes, entities, soft and line-break hyphens normalised): 7 hits, 0 misses. Mazar pages are printed pages (PDF = printed + 11). Trigger Claims matched by script as substrings of their Transcript lines: 2 hits.
# owner: empty (""). The owner delegated the publish review (#93; extended to the Timeline, #110, 2026-11-23); a `delegation` block is added when the independent second agent pass has run.
# Flags for the second pass: (1) Britannica's 957 is a conventional date that ultimately rests on the biblical chronology (cf. NABRE's caution), but Britannica states it flat, unattributed; check that reading. (2) Neither Trigger Claim dates the temple: E2 is an evidence claim, E176 a narrative-sequence statement; check `states: critical` for E176, which may read as a retelling of the biblical story rather than the speaker's own claim. (3) split-shown: no source gives a competing date; Mazar's doubt is on the kingdom's means, not a different year, so the display stays single and the note names the doubt. (4) Display is flat while the note shows doubt, the same shape as `solomon` (#275's scope). (5) `pioske-bo-first-temple` and `nabre-1-kings-6-notes` are new ids; `nabre-1-kings-6-notes` read by curl from the live USCCB page (other NABRE ids note it refuses scripted requests; this one didn't).
