uncited:
  - "Pioske, Bible Odyssey “First Temple”: “According to the Bible (1Kgs 6:37-38, 2Chr 3:2), Solomon built the First Temple between the fourth and eleventh years of his reign (ca. 950 BCE)”. Attributed to the Bible."
  - "Pioske: “The First Temple would have stood alongside the royal palace in Jerusalem for nearly four hundred years.” Duration, hedged."
  - "EJ “Temple: First Temple, History” (Grintz): “The work was begun in the month of Iyyar in the fourth year of Solomon's reign and was completed in the 11th year of his reign in the month of Bul”. The Bible's regnal years (1 Kgs 6:1, 38), no absolute date; 1st-edition text, outside #80's window."
  - "EJ “Temple: First Temple, Structure” (Yadin): “erected on Mt. Moriah in Jerusalem between the fourth and the 11th years of Solomon's reign”. Same reasons; also the Arad and Tell Tainet parallels."
  - "HarperCollins “Temple, The”: “beginning with the monarchy (tenth century BCE) and continuing until its final destruction by the Roman legions in 70 CE”. The century glosses the monarchy; the sentence covers both temples (critical-scope)."
  - "HarperCollins “Temple, The”: “The First Temple, built under Solomon”; “Solomon”: “an extensive building program that included an elaborate palace complex and a temple”; “Jerusalem”: “constructing a Temple north of the City of David”. Undated; Britannica carries the reign."
  - "EJ “Solomon”: “Solomon reigned jointly with his father apparently from 967 to 965 b.c.e. and on his own from 965 to 928 b.c.e.” Reign, hedged; also the ʿAin Dara parallel (“contemporary with it”), hedged by “apparently”."
  - "Coogan and Chapman ch. 15 summary: “there is some likelihood that there was a historical Solomon who reigned from approximately 968 to 928 BCE”. Reign, hedged."
  - "Hayes l14: “So, when Solomon died in 922”. Reign end only."
  - "Mazar 2007, p. 127: “The temple and palace that Solomon supposedly built should be found, if anywhere, below the present Temple Mount, where no excavations are possible”. Hedged (“supposedly”); Pioske carries the no-excavation point."
  - "Mazar 2007, pp. 128–129: the tripartite plan has close parallels at Tell Tayinat and ʿAin Dara, unknown after the eighth century, so the description “could not have been an invention of the seventh century or later”. Not needed beside p. 128's existence statement."
  - "Finkelstein 2007, pp. 112–113: Jerusalem has “failed to reveal evidence for any meaningful tenth century building activity”; tenth-century Jerusalem “no more than a small, remote highlands village”. On Jerusalem, not the temple, which lies under the unexcavated Temple Mount; `solomon` carries the historicity debate."
  - "Eskenazi, Bible Odyssey: “The Jerusalem temple said to have been built by Solomon was destroyed in 587/586 B.C.E.” Attributed; destruction is `fall-of-jerusalem`."
