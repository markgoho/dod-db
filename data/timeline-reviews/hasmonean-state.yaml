# Review record for the Timeline Entry `hasmonean-state` (/timeline/#hasmonean-state; #93 shape). Not rendered.
# Issue #236 (from #108), “Timeline Entry: The Hasmonean kingdom”. Issue notes: the show gives three start dates (165 E71, 160 E123, 141 E158), so use the sourced value and show the disagreeing Trigger Claims per #99; the end, 63 BCE, must agree with `alexander` (Hellenistic kingdoms to 63 BCE, Roman rule from 63); the Maccabean revolt entry (`maccabean-revolt`) precedes it, so don't double-date the revolt; Torah as public, enforced law in the Hasmonean period (E126 00:08:14, Adler) is a separate claim, kept out. Lead-agent brief: no seeAlso or anchor to #237 (death of Herod).
# Id `hasmonean-state`; title “The independent Hasmonean state”, worded for what the sources date: Judea's independence from the Seleucids to Pompey. Not “kingdom”: Henze and Werline (row 104–103) and Stern (EJ) make Aristobulus I the first Hasmonean king, so a “kingdom” from 143–129 is wider than the sources. The end is independence, not the dynasty: Stern runs Hasmonean rule to Antigonus's death in 37 BCE (in the note).
# Sourcing test, 2026-11-27: met. No source read dates the span in one breath (Henze and Werline body, Magness 2012 intro and Kee 2007 summary searched; none gives a Hasmonean period), so the display joins sourced start and end. Start, each source attaching its year to independence itself: Stern, EJ “Hasmoneans” (Reference; “In 143–142 b.c.e., Demetrius ii recognized the independence of Judea”), Levine 1999 (Reference; Simon “declared his independence from Seleucid rule” in 141), Henze and Werline 2020 Chronology (Scholarly, in window; “129 Judea becomes independent”). Sources differ, so #99: all three shown, each cited; EJ's “143–142” is a dual form, shown as given. End, unanimous: 63 BCE (Henze and Werline row 63; Britannica “Palestine”; Bible Odyssey Second Temple timeline; Stern's “Pompey's annexation” sentence, no year). Kind: event. No Tradition Date: every Trigger Claim states critical. No setting (event entry). No anchor, no seeAlso.
# Milestones, not display sides (they date something other than independence): NABRE note to 1 Mc 13:41 (year 170 = March 142 to April 141 B.C., the verse's “yoke of the Gentiles was removed”: the claim is the verse's, the note only converts the year); Britannica “Palestine” 142–141 (Akra and the decree for Simon); Henze and Werline 140 (Simon high priest, commander, ethnarch) and 198–142 (Seleucid rule of Judea; noted beside their 129). All in the note, attributed.
# Consistency: `alexander` (Hellenistic kingdoms 332–63, Roman rule from 63, Bible Odyssey) agrees with this entry's 63; the same Bible Odyssey intro is cited here. `maccabean-revolt` (167 desecration, 164 rededication): not restated; that review left every Hasmonean-kingdom date for #236. `daniel`, `temple-destruction` untouched. Herod (37 king, 4 BCE death) kept out except Antigonus's 37 as the end of Hasmonean rule.
# Trigger Claims (#99: one to three; shown verbatim, disagreeing with each other and with the display): E158 00:18:34 (141 to 63, Pompey annexes Judea), E123 00:42:45 (“160 BCE to around 63 BCE”, hedge kept), E71 00:54:06 (“until like 165 BCE”, hedge kept; “marginally autonomous independent kingdom”). Not kept: E158 00:17:18 (“a high priest appointed in 141 BCE who institutes the Hasmonean Kingdom”, hedged “I want to say”; E158 00:18:34 states the span), E158 00:22:25 (Seleucids annexed 64 BCE), E112 00:02:19 (“middle of the 2nd century BCE”, no year), E112 00:08:08 (2 Maccabees' composition), E118 00:12:15 (63 BCE annexation, about modern Israel), E187 00:55:43 and 00:59:31 (Hellenistic period 332–63; “160s, 150s”), E123 00:40:24 and 00:41:37 (no start year).
# agent: the first pass (2026-11-27), lead agent alone (one side: critical). Saved into scratchpad/hasm-p1: Henze and Werline PDF (curl; pdftotext -layout and plain), Levine at cojs.org (curl, HTML stripped), EJ “Hasmoneans” at Encyclopedia.com (curl, HTML stripped; Hebrew and Greek characters come out as “?”, none quoted), Bible Odyssey Tiki-Toki embed (curl), Magness 2012 excerpt PDF (curl; no Hasmonean dates), Kee 2007 summary (curl; none). In Claude in Chrome, page innerText saved verbatim for the cited paragraphs with their headings: Britannica “Palestine” section “The Hasmonean priest-princes”, Britannica “Hasmonean dynasty” opening paragraph, USCCB 1 Maccabees 13 (vv. 41–42, notes 13:41, 13:51) and 14 (notes 14:16, 14:27, 14:47). Every cited quote script-matched against the saved text (NFKC, entities, whitespace, curly quotes, dashes, ellipsis normalised): 14/14 found. Trigger Claims matched by script as substrings of the only turn at that timestamp and speaker in each final Transcript (episode per processed-videos.json): 3/3.
# owner: empty (""). The owner delegated the publish review (#93; extended to the Timeline, #110, 2026-11-23); a `delegation` block is added when the independent second agent pass has run.
# Flags for the second pass: (1) Display “143–142, 141 or 129 to 63 BCE”: three start sides plus a shared end; is “to” clear, and is each side a date for independence in its own source? (2) Henze and Werline 129 sits beside their own “198–142 Seleucids rule Judea”: is 129 fairly their start date for independence (their row says “Judea becomes independent”)? (3) Stern's EJ text is the first edition's (Menahem Stern) carried into the 2nd ed. (2007); the registry leaves year null as for the other EJ entries; in window? (4) Levine 1999 is Reference (BAS, popular venue; class ruled on `maccabean-revolt`); 27 years, in window. (5) critical/13 (Stern, “was the first Hasmonean to arrogate to himself the title of king”) has no subject or year in the quote; the note's “Aristobulus I (104–103 BCE)” rests on Henze and Werline row 104–103 and the same EJ sentence. (6) The note's “ending the Hasmonean state's independence” joins Henze and Werline row 63 with Stern's undated sentence. (7) Bible Odyssey quote is from the timeline introduction (embed meta description), as on `alexander`.
