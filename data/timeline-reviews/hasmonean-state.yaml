leads: []
uncited:
  - "Britannica “Hasmonean dynasty” (opening paragraph): Simon succeeded Jonathan “In 143 (or 142) BCE” and “soon became independent of the Seleucids as high priest, ruler, and ethnarch of Judaea”; accession, and independence without a year. Agrees; Britannica “Palestine” carries the cited milestones."
  - "Britannica “Palestine”, first paragraph of “The Hasmonean priest-princes”: Jonathan 161/160–143/142, Simon 143/142–134, Jonathan high priest in 153, Simon's exemption from taxation from Demetrius II. Accession dates, not independence."
  - "Bible Odyssey timeline item “Simon the Hasmonean (142-134 B.C.E.)”: “a certain degree of political independence for Judea, despite the continued presence of Seleucid rule”; “In 141 B.C.E., Simon expelled Seleucid forces from Jerusalem.” Hedged; no year for independence."
  - "Bible Odyssey timeline item “Pompey invades Palestine” (63 B.C.E.): Pompey “took control of Jerusalem, marking the beginning of Roman rule in Judea”. Agrees; the quote itself has no year (the item's date field does); the introduction (critical/6) carries 63. Second pass: the introduction is cut to uncited too (below); the 63 rests on Henze and Werline and Britannica."
  - "NABRE notes to 1 Mc 13:51 (“June 3, 141 B.C.”, the Akra's capture), 14:16 (embassy “probably in 142 B.C.”), 14:27 (“September 13, 140 B.C.”, the decree for Simon) and 14:47 (“Ethnarch: a subordinate ruler over an ethnic group whose office needed confirmation by a higher authority within the empire.”). Milestones carried by other cites; 14:47 qualifies “ethnarch” but dates nothing."
  - "Levine: the Akra “was conquered only in 141, after Simon the Hasmonean rose to power”; Jonathan “was killed in 143 B.C.E.”; his section heading “4. 152–141 B.C.E.” (Hasmonean ascendancy culminating in an independent state). Agrees; critical/2 carries 141."
