# Flags for the second pass: (1) Display “143–142, 141 or 129 to 63 BCE”: three start sides plus a shared end; is “to” clear, and is each side a date for independence in its own source? (2) Henze and Werline 129 sits beside their own “198–142 Seleucids rule Judea”: is 129 fairly their start date for independence (their row says “Judea becomes independent”)? (3) Stern's EJ text is the first edition's (Menahem Stern) carried into the 2nd ed. (2007); the registry leaves year null as for the other EJ entries; in window? (4) Levine 1999 is Reference (BAS, popular venue; class ruled on `maccabean-revolt`); 27 years, in window. (5) critical/13 (Stern, “was the first Hasmonean to arrogate to himself the title of king”) has no subject or year in the quote; the note's “Aristobulus I (104–103 BCE)” rests on Henze and Werline row 104–103 and the same EJ sentence. (6) The note's “ending the Hasmonean state's independence” joins Henze and Werline row 63 with Stern's undated sentence. (7) Bible Odyssey quote is from the timeline introduction (embed meta description), as on `alexander`.
# Independent second agent pass 2026-11-27 (#93 delegation, #110): a fresh agent that did not build the entry, working from its own scratch folder only (scratchpad/hasm-p2; never read hasm-p1). By curl from the registry URLs: Henze and Werline PDF (pdftotext -layout and plain), Levine at cojs.org and EJ “Hasmoneans” at Encyclopedia.com (HTML stripped by a script), the Bible Odyssey gallery page and from it the Tiki-Toki embed (tiki-toki.com/timeline/embed/53310/6300800090/). In Claude in Chrome (own tab, closed after): Britannica “Palestine” section “The Hasmonean priest-princes” (cited paragraphs transcribed from the page's innerText; the agent's transcription of tool output, as on `maccabean-revolt`) and USCCB 1 Maccabees 13 (get_page_text; vv. 41–42 and notes 13:41, 13:51 transcribed). Quotes re-matched by script restricted to each locator (Henze and Werline rows: year and text on one line between “Chronology / BCE” and “-xi-”; Stern: the named block; Levine: the named paragraph; Britannica: the named paragraph; NABRE: the 13:41 note; Bible Odyssey: the embed's meta description), normalising NFKC, entities, whitespace, curly quotes and dashes: 13/14 at locator, then 14/14 after fixing critical/14's locator (the quote crosses the reproduction's mid-sentence paragraph break). After the cut, 13/13. Trigger Claims script-matched as substrings of the only turn at each timestamp and speaker in the final Transcript (episode per processed-videos.json transcriptPath): 3/3; context read about two minutes either side in full.
# Second pass changed: (a) display “143–142, 141 or 129 to 63 BCE” → “From 143–142, 141 or 129 to 63 BCE” (scopes the alternatives as start sides, as on the Timeline's “From perhaps the 10th century BCE, or the 8th or 7th, to the 2nd century CE”; flag 1). (b) Cut Bible Odyssey's introduction (was critical/6) to `uncited`: it frames 332–63 as Hellenistic foreign rule, which on its face is in tension with the entry's subject, and only backs Roman rule from 63, already carried by critical/4 and /5. Old critical/7–14 renumbered critical/6–13; bo-timeline-second-temple-judaism dropped from `sources` (registry entry kept, other entries cite it). The “End, unanimous” line and Bible Odyssey mentions above are superseded on that point; consistency with `alexander` (63) holds without the cite. (c) critical/13 (was 14) locator: “paragraph beginning “to Judaism. The internal crisis”” → “paragraph beginning “to Judaism. The internal crisis”, last sentence, running on into the next paragraph (“a close, and prepared the way for Herod”)”. Note and title unchanged: every year in the note traces to a remaining cite (143–142 c/1; 141 c/2; 129 c/3; 142 c/7; March 142 to April 141 c/8; 142–141 c/9; 140 c/10; 104–103 c/11 and c/12; 63 c/4 and c/5; 37 c/13).
# Rulings on the first pass's flags: (1) Clear with “From …”; each start side is a date for independence in its own source (Stern “recognized the independence of Judea”; Levine “declared his independence from Seleucid rule”; Henze and Werline “Judea becomes independent”). (2) Keep 129: the row says independence outright; their own 198–142 row is shown beside it in the note, so the reader sees both; no sign it is a misprint (other sources give other years, shown as sides). (3) In window as the 2nd ed. (2007), per registry precedent for EJ entries; the text is Menahem Stern's, carried forward, and the page's added bibliography runs to 1995. Not the only source for the start (Levine 141 and Henze and Werline 129 are separate sides; Britannica's Simon 143/142 accession agrees, uncited). (4) Reference, in window (27 years), as ruled on `maccabean-revolt`. (5) Fine as is: the quote's subject and year are in the same sentence immediately before it (“John's heir, *Aristobulus i (104–103 b.c.e.), was …”), and the note's year also has Henze and Werline row 104–103; the lead may extend the quote to start at “Aristobulus i (104–103 b.c.e.),” at publish if wanted. (6) Fair: Stern's sentence names Pompey's annexation as the end of independence; the year 63 comes from Henze and Werline and Britannica, which both date Pompey's capture of Jerusalem. (7) Moot: Bible Odyssey cut (see (b)).
# Flags for publish: (a) Henze and Werline's 129 sits beside their own “198–142 Seleucids rule Judea” with no row for 142–129; the note shows both, but the lead should keep that parenthesis if the note is edited. (b) The NABRE note gives the year as “by the Temple calendar”; the entry's note omits that qualifier (judged no change of strength). (c) The Britannica and NABRE texts in hasm-p2 are the agent's transcriptions of Chrome tool output (innerText slices; get_page_text), not raw page saves; the Chrome javascript read of the USCCB page was blocked by the extension's cookie/query-string filter, so get_page_text was used. (d) The E123 Trigger Claim's “160 BCE” and E71's “165 BCE” disagree with the display and are shown verbatim (#99); E123's preceding turns call the kingdom “semi-autonomous, semi-independent” and “subordinate to Rome in some sense”, outside the quote. (e) `alexander` (published) keeps, attributed, Bible Odyssey's frame of Jews under the Hellenistic kingdoms 332–63 BCE (with Austin's Hellenistic period to 30 BC). Ruled not a contradiction: it is a period frame (“Throughout much of this period”), not a dating of Judean independence, and Bible Odyssey's own Simon item allows “a certain degree of political independence”; it agrees with this entry's 63. It was cut here only because it does not back an independent state's end. `alexander` left untouched; the lead may weigh it at publish.
# Publish resolutions, 2026-11-27 (lead agent, on the second pass's flags, conservatively): Bible Odyssey cut accepted (63 rests on Henze and Werline row 63 and Britannica “Palestine”, both with the year; Stern names Pompey's annexation as the end). Display “From 143–142, 141 or 129 to 63 BCE” accepted. Flag 5: critical/12's quote left as is (subject and year sit just before it in the same sentence; Henze and Werline row 104–103 carries both). (a) Henze and Werline's 129 kept beside their 198–142 row in the note. (b) “by the Temple calendar” left out of the note: no change of strength. (c) Both passes' Chrome reads accepted as transcriptions of the live cited passages. (d) E123 and E71 shown verbatim (#99); their surrounding hedges stay in the Trigger Claim notes. (e) `alexander` left alone: its Hellenistic-kingdoms 332–63 is an attributed period label and agrees on 63. No seeAlso, no anchor. draft dropped; sourcesRead, review and secondPass all 2026-11-27.
