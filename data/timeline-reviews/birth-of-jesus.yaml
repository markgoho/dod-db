# Britannica authorship (new finding). The first pass recorded the JSON-LD author and byline as Sanders; this pass saw Pelikan on its first load. Re-fetching showed the byline (“Written by …”) and JSON-LD author rotate per request between the two primary contributors (three fetches of /biography/Jesus: Pelikan, Sanders, Sanders; two section pages each gave both). The /additional-info page lists Primary Contributors Jaroslav Jan Pelikan, E.P. Sanders and the Editors; the citation line reads “Pelikan, Jaroslav Jan, Sanders, E.P.”. No section-level signature was found, so no one sentence can be assigned to Sanders.
# Second pass changed: (a) the note's “Sanders, in Britannica, places it” narrowed to “Britannica places it” (authorship above). (b) Registry `britannica-jesus` author “E. P. Sanders” → “Jaroslav Jan Pelikan and E. P. Sanders” (Britannica's own citation line), edition string to match, and this file's `sources.britannica-jesus.edition` likewise; the public short cite becomes “Pelikan and Sanders 1998”. (c) critical/1 quote trimmed from “Jesus (born c. 6–4 BCE, Bethlehem—died c. 30 CE, Jerusalem) was a religious leader revered in Christianity” to “Jesus (born c. 6–4 BCE” (flag 2). Nothing cut: title, display, from/to/precision, all seven citations and the three Trigger Claims stand; no review keys renumbered; no registry entry removed.
# Second-pass rulings on the first-pass flags: (1) Own voice; kept. The summary paragraph marks three claims as the Gospels' (“Although born in Bethlehem, according to Matthew and Luke”; “According to Matthew and Luke, however, Joseph was only legally his father”; “Joseph is said to have been a carpenter”) and leaves the date sentence unmarked, with Matthew 2 and Luke 1:5 in parentheses as evidence; its 6 BCE lower edge is in neither Gospel, so it is Britannica's inference, not a report. The article says it flatly twice more (“When Jesus was born, all of Jewish Palestine … was ruled by … Herod the Great”; “When Herod died shortly after Jesus’ birth”, both uncited) and the lede gives “born c. 6–4 BCE” with no attribution. Not conditional (no “if”). The date rests on the Gospels' Herod setting, which the note says (“citing Matthew 2 and Luke 1:5”). (2) Trimmed (change c): the lede asserts Bethlehem flatly where the same article hedges it (“according to Matthew and Luke”) and Bond doubts it (“it seems more likely that the story was developed within early Christian circles”, uncited); the entry says nothing on the birthplace, so the quote no longer carries it. Short quotes have precedent (“King of Assyria 705–681 BCE.”, “The year was 1406 B.C.”). (3) Display “c. 6–4 BCE” is Britannica's own form and hedge; Bond's “In all probability … did not know exactly” and “roughly the right period” sit in the note, attributed, and give no other date (no #99 alternative). Pass. (4) Bond: the note keeps “in all probability”, “roughly the right period”, “if historical”, Luke against Matthew, and does not show her “6 B.C.E.” as her date; it drops Matthew's star, which narrows only. Landau: the note keeps “strongly implies” and the gap within Luke (1:5 against the census). Pass. (5) 1998 is inside the ~30-year window (#86; the excluded NABRE NT is 1986) on first publication alone; updated 2026-11-20. Pass.
