leads:
  - "Mark D. Smith, “Of Jesus and Quirinius”, CBQ 62 (2000): academia.edu copy login-walled; not read."
  - "B. W. R. Pearson, “The Lucan Censuses, Revisited”, CBQ 61 (1999): cited in Compton n. 6; paywalled; not read."
  - "John M. Rist, “Luke 2:2: Making Sense of the Date of Jesus' Birth” (reported as JBL 2000 in a search summary; venue unconfirmed): not fetched."
  - "Tyndale House Cambridge, “Was Luke wrong about the census?”: TLS errors on two tries; likely apologetic; not read."
  - "Bible Odyssey podcast “Ancient Censuses—Does Luke's Christmas Story Make Sense?” (2024): no transcript on the page."
uncited:
  - "Retief, Cilliers and Hoffman, “Die geboortedatum van Christus as ’n historiese probleem”, Acta Theologica 25.1 (2005) 69–88, English abstract p. 69: “the date of birth of Jesus should be placed in 5 BC or 6 BC (between March and November)”; body p. 84: “Ons eie voorstel van 5 v.C., dalk 6 v.C.” and “Die meerderheidsgroepering val egter binne ’n nou band van 7 tot 4 v.C.” Not used: falls inside the display (not a #99 alternative); the body is Afrikaans (any translation would be ours); the method accepts the birth narratives as history (p. 70); authors are classicists and a physicist."
  - "HarperCollins Bible Dictionary (2009), entry “Quirinius” on Bible Odyssey: Josephus “tells of a census carried out under Quirinius's authority in 6 or 7 CE”; “There is a historical problem, however, in relating this census to the one mentioned in (Luke 2:1-3), because Jesus is also said to have been born during the reign of Herod the Great (Matt 2:1-22; Luke 1:5), who died in 4 BCE.” Not used: the census year is given as 6 or 7 CE; the note attributes 6 CE to Bond rather than stating it flatly; the birth is reported (“is also said”). Bond and Landau carry the conflict."
  - "HarperCollins, entry “Herod”: “From 37 until his death in 4 BCE, Herod ruled as king of the Jews … According to (Matt 2:1-18, Luke 1:5), the birth of Jesus occurred while Herod was king.” A report of the Gospels; Britannica carries the 4 BCE bound."
  - "Denzey Lewis, Bible Odyssey “How Does the New Testament Relate to History?” (2022), body ¶ 6: “Herod died around 5 B.C.E., while Quirinius was not legate of Syria until around 5 C.E.—some 10 years later.” Not used: her years (c. 5 BCE / c. 5 CE) differ from Bond, Landau and Britannica; the decade conflict is carried by Bond and Landau."
  - "Bond 2018, ¶ 1 of “Was there really a census?”: “When Herod I died in 4 B.C.E., his kingdom was divided among three of his sons”. Agrees; Britannica and Landau carry 4 BCE."
  - "Britannica “Jesus”, section “The political situation”: “When Herod died shortly after Jesus’ birth, his kingdom was divided into five parts.” Agrees with the cited summary sentence; not needed."
  - "Martin, Open Yale RLST 152 lecture 13, ch. 1: “Most of us think we don't know anything about the birth of Jesus. All the Christmas stories are later tradition”; ch. 2: “The birth narratives, we just throw up our hands.” No year; scope is the birth stories."
  - "Bird, Bible Odyssey “Bethlehem” (2017): “many scholars conclude that Jesus was probably born in Nazareth rather than in Bethlehem”. Birthplace only; not this entry's subject."
  - "Jensen, Bible Odyssey “Herod the Great” (2018): “Herod ruled from the year 40-4 BCE but first captured the throne in 37 BCE.” Herod's reign; for #237."
  - "Compton, “Once More: Quirinius's Census”, DBSJ 14 (2009) p. 46: “a reign ended by Herod's death in March/April of 4 B.C.” Seminary journal, harmonising frame; no birth year."
  - "Ehrman, Brief Introduction 5e chapter summaries (OUP), ch. 7: the birth narratives differ; no date. Powell, Bible Odyssey “Jesus” (2016): no date. Nissenbaum, Bible Odyssey (2017): the calendar day, not the year."
