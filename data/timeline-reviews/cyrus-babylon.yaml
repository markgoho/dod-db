# Re-review 2026-11-27 (#211, lead agent; owner route: #93 delegation, #110): the day and manner of Babylon's fall, cut on 2026-11-26 for the 30-year window, sourced inside it. Note gains three sentences, before the return: “Ugbaru entered Babylon with Cyrus's army on 12 October 539; Cyrus himself arrived on 29 October. The Babylonian chronicle, in Tavernier's translation, says they entered without a fight. In Herodotus, Cyrus drained the bed of the Euphrates after a battle near the city; in Xenophon, he reached Babylon without a fight and diverted the river. Tolini argues that there was at least one violent fight, at the Enlil Gate, and that Babylon did not give in without resistance.” Title, display, from and precision unchanged; Trigger Claims unchanged.
