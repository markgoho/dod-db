# Review record for the Timeline Entry `cyrus-babylon` (/timeline/#cyrus-babylon; #93 shape). Not rendered.
# Issue #191 (from #108), “Timeline Entry: Cyrus takes Babylon”. Issue notes: date the conquest, not the return, unless a source dates the return; critical side only; candidate `anchor` for period-dated entries (Persian period, e.g. Job).
# Anchor candidacy: recorded here only. No published entry is edited to anchor to this one; Job's own review says its sources don't name the Persian period. Follow-on filed as an issue.
# Sourcing test, 2026-11-26: met. Reference sources date the conquest outright to 539 BCE (Silverman, Bible Odyssey; Coogan and Chapman ch. 21; Dandamayev, Encyclopaedia Iranica “Babylonia i”) and a Scholarly source does too (Waerzeggers 2021, De Gruyter; second pass: cut, it dates the attack, not the taking; the test stays met on the three Reference sources, two inside the 30-year window). No source read gives another year for the fall of Babylon; 538 appears only for the edict (Porten, EJ “Temple”; Rappaport, EJ “Cyrus”), the start of the return (Coogan ch. 21), Cambyses made king of Babylonia (Iranica “Babylonia i”) and the Cyrus Cylinder (“ca. 538”, Silverman's image caption). Kind: event. No Tradition Date: no Trigger Claim states the tradition's side. No setting (event entry).
# Return: the issue allows it when a source dates it; Coogan ch. 21 dates the start of the return (“beginning in 538”), so it is in the note, not the display.
# How Babylon fell (#99: sources differ → show both): Iranica “Cyrus iii” gives the Babylonian chronicle's surrender “without a struggle” and Herodotus and Xenophon's “bitter fighting”; both in the note, each attributed. E115's “besieges—lays siege to Babylon” is not kept as a Trigger Claim (see below), so the note does not answer it.
# Persian period's end: the show says 332 (E187); Silverman gives Darius III's defeat by Alexander as 334–330 BCE, HarperCollins “Persia” “ca. 330 BCE”. The note gives Silverman's range as he gives it; the E187 Trigger Claim keeps its 332 and is shown apart (CONTEXT.md).
# Dropped: the exact days of Sippar's fall and Babylon's taking (10 and 12 October, Iranica; 14 and 16 Tashritu, Waerzeggers): Iranica's two articles differ on the Opis battle (August vs “the beginning of the following October”); only Cyrus's entry (29 October 539) is in the note. Cyrus's reign years differ between sources (559–529 EJ; 559–530 Oxford Phrase and Fable; 550–530 EWB) and are out of scope.
# Trigger Claims (#99: one to three): E187 00:53:37 (issue lead), E34 00:34:10, E71 00:51:20, each dating the conquest to 539 flat. Not kept: E115 00:39:41 (“539-ish”, hedged; adds “lays siege”); E130 00:19:38 (“what's 587, 539 BCE, Cyrus the Great comes in and conquers Babylon” — mid-sentence restart, duplicate); E187 00:51:44 (no year in the turn; the 539 is in the exile range); E43 00:13:58, 00:40:48 (no year); E16, E32, E159 (no dated conquest found: E16 nothing on Cyrus; E32 Daniel 9; E159 1 Esdras, no year).
