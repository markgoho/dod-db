leads:
  - "Seth L. Sanders, The Invention of Hebrew (2009): paywalled; no open copy."
  - "William M. Schniedewind, A Social History of Hebrew (Yale, 2013): no open copy."
  - "Finkelstein and Sass 2013 (HeBAI), on when writing in Hebrew began: paywalled; known only through Naʼaman n. 13."
  - "Misgav, Garfinkel and Ganor 2009, first publication of the Qeiyafa ostracon (IES): no open copy."
  - "Richelle 2015 and his UCLouvain chapter on Iron Age literacy: repository timed out."
  - "Bible History Daily, “The oldest Hebrew script and language”: BAS web page, not fetched."
  - "Not searched: HIPHIL Novum, Maarav, Garr 1985."
uncited:
  - "Rubin, Bible Odyssey “Where Did Hebrew Come From?” (2024; University of Georgia): “from a linguistic perspective the Hebrew and Canaanite languages were nearly identical”; “the earliest known Hebrew writing dates from only around 1000 BCE”. Read; no date for the split; the second sentence is attestation, for the follow-up entry."
  - "Rollston 2010 (SBL), pp. 3, 29–35, 42: script is not language; the Old Hebrew script became a distinct national script in the 9th century BCE; Gezer calendar's language contested (Cross Hebrew, Pardee Phoenician). Script and attestation, for the follow-up entry."
  - "Sergi 2023 (SBL), pp. 34, 204–8: local dialects including Hebrew written in differentiated scripts from the second half of the 9th century; “it seems” Israel's and Judah's scribes wrote Hebrew in Old Hebrew script by then. Attestation, for the follow-up entry."
  - "Naʼaman 2017 p. 10: “the early Hebrew script was formed only in the 9th century, probably in order to write documents in the Hebrew language that was developing earlier as an independent dialect” (after Naveh 1982), and n. 13 (Finkelstein and Sass). Script; “developing earlier” gives no date."
  - "Millard 2011 (Tyndale Bulletin), Qeiyafa ostracon: “the language may be Hebrew, Canaanite, Phoenician or Moabite”; “there is no proof the text is written in Hebrew rather than Canaanite”. One inscription, not the language's emergence."
  - "Hayes RLST 145 l7 ch. 5–6: “Hebrew is simply a Canaanite dialect”; no date."
  - "Sáenz-Badillos 1993 (Cambridge excerpt, p. 1): Hebrew “developed … during the latter half of the second millennium BCE”. Outside the 30-year window; image-only PDF, typed by hand."
  - "Encyclopaedia Judaica (encyclopedia.com) “Alphabet, Hebrew” (Naveh) and “Gezer Calendar” (Oded); and “Hebrew Language” (Jewish Virtual Library): 1971 edition text, outside the window."
  - "Raphaeli, Encyclopedia of the Modern Middle East and North Africa: Biblical Hebrew crystallized in the 11th–10th centuries BCE; dates the literary language, and the author's credentials are unverified."
  - "Suchard 2016 (Leiden PhD thesis): Proto-Northwest-Semitic; no date; a thesis."
  - "Finkelstein and Mazar 2007 (SBL), pp. 105, 134–35: tenth-century inscriptions as objects; p. 105 is the editor's summary."
