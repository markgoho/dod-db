# Review record for the Timeline Entry `hebrew-language` (/timeline/#hebrew-language; #93 shape). Not rendered.
# Issue #197 (from #108). Issue notes: scope trap — the show's "Hebrew didn't exist" sometimes means the written language; word the entry for what the sources date and don't merge the language with the earliest inscriptions. Expected a split or undated statement. Sits near merneptah-stele on the minimap (#175).
# Scope chosen: Hebrew as a language distinct from Canaanite, the subject of the issue's lead claim (E152) and E175. The earliest Hebrew writing is a separate subject: the sources date the Old Hebrew script outright (9th century BCE: Rollston 2010 p. 42, Naʼaman 2017 p. 10 after Naveh, Sergi 2023 pp. 204–8) and split on the earliest Hebrew writing (Rubin 2024 "around 1000 BCE"; Finkelstein and Sass 2013, via Naʼaman n. 13, first half of the 9th century). Rollston p. 3 warns script and language differ. Left to a follow-up entry, not merged here.
# Sourcing test, 2026-11-26: met as undated. No Scholarly or Reference source read dates Hebrew's emergence as a distinct language outright. McCarter 2008 gives only a lower limit ("unlikely … before the end of the Late Bronze Age") and dates the first identifiable phase "before c. 1000 BC" on poetry that "may have been composed" before 1000; Naʼaman 2017 says no epigraphic evidence shows the split in the first half of the 10th century. Neither gives a positive date, so no Critical Date (conditional-not-critical). Placement: undated with no Tradition Date, so the entry is in the unplaced list (timeline-placement.html); no minimap tick, so no #175 crowding.
# Trigger Claims: E152@00:47:37 (the issue's lead; the follow-up at 00:48:19 answers "As both a written and a spoken language?" with "Yes, it was indistinguishable from a generic, broader Canaanite language until somewhere in between 1100 and 1000 BCE", not stored). E175@00:13:51 keeps "at the very earliest". E187@00:44:45 (language differentiation around 1000). Not stored: E187@00:44:37 ("the written language begins toward the end of Iron Age one", narrowed from "Hebrew doesn't even exist yet" to "at least the written"): about writing, kept for the follow-up entry. E121@00:31:17 ("Hebrew doesn't exist in this time period either") and E154@00:18:30 ("Hebrew didn't even exist when this Egyptian poem was written") give no date. The show's dates (1100–1000; 11th century at the earliest; around 1000) agree with each other; no #99 contradiction. All state critical: no Tradition Date.
# agent: the first pass (2026-11-26). Research agents per side (language emergence; earliest inscriptions), each saving fetched pages; quotes script-matched against the saved text (whitespace, quotes, dashes, entities, line-break hyphens and space before punctuation normalised): 4 hits, 0 misses. Trigger Claims matched by script as substrings of their Transcript lines at timestamp and speaker: 3 hits.
# owner: empty (""). The owner delegated the publish review (#93; extended to the Timeline, #110, 2026-11-23); a `delegation` block is added when the independent second agent pass has run.
# Flags for the second pass: (1) McCarter is cited from the open Cambridge Core chapter summary (the chapter itself is paywalled), the same access as fleming-2021-yahweh-before-israel-ch7; check the summary is the chapter's own text and the 2008 volume year. (2) McCarter's second sentence is hedged ("suggest", "may have been composed"); the statement keeps both hedges; cut it if it reads stronger than the source. (3) "The sources give it no firm date" is our summary of two sources that give none, as on `exodus`; narrow if needed. (4) Naʼaman p. 11's sentence is about the time of the Qeiyafa ostracon (first half of the 10th century), read in context. (5) Title "Hebrew becomes a language distinct from Canaanite": check it doesn't imply a date the statement denies.
# Independent second agent pass 2026-11-26 (#93 delegation, #110): both sources re-fetched from their registry URLs into a fresh folder (Naʼaman PDF via pdftotext; Cambridge page HTML stripped to text); all four quotes re-matched by script (whitespace, quotes, dashes, entities, soft and line-break hyphens, space before punctuation normalised): 4 hits, 0 misses, each at its locator (McCarter: the open Summary, section heading “Stages in the development of Ancient Hebrew”, its first two sentences; Naʼaman printed p. 10 = PDF p. 11, end of point (5); printed p. 11 = PDF p. 12, the second of three reasons). All three Trigger Claims re-matched by script as substrings of the line at their timestamp and speaker in the final Transcripts (via processed-videos.json), about two minutes either side read: 3 hits.
# Second pass changed: (1) the statement dropped McCarter's first hedge (“Prosodic and linguistic studies suggest”), contrary to first-pass flag (2); it now reads “writes that studies suggest the earliest poetry … may have been composed …, calling that poetry the first identifiable phase”, keeping both hedges. (2) E152's stored text trimmed to “Hebrew didn't exist until like between 1100 and 1000 BCE.”: the cut lead-in (“that then contributed to Proto-Canaanite … Phoenician … Hebrew”) traces the alphabet from Sinai hieroglyphs, a script lineage, and on this language entry it read as a language lineage (the issue's scope trap). No citation cut; nothing moved to uncited; no citation added.
# Flags for publish: (1) Title “distinct from Canaanite” is Naʼaman's framing (“detached from the Canaanite one”); McCarter classifies Hebrew as Canaanite (“Within Northwest Semitic, Hebrew is classified as Canaanite as distinct from Aramaic”) and says “emerged as a discrete language”. Not wrong (Canaanite here is the undifferentiated dialect it split from, as on the show), but the publisher may prefer “Hebrew emerges as a discrete language” or a title naming both. (2) McCarter's open summary stops two sentences into the “Stages” section; the chapter's own dating beyond that is unread (paywalled), so “no firm date” is checked only against the open text. (3) McCarter's page lists a “Preface to the first edition” and the Cambridge Encyclopedia tables of contents: the chapter is a paperback reissue of the 2004 encyclopedia text; 2008 is the page's print year (online 22 September 2009). Either year is inside the 30-year window; left at 2008. (4) E187 is the weakest Trigger Claim: it follows “there's a reason for this”, which refers to the written language (00:44:37), and it never names Hebrew (“the Israelites … speak our language different from everybody else”); kept, since the turn is about language differentiation around 1000 and the run-up names Hebrew. (5) Naʼaman p. 10 also says (after Naveh) Hebrew “was developing earlier as an independent dialect” before the 9th-century script; recorded under uncited by the first pass, not a date. (6) The show's “by about 1000” vs Naʼaman's no epigraphic evidence for the early 10th century is tension, not a contradiction of a dated row; Trigger Claims shown verbatim per #99.
