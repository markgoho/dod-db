# Second pass changed: (a) critical/5 (EJ “approximately six centuries (from the 11th to the 5th century b.c.e.)”) moved to `uncited`: it dates the same stage as Nihan and Rhyder (whole process) with a different start, so display and `from` would have to carry both (#99), but the sentence is the documentary hypothesis's own picture (EJ's next sentence: “This picture of the formation of the Torah from source documents is known as the documentary hypothesis”), with J and E at the earliest stage, in an entry that states Friedman's model as settled; Hayes l5's classical dates are uncited on the same ground. Old critical/6 renumbered critical/5. (b) The note's EJ sentence narrowed to the quote: “has the addition of Genesis through Numbers accomplished by the mid-5th century BCE” (the quote has no “to Deuteronomy”; that is two sentences later). (c) setting/2 (Hayes l5) moved to `uncited`: the sentence is about the narrative sources P, J and E as the source critics reconstruct them, not the Pentateuch; setting/1 carries the display alone. `hayes-rlst145-l5` dropped from `sources` (registry entry kept; other entries cite it).
# Second pass flags (resolved): (1) display “Neo-Assyrian to Persian period” for the whole process kept: the issue note (“date what the sources date … and say which in the note”) and CONTEXT (“worded for what its sources date”); Nihan and Rhyder date the whole process in one sentence and the note names the stage. With EJ's process sentence uncited, no remaining source dates the same stage differently; Ska, Hayes and EJ canonization date the final stage, each attributed in the note, all inside the span. (2) from -912 / to -323 are Nihan and Rhyder's period bounds (“ca. 912–612”, “ca. 538–323”); precision: period; kept. (4) Hayes's “in that period” follows “the period of the exile is the sixth century”; the bracket is the transcript's own; “probably” kept in the note. (5) moot for the quotes kept (EJ quote's lowercase “b.c.e.” as in the saved text). (6) Tradition display “c. 1446–1406 BCE, written by Moses” kept: Turpin's sentence gives the writing range with Moses as writer; the subtitle has “traditional Mosaic authorship”. (7) 175@00:15:14 kept as states: tradition: it reports what a named crowd holds, with the writing date conditional on it, as `exodus`'s tradition trigger (“if you date the Exodus to the 1400s BCE, which is what a lot of folks do”). (8) E117's dropped continuation (“but these days … priestly literature which is probably post-exilic”) is a shift of topic to P; the hedge “is kind of a traditional dating” is kept; fine. Overlaps re-checked: `priestly-genesis-1` (exilic or post-exilic) and `deuteronomy` (-800 to -500) sit inside -912 to -323; E117's P late 6th/early 5th and D end of 7th agree with them.
# Second pass flags (open, non-blocking): (3) Ska's text below the video not checked against the audio. Nihan and Rhyder's registry `year` is null though the page is dated August 26, 2020 (`datePublished` 2020-08-26); other Bible Odyssey articles also have null; left as is. Holder confirmed: AiG About page (re-fetched) reads “Answers in Genesis is an apologetics (i.e., Christianity-defending) ministry”; `aig-wright-2012-flood` has the same holder string.
# Publish resolutions, 2026-11-26 (lead agent, on the second pass's flags): (1), (2), (4)–(8) resolved by the second pass; kept as it left them. (3) Ska's page text kept as cited: it is the text Bible Odyssey (SBL) publishes with the video, under Ska's name; it carries only the note's attributed Persian-period clause and the pre-exilic elements clause, not the display (Nihan and Rhyder). Nihan and Rhyder `year` left null, as for other Bible Odyssey entries. The two cuts (EJ process sentence; Hayes l5 setting) leave the entry rule met: one Reference source dates the subject outright (Nihan and Rhyder) and backs the setting; Trigger Claims 3. Setting display reworded “from the creation …” → “the time from the creation …” to read after the page's “Set in” (as `judges-dtr`); no change in scope. Preview: placed between `david-and-solomon` and `deuteronomy`, Tradition Date in its lane, sources and 3 Trigger Claims render with Episode links resolving, minimap tick without overlap. draft dropped; sourcesRead, review and secondPass all 2026-11-26.
