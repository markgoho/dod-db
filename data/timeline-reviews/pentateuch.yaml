# Review record for the Timeline Entry `pentateuch` (/timeline/#pentateuch; #93 shape). Not rendered.
# Issue #185 (from #108), “Timeline Entry: The Pentateuch”. Issue notes: the show's dates differ by stage (#99): date what the sources date (composition of sources vs final compilation) and say which in the note. Overlaps `priestly-genesis-1` and `deuteronomy`; don't contradict them. Kind: composition; sides: both.
# Sourcing test, 2026-11-26: met. Reference sources date the subject outright: Nihan and Rhyder (Bible Odyssey, SBL) date the whole compositional and editorial process “from the Neo-Assyrian (ca. 912–612 BCE) to the Persian period (ca. 538–323 BCE)”; Ska (Bible Odyssey) gives the Persian period for the Pentateuch “as such”, as a point many scholars agree on; Hayes l12 the exilic to post-exilic final form, “probably”; the Encyclopaedia Judaica (Friedman and Overton) the 11th to 5th century for the process and the mid-5th century for the addition of Genesis–Numbers. No Scholarly-class source was read in full (all Reference). Tradition: Answers in Genesis (Turpin 2021) dates Moses' writing of the Torah c. 1446–1406 BC. Setting: Nihan and Rhyder, Hayes l5.
# Stage split (issue note, #99): display and from/to date the whole process (Nihan and Rhyder, one sentence; not stitched from two sources). The note says so and gives the final collection's dates by source: Ska (Persian), Hayes (exilic to post-exilic, probably), EJ (process 11th–5th century; Genesis–Numbers added by the mid-5th century). The sources differ on the start (Neo-Assyrian, from ca. 912, vs EJ's 11th century) and on where the final form falls (exilic vs Persian); each is attributed by name in the note, none picked.
# Overlaps: `priestly-genesis-1` (P final form exilic or post-exilic, Hayes l9) and `deuteronomy` (8th century to after the exile) both fall inside this entry's span; no conflict. Friedman's pre-exilic, Hezekiah-era P (EJ section “p”) would contradict `priestly-genesis-1` and is uncited; EJ is cited only for the two sentences on the whole process and on Genesis–Numbers.
# Trigger Claims (#99: one to three): E175 00:13:51 (Hebrew points to the 8th–6th centuries; critical), E175 00:15:14 (the crowd who dates Moses to the 15th century, “if Moses was writing around that time period”; tradition), E117 00:38:08 (single collection by the 5th or 4th century, “kind of a traditional dating”; critical). Not kept: E175 00:11:48 (“It was not written in the 15th century BCE, it was not written by Moses”: a denial, states the critical side; E175 is already represented twice); E22 00:23:09 (Liane Feldman: the four sources “at some point most scholars would, say in the Persian period were joined together” — a good critical claim, dropped only for the three-claim limit; E117 carries the compilation stage); E8, E20, E95, E104, E115, E164, E187 (no date on the Pentateuch's composition found in the Transcript, or only incidental). The show's “4th century” (E117) and “8th–6th centuries” (E175) are not the sources' dates; shown verbatim, not explained (#99).
# agent: the first pass (2026-11-26). Three research agents (critical; tradition; setting) fetched every source into separate scratch folders; every quote copied from saved text. Every quote script-matched against the saved text (whitespace, quotes, dashes, entities, tags normalised): 10/10, zero misses. Trigger Claims matched by script as substrings of their Transcript lines at timestamp and speaker: 3/3.
# owner: empty (""). The owner delegated the publish review (#93; extended to the Timeline, #110, 2026-11-23); a `delegation` block is added when the independent second agent pass has run.
