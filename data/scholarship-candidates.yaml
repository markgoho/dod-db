# Scholarship Page candidates (#96). Committed, not rendered.
#
# subjects: the queue. File order is the order; the next page is the first
#   `passed` entry, else the first `candidate` (the owner's pick overrides).
#   status: candidate  untested, or unblocked
#           passed     sourcing test passed; waits for a draft slot
#           held       fell short; `missing` says what unblocks it
#           dropped    not a page subject; `reason` says why
#   core: the candidate core claim. Until a test, the show's thesis as the
#     inventory states it; a test rewords it to its sources' strength.
#   basis: where the entry came from (inventory counts, Episode, #93 cut).
#   watch: terms `bun run synthesis:gather` looks for at a word start in each
#     new Transcript, for any subject not dropped.
#   triggers: Trigger Claim pointers (episode, speaker, timestamp, text).
#     Unchecked until the sourcing test reads the Transcript around them.
#   tested: date of the last sourcing test.
#   found: passages read in the source itself (registry id or full citation,
#     locator, URL, quote). leads: passages not read in the source (CONTEXT.md).
#   An entry leaves the file when its draft page is created; a page cut below
#   the publish rule (#93) returns as `held` under its page slug.
#
# statements: proposed new statements for an existing page, from a new
#   Episode, or conflicts: a Trigger Claim that contradicts a statement, with
#   that statement's question and notes "Conflict with <id>: ...". Picked up
#   only by a re-review the owner chooses (#93).
#
# Seed (2026-11-23): the consensus-claims inventory (#77, branch
# research/consensus-claims-inventory) ranked items 4-10, then its "short
# page" tier, then the remaining clusters with a statable thesis, then the
# three held subjects from #84. Counts are the inventory's core-thesis counts
# where it gives them, else whole-cluster counts. Nothing below has been
# sourcing-tested; #85 tested only the three built subjects.

