# Scholarship Page candidates (#96). Committed, not rendered.
#
# subjects: the queue. File order is the order; the next page is the first
#   `passed` entry, else the first `candidate` (the owner's pick overrides).
#   status: candidate  untested, or unblocked
#           passed     sourcing test passed; waits for a draft slot
#           held       fell short; `missing` says what unblocks it
#           dropped    not a page subject; `reason` says why
#   core: the candidate core claim. Until a test, the show's thesis as the
#     inventory states it; a test rewords it to its sources' strength.
#   basis: where the entry came from (inventory counts, Episode, #93 cut).
#   watch: terms process-next-episode greps in each new Transcript (held for
#     a Trigger Claim only).
#   triggers: Trigger Claim pointers (episode, speaker, timestamp, text).
#     Unchecked until the sourcing test reads the Transcript around them.
#   tested: date of the last sourcing test.
#   found: passages read in the source itself (registry id or full citation,
#     locator, URL, quote). leads: passages not read in the source (CONTEXT.md).
#   An entry leaves the file when its draft page is created; a page cut below
#   the publish rule (#93) returns as `held` under its page slug.
#
# statements: proposed new statements for an existing page, from a new
#   Episode. Picked up only by a re-review the owner chooses (#93).
#
# Seed (2026-11-23): the consensus-claims inventory (#77, branch
# research/consensus-claims-inventory) ranked items 4-10, then its "short
# page" tier, then the remaining clusters with a statable thesis, then the
# three held subjects from #84. Counts are the inventory's core-thesis counts
# where it gives them, else whole-cluster counts. Nothing below has been
# sourcing-tested; #85 tested only the three built subjects.

subjects:
  - slug: yahweh-origins
    subject: "Yahweh's origins and early Israelite religion"
    status: passed
    core: "Yahweh and El appear to have begun as different gods: the Bible seems to preserve a memory of a time when Israel's ancestors worshipped the Canaanite god El, before they turned to Yahweh."
    basis: "Inventory rank 4: 8 Episodes, 18 claims, all Hosts. The show marks several points as under discussion; a page must carry that hedging."
    tested: 2026-11-23
    triggers:
      - episode: 66
        speaker: "Dan McClellan"
        timestamp: "00:46:10.270"
        text: "And I think many scholars would say if there is a relationship, then whoever occupied this land or whoever bore this name probably named their deity after the land or the people and at some point made their way into the northern hill country of Israel, bringing their deity with them and introduced that deity into this Northwest Semitic group that was probably already devoted mainly to El, but also to other deities."
      - episode: 66
        speaker: "Dan McClellan"
        timestamp: "00:47:29.560"
        text: "And they were probably inserted into the pantheon on the second tier. They initially were one of the offspring of the high God who was either El or Elyon or. Or maybe Elohim."
      - episode: 124
        speaker: "Dan McClellan"
        timestamp: "00:47:29.421"
        text: "Deuteronomy 32:8-9, I and many other scholars think, preserves an early understanding of Adonai as one of the Bene Elohim, as one of the children of God. Right. And so Elyon would be a separate deity, the Most High, and then Adonai would have been one of the Bene Elohim who was given Israel as their inheritance."
      - episode: 7
        speaker: "Dan McClellan"
        timestamp: "00:53:48.480"
        text: "There are a lot of scholars who date this very, very early, suggest this may predate the conflation of Adonai and El."
      - episode: 7
        speaker: "Dan Beecher"
        timestamp: "00:48:15.370"
        text: "I, I think the data indicate that they merged probably between around 900 BCE. You have Adonai originally comes in as a second-tier deity who adopts this storm deity profile."
    found:
      - "hayes-rlst145-l7 (Reference, Christine Hayes, 2006), ch. 6 'Smith's Convergence and Divergence Model', https://oyc.yale.edu/religious-studies/rlst-145/lecture-7: 'The Canaanite god El was, from the biblical text, the God of Israel's earliest ancestors. Through a process of convergence, he argues: the God Yahweh was the god that we think originally came from a region further south, Sinai, Edom, somewhere further south — but this god, through a process of convergence and cultural mixing, began to take on the characteristics of other deities, first El, and then Baal, or sort of simultaneously El and Baal.' Same chapter: 'Smith's model of convergence and then differentiation, has great explanatory power.' Core claim, author 1."
      - "hayes-rlst145-l7, ch. 5 'Descriptions of God in the Bible', same URL: 'Now, this contradicts the J source, and many scholars have suggested that P and E preserve a memory of a time when Israel worshipped the Canaanite god, El.' Also ch. 5: 'Many personal and place names in the patriarchal narratives are compounds in which one element is El. Israel, Ishmael, Beth-el. El is the God of the Patriarchs. By contrast, after the time of Moses, Israelite names start to be formed using Yah, or Yahu, as part of the name Yahweh'. Ch. 6: 'To be blunt, the patriarchs seem to have worshiped the Canaanite God, El.'"
      - "hayes-rlst145-l8 (same author as l7; counts once), https://oyc.yale.edu/religious-studies/rlst-145/lecture-8: 'He wins a stunning victory, he establishes himself as the god of the Israelites in place of El, who was worshipped by Israel's patriarchs, remember.' Same lecture: 'The older god El, the sky god, was replaced by the younger storm god, Baal'. This passage follows 'Coogan notes' and relays Coogan, so it isn't independent of the Coogan and Chapman summaries."
      - "Michael D. Coogan and Cynthia R. Chapman, student chapter 5 summary of A Brief Introduction to the Old Testament, 4th ed. (OUP Learning Link, 2019; Reference, publisher summary per #86), 'Chapter 5 Summary', https://learninglink.oup.com/access/content/coogan-brief-4e-student-resources/coogan-brief-4e-chapter-5-summary: 'Specifically, Genesis appears to preserve a tradition dating from the period when Israel’s ancestors prayed to El, the Canaanite god worshiped by Israel’s neighbors.' Core claim, author 2."
      - "coogan-brief-4e-summary (chapter 6; same authors as the chapter 5 summary; counts once), section 'The Hegemony of Storm-gods', https://learninglink.oup.com/access/content/coogan-brief-4e-student-resources/coogan-brief-4e-chapter-6-summary: 'While the sources all state that there is continuity between the God of the ancestors and the God of Exodus, the fact that the deity first reveals himself as Yahweh in both E and P sources in the book of Exodus suggests that something new has happened. This reference indicates that there is an echo of change preserved in Exodus, recalling a time when the ancient Israelites switched their loyalties from the worship of the sky god to the worship of the storm-god.' Names neither El nor Yahweh by these titles; it backs the core only read with the chapter 5 summary (El the ancestors' god). Core claim, author 2."
      - "Daniel E. Fleming, Yahweh before Israel: Glimpses of History in a Divine Name (Cambridge University Press, 2021; Scholarly), publisher excerpt PDF, https://assets.cambridge.org/97811088/35077/excerpt/9781108835077_excerpt.pdf, p. 4: 'I do not think Yahweh began as any form of “The God” El, and I do not think Yahweh was first of all a local highland storm god of the Hadad type.' First person, so the author's own view; supports the core claim's first clause as a third author. The excerpt (pp. 1-6) names no one who holds that Yahweh began as El."
      - "Fleming 2021 excerpt, p. 3: 'I undertook my own contribution with what I perceived as a consensus as my target, what I will call for simplicity the Midianite Hypothesis of Yahweh’s southern desert origins. In fact, there is no consensus and never was.' A page stating Yahweh's southern origin must carry this."
      - "Fleming 2021 excerpt, p. 1: 'Yet there is no certain evidence for a god named Yahweh before the name’s first appearance in a mid-9th century BCE royal inscription from Jordan' p. 4: 'The Egyptian evidence is decisive to my analysis: the name Yhwȝ designates a Shasu group, a Yhwȝ-people.'"
    leads:
      - "Mark S. Smith's convergence-and-differentiation model, known here only through Hayes's account in hayes-rlst145-l7, ch. 6; Smith's own text (The Early History of God) not read."
      - "Theodore Lewis 2020, chapter 6 'The Origins of Yahweh' (The Origin and Character of God, OUP), cited in Fleming 2021, p. 3 n. 4 as a systematic review of the inscriptional evidence; not read."
    notes: "Gates run 2026-11-23 (#124): 1 Trigger Claim, read in Transcript context; 2 core claim reworded to the sources' hedges ('appear', 'seems to preserve'); 3 two independent Reference authors (Hayes; Coogan and Chapman) plus Fleming (Scholarly), none Host-authored; 4 at least three statements possible (El as the ancestors' god, Yahweh taking on El's and Baal's traits, Yahweh's attestation and southern origin, contested per Fleming p. 3). Core cut to what both counted authors say (ancestors worshipped El, then a turn to Yahweh); 'Yahweh took on El's characteristics' rests on Hayes relaying Smith alone. Ep 66 00:47:29 read through 00:51:30: the hedge at 00:50:55 ('in my opinion, and in the opinion of some scholars, certainly not all scholars') governs the ancestral-deity claim, not the second-tier claim. Ep 7 00:48:15: the Transcript labels the Speaker Dan Beecher, but 00:44:42-00:48:15 reads as McClellan's announced divine-council piece (it cites Mark Smith; the line at 00:47:42 labelled McClellan is the lay question), so the label is probably swapped; confirm the Speaker at owner review or drop the pointer. No source found for the Deut 32:8-9 reading (Ep 124 trigger); it can't be a statement yet. Coogan 4th-ed. year is still unconfirmed from OUP's catalogue (#86)."

