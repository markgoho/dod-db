  - slug: inerrancy
    subject: "Inerrancy"
    status: candidate
    core: "Inerrancy as a formal doctrine is a modern development, firmed up in reaction to critical scholarship, not a view Christians always held."
    basis: "#84: the dropped advisory guide becomes three held candidates."
    watch: [inerran, infallib]
    triggers:
      - episode: 6
        speaker: "Dan McClellan"
        timestamp: "00:04:54.650"
        text: "Yeah, and there are different. There are variations on inerrancy. Like, some people say it's anything. Everything is exactly accurate. Other people say, well, no, it's just matters of doctrine or even central matters of doctrine. Other people say doctrine or history. Some people say it's limited to the autographs. So only those original texts that were physically written on by the actual authors themselves. Other people say it's, you know, any version of the Bible. It's. There are a lot of variations on it, but yeah, the idea is basically that it cannot be an error."
      - episode: 79
        speaker: "David Congdon"
        timestamp: "00:27:45.070"
        text: "Lewis is, I mean, part of a British tradition. Of course, it never had an interest in inerrancy and still doesn't."
      - episode: 79
        speaker: "David Congdon"
        timestamp: "00:28:07.380"
        text: "I mean, the thing with scripture is fascinating too, because I do think the inerrancy debates are, I mean, while they still happen, it is largely a thing of the past, in my opinion. I mean, we do. I mean, the inerrancy wars were big in the 70s, 80s, and then especially into, you know, 90s."
      - episode: 140
        speaker: "Dan McClellan"
        timestamp: "00:50:19.206"
        text: "Again, it's all presupposing inspiration, not inerrancy as we understand it today, because that's another thing that has really only come up in the last couple hundred years, but as a formal doctrine."
      - episode: 152
        speaker: "Dan McClellan"
        timestamp: "00:21:57.756"
        text: "So this is what I think is kind of the main pivot towards what we might call fundamentalist Christianity. Right, because this is a series of publications basically arguing, lashing out against the historical-critical method, against critical scholarship, to draw the line in the sand and say, these are the fundamentals of being a Christian, and you have to accept these in order to be on our side of things. And it was doubling down on some concept of a literal approach to scripture where it's no longer just kind of, you know, your hippie-dippy Origen, you know, hit the blunt and then say, you know, just relax about these contradictions and stuff. They developed the notion of the inerrancy, the historicity, the univocality, all these things of the scriptures as more firm identity markers as a way to object to rising critical scholarship."
    notes: '#125 gate-1 read (2026-11-23): every `inerran`/`infallib` hit line in the 29 Episodes tagged inerrancy, plus about two minutes either side of each recorded claim. Ep 152 at 00:21:57 is about The Fundamentals (1910-1917, per 00:20:50); Ep 152 at 00:26:08 adds the 1978 Chicago Statement. Ep 164 at 00:14:17 (Leslie Baynes: Gore, 1889, "says that the Bible is not inerrant") is a further lead. Ep 149 at 00:25:47 is a question, not used. Core is the show''s thesis, not yet sourced.'

  - slug: inspiration
    subject: "Inspiration of scripture"
    status: candidate
    core: "In 2 Timothy 3:16, 'all scripture' meant the Jewish scriptures, and the reading of theopneustos as 'inspired' was popularized by Origen in the third century."
    basis: "#84: the dropped advisory guide becomes three held candidates."
    watch:
      [
        inspired by God,
        inspiration of,
        God-breathed,
        God breathed,
        inspired word,
      ]
    triggers:
      - episode: 6
        speaker: "Dan McClellan"
        timestamp: "00:42:55.230"
        text: "Well, actually, independently of when you think this text was written, this word was used exclusively to refer to Jewish scriptures in this time period. So the author here is without a doubt referring to the texts that were in circulation, that were considered authoritative, inspired, that were considered scripture by the Jewish community."
      - episode: 6
        speaker: "Dan McClellan"
        timestamp: "00:51:49.310"
        text: "The overwhelming consensus among believing readers of the text is that God-breathed means inspired, that the scriptures were breathed out by God or they were in some sense composed under God's breathing authority or influence. God is breathing down the author's neck in some way. And that's been a very, very common reading for a long, long time, but not the entire time. We can roughly pinpoint when that reading started."
      - episode: 6
        speaker: "Dan McClellan"
        timestamp: "00:52:52.050"
        text: "It was around the third century with the writer Origen who kind of popularized and promulgated that reading, understanding theopneustos to mean inspired."
      - episode: 6
        speaker: "Dan McClellan"
        timestamp: "00:53:55.170"
        text: "And in pretty much everywhere that Dr. Poirier found this word in Greco-Roman, Jewish or Christian literature prior to Origen, that's the meaning. And I think he makes a very strong case that this text was intended to function that way, that it should be understood to mean all Scripture is life-giving and is profitable for teaching, for reproof, for correction, for training in righteousness."
      - episode: 164
        speaker: "Leslie Baynes"
        timestamp: "00:36:42.209"
        text: "Well, Moffatt also said it in the preface to his New Testament that you had to reject the idea of, uh, plenary verbal inspiration, mechanical inspiration, uh, however you want to phrase the thing."
    notes: '#125 gate-1 read (2026-11-23): every watch-term hit line in the 11 matching Transcripts, plus about two minutes either side of each recorded claim; the Ep 164 claim came from the inerrancy read. Substantive claims are almost all Ep 6 on 2 Timothy 3:16; the rest are passing mentions. The "overwhelming consensus" at 00:51:49 is among believing readers, not scholars. The life-giving reading rests on one scholar (John C. Poirier, The Invention of the Inspired, 2021), so the core may narrow to what theopneustos means in 2 Timothy 3:16. Core is the show''s thesis, not yet sourced.'

statements:
  - page: daniel-date
    question: "In what language were the additions first written?"
    triggers:
      - episode: 70
        speaker: "Dan McClellan"
        timestamp: "00:31:24.860"
        text: "And so it, it's. It's an additional chapter that's tacked on at the. The end of Daniel and was probably written in Greek and added into the Book of Daniel."
    notes: "Conflict with additions-origin: the quote has Bel and the Dragon probably written in Greek; the statement says the additions were possibly first composed in Hebrew or Aramaic (NABRE notes “probably”, Posen “may”, McLay “suggest”; short reworded at the #155 second pass, 2026-11-25), with McLay allowing that the Old Greek of Bel reads more like a dynamic translation or even a Greek composition. Logged at the #155 first pass, 2026-11-25."
  - page: daniel-date
    question: "When was the Book of Daniel written?"
    triggers:
      - episode: 45
        speaker: "Kipp Davis"
        timestamp: "00:40:42.040"
        text: "So, so, like, just very briefly, scholars are uniformly convinced that the Book of Daniel was not completed until well into the second century after the Hasmonean revolt, and that the prophecies in the Hebrew portion, beginning in chapter 8 through to 12, were all written after the fact and, you know, set in the mouth of Daniel as if they were predictions of the future."
    notes: "Conflict with date: “uniformly convinced” states unanimity; the statement reports, from Suchard (JBL 2022) and Valeta's Bible Odyssey box, that some still hold a sixth-century date. The second-century date itself agrees. Logged at the #155 first pass, 2026-11-25."
  - page: david-and-the-united-monarchy
    question: "Who killed Goliath?"
    triggers:
      - episode: 52
        speaker: "Dan McClellan"
        timestamp: "00:16:16.110"
        text: "And so the scholarly consensus is that there was a story about a dude named Elhanan who killed this giant named Goliath. And suddenly there's a five finger discount going on by whoever is responsible for the David history."
    notes: "Conflict with goliath: “the scholarly consensus is” states a consensus; the statement reports the Elhanan explanation as one explanation (HarperCollins “Some interpreters”, EJ “more likely”) and names dissent (EJ's Elhanan = David; Garsiel on the duel's general reality). Logged at the #150 publish, 2026-11-25."
  - page: david-and-the-united-monarchy
    question: "Did David and Solomon rule a united kingdom of Israel and Judah?"
    triggers:
      - episode: 139
        speaker: "Dan McClellan"
        timestamp: "00:48:17.291"
        text: "and here's the thing, there was never a single united kingdom. Scholars are pretty sure that Judah in the south and Israel in the north were originally separate kingdoms."
    notes: "Conflict with united-monarchy: “there was never a single united kingdom. Scholars are pretty sure …” states near-unanimity; the statement reports a debate, with Faust and Sapir and Garfinkel et al. arguing for an early state. The same turn goes on “maybe … Israel might have subjugated the southern kingdom”. Logged at the #150 publish, 2026-11-25."
  - page: satan-demons-and-angels
    question: "Is the serpent in Genesis 3 Satan?"
    triggers:
      - episode: 18
        speaker: "Dan McClellan"
        timestamp: "00:50:40.250"
        text: "But we don't really see an explicit identification of Satan either with the serpent in the Garden of Eden or with Lucifer until we get into the 2nd and 3rd centuries CE within early Christianity."
    notes: "Conflict with serpent: the quote puts the first explicit identification of the serpent with Satan in the second and third centuries CE; the statement reports the NABRE's note that Wisdom 2:24 is the first biblical text to equate the serpent with the devil, and Christian tradition's reading of Revelation 12:9 and 20:2, alongside Dolansky's view that the two are not brought together until early Christian writings. Logged at the #147 first pass, 2026-11-26."
  - page: satan-demons-and-angels
    question: "Did Persian religion shape the idea of Satan?"
    triggers:
      - episode: 18
        speaker: "Dan McClellan"
        timestamp: "00:53:30.770"
        text: "So we have a dualism that seems to pop up within early Judaism following the Babylonian exile. And a lot of scholars would say Zoroastrianism seems like the most likely source of that."
    notes: "Conflict with persia: “a lot of scholars would say … most likely” states a majority view; the statement reports the question as contested (Collins “controversial”, Silverman “in no way … proved or disproved”, the Angra Mainyu derivation “typically rejected”), with Stephens, Hayes and Jonker on the side of influence. Logged at the #147 first pass, 2026-11-26."
  - page: satan-demons-and-angels
    question: "When do angels get names?"
    triggers:
      - episode: 28
        speaker: "Dan McClellan"
        timestamp: "00:24:30.320"
        text: "So New Testament angels, very different from Hebrew Bible angels. And they have names."
    notes: "Conflict with names: as trimmed, the quote sets named New Testament angels against Hebrew Bible angels; the statement reports that Daniel, among the latest books of the Hebrew Bible, first names Gabriel and Michael (Sommer, Merrill Willis, Bamberger). The speaker goes on (00:25:51, hedged) to place Michael in Daniel. Removed from the page by the #147 second pass and logged at the #147 publish, 2026-11-26."
  - page: the-origins-of-hell
    question: "Why do some Bibles translate Sheol as “hell”?"
    triggers:
      - episode: 98
        speaker: "Dan McClellan"
        timestamp: "00:10:40.640"
        text: "So in the Hebrew Bible, you have no concept of hell as, as we understand it, you have Sheol, and in the King James Version, that is translated as hell every single time."
    notes: "Conflict with translations: “translated as hell every single time” states one rendering throughout; the statement reports that the King James rendered Sheol as “hell” in some places and as “grave” or “pit” in others (ISBE, with the NCE, HarperCollins and Zaleski). The same turn's next sentence (“But Sheol is a reference to the grave and the abode of all the dead.”) is attached to the page as 98@00:10:40. Logged at the #148 first pass, 2026-11-26."
  - page: the-origins-of-hell
    question: "Does Paul speak of hell?"
    triggers:
      - episode: 89
        speaker: "Dan McClellan"
        timestamp: "00:41:01.240"
        text: "Paul never uses any of the three words for hell anywhere. And so whether it's Gehenna, Tartarus or Hades, they never occur in any of Paul's writings."
    notes: "Conflict with paul: the quote says Hades never occurs in Paul's writings; the statement reports Janse van Rensburg and Van Eck's reading that Paul refers to Hades once, at 1 Corinthians 15:54–55. Gehenna's absence agrees. Logged at the #148 first pass, 2026-11-26."
  - page: the-origins-of-hell
    question: "Does Paul speak of hell?"
    triggers:
      - episode: 15
        speaker: "Dan McClellan"
        timestamp: "00:30:11.840"
        text: "Paul does not talk about it at all. We do not have any of them in Paul."
    notes: "Conflict with paul: “it” and “them” are the three categories of divine punishment after death (annihilation, temporary torment then annihilation, eternal conscious torment); the quote says Paul reflects none of them; the statement reports Bakhos (“Paul describes the wicked as simply being destroyed”) and Janse van Rensburg and Van Eck (Paul “actually adopted … annihilation”). Logged at the #148 first pass, 2026-11-26."
  - page: new-testament-later-additions
    question: "Did Erasmus promise to include the comma if a single Greek manuscript containing it were found?"
    triggers:
      - episode: 160
        speaker: "Dan McClellan"
        timestamp: "00:11:06.600"
        text: 'And he basically said, "Look, I''m not going to include this unless I have a Greek manuscript that has it, because it''s not in any of the Greek manuscripts." And lo and behold, somebody shows up with a Greek manuscript that has it.'
    notes: "Conflict with promise: the quote has Erasmus saying he would not include the comma without a Greek manuscript; the statement reports de Jonge (ETL 1980) and McDonald (Leiden 2011) that the promise has no foundation in Erasmus's works and is a persistent legend. Logged at the #149 first pass, 2026-11-26."
  - page: new-testament-later-additions
    question: "What did the King James translators work from?"
    triggers:
      - episode: 160
        speaker: "Dan McClellan"
        timestamp: "00:12:17.026"
        text: "The third edition has the Comma Johanneum, and it just so happens that the edition that the King James translators relied on for their revision was the third edition."
    notes: "Conflict with kjv-text: the quote has the KJV translators relying on Erasmus's third edition; the statement reports Holmes (Bible Odyssey) that Beza's 1588–89 and 1598 editions were heavily used. The same turn calls the third edition the Novum Instrumentum; de Jonge (ETL 1980, p. 385) says the edition was entitled Novum Testamentum from 1519. Logged at the #149 first pass, 2026-11-26."
  - page: new-testament-later-additions
    question: "What is Codex Sinaiticus?"
    triggers:
      - episode: 17
        speaker: "Dan McClellan"
        timestamp: "00:39:07.650"
        text: "There's the famous discovery of Sinaiticus, which is our earliest manuscript of the full Bible that we know of. That's probably mid to late 4th century CE."
    notes: "Conflict with sinaiticus: “our earliest manuscript of the full Bible” is stronger than the statement, which reports the Codex Sinaiticus Project that about half of its Old Testament survives and that Codex Vaticanus is of similarly early date. Logged at the #149 first pass, 2026-11-26."
  - page: the-emergence-of-monotheism-and-the-divine-council
    question: "When does the Bible first deny that other gods exist?"
    triggers:
      - episode: 59
        speaker: "Dan McClellan"
        timestamp: "00:49:48.500"
        text: "And so our generation is, is coming on what I hope is the tail end of the, the era of Deutero Isaiah. They're, they're constantly trying to hold that threshold against the data and say, no, no, no, we have it by this time."
      - episode: 59
        speaker: "Dan McClellan"
        timestamp: "00:50:52.840"
        text: "Well, one, the question of where the threshold is is the wrong question to begin with. But two, it's definitely not anywhere in the Bible."
    notes: "Conflict with explicit: both turns deny that monotheism appears anywhere in the Bible, Second Isaiah included; the statement reports, from Coogan and Chapman, the NABRE notes, Hayes, Sperling, Markl and Machinist, that Second Isaiah is the first explicit denial that other gods exist, with Fredriksen's reading of such declarations as loyalty language attributed in the text. Logged at the #151 first pass, 2026-11-27."
  - page: the-emergence-of-monotheism-and-the-divine-council
