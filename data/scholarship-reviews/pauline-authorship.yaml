leads:
  - "Ehrman, A Brief Introduction to the New Testament, 5th ed.: a web-search summary (not the catalogue page) gives 1 Oct 2020 for the US listing but 13 Dec 2021 for the UK listing, ISBN 9780190089528. Both years are inside the window. The registry keeps 2020 from the #95 catalogue read."
  - "NABRE introduction to 1 Timothy (https://bible.usccb.org/bible/1timothy/0): “Most scholars are convinced that Paul could not have been responsible for the vocabulary and style, the concept of church organization, or the theological expressions found in these letters.” Not re-read in this pass. The NABRE New Testament preface (https://bible.usccb.org/bible/newtestament/0, read 2026-11-23) is dated September 30, 1986 and says “In most cases the introductions and notes have been entirely rewritten and expanded”, so the NT introductions fall outside the 30-year window for state-of-the-field statements (#86)."
  - "NABRE introduction to Ephesians (https://bible.usccb.org/bible/ephesians/0): “much of critical scholarship has considered the letter’s style …”. Same 1986 window problem."
  - "Bulundwe p. 325, note 9: “According to Burnet, 90% of the scholars consider the Pastoral Epistles (1 et 2 Tim; Titus) as pseudepigrapha”. This reports Régis Burnet, Épîtres et lettres (Cerf, 2003), 200–201, secondhand; Burnet not opened."
  - "Frank J. Matera, New Testament Theology (WJK, 2007), pp. 240–241: “which most scholars classify as pseudonymous”. Google Books snippet (#86)."
  - "Mark Allan Powell, Introducing the New Testament (Baker, 2009): “many scholars believe that the three Pastoral Letters can be regarded as pseudepigraphical”. Google Books snippet (#86)."
  - "Luke T. Johnson, The First and Second Letters to Timothy (Doubleday, 2001), and Jens Herzer, “Abschied vom Konsens?”, ThLZ 129 (2004): the dissenting works Bulundwe cites. Not opened."
  - "Raymond E. Brown, An Introduction to the New Testament (1997): widely cited for per-letter estimates. Not readable (print-disabled scans, no Google preview)."
