leads:
  - "#145 2026-11-24: pastorals-dissent cut (see uncited). Bulundwe (dropped) named Johnson (all three Pastorals authentic) and Herzer (only 1 Timothy pseudonymous) as dissenters; reading either in their own work, beside Martin l19, would let a dissent statement return."
  - "Ehrman, A Brief Introduction to the New Testament, 5th ed.: a web-search summary (not the catalogue page) gives 1 Oct 2020 for the US listing but 13 Dec 2021 for the UK listing, ISBN 9780190089528. Both years are inside the window. Settled in the second pass: the US catalogue page gives 01 October 2020 (see sources)."
  - "NABRE introduction to 1 Timothy (https://bible.usccb.org/bible/1timothy/0): “Most scholars are convinced that Paul could not have been responsible for the vocabulary and style, the concept of church organization, or the theological expressions found in these letters.” Not re-read in this pass. The NABRE New Testament preface (https://bible.usccb.org/bible/newtestament/0, read 2026-11-23) is dated September 30, 1986 and says “In most cases the introductions and notes have been entirely rewritten and expanded”, so the NT introductions fall outside the 30-year window for state-of-the-field statements (#86)."
  - "NABRE introduction to Ephesians (https://bible.usccb.org/bible/ephesians/0): “much of critical scholarship has considered the letter’s style …”. Same 1986 window problem."
  - "Bulundwe (no longer cited; see uncited) p. 325, note 9: “According to Burnet, 90% of the scholars consider the Pastoral Epistles (1 et 2 Tim; Titus) as pseudepigrapha”. This reports Régis Burnet, Épîtres et lettres (Cerf, 2003), 200–201, secondhand; Burnet not opened."
  - "Frank J. Matera, New Testament Theology (WJK, 2007), pp. 240–241: “which most scholars classify as pseudonymous”. Google Books snippet (#86)."
  - "Mark Allan Powell, Introducing the New Testament (Baker, 2009): “many scholars believe that the three Pastoral Letters can be regarded as pseudepigraphical”. Google Books snippet (#86)."
  - "Luke T. Johnson, The First and Second Letters to Timothy (Doubleday, 2001), and Jens Herzer, “Abschied vom Konsens?”, ThLZ 129 (2004): the dissenting works Bulundwe cites (Bulundwe no longer cited). Not opened."
  - "Raymond E. Brown, An Introduction to the New Testament (1997): widely cited for per-letter estimates. Not readable (print-disabled scans, no Google preview)."
uncited:
  - "#145 2026-11-24: statement pastorals-dissent cut (question “Does any scholar defend Paul's authorship?”, short “Some do.”). Was pastorals-dissent/1, Martin l19 ch. 1 [00:00:00]: “There has been some question in the last several years that maybe the actual historical Paul wrote II Timothy because II Timothy looks sort of like a last will and testament of Paul that he may have written in prison. But I don't tend to buy that.” and pastorals-dissent/2, ch. 3 [00:26:50]: “So there are scholars who would defend these letters being by Paul and that's what they would say.” Both verified in the second pass 2026-11-23. Cut because “Some do.” was Martin's report alone."
  - "#145 2026-11-24: R. F. Collins, “Pastoral Epistles”, New Catholic Encyclopedia, on Encyclopedia.com (bibliography to 2001, so the 2nd-edition text), read in full: “by the end of the twentieth century biblical scholarship reached almost universal consensus that these texts had not been written by Paul. A small number of scholars continue to hold that some of Paul's personal notes have been incorporated into 2 Timothy (the so-called fragment hypothesis).” Not cited: the New Catholic Encyclopedia's class is unruled (#86), and the fragment hypothesis is not a defence of Paul's authorship. If the owner rules it Reference, it and Martin l19 could back a reworded statement (“Does any scholar think Paul had a hand in them?” / “A small number do, at least for 2 Timothy.”), and its “almost universal consensus” could join pastorals."
  - "Kampotela Luc Bulundwe, “Ethics and Pseudepigraphy: Do the Ends Always Justify the Means?”, Athens Journal of Humanities and Arts 6.4 (2019), pp. 323–344 (University of Geneva repository PDF). Was undisputed/3 (p. 323, “most commentators distinguish seven authentic epistles”), pseudepigraphy/2 (p. 323, “up to six pseudepigraphical epistles”), accepted/2–5 (pp. 324, 326: the indifference idea, Amsler, forgery “so widespread” since Ehrman 2013, Aune and Burnet), pastorals/4–5 (p. 336 and note 74: 2 Timothy's pseudonymity “the majority but not unanimous position”; the consensus questioned by Johnson and Herzer) and pastorals-dissent/1–2 (note 74: Herzer, only 1 Timothy pseudonymous; Johnson, all three authentic). Dropped 2026-11-23 by the owner's decision: the publisher (ATINER) has a weak reputation and the article's scope on the Pastorals is narrow. Quotes not re-matched in the second pass, since the source is not cited. The page loses Johnson and Herzer by name and “not unanimous”."
  - "Ehrman ch. 16 summary, section “Pseudonymity in the Ancient World”: “This is not to say, however, that this behavior was condoned in antiquity. On the contrary, ancient authors almost universally condemned the practice.” Verified verbatim in the second pass 2026-11-23. Was accepted/1. The accepted statement (“Was writing in someone else's name accepted in antiquity?” / “Views differ …”) is cut: “Views differ” and “has spread since 2013” rested only on Bulundwe. This sentence alone would answer the question one way while the first pass's reading found the matter disputed, so it is not used to rebuild the statement (when in doubt, cut)."
