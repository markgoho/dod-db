leads:
  - "Finkelstein and Römer, “Comments on the Historical Background of the Jacob Narrative in Genesis”, ZAW 126 (2014) 317–338, and “…of the Abraham Narrative”, HeBAI 3 (2014) 3–23: author offprints behind bot walls (serval.unil.ch, HAL); not read."
  - "Shupak, “The Joseph Story (Genesis 37–50) from an Egyptological Perspective”, JAOS 145.2 (2025): abstract only (“Most scholars today regard the Joseph story as an exilic novella…”, a view she argues against); article paywalled."
  - "Schipper, “The Egyptian Background of the Joseph Story”, HeBAI 8/1 (2019): summary only; paywalled."
  - "Encyclopedia of the Bible and Its Reception, “Abraham” (De Gruyter 2009): copy found was a licensed, watermarked download; not cited."
  - "de Pury, “The Jacob Story and the Beginning of the Formation of the Pentateuch” (SBLSymS 34, 2006); Schmid, Genesis and the Moses Story (2010): no open copy."
  - "Dozeman, “The Wilderness and Salvation History in the Hagar Story”, JBL 117 (1998): no open copy; known via Onwukwe."
  - "Trible, Texts of Terror (1984); Levenson, Death and Resurrection of the Beloved Son (1993); Spiegel, The Last Trial: known only as reported (Noble, EJ)."
  - "Westermann, Genesis 12–36; T.D. Alexander 1992; Peleg 2006: known only via Tushima. Baden, The Composition of the Pentateuch (2012), on J/E in Gen 37: via Römer et al. n. 3."
  - "Sapir-Hen and Ben-Yosef, “The Introduction of Domestic Camels to the Southern Levant”, Tel Aviv 40 (2013): repository link broken; TAU press release only (not a qualifying class)."
  - "Grossman, “Two Double Narratives in Genesis: Hagar's Departure (16, 21)”, Megadim 29 (1998): catalogue record only."
  - "Chabad.org, Posner, “Who Was Abraham?”: 403 to scripts; one sentence via a fetch tool, not saved; no Jewish denominational source on the tradition statement."
  - "Kitchen, “The Patriarchal Age: Myth or History?”, BAR 21:2 (1995): teaser excerpt only; outside the window."
  - "Shenhav, “Rethinking the Aqedah after the Holocaust”, in Aqedah (De Gruyter 2025): PDF on a third-party site (Agnon House), licence unclear; not cited."
uncited:
  - "Lemański 2020, p. 67, “There is a consensus among exegetes that the formula marks the final stage of coalescing of the patriarchal traditions.”: read; covers only the three-name formula, not the whole thesis, so not used for the core's wording."
  - "Tobolowsky, “Since the 1930s, many scholars have argued that there were twelve tribes…”: read; a separate twelve-tribes statement was cut (field rests on Tobolowsky alone); two sentences kept in traditions."
  - "Hayes l6, Isaac as “the most invisible of the patriarchs”; Mbuvi, Bible Odyssey “Isaac”: read; an Isaac statement was cut (the southern-tribe suggestion is Coogan alone)."
  - "Hagar's name: EJ Hagar (“The etymology of Hagar is obscure”), Drey, AUSS 40.2 (2002), Gafney (“perhaps more epithet than name”), JWA (“could be heard as hagger”): read; only wordplay, no statement."
  - "Galatians 4:21–31: EJ Ishmael, Greenspahn ER Isaac and Moyise (Bible Odyssey) read; they disagree on whom Paul's Hagar stands for; no statement and no Trigger Claim."
  - "Schmid 2012, p. 190 (common ground with Baden) and p. 203 (Hosea 12, Ezek 20 and 33): read; the jacob-first text uses only his summary."
  - "Finkelstein, The Forgotten Kingdom, pp. 141–142, the configuration putting Abraham first as “a late construct”: read; the sentence breaks across a page and figure caption; not cited."
  - "EJ Genesis, “All this makes it likely that some Genesis narratives have preserved some authentic reminiscences of early tribal history.”: read; the historical text carries the split through Hayes, Mazar and Lombaard."
  - "NABRE intro ¶ 7, “it is reasonable to accept the Bible’s own chronology…”: read; NABRE's own lean (as on the Timeline's abraham entry), not cited."
  - "EJ Camel (Feliks, first-edition text) on camel bones in early Egypt: read; outside the window."
  - "Hoffmeier, Tyndale Bulletin 43.1 (1992), “Clearly there is no agreement on the question of sources”: read; outside the window."
  - "Hayes l5, the wife-sister stories as rhetorical questions: read; framing only."
  - "EJ Philistines (Greenfield / Sperling), “anachronistic”: read; anachronisms carried by Finkelstein, EJ Genesis and NABRE."
  - "Answers in Genesis, M. McClellan, “Abraham and the Chronology of Ancient Mesopotamia”, ARJ 5 (2012): read; the page disclaims AiG's own view, so not cited for a tradition."
  - "Got Questions, “Who are the biblical patriarchs?”; ABR About page; CCC §2570 prayer passage: read; not needed."
  - "Bible Odyssey articles on Sarah, Rebekah, Rachel, Leah, Jacob (Cook), the Torah (Nihan and Rhyder); Kaminsky on the Akedah; EJ Patriarchs: read; nothing used."
  - "Hendel, Bible Odyssey, Haran and El as possible ancient memories: read; the historical text uses his existence sentence."
  - "Greenspahn ER Jacob, the Bronze Age setting for those who accept the patriarchs' historicity: read; not used."
  - "Mazar, p. 59, his parallels-too-close sentence: read; summarised in the historical text, cited only via historical/6."
