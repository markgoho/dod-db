storical; no short they draw on changed. Flags for the second pass: (1) jacob-first/13: check that “this question” is the Abraham narratives' date (p. 4 end, p. 3 abstract). (2) Finkelstein appears on jacob-first in three works; check the text attributes each and the short does not lean on him as several authors. (3) anachronisms/13: the paper's scope is the pack-camel date, not Genesis; check the text claims no more. (4) joseph-story/10: abstract-only field sentence from an author who disputes it; check the text frames it so and the short stays “disputed”. (5) tradition short: check “A Chabad-Lubavitch article” names the source in its own terms and is no stronger than Posner's two sentences.
