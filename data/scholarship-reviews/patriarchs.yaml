# Review record for /scholarship/patriarchs/ (#93 shape). Not rendered.
# agent: results of the agent first pass (#153, 2026-11-27). That pass does not count toward publish.
# owner: empty (""). The owner delegated the publish review (#93, 2026-11-23); the `delegation` block records the independent second agent pass once it has run.
# Issue #153: queued as candidate `patriarchs` ("Abraham, Isaac and Jacob"); the issue adds Joseph and Hagar (statements joseph-sale, joseph-story, hagar-twice, ishmael, hagar-exodus). Confessional study Bibles are Tradition and don't count toward the core; NABRE is Reference (scholarly-association notes, CONTEXT.md). Overlaps kept out: God of the fathers / El (the-origins-of-yahweh el, resemblance), Hagar as slave-wife or concubine (marriage-polygamy-and-adultery-in-the-bible concubines), teraphim and Abraham as first monotheist (the-emergence-of-monotheism-and-the-divine-council); the Exodus itself (moses-and-the-exodus). Registry ids reused: coogan-brief-4e-summary-ch4, -ch5, hayes-rlst145-l6, -l7, nabre-genesis-intro, hendel-2018-abraham, ej-history-beginning-monarchy, finkelstein-2013-forgotten-kingdom, gafney-bo-hagar, abr-wood-2009-ur. The Timeline's abraham entry (#187, #199) dates the patriarchs; this page does not, and follows #199's note not to reuse EJ History's “first half of the second millennium” setting sentence.
# Sourcing test (#153, 2026-11-27): gate 1, 20 Trigger Claims in Episodes 1, 3, 22, 63, 64, 74, 111, 118, 121, 157 and 169 (the inventory's six from Episodes 63, 121 and 157 among them; 63@00:07:47 not used for its two slips, 00:07:22 and 00:08:44 instead), each read with about two minutes either side. Gate 2, the core: the candidate “Abraham, Isaac and Jacob come from separate traditions woven together” sourced as “their traditions came from different groups and were only later joined as grandfather, father and son”, with “many scholars hold” from Greenspahn (“Many modern scholars consider…”), Lombaard 2010 (“a point long accepted”) and Lemański 2020 (“according to scholars involved with historical-critical studies”). No source says “consensus” for the whole thesis (E121's word); Lemański's “consensus” covers only the three-name formula (uncited). Gate 3: 6 independent authors behind the core (Lombaard, Greenspahn, Lemański, Coogan and Chapman, Hong, Tobolowsky). Gate 4: 13 statements.
# Dropped for want of a second author or a readable source: the twelve-tribe scheme as a separate statement (field: Tobolowsky only; two of his sentences kept in traditions); Isaac and a southern tribe (Coogan only; in the traditions text); Hagar's name (sources call it obscure; the ger link is wordplay); Galatians 4 (sources disagree); Jacob and the Exodus as rival origin traditions as a separate statement (Schmid's self-report and Lemański's “unsolved”; both in the jacob-first text); the Joseph story's date as “most scholars … Persian or Hellenistic” (Shupak's abstract only, a view she argues against; lead); Genesis 22:19 as evidence of an E version where Isaac dies (no qualifying source).
# Rulings: historical: the sources disagree about the field itself (Mazar “most scholars … late invention”, Hayes “seriously divided”, Lombaard 2010 “the greater part … some historical referentiality”), so the short says “Scholars are divided” with no frequency word (#80), as #199 found. jacob-first: Lemański (“generally agreed”) and Lombaard (“already accepted”) on a late Abraham narrative stand against NABRE's “a few regard them as late” and Coogan's “some scholars have dismissed these narratives as a historical fiction from late”, so the short says the Abraham question “remains debated”; the Hosea 12 point keeps its field wording (Lombaard 2014 and Lemański). joseph-sale: the short leads with the textual fact; the two-traditions reading rests on NABRE and EJ (own view) and the debate on Römer et al.; E74 and E22, which assert two complete stories, take one side of a split the statement shows and are kept (CONTEXT, 2026-11-25), flagged.
# First pass: four research agents fetched every source on 2026-11-27 into separate scratch folders and copied quotes from the saved text; the lead re-read the NABRE chapter notes live. Every page quote script-matched: 92 against saved text (whitespace, HTML entities, quotes, dashes normalised; PDF line-end hyphens joined; footnote markers after punctuation ignored), 10 NABRE notes matched in the live page in Chrome by JavaScript on whitespace-normalised text (bible.usccb.org refuses scripted requests with a bot check; an Internet Archive fetch was refused by this session's permission rules and not retried): 102/102, 0 misses. NABRE intro ¶ 7 matched against a saved copy. The second pass must re-fetch, and read NABRE in a browser.
# Access quirks for the second pass: bsw.org (Hong, Schmid) serves one HTML page per printed page and double-encodes punctuation (mojibake) in scripted copies; Lemański's PDF sets the first letter as a drop cap; Tushima's two-column PDF interleaves with a QR caption in layout mode (use plain pdftotext); encyclopedia.com “people” URLs aggregate several encyclopedias' entries (sarna-sperling-ej-abraham, greenspahn-er-*, sarna-ej-joseph): attribute by the signature after each entry; Bible Odyssey may challenge scripts.
# Flags for the second pass: (1) Greenspahn's ER entries are signed “1987 and 2005”; which wording is 2005 is not shown (window). (2) EJ 2nd-ed. entries revised by Sperling: sentence dates not shown; four EJ ids share the reviser, and no short rests on two EJ ids alone. (3) sarna-ej-joseph is signed by Sarna alone and may be first-edition text; it backs own-view descriptions only. (4) Lombaard 2010's “long accepted” is a parenthesis inside his own list of positions. (5) Schmid's “increased acceptance” is a proponent's self-report, attributed (“he says”). (6) Mazar's p. 58 anachronisms sentence describes the pre-1970s view; text says “were once considered”. (7) Tushima's “had been” is past tense. (8) Coogan ch. 4's “almost all biblical scholars” is about the Pentateuch's repetitions in general, used in the wife-sister text only. (9) tradition short: “Evangelical ministries treat the patriarchs' stories as history” is our summary of ABR (Wood's chronology, Caesar's “reflection of historical reality”) and Got Questions; check it is no stronger than they are. (10) ishmael short's “Abraham's son by Hagar” is the biblical narrative, uncontested. (11) The hagar-exodus short's “They differ” reports a split among the cited sources (Marzouk, Trible via Noble vs Frymer-Kensky and Kamionkowski, Noble); the page does not count them.
# Second agent pass 2026-11-27 (#93 delegation, independent): every source re-fetched into the second pass's own scratch folder; no first-pass file opened. By curl: 42 URLs (Lombaard ×2, Lemański, Hong p. 337, Schmid p. 208, Encyclopedia.com ×9 pages for 10 ids, the SBL Quest PDF, Forgotten Kingdom PDF, Tushima, Römer et al., Noble ×2, Onwukwe, JWA, Coogan ch. 4 and ch. 5, Hayes l6 and l7, vatican.va ×2, ABR ×2, Got Questions, 10 Bible Odyssey pages, NABRE Genesis intro); Bible Odyssey served curl this time with no challenge. NABRE Genesis 11, 12, 20, 21, 26, 37 refuse scripts (403 bot check) and the Internet Archive was refused by this session's permission rules, so they were read live in Chrome at the public URLs (each by page navigation; 11 and 21 also by in-page fetch from 12 before that was refused) and matched in-browser. 102/102 quotes matched: 90 by script on whitespace, NFKC and quote/dash folding, line-end hyphens joined; anachronisms/2 needed punctuation-insensitive matching (PDF extraction); joseph-sale/5 matched with footnote digits 3 and 4 ignored; 10 NABRE notes in the browser. PDF pages read from printed page numbers; HTML paragraphs and headings counted from the markup. All 20 Trigger Claims re-matched by script at timestamp and speaker in the final Transcript and read two minutes either side.
# Second pass changes. Five shorts: wife-sister (cut “and long took Genesis 12 to be the earliest; others read the later two as literary compositions drawing on it”, each one author via Tushima, #133); joseph-story (“Scholars note its own style and plot, and some call it a novella”, not “one continuous, novella-like story”, as “continuous” was Sarna's alone and Coogan says “some scholars”); anachronisms (“Some scholars take them as signs that the stories were written late; they were once read as later additions to older traditions”, as Mazar's sentence reports the pre-1970s view); tradition (“Two evangelical ministries write of the patriarchs as historical figures … articles on its site and on Got Questions argue that the patriarchs' camels are no anachronism”, not “Evangelical ministries treat … as history … reject”, which widened two named sources to a class). hagar-twice short (“Critical scholarship often attributes them to the J and E sources”, not “the first mainly to J and the second to E”, which only EJ Hagar gives). Text: hagar-twice (EJ Hagar's separate-crystallizations reading is conditional, “difficulties … are lessened if”, not “prefers”); ishmael (EJ Hagar's etiology sentence is conditional, “would serve”). No citation cut. Locators: traditions/2 (Greenspahn paragraph begins “Many modern scholars consider”), traditions/9 (“More recently, however”), anachronisms/4–5 (EJ Genesis “Composition – The Critical View”, subsection “Anachronisms”, not “The Age of the Material”), joseph-sale/4 (subsection “Duplications”), joseph-sale/5 and hagar-twice/6 (p. 2), ishmael/5 (“Source Criticism”), wife-sister/8 (“History of Scholarship”), joseph-story/8 (paragraph beginning “Joseph is presented as a man”), akedah/5 (“Did You Know?” list), tradition/6 (answer, final paragraph, beginning “In short”).
# Second pass flags: (1) Triggers 157@00:03:56 (“probably literary creations”), 74@00:41:52 (“two entirely different stories”, unhedged) and 22@00:29:37 (whose turn, past the trim, says the two parallel stories have “their own beginnings, their own middles, and their own ends”) each take one side of a split a statement reports (historical's “Scholars are divided”; joseph-sale's “debated”, with Römer et al.'s “no one has succeeded in reconstructing two coherent, independent narratives”). The marriage page logged 44@00:23:11, a flat assertion against a reported split, as a conflict; for the lead to decide (conflict log outside this pass's files). 118@00:07:18 is the same shape but hedged. (2) Trigger 63@00:22:26 is trimmed so that “these are two competing myths” has no antecedent; the cut sentence before it names the patriarchal Jacob and prophetic Moses traditions. (3) jacob-first short “Jacob's” rests on the field reading of Hosea 12 (Lombaard 2014, Lemański p. 72) plus Lemański's and Finkelstein 2013's own priority claims; no source says scholars generally hold the Jacob tradition oldest, and Lombaard 2014 argues the reverse. Kept as framed (“on the usual reading of Hosea 12”). (4) jacob-first “remains debated” rests on NABRE intro ¶ 7 and Finkelstein 2007 (pre-exilic sources) against Lemański (“generally agreed”) and Lombaard (“already accepted”) on an exilic Abraham narrative. NABRE's first clause (“traditionally dated them … second millennium”) dates the stories' setting, not their composition; only its “a few regard them as late (sixth or fifth century B.C.)” bears on composition, and it covers all the ancestral stories, Abraham's included. Kept. (5) hagar-exodus “They differ on whether her story reverses the Exodus or foreshadows it”: Marzouk's “reversal” is of roles; the reversal side rests mainly on Trible as reported by Noble. (6) “No record found outside the Bible names any of them” (historical) rests on two EJ ids only, against the first pass's flag (2); exempt as an uncontested fact (#133). (7) The first pass's flags (1) Greenspahn window, (3) sarna-ej-joseph edition, (5) Schmid's self-report and (7) Tushima's past tense stand; years not printed on the fetched copies of EJ, CCC, Got Questions, Hayes and Noble were not re-checked. Publish rule recomputed: 13 statements, core traditions backed by 6 independent authors (3 Scholarly, 3 Reference), none Host-authored; holds. Ids, slug, draft, review and sourcesRead unchanged.
