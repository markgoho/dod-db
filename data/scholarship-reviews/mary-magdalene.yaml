# Review record for /scholarship/mary-magdalene/ (#93 shape). Not rendered.
# agent: results of the agent first pass (#157, 2026-11-27). That pass does not count toward publish.
# owner: empty (""). The owner delegated the publish review (#93, 2026-11-23); the `delegation` block records the independent second agent pass once it has run.
# Issue #157 note: the Ep 12 guest argues a textual point on Magdala and John 11, and the core claim "may not be 'no gospel calls her a prostitute'"; the sources set it. Both of the guest's points are on the page, each reported as one scholar's view with the reply or the common reading beside it (magdala, martha); neither is the core.
# Overlap: Mark 16:9 is cited only as "the longer ending of Mark", with no statement on its authorship (new-testament-later-additions#mark-ending carries that). Nothing here restates the-historical-jesus. Reused registry ids: harpercollins-2009-dictionary (per-citation urls: Mary, Magdala), tonsing-2022-ending-of-mark, martin-rlst152-l13.
# Sourcing test (#157, 2026-11-27): gate 1, 18 Trigger Claims in Episodes 12, 48, 50, 94, 123, 127, 133 and 185 (every final transcript grepped for "magdal"), each script-matched at its turn's leading timestamp and speaker, read about two minutes either side. Gate 2, the core: the candidate "no gospel calls her a prostitute; the image comes from Gregory the Great" sourced at the strength "No; scholars trace the image to later readers who identified her with the sinful woman of Luke 7, an identification Gregory made in a sixth-century sermon": Swenson (Reference, "nowhere in the Bible"), HarperCollins (Powell, ed., Reference, "nonhistorical tradition ... derived from confusing her"), Clanton (Reference, "As many scholars have noted"), Beavis (Reference), Müller van Velden 2024 (Scholarly), Jóźwiak 2024 (Scholarly); Kent 2010 (dissent on identity) concedes "More recent scholarship discounts the previous tradition". "formalised" and 591 are Müller van Velden's alone and stay in the text, attributed. Gate 3: counted by hand, 6 independent authors behind the core (Kent not counted), none Host-authored; Schrader and Taylor are not core sources. Gate 4: 11 statements.
# Independence by hand: Schrader 2017 (HTR), Schrader and Taylor 2021 (JBL abstract), Taylor 2014 (PEQ abstract) and Schrader Polczer 2025 (TC) are one voice for #133, though `independentSources` would count four author strings; none backs a short alone. Fellows 2023 and 2025 are one voice. King 2013 and 2014 are one voice.
# Dropped for want of a second author or any qualifying source: Luke removing her from the cross and tomb and giving her no resurrection appearance (the guest on air; no source states the appearance point); Ephrem merging her with the sinner (Hunt shows only the Bethany and haemorrhage mergers; lead); the 1969 Roman Calendar change and the 1978 Breviary change (Kent's footnote citing Haskins only; Roche gives no year); Eusebius's Magdala, Luke's "called Magdalene" as an epithet, and "no author before the sixth century" (JBL body not open; only the abstract and a news report); Gregory's sexual reading being a later misreading of his sermon (Smit 2022, abstract only, full text blocked); the Gospel of Jesus's Wife beyond one clause (Harvard Divinity School statement and Jacobs's Scalar book fit no source class).
# First pass: three research agents fetched every source on 2026-11-27 into separate scratch folders and copied quotes from the fetched text; every page quote was then script-matched (whitespace, HTML entities, curly quotes, dashes and PDF line-break hyphens normalised; inline tags stripped from HTML) against those saved texts: 94/94, 0 misses. PDF locators checked against printed page numbers (DASH copies carry a cover sheet, so PDF page = printed page + 1). The second pass must re-fetch.
# Flags for the second pass: (1) Abstract-only citations: Taylor 2014 and Schrader and Taylor 2021 (KCL Pure pages; full texts paywalled), as the registry's "abstract only cited" convention; they back only the attributed challenge in magdala. (2) Access: Schrader 2017 is the author's May 2016 manuscript on DukeSpace (bitstream URL; the item page has a browser check), cited by manuscript page, not HTR 360–392; Cirafesi (MDPI) and the two TC 2025 articles return 403 to curl and open in a browser; Fellows 2023 read at the Internet Archive copy because jbtc.org returned 522 (#93 dead-URL rule). The Cirafesi browser save was truncated after the quoted sentence; the quote is whole. (3) Kent 2010 is in a seminary journal of the Adventist church; Scholarly by venue (#80), used only for the attributed dissent and his concession. (4) Swenson's article is a revised excerpt from her trade book Bible Babel (2010); the "Did You Know?" box is not cited, as it may be editorial. (5) Tönsing's "named after her place of origin" and "unmarried" sentences cite Maisch 1998; Müller van Velden's "sinner" sentence cites Ehrman 2006; Müller van Velden's which-mary consensus sentence is set against King's "Scholars are divided", which she quotes, so the short says divided. (6) apostle: Jóźwiak (Hippolytus) and Beavis (Martha and Mary) disagree on the title's first use; the short says disputed. (7) The tradition statement uses an OCA saints' life and a parish text (Fenton, Michigan) on orthochristian.com, each named in its own words; neither speaks for Orthodoxy as a whole. (8) The NTS 2015 editorial is unsigned (author null). (9) TC 2025 Schrader Polczer: header says pp. 147–153, the conclusion sits on p. 154; registry says 147–154. (10) Schrader's p. 45–46 sentence is split into two citations at the page break.
# Second agent pass 2026-11-27 (#93 delegation, independent): all 28 cited sources (29 URLs: two HarperCollins entry pages) re-fetched into the second pass's own scratch folder, not the first pass's files. 25 by curl with a browser User-Agent (PDFs through pdftotext, HTML tags stripped); Cirafesi (MDPI, curl 403) read in Claude in Chrome as page text; the two TC 2025 articles (curl 403, direct PDF load stopped at a bot check, which was not worked around) opened in Chrome from each article page's own PDF link and read on the rendered pages. jbtc.org returned 522 to curl and in Chrome, so Fellows 2023 was matched on the Internet Archive copy. Of the 94 first-pass quotes, 90 matched verbatim by script against the fetched files (whitespace, HTML entities, curly quotes, dashes and PDF line-break hyphens normalised), the two Cirafesi quotes against the browser page text, and the two TC 2025 quotes by eye on the rendered PDF (in-page PDF text extraction was not available); 0 misses. PDF locators checked against printed folios (DASH copies: PDF page = printed + 1); HTML and manuscript locators checked against the nearest heading or paragraph. All 18 Trigger Claims re-matched at timestamp and speaker in the final transcripts as contiguous spans inside the turn (none is the full turn) and read about two minutes either side. 92 citations after the cuts below.
# Second pass changes. Cut to uncited: which-mary/3 (King 2002 read only inside Müller van Velden's block quote: a Lead for King) and which-mary/4 (King HTR 2014's caution is about the Jesus's Wife fragment's Mary, widened in the text to “a Mary”); which-mary/5–6 renumbered /3–/4; their text sentences dropped. Shorts: apostle (“Where the title began is disputed …” to “The title itself comes from later Christian writers, the earliest around the third century”: Jóźwiak's own quoted Hippolytus passage is plural, so she and Beavis may describe one text); bethany (“Western tradition long identified them; Eastern tradition kept them distinct” to “Pope Gregory the Great identified them in a sixth-century sermon”: “long” had no quote here and the East clause is Beavis alone, kept in the text); magdala (Taylor/Schrader epithet sentence, one voice, out of the short; kept in the text); which-mary (“scholars are divided” to “that has been challenged”); peter (“Scholars read … including women's, though they caution …” to “Scholars suggest the dispute may reflect tensions or debates over authority in early Christianity”: Dilley “suggest”, Tönsing “could point”; the caution and “women's” each rested on one author); tradition (“citing Thomas Aquinas's title” to “noting that Thomas Aquinas called her”). Text: apostle drops the uncited, overstated Aquinas sentence; martha “accepts that” to “repeats Schrader's point that”, “diminish” to Fellows's “denigrate”; wife “no clear reference to Jesus's marriage in any ancient text, Christian or non-Christian”. Locators: risen/4 (p. 128), tradition/3 (decree, third paragraph), tradition/7 (paragraph beginning “A woman whose name”), magdala/9 (paragraph beginning “Migdal is located”, not paragraph 1), martha/3 (section “Summative Analysis”), martha/4 (paragraph beginning “In conclusion”), peter/7 (§5, not §3.3). Triggers file and registry not edited.
# Second pass flags: (1) bethany short's “Modern scholarship has tended to treat them as two women” rests on Schrader's report of the tendency, with HarperCollins and Swenson treating them as distinct; Kent's concession (prostitute) would also back it but is not cited in bethany. (2) Kent: JAAS calls itself peer-refereed; a seminary journal of the AIIAS (the Trinity page treated a seminary house journal as non-qualifying for a claim with no other source); here Kent backs only his attributed dissent and concession, never a short or the core; kept. (3) apostle: Jóźwiak (Hippolytus gave her the title) and Beavis (the first use refers to Martha and Mary) are both in the text, attributed; the lead may want to say they may concern the same Hippolytus text. (4) Triggers: first-pass notes say “full turn”, but all 18 are spans; 48@00:39:42's span does not name Mary Magdalene (named later in the turn); 12@00:55:52 “widely known … Peter did not like her” is in some tension with Tönsing's caution in peter's text (hedged; kept); 50@00:14:03's span drops the turn's Ephrem sentence. (5) First-pass flags (1), (2), (4)–(10) re-checked: abstract-only convention exists on trunk (one prior registry entry); access lines accurate; Schrader PDF dated 18 May 2016; TC 2025 header says 147–153 with text on p. 154. (6) bethany: the new short's Gregory sentence rests on Swenson and Clanton; Beavis, cited in the same statement, says Gregory made the sinner Mary Magdalene “rather than Mary of Bethany”; the text reports both, attributed. (7) magdala: with the epithet sentence out of the short, Trigger Claims 12@00:40:46 and 12@00:47:59 argue against the short's common reading; kept, as a Trigger Claim gates the subject, not a statement (CONTEXT.md), but the lead may want to log them as conflicts. (8) martha: Schrader herself calls Martha's presence “the consensus view” (manuscript p. 41, read, not cited), so “That has been proposed and is disputed” may undersell where the field stands; no citation added. Publish rule recomputed: 11 statements; core prostitute on Swenson, HarperCollins, Clanton, Beavis, Müller van Velden, Jóźwiak (6 independent authors; Kent not counted); none Host-authored. Ids, slug, draft and review unchanged.
# Publish 2026-11-27 (lead agent, on the second pass's flags): (1) bethany: the short's second sentence (“Pope Gregory the Great identified them in a sixth-century sermon”) cut, since Beavis, cited in the same statement, says Gregory made the sinner Mary Magdalene “rather than Mary of Bethany”, against Swenson and Clanton; the text now shows that disagreement. The remaining “tended … challenged” sentence rests on Schrader's report with HarperCollins and Swenson. (2) Kent kept for his attributed dissent and concession only. (3) apostle short kept as the second pass narrowed it. (4) 12@00:40:46 and 12@00:47:59 kept: they report the epithet argument the magdala text attributes to Taylor and Schrader and state no contrary fact about what reference works say; not logged as conflicts. (5) martha: Schrader's “the consensus view” (manuscript p. 41) is not added, since a publish may add no citation; the short stays “proposed and is disputed”, the weaker reading; filed as follow-up for the owner's next re-review. (6) 48@00:39:42 extended to the end of “Mary Magdalene and others.” so the trimmed claim names her; re-matched by script at timestamp and speaker. 50@00:14:03 kept: the dropped Ephrem sentence carries no statement (Ephrem's merger is a lead). 12@00:55:52 kept (hedged). Publish rule recomputed: 11 statements; core prostitute on Swenson, HarperCollins (Powell, ed.), Clanton, Beavis, Müller van Velden and Jóźwiak, 6 independent authors, Reference and Scholarly, none Host-authored. draft flag dropped; review and sourcesRead 2026-11-27.
