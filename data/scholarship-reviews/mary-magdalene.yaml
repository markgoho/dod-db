# Re-review first pass (lead agent), 2026-11-27. Read and cited: Schrader 2017 manuscript p. 41 (“the consensus view that Martha was always present in the circulating Fourth Gospel”, martha/12; the second pass's flag (8)); Schaberg and Ringe, “Gospel of Luke”, Women's Bible Commentary 3rd ed. (2012) p. 510, Luke has no appearance to Mary Magdalene (risen/7; the Episode 12 guest's point); Wilson, “Mary Magdalene and Her Interpreters”, same volume, p. 532 (prostitute/12–14); Harvey, Scenting Salvation (2006) p. 295 n. 202 (prostitute/15–16; resolves the Ephrem lead against a merger); Smit, NTT 76.4 (2022), Utrecht repository publisher PDF, English abstract (prostitute/17); De Luca and Lena, “Magdala/Taricheae” (2015) pp. 280–281 (magdala/14–16); King, “Why All the Controversy?” and Shoemaker, “A Case of Mistaken Identity?”, in Jones, ed., Which Mary? (2002; Brill 2003), pp. 54 and 6 (which-mary/5–6). Shorts changed: martha (“That has been proposed and is disputed.” → “The consensus view has been that Martha was always present in John's gospel, and a proposal that she was added is disputed.”: Schrader reports the consensus in her own words, Fellows holds that view; #80 one in-window source may say consensus, reasons follow in the text) and which-mary (“Usually she is taken to be, but that has been challenged” → “That is disputed. … she has long been identified as Mary Magdalene, but some scholars argue another Mary is meant.”: King 2002, now read directly, says scholars are divided over the Gospel of Mary's Mary, against Müller van Velden's “consensus view” and Shoemaker's “settled in rather comfortably”; #80, two sources that disagree on the field's state mean contested, so “usually” is dropped). Shorts unchanged: risen (Luke's lack of an appearance rests on Schaberg and Ringe alone in so many words; text only), prostitute (the new authors back it; Smit qualifies what Gregory meant, not that he made the identification), magdala. Closed with reasons (leads): JBL 2021 body and Taylor PEQ 2014 (paywalled; SPC, MUSE, KCL Pure abstract only; no DukeSpace copy), Haskins and the 1969/1978 changes (no vatican.va text; lending copy only), Harvey JECS 2001 and Shoemaker JECS 2001 (MUSE subscription), Marjanen 1996, Bauckham 2018, Meier 1994 and King 2003 (no preview or snippet only; Internet Archive lending or unattributed uploads, not used), Post 2025 (Tradition venue, no readable text). Leads remaining: Kokkinos 2010 (read only via De Luca and Lena), Brock 2003 (snippet; block-quoted by Müller van Velden). Flags for the second pass: (1) Schaberg and Ringe and Wilson classed Reference (one-volume academic commentary), counted as two authors though in one volume; (2) the martha short's “consensus” rests on the challenger's own report, scope “circulating Fourth Gospel”; (3) which-mary short: whether “has long been identified” stays within Shoemaker and Müller van Velden, and whether King's sentence (Gospel of Mary only) warrants “disputed” for the related writings; (4) Smit's abstract quote is from the English abstract of a Dutch article; (5) De Luca and Lena's p. 281 quote omits footnote markers 5 and 6; (6) Google Books pages read from images, not scripted; Wilson's Philip sentence on p. 532 (uncited) may interest the wife statement later.
# Independent second agent pass on the #248 re-review, 2026-11-27 (#93 delegation): re-fetched into my own scratch folder, not the first pass's files: Smit 2022 (Utrecht PDF) and Schrader 2017 (DukeSpace PDF) by curl and pdftotext, script-matched 2/2 (Schrader p. 41 is the printed folio; Smit's p. 318 conclusion script-read); the Google Books pages PA510, PA531–532 (Women's Bible Commentary), PA295 (Harvey), PA280–281 (De Luca and Lena), PA53–54 and PA6 (Which Mary?) opened in my own Claude in Chrome tab, 11/11 quotes matched verbatim by eye from the page images; edition pages opened for Harvey, the Galilee volume and Which Mary?. Not opened: the Women's Bible Commentary edition page, the Luke chapter's byline page and Shoemaker's p. 5 (a later browser navigation was refused by the session's permission check). Paywall, snippet and lending-copy claims in the #248 leads were not re-tested. 13/13 changed citations pass; none cut. Wording narrowed: martha short “always present in John's gospel” → “… in John's gospel as it circulated” (Schrader's scope, #80); which-mary short “has long been identified” → “has been identified” (no source gives a duration); which-mary text, King “divided …: Mary Magdalene, Mary the virgin-mother or some other Mary” → “divided … and asks whether she is …” (her question, not a claim), and Müller van Velden's “the consensus view still holds” → “the view still holds” (King and she disagree on the field's state, so the page drops the word, #80); risen text “Mark 16:9” → “the longer ending of Mark”; magdala text “Kokkinos's relocation … redraws the widely accepted scholarly map” → “Kokkinos has attempted to redraw the widely accepted scholarly map of the lake region by relocating Magdala/Taricheae”; one uncited item (Schaberg and Ringe) reworded, since its sentence is inside risen/7's quote. Question cards regenerated. Flags for the lead: (1) Schaberg and Ringe's authorship and the Women's Bible Commentary publisher rest on the first pass only; open the chapter's first page before relying on them as two authors. (2) The martha short's “consensus” rests on one Scholarly source's report (allowed by #80) made by the proposal's own author in 2016; Fellows holds the view but reports no field state, so the short's first clause has one reporter. (3) De Luca and Lena: Google Books gives print 2014, ebook 2015; registry year kept 2015. (4) Smit's Dutch abstract says “onjuist” (incorrect), stronger than the English “problematic” the page quotes. (5) Dropping Müller van Velden's attributed “consensus view” from the which-mary text is stricter than the earlier passes, which kept it beside King's “divided”; I read #80's “drops the word” as covering attributed uses once two sources disagree; restore it if the owner reads the rule as applying only to the page's own voice. (6) First-pass flag (3): the which-mary short's “That is disputed” covers the related writings on Shoemaker's own challenge (the Dormition Mary, read at p. 6), Beavis's other-Mary reading and Müller van Velden's report of the challenge, not on King, whose sentence is scoped to the Gospel of Mary; “has been identified” rests on Shoemaker and Müller van Velden. (7) Leads/uncited items naming #248: Wilson's Philip sentence (p. 532), Harvey n. 203, De Luca and Lena's toparchy paragraph (p. 281), Schaberg and Ringe's suppression paragraph (p. 510) and Smit p. 318 were seen on the pages I opened and are described correctly (one Schaberg and Ringe item reworded); Fellows 2023/2025 were not re-opened, so flag (2)'s “reports no field state” is the first pass's reading. A Google Books API and Open Library lookup for the Women's Bible Commentary's contents failed (no record), so flag (1) stands; it does not block.
# Publish resolutions, 2026-11-27 (lead agent, #248 re-review, delegated): second-pass wording accepted (risen “the longer ending of Mark”; magdala Kokkinos “has attempted to redraw”; martha short “as it circulated”, Schrader's scope; which-mary short “has been identified”; King's question kept as a question; Müller van Velden's “consensus view” dropped from the page's text beside King's “divided”, per #80). Flags: (1) Schaberg and Ringe's authorship rests on the UPenn catalogue's table of contents (find.library.upenn.edu/catalog/9959483143503681, “Gospel of Luke / Jane D. Schaberg and Sharon H. Ringe”), read by the lead; the second pass read the quote on PA510; kept. (2) martha's “consensus” rests on Schrader's own report (2016 manuscript), one in-window Scholarly source, which #80 allows; Fellows 2025 was re-read in full by the lead and reports no state of the field; kept, scoped as she scopes it. (3) De Luca and Lena year kept at 2015 (the November 2015 edition read). (4) Smit: the page quotes and paraphrases the English abstract's weaker “problematic”, not the Dutch “onjuist”; kept. (5) Accepted. (6) “That is disputed” rests on Shoemaker, Beavis and Müller van Velden's report for the related writings and on King for the Gospel of Mary; kept. (7) Paywall and lending claims are the lead's, recorded with what was tried. Infographic: plates trace to prostitute's short (unchanged) and cites 1–6 and to gospels; risen's short unchanged; no plate out of step. Publish rule: 11 statements, 105 citations; core prostitute on Swenson, HarperCollins, Clanton, Beavis, Müller van Velden, Jóźwiak, Wilson and Harvey (8 independent authors), none Host-authored: met.
