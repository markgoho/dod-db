leads:
  - "Gregory the Great, Homily 33 in English (“She whom Luke calls the sinful woman, whom John calls Mary, we believe to be the Mary from whom seven devils were ejected according to Mark …”): read only as Ehrman 2006 is quoted by Müller van Velden p. 136; the Latin with Jóźwiak's own translation is on p. 875 of her article, not cited."
  - "Hippolytus, Commentary on the Song of Songs (“apostles to the apostles”, plural): read only as Backes 2017 is quoted by Jóźwiak p. 874."
  - "Ephrem the Syrian merging Mary Magdalene with the sinful woman: search summaries only; Hunt (Hugoye 1998) shows only the Bethany and haemorrhage mergers; Harvey, JECS 9.1 (2001), on the attribution of the sinful-woman mimra, seen only as a re-host."
  - "Haskins, Mary Magdalen: Myth and Metaphor (1993), on the 1969 Roman Calendar and 1978 Breviary changes: read only as cited in Kent 2010 n. 5."
  - "Schrader and Taylor, JBL 140.4 (2021), body: Eusebius's Magdala, Luke's “called Magdalene”, and “no author prior to the sixth century”: read only in the abstract and as quoted in a Religion News Service report (Christian Century, 2022, excluded)."
  - "Smit, NTT 76.4 (2022), on whether Gregory associated Mary primarily with sexual sin: abstract only; full text blocked (Cloudflare/403)."
  - "Marjanen, The Woman Jesus Loved (1996), and Shoemaker, JECS 9 (2001) and Which Mary? (2002): read only as reported by Müller van Velden and Tönsing."
  - "Beavis, CBQ 74 (2012), and Goodacre, “The Magdalene Effect” (2020), on Mary of Bethany as Mary Magdalene: read only as reported by Schrader 2017."
  - "De Luca and Lena (2015), Kokkinos, PEQ 142 (2010), and Bauckham, ed., Magdala of Galilee (2018), on the Magdala/Taricheae identification: read only as cited by Cirafesi."
  - "John P. Meier, A Marginal Jew 2:817, 831, on a source-critical Lazarus story with only Mary: read only as cited by Schrader Polczer 2025."
  - "Schrader Polczer, Duke dissertation (2023): embargoed until 2027-09-14."
  - "Darrell Post, Bible and Spade 38.1 (2025), checked John 11 in 2,221 Greek manuscripts (as reported by Fellows 2025): the article is image-only; Associates for Biblical Research is a Tradition venue."
  - "Karen L. King, on the Gospel of Mary (cited by Müller van Velden as King 2002:54), “Scholars are divided over the identity of Mary and her significance in this Gospel.”: read only as block-quoted by Müller van Velden p. 133 (second pass 2026-11-27)."
uncited:
  - "Müller van Velden p. 133, block quotation of King (“Scholars are divided over the identity of Mary and her significance in this Gospel.”): read; cut by the second pass 2026-11-27 (was which-mary/3): King's sentence was read only as quoted in another work, so it is a Lead for King, and it had been the only basis for the short's “divided”."
  - "King, HTR 2014, author manuscript p. 22 (“Early Christianity's well-known profusion and confusion of Marys should make us cautious in identifying Mary here.”): read; cut by the second pass 2026-11-27 (was which-mary/4): the sentence is about the Mary of the Gospel of Jesus's Wife fragment, not the Gospel of Mary, and the text had widened it to “a Mary”."
  - "Swenson, Bible Odyssey, “Did You Know?” box (“likely result of textual ambiguity and later confusion with the sixth-century story of Mary of Egypt”; “Gnostic texts portray her as an early apostle”): read; not cited, as it may be Bible Odyssey's editorial text rather than Swenson's."
  - "Kent 2010 n. 1 (“The Greek fathers saw three separate people”) and n. 5 (1969 and 1978 changes): read; not cited, footnote reports resting on Haskins; the East/West point is carried by Beavis."
  - "Hunt, Hugoye 1.2 (1998), on Ephrem's conflation of the sinful woman with the Bethany anointer and the woman with the haemorrhage: read; not cited, since it does not involve Mary Magdalene."
  - "John Paul II, Mulieris dignitatem §16 (1988): read; not cited, the 2016 decree and Roche carry the Catholic position."
  - "Holy See Press Office, 10 June 2016 (Roche): read; not cited, a shorter form of Roche's vatican.va article."
  - "Saint Sophia Greek Orthodox Cathedral, Washington DC, copy of the Fenton parish text: read; not cited, the same text."
  - "Dale Martin, RLST 152 lecture 6 (“probably the Gospel of Mark really did end at Chapter 16:8”): read; not cited, the authorship of Mark's ending is new-testament-later-additions' subject."
  - "Martin, RLST 152 lecture 8 (“[he's talking about Mary Magdalene probably]” on Thomas 114): read; not cited, a bracketed aside."
  - "King, HTR 2014, on Gos. Phil. 59.6–11 in translation and on Thomas 114 (“not entirely clear who is being referred to”): read; not cited (the caution sentence on p. 22 was cut by the second pass; see below)."
  - "King, NTS 2013, the kiss passage (Gos. Phil. 63.30–64.5) and n. 64 on Schenke's Sophia reading: read; not cited, the lacuna makes it a reading King herself hedges."
  - "Gathercole 2015 p. 6, “there are sexual undertones in the terms”: read; not cited separately, the wife text keeps his reticence sentence and his no-clear-reference sentence."
  - "NTS 61.3 editorial on the Harvard Divinity School press release (“These claims do not appear to have been retracted.”): read; not cited, the page does not discuss the retraction."
  - "Harvard Divinity School, Dean Hempton's statement (2016, Wayback copy) and Andrew Jacobs, Gospel Thrillers (USC Scalar): read; not cited, an institutional statement relaying journalism and an unreviewed digital book."
  - "Nicola Denzey Lewis, “Mary Magdalene and Jesus” (Bible Odyssey video transcript): read; not cited, a personal view (“I wasn't there! I would say no.”)."
  - "Müller van Velden p. 130 on the Gospel of Mary's manuscripts and date: read; not cited, the shelfmarks appear swapped against King's HTR note 97."
  - "Webster, Bible Odyssey, on Scorsese's portrayal: read; cited only for the gospel details and the title."
  - "IAA reports on the Migdal excavation beyond the names and the synagogue: read; not cited."
  - "Taylor 2014 abstract, Magadan (Matt 15:39) becoming Magdala for the Byzantine pilgrim route: read; not cited, one voice and not needed for the page's question."
  - "Fellows 2023 on a sexist tendency in other Bethany variants: read; cited only for his thesis sentence."
  - "Schrader Polczer 2025 conceding some of Fellows's points are “quite strong” and his 11:3 pronoun argument “persuasive”: read; not cited, the page reports only the two conclusions."
  - "OCA life, “This was the first preaching in the world about the Resurrection.”: read; not cited."
  - "Hombana and Saleh (HTS 2025) and Almirzanah (HTS 2022): read; mention Mary Magdalene only in passing."
