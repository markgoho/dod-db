# Review record for /scholarship/mary-magdalene/ (#93 shape). Not rendered.
# agent: results of the agent first pass (#157, 2026-11-27). That pass does not count toward publish.
# owner: empty (""). The owner delegated the publish review (#93, 2026-11-23); the `delegation` block records the independent second agent pass once it has run.
# Issue #157 note: the Ep 12 guest argues a textual point on Magdala and John 11, and the core claim "may not be 'no gospel calls her a prostitute'"; the sources set it. Both of the guest's points are on the page, each reported as one scholar's view with the reply or the common reading beside it (magdala, martha); neither is the core.
# Overlap: Mark 16:9 is cited only as "the longer ending of Mark", with no statement on its authorship (new-testament-later-additions#mark-ending carries that). Nothing here restates the-historical-jesus. Reused registry ids: harpercollins-2009-dictionary (per-citation urls: Mary, Magdala), tonsing-2022-ending-of-mark, martin-rlst152-l13.
# Sourcing test (#157, 2026-11-27): gate 1, 18 Trigger Claims in Episodes 12, 48, 50, 94, 123, 127, 133 and 185 (every final transcript grepped for "magdal"), each script-matched at its turn's leading timestamp and speaker, read about two minutes either side. Gate 2, the core: the candidate "no gospel calls her a prostitute; the image comes from Gregory the Great" sourced at the strength "No; scholars trace the image to later readers who identified her with the sinful woman of Luke 7, an identification Gregory made in a sixth-century sermon": Swenson (Reference, "nowhere in the Bible"), HarperCollins (Powell, ed., Reference, "nonhistorical tradition ... derived from confusing her"), Clanton (Reference, "As many scholars have noted"), Beavis (Reference), Müller van Velden 2024 (Scholarly), Jóźwiak 2024 (Scholarly); Kent 2010 (dissent on identity) concedes "More recent scholarship discounts the previous tradition". "formalised" and 591 are Müller van Velden's alone and stay in the text, attributed. Gate 3: counted by hand, 6 independent authors behind the core (Kent not counted), none Host-authored; Schrader and Taylor are not core sources. Gate 4: 11 statements.
# Independence by hand: Schrader 2017 (HTR), Schrader and Taylor 2021 (JBL abstract), Taylor 2014 (PEQ abstract) and Schrader Polczer 2025 (TC) are one voice for #133, though `independentSources` would count four author strings; none backs a short alone. Fellows 2023 and 2025 are one voice. King 2013 and 2014 are one voice.
# Dropped for want of a second author or any qualifying source: Luke removing her from the cross and tomb and giving her no resurrection appearance (the guest on air; no source states the appearance point); Ephrem merging her with the sinner (Hunt shows only the Bethany and haemorrhage mergers; lead); the 1969 Roman Calendar change and the 1978 Breviary change (Kent's footnote citing Haskins only; Roche gives no year); Eusebius's Magdala, Luke's "called Magdalene" as an epithet, and "no author before the sixth century" (JBL body not open; only the abstract and a news report); Gregory's sexual reading being a later misreading of his sermon (Smit 2022, abstract only, full text blocked); the Gospel of Jesus's Wife beyond one clause (Harvard Divinity School statement and Jacobs's Scalar book fit no source class).
# First pass: three research agents fetched every source on 2026-11-27 into separate scratch folders and copied quotes from the fetched text; every page quote was then script-matched (whitespace, HTML entities, curly quotes, dashes and PDF line-break hyphens normalised; inline tags stripped from HTML) against those saved texts: 94/94, 0 misses. PDF locators checked against printed page numbers (DASH copies carry a cover sheet, so PDF page = printed page + 1). The second pass must re-fetch.
# Flags for the second pass: (1) Abstract-only citations: Taylor 2014 and Schrader and Taylor 2021 (KCL Pure pages; full texts paywalled), as the registry's "abstract only cited" convention; they back only the attributed challenge in magdala. (2) Access: Schrader 2017 is the author's May 2016 manuscript on DukeSpace (bitstream URL; the item page has a browser check), cited by manuscript page, not HTR 360–392; Cirafesi (MDPI) and the two TC 2025 articles return 403 to curl and open in a browser; Fellows 2023 read at the Internet Archive copy because jbtc.org returned 522 (#93 dead-URL rule). The Cirafesi browser save was truncated after the quoted sentence; the quote is whole. (3) Kent 2010 is in a seminary journal of the Adventist church; Scholarly by venue (#80), used only for the attributed dissent and his concession. (4) Swenson's article is a revised excerpt from her trade book Bible Babel (2010); the "Did You Know?" box is not cited, as it may be editorial. (5) Tönsing's "named after her place of origin" and "unmarried" sentences cite Maisch 1998; Müller van Velden's "sinner" sentence cites Ehrman 2006; Müller van Velden's which-mary consensus sentence is set against King's "Scholars are divided", which she quotes, so the short says divided. (6) apostle: Jóźwiak (Hippolytus) and Beavis (Martha and Mary) disagree on the title's first use; the short says disputed. (7) The tradition statement uses an OCA saints' life and a parish text (Fenton, Michigan) on orthochristian.com, each named in its own words; neither speaks for Orthodoxy as a whole. (8) The NTS 2015 editorial is unsigned (author null). (9) TC 2025 Schrader Polczer: header says pp. 147–153, the conclusion sits on p. 154; registry says 147–154. (10) Schrader's p. 45–46 sentence is split into two citations at the page break.
