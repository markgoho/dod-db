leads:
  - "Gregory the Great, Homily 33 in English (“She whom Luke calls the sinful woman, whom John calls Mary, we believe to be the Mary from whom seven devils were ejected according to Mark …”): read only as Ehrman 2006 is quoted by Müller van Velden p. 136; the Latin with Jóźwiak's own translation is on p. 875 of her article, not cited."
  - "Hippolytus, Commentary on the Song of Songs (“apostles to the apostles”, plural): read only as Backes 2017 is quoted by Jóźwiak p. 874."
  - "Ephrem the Syrian merging Mary Magdalene with the sinful woman: closed (#248 re-review 2026-11-27). No source read states it. Harvey, Scenting Salvation (2006), p. 295 n. 202 (read, cited at prostitute/15–16) says Eastern Christianity in general did not associate Mary Magdalene with the Sinful Woman and that later copyists and editors added Mary Magdalene subtitles to the homilies on the Sinful Woman; n. 203 calls the authenticity of the Ephremic sermon “On the Sinful Woman” very doubtful. Harvey, JECS 9.1 (2001): Project MUSE, subscription only; no author or repository copy found."
  - "Haskins, Mary Magdalen: Myth and Metaphor (1993), on the 1969 Roman Calendar and 1978 Breviary changes: closed (#248 re-review 2026-11-27). Read only as cited in Kent 2010 n. 5 and in Google Books snippets of later books (Maros, Bantu and Kim, eds., Wipf and Stock 2024; De Marco 2018, a trade book); Haskins 1993 is at the Internet Archive as a lending copy only (login) and outside the window. No vatican.va text giving the years was found: Roche's vatican.va article (cited at tradition/4–5) names the post–Vatican II reform of the Roman Calendar without a year, and the 1969 Calendarium Romanum is not on vatican.va. Wilson's Women's Bible Commentary essay (preview) has no 1969 passage."
  - "Schrader and Taylor, JBL 140.4 (2021), body: Eusebius's Magdala, Luke's “called Magdalene”, and “no author prior to the sixth century”: closed as unreadable (#248 re-review 2026-11-27). The DOI resolves to the Scholarly Publishing Collective page, abstract only (“You do not currently have access”); Project MUSE and KCL Pure abstract only; no DukeSpace copy (DukeSpace search lists only her HTR manuscript and dissertation). Taylor's popular article “Magdala's Mistaken Identity” (BAR, Fall 2022) seen only as summarised on Bible History Daily (a magazine blog, excluded). Taylor, PEQ 146.3 (2014), full text: Taylor & Francis paywall and KCL Pure abstract only."
  - "Marjanen, The Woman Jesus Loved (Brill, 1996): closed (#248 re-review 2026-11-27): no Google Books preview found, at the edge of the 30-year window; his view is reported by Müller van Velden and Tönsing (cited). His chapter in Which Mary? (2002), p. 31, “unavailable for viewing” in the Google Books preview. Shoemaker, JECS 9 (2001): Project MUSE, subscription only; superseded by his own Which Mary? chapter (2002), read and cited at which-mary/6."
  - "Beavis, CBQ 74 (2012), and Goodacre, “The Magdalene Effect” (2020), on Mary of Bethany as Mary Magdalene: read only as reported by Schrader 2017."
  - "Kokkinos, PEQ 142 (2010), “The Location of Tarichaea: North or South of the City of Tiberias?”: read only as reported by De Luca and Lena 2015, p. 281 (cited at magdala/15) and by Cirafesi; Taylor & Francis paywall (#248 re-review 2026-11-27). Bauckham, ed., Magdala of Galilee (2018): Google Books “No preview”; closed. De Luca and Lena (2015) itself is now read and cited (magdala/14–16)."
  - "John P. Meier, A Marginal Jew 2:817, 831, on a source-critical Lazarus story with only Mary: closed (#248 re-review 2026-11-27). Read only as cited by Schrader Polczer 2025. Google Books: snippet view only; Internet Archive: only an unattributed user upload (folkscanomy), not a publisher, author or library copy, so not used; 1994, outside the 30-year window."
  - "Schrader Polczer, Duke dissertation (2023): embargoed until 2027-09-14."
  - "Darrell Post, “Rescuing Martha”, Bible and Spade 38.1 (2025): 2,221 Greek manuscripts of John 11, as reported by Fellows 2025 (pp. 156, 159): closed (#248 re-review 2026-11-27). No readable text found; Bible and Spade is the magazine of Associates for Biblical Research, a Tradition venue, which could support only what that ministry holds, not a text-critical finding."
  - "Brock, Mary Magdalene, the First Apostle: The Struggle for Authority (2003), p. 40, “only Luke refuses her a commission to spread the news of the resurrection”: read only as block-quoted by Müller van Velden (§3.3, p. 134) and in a Google Books snippet (#248 re-review 2026-11-27); snippet view only."
  - "King, The Gospel of Mary of Magdala (Polebridge, 2003): Google Books snippet view only; Internet Archive lending copies only (login) and one unattributed upload, not used (#248 re-review 2026-11-27). Her 2002 essay in Which Mary? is read and cited instead (which-mary/5)."
uncited:
  - "Müller van Velden p. 133, block quotation of King (“Scholars are divided over the identity of Mary and her significance in this Gospel.”): read; cut by the second pass 2026-11-27 (was which-mary/3): King's sentence was read only as quoted in another work, so it is a Lead for King, and it had been the only basis for the short's “divided”."
  - "King, HTR 2014, author manuscript p. 22 (“Early Christianity's well-known profusion and confusion of Marys should make us cautious in identifying Mary here.”): read; cut by the second pass 2026-11-27 (was which-mary/4): the sentence is about the Mary of the Gospel of Jesus's Wife fragment, not the Gospel of Mary, and the text had widened it to “a Mary”."
  - "Swenson, Bible Odyssey, “Did You Know?” box (“likely result of textual ambiguity and later confusion with the sixth-century story of Mary of Egypt”; “Gnostic texts portray her as an early apostle”): read; not cited, as it may be Bible Odyssey's editorial text rather than Swenson's."
  - "Kent 2010 n. 1 (“The Greek fathers saw three separate people”) and n. 5 (1969 and 1978 changes): read; not cited, footnote reports resting on Haskins; the East/West point is carried by Beavis."
  - "Hunt, Hugoye 1.2 (1998), on Ephrem's conflation of the sinful woman with the Bethany anointer and the woman with the haemorrhage: read; not cited, since it does not involve Mary Magdalene."
  - "John Paul II, Mulieris dignitatem §16 (1988): read; not cited, the 2016 decree and Roche carry the Catholic position."
  - "Holy See Press Office, 10 June 2016 (Roche): read; not cited, a shorter form of Roche's vatican.va article."
  - "Saint Sophia Greek Orthodox Cathedral, Washington DC, copy of the Fenton parish text: read; not cited, the same text."
  - "Dale Martin, RLST 152 lecture 6 (“probably the Gospel of Mark really did end at Chapter 16:8”): read; not cited, the authorship of Mark's ending is new-testament-later-additions' subject."
  - "Martin, RLST 152 lecture 8 (“[he's talking about Mary Magdalene probably]” on Thomas 114): read; not cited, a bracketed aside."
  - "King, HTR 2014, on Gos. Phil. 59.6–11 in translation and on Thomas 114 (“not entirely clear who is being referred to”): read; not cited (the caution sentence on p. 22 was cut by the second pass; see below)."
  - "King, NTS 2013, the kiss passage (Gos. Phil. 63.30–64.5) and n. 64 on Schenke's Sophia reading: read; not cited, the lacuna makes it a reading King herself hedges."
  - "Gathercole 2015 p. 6, “there are sexual undertones in the terms”: read; not cited separately, the wife text keeps his reticence sentence and his no-clear-reference sentence."
  - "NTS 61.3 editorial on the Harvard Divinity School press release (“These claims do not appear to have been retracted.”): read; not cited, the page does not discuss the retraction."
  - "Harvard Divinity School, Dean Hempton's statement (2016, Wayback copy) and Andrew Jacobs, Gospel Thrillers (USC Scalar): read; not cited, an institutional statement relaying journalism and an unreviewed digital book."
  - "Nicola Denzey Lewis, “Mary Magdalene and Jesus” (Bible Odyssey video transcript): read; not cited, a personal view (“I wasn't there! I would say no.”)."
  - "Müller van Velden p. 130 on the Gospel of Mary's manuscripts and date: read; not cited, the shelfmarks appear swapped against King's HTR note 97."
  - "Webster, Bible Odyssey, on Scorsese's portrayal: read; cited only for the gospel details and the title."
  - "IAA reports on the Migdal excavation beyond the names and the synagogue: read; not cited."
  - "Taylor 2014 abstract, Magadan (Matt 15:39) becoming Magdala for the Byzantine pilgrim route: read; not cited, one voice and not needed for the page's question."
  - "Fellows 2023 on a sexist tendency in other Bethany variants: read; cited only for his thesis sentence."
  - "Schrader Polczer 2025 conceding some of Fellows's points are “quite strong” and his 11:3 pronoun argument “persuasive”: read; not cited, the page reports only the two conclusions."
  - "OCA life, “This was the first preaching in the world about the Resurrection.”: read; not cited."
  - "Hombana and Saleh (HTS 2025) and Almirzanah (HTS 2022): read; mention Mary Magdalene only in passing."
  - "Schaberg and Ringe, Women's Bible Commentary (2012) p. 510, the paragraph speculating that a Lukan appearance tradition was suppressed: read (#248 re-review 2026-11-27); not cited, interpretive and one voice. Their sentence “Their witness is not essential to the Christian faith” sits inside risen/7's quote but is not rendered in the text (reworded by the second pass, 2026-11-27)."
  - "Wilson, Women's Bible Commentary (2012) p. 532, on the Gospel of Philip: “However, it is more likely, many argue, that this ambiguous material conveys Mary Magdalene's favored status among the disciples as Jesus' spiritual, not sexual, companion.”: read (#248 re-review 2026-11-27); not cited, outside #248's leads; a candidate for the wife statement at its next re-review. Also p. 532 on Lefèvre d'Étaples's 1517 critique: not cited."
  - "Smit 2022, conclusion (Slotbeschouwing), p. 318, in Dutch: Gregory decreed nothing officially, and the reception of his identification took a long time and was contested: read (#248 re-review 2026-11-27); not cited, the English abstract carries his reading."
  - "Harvey 2006 p. 295 n. 203, on the doubtful authenticity of the Ephremic sermon “On the Sinful Woman”: read (#248 re-review 2026-11-27); not cited, Ephrem is not on the page."
  - "Fellows 2025 (TC 30), pp. 155–158, on name order and Post's argument; re-read in Chrome (#248 re-review 2026-11-27): states no view of the field; already cited for his conclusion (martha/11)."
  - "De Luca and Lena 2015 p. 281, on Taricheae's foundation and its role as a toparchy seat: read (#248 re-review 2026-11-27); not cited, beyond the page's question."
