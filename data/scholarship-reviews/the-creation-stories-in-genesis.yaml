leads:
  - "Nahum M. Sarna, Understanding Genesis (1966/1967), pp. 1–32: the source of much of Hayes l3 and listed in Paul's bibliography; not read."
  - "U. Cassuto, A Commentary on the Book of Genesis, vol. 1 (1961), pp. 19–20: the opposing view on the temporal clause, as Paul points to it; not read."
  - "NABRE notes on Genesis 2 (https://bible.usccb.org/bible/genesis/2) and the Genesis introduction (https://bible.usccb.org/bible/genesis/0): likely give the J/non-P attribution of 2:4b–25 and dating; returned 403 to scripted requests 2026-11-24; not read."
  - "Gerhard May, Creatio ex nihilo (T&T Clark, 1994): the second-century origin of the doctrine, the creation-ex-nihilo candidate's subject; named in search results and by McClellan (Ep 70 00:27:20); not read."
uncited:
  - "Theodor H. Gaster, “Deep”, Encyclopaedia Judaica on Encyclopedia.com (https://www.encyclopedia.com/religion/encyclopedias-almanacs-transcripts-and-maps/deep): “The ancient Hebrews believed that the earth lay across an all-encompassing ocean, which they called tehom.” Read in full 2026-11-24. Not cited: first-edition text (bibliography to 1969), and the firmament and deep statements already have in-window authors."
  - "Paul, Encyclopaedia Judaica, opening paragraph: “creatio ex nihilo, a concept that first appears in ii Maccabees 7:28”. Paul's alone and outside the window; about the doctrine's history (creation-ex-nihilo candidate), so kept off this page."
  - "Coogan and Chapman ch. 4 summary, “History of Scholarship”: “Jean Astruc … posited that the overall disparities between the creation narratives (including the different names of God in each) suggested that Moses was using two distinct sources when he wrote Genesis 1–3.” History of scholarship; not needed."
  - "Coogan and Chapman ch. 4 summary, “Near Eastern Parallels”: “dating indicates that the Babylonian epics, including Atrahasis and the pertinent sections of Gilgamesh, were earlier and undoubtedly influenced the biblical writers.” About the Flood, not creation."
  - "Hayes l4 ch. 2 [00:05:44]: the Enkidu parallels to the second creation story (“Enkidu like Adam is fashioned from clay.”). A possible later statement on Genesis 2's parallels; Coogan and Chapman ch. 3 (“possible parallels between the Eden account in Genesis and Gilgamesh”) would be its second author."
  - "Hayes l3 ch. 2: the Egyptian god Ptah creating by will (“There's a very similar Egyptian creation story actually in which the god Ptah just wills ‘let this be.’”). Not on the page."
  - "Klamm, paragraphs 3–4 (second pass 2026-11-24): “Both begin with temporal clauses…”, “a word related to Tiamat”, “Rather than creating out of nothing…”, “Both God and Marduk separate primordial waters…”, “Marduk assigns the work of the gods to the humans…”. Dropped from the page as covered by Hayes, Coogan and Chapman, or Paul (owner delegate decision on Klamm)."
