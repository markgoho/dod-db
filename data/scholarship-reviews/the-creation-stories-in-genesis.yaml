rules:
  publish-rule:
    {
      agent: pass,
      owner: "",
      note: "9 statements (minimum 3). Core (two) backed by three distinct authors (#92): Christine Hayes (hayes-rlst145-l3, -l4, -l5, Reference, Yale 2006; two/1–3, 7–8), Coogan and Chapman (coogan-brief-4e-summary-ch3, -ch4, Reference, OUP 2019; two/4–6, 13, counting once) and Shalom M. Paul (paul-ej-creation-cosmogony, Reference; two/10–12; outside the window, see header), plus the NABRE notes (no author, 2011; two/9, P attribution only). None Host-authored. Flag for the second pass: Hayes says lecture 3 draws “very heavily” on Nahum Sarna's Understanding Genesis (l3 ch. 1) and Paul's bibliography lists Sarna, Understanding Genesis (1967), pp. 1–32, so on the Enuma Elish comparison (enuma, deep) Hayes and Paul are distinct authors but not wholly independent in substance. Coogan and Chapman and Klamm show no such tie. The core (two accounts) doesn't rest on Hayes's Sarna-based material.",
    }
  consensus-wording:
    {
      agent: pass,
      owner: "",
      note: "No “consensus” or “most scholars” on the page. “almost all biblical scholars” (two) is Coogan and Chapman's, quoted in two/13 and attributed in the statement; the short says only “Scholars read…”. “many commentators” (beginning) is Paul's, attributed, not in the short. Shorts and their in-window authors: two (Hayes, Coogan and Chapman); differ (Hayes, Coogan and Chapman; exempt facts about the texts); dating (“disputed”: Hayes dating/7, Coogan and Chapman dating/9; the classic scheme is a fact about the history of scholarship); enuma (Hayes, Coogan and Chapman, Klamm); deep (related: Hayes, Klamm; not a god: Hayes, NABRE, see deep/5); beginning (Hayes, NABRE); nihilo (Hayes, Coogan and Chapman, Klamm); firmament (Hayes, NABRE, Klamm); days (pattern: Hayes, NABRE; sabbath: Hayes, Coogan and Chapman). Reasons given where the sources give them (#86): divine names, style, order (differ); land borders and Judah (dating); sequence of events (enuma); etymology (deep); Hebrew syntax and comparable cosmogonies (beginning).",
    }
  dissent-attributed:
    {
      agent: pass,
      owner: "",
      note: "Paul's dissent on the abstract God of Genesis 1 (differ), Cassuto's dissent as Paul reports it (beginning), Hayes's judgement of Wellhausen's bias (dating) and Klamm's report of the two explanations (enuma) are attributed by name.",
    }
  tradition-named:
    {
      agent: pass,
      owner: "",
      note: "No Tradition sources cited. The NABRE notes are Reference (CONTEXT.md: notes by a scholarly association; registry precedent nabre-daniel-intro).",
