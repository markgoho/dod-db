leads:
  - "Bart D. Ehrman, Did Jesus Exist? (HarperOne, 2012), Google Books page id PT9: “virtually every scholar of antiquity, of biblical studies, of classics, and of Christian origins in this country and, in fact, in the Western world agrees.” Snippet only; full sentence not read (#86). A trade-press book would count as Reference."
  - "Chrissy M. E. Hansen, “Reception of the Testimonium Flavianum”, New England Classical Journal 51.2 (2024), abstract only: “Recent studies have largely ruled it partially authentic”. PDF not read. Could back a Testimonium statement."
  - "T. C. Schmidt, Josephus and Jesus: New Evidence for the One Called Christ (Oxford University Press, 2025), open access; Oxford Academic and OAPEN refused automated requests in earlier research. Not read."
  - "Martin l13 ch. 1: “basically most scholars will say that we don't really know what happened at the trial of Jesus.” Read; not used. Could back a further statement."
  - "Ehrman ch. 9 summary, section “The Apocalyptic Death of Jesus”: “Pontius Pilate, not Jewish authorities, sentenced him to crucifixion.” Read; not used."
