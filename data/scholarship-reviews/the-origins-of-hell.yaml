leads:
  - "Lloyd R. Bailey, “Gehenna: The Topography of Hell”, Biblical Archaeologist 49 (1986): 187–91, on Kimhi's c. 1200 commentary on Psalm 27 as the source of the dump explanation and on the lack of literary or archaeological support: read only in a scan posted on a private website (godawa.com), neither a publisher nor an author copy; not cited. Also quoted via Papaioannou and Segovia. #239 re-review 2026-11-27: JSTOR (stable/3210000) offers “Read online” only after registering a free account (Chrome, register dialog), so it is not free reading without login; Internet Archive has no copy of the volume; no author or repository copy found. Closed: no qualifying copy. Also pre-1996 (state-of-the-field use would fall outside the window)."
  - "W. D. Davies and D. C. Allison, Matthew (ICC 1988), vol. 1, and Philip S. Johnston, “Gehenna”, NIDB (2007), on the dump view as without ancient support: seen only on a blog. #239 re-review 2026-11-27: Davies and Allison vol. 1 (T&T Clark 1988): Google Books edition page (ISBN 0567094812, id z79ltm3TFWwC) says “Preview unavailable”; Internet Archive search finds only W. C. Allen's 1907 ICC Matthew; pre-1996 besides. Johnston, NIDB: Google Books edition page (ISBN 0687333555) offers no preview; the five Internet Archive volumes (newinterpretersd0001–0005unse) are controlled lending only (access-restricted, login). Closed: no qualifying copy."
  - "Ronny Reich and Eli Shukron, “The Jerusalem City-Dump in the Late Second Temple Period”, ZDPV 119 (2003): 12–18: an excavated dump east of the City of David, not in Hinnom; seen only on a blog. #239 re-review 2026-11-27: JSTOR has it (ZDPV 119.1, pp. 12–18; found by title and author search in Chrome) with “Read online”, which, as for Bailey, needs a registered account; Internet Archive has ZDPV only for 1878–1911; no author or repository copy found. Closed: no qualifying copy. It would bear on the rubbish-dump text only indirectly (a dump elsewhere)."
  - "Elizabeth Bloch-Smith, Judahite Burial Practices (1991); Brian B. Schmidt, Israel's Beneficent Dead (1994); Christopher Hays, A Covenant with Death (2015); Stephen L. Cook, “Funerary Practices and Afterlife Expectations in Ancient Israel”, Religion Compass (2007): not public; seen via Sonia, Suriano and Hess."
  - "Martha Himmelfarb, Tours of Hell (1983): via Wyatt, Sim and Bauckham. #239 re-review 2026-11-27: Internet Archive copy is controlled lending only (access-restricted, login); the Google Books edition page (ISBN 0812278828) offers no preview; pre-1996. Closed: no qualifying copy. (Bauckham's “Early Jewish Visions of Hell”, JTS 41, 1990, was read in its 1998 Brill reprint and is now cited at gehenna-punishment/10.)"
  - "Alan E. Bernstein, The Formation of Hell (1993): via Janse van Rensburg and Van Eck. #239 re-review 2026-11-27: the three Internet Archive copies are controlled lending only (access-restricted, login) and the Google Books edition page (ISBN 0801428939) offers no preview; pre-1996. Closed: no qualifying copy; paul keeps him as “following Alan Bernstein”. Heikki Räisänen (2007): Janse van Rensburg and Van Eck's bibliography lists it as “Jesus and hell”, an unpublished paper delivered at the SBL conference, Vienna; no public copy. Closed: unpublished; nt-views keeps him as “following Heikki Räisänen”."
  - "George W. E. Nickelsburg, Resurrection, Immortality, and Eternal Life (1972); G. F. Moore, Judaism (quoted in EJ “Resurrection”): not read in the source."
  - "Kim Papaioannou, The Geography of Hell in the Teaching of Jesus (Pickwick 2013): preview not checked."
  - "W. J. Dalton, Christ's Proclamation to the Spirits (1989); J. H. Elliott, 1 Peter (AB 2000); J. N. D. Kelly, Early Christian Creeds: via Pierce, the NCE and Buitendag. #239 re-review 2026-11-27 (Kelly only): the seven Internet Archive copies (1950–1981 editions) are controlled lending only (access-restricted, login) and the Google Books edition page (ISBN 058249219X) offers no preview; Buitendag cites the 2006 reprint of the 1960 text, pre-1996. Closed: no qualifying copy."
  - "Bart Ehrman, Heaven and Hell (2020): no readable excerpt found."
  - "D. F. Watson, “Gehenna”, Anchor Bible Dictionary 2:926–28: cited in the EJ bibliography; paywalled."
