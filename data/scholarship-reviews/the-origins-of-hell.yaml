leads:
  - "Lloyd R. Bailey, “Gehenna: The Topography of Hell”, Biblical Archaeologist 49 (1986): 187–91, on Kimhi's c. 1200 commentary on Psalm 27 as the source of the dump explanation and on the lack of literary or archaeological support: read only in a scan posted on a private website (godawa.com), neither a publisher nor an author copy; not cited. Also quoted via Papaioannou and Segovia."
  - "David Kimhi (Radak), commentary on Psalm 27:13: Sefaria refused scripted requests; seen only as quoted by Bailey, Segovia and Montgomery."
  - "W. D. Davies and D. C. Allison, Matthew (ICC 1988), vol. 1, and Philip S. Johnston, “Gehenna”, NIDB (2007), on the dump view as without ancient support: seen only on a blog."
  - "Ronny Reich and Eli Shukron, “The Jerusalem City-Dump in the Late Second Temple Period”, ZDPV 119 (2003): an excavated dump east of the City of David, not in Hinnom; seen only on a blog. Worth reading in the source."
  - "Philip S. Johnston, Shades of Sheol (2002), 69–97: Sheol primarily the place of the unrighteous or untimely dead; and Jon D. Levenson, Resurrection and the Restoration of Israel (2006), 72–79: read only as reported by Hess (Denver Journal review) and Suriano n. 13."
  - "Elizabeth Bloch-Smith, Judahite Burial Practices (1991); Brian B. Schmidt, Israel's Beneficent Dead (1994); Christopher Hays, A Covenant with Death (2015); Stephen L. Cook, “Funerary Practices and Afterlife Expectations in Ancient Israel”, Religion Compass (2007): not public; seen via Sonia, Suriano and Hess."
  - "Richard Bauckham, “Early Jewish Visions of Hell”, JTS 41 (1990); Martha Himmelfarb, Tours of Hell (1983): via Wyatt and Sim."
