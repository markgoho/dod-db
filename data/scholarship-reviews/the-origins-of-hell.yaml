rules:
  publish-rule:
    {
      agent: "pass",
      owner: "",
      note: "First pass 2026-11-26: 18 statements. Core sheol cites Dolansky (Reference, 2019), Henning (Reference, 2017), Bakhos (Reference), Hayes l21 (Reference, 2006), Shaked (Reference, 1998/2012), Reyburn and Fry (Reference, 1997), the NABRE Psalm 6 notes (Reference, 2011) and Suriano (Scholarly, 2016): eight independent authors, none Host-authored. Rule met.",
    }
  consensus-wording:
    {
      agent: "pass",
      owner: "",
      note: "First pass 2026-11-26: “consensus” and “most scholars” are not used by the page. Shorts saying “scholars say” rest on two or more authors stating it (sheol: Dolansky, Henning, Bakhos, Hayes, Shaked; daniel-12: Hayes, Merrill Willis, HarperCollins, NABRE). Quoted state-of-the-field sentences are attributed: Ogden and Sterk “Commentators generally agree” (with Cook and the NABRE against, so the short reports a split), Papaioannou “It is commonly believed” (with his dissent), Bakhos “for the first time” (not in the short), Shaked “not all scholars subscribe”. The rubbish-dump short says “the studies that examine the claim” (Henning, Papaioannou, Segovia) and names the reference works that still call it a dump.",
    }
