# Review record for /scholarship/the-origins-of-hell/ (#93 shape). Not rendered.
# agent: results of the agent first pass (#148, 2026-11-26). That pass does not count toward publish.
# owner: empty (""). The owner delegated the publish review (#93, 2026-11-23); the `delegation` block records the independent second agent pass once it has run.
# Issue #148 instructions: short answers report the state of scholarship, never one scholar's view (#133); confessional study Bibles are Tradition and don't count toward the two. Possible trigger Ep 15 on Sheol and Gehenna. No candidate entry existed; slug from the issue title.
# Sourcing test (#148, 2026-11-26): gate 1, eighteen Trigger Claims in Episodes 15, 98, 157 and 160, read with about two minutes either side and script-matched. Gate 2, the core: the candidate “there is no hell in the Hebrew Bible; Sheol was the same for everybody” sourced as “the Hebrew Bible's Sheol is a shadowy underworld of the dead, without judgment or torment, and no passage describes a fiery place of eternal punishment”: Dolansky, Henning, Bakhos, Hayes, Shaked, Reyburn and Fry and the NABRE back it; Suriano's nuance (a metaphor for dying) is attributed. 18 statements.
# Reworded to the sources: the Host's “everybody went to the same place” kept in the text as the sources' “all of the dead”, not in the short; the origin of post-mortem punishment placed in Jewish apocalyptic writing of the last centuries BCE (not in Daniel 12, which the sources make the first explicit resurrection text); the persecution/theodicy explanation kept to “the problem of divine justice” (Hayes, Wyatt), since the persecution sources (Hayes, Stern, Greenberg) explain Daniel's resurrection, not hell; Gehenna's first naming as a place of punishment reported as a split (HarperCollins, Henning vs NABRE, Papaioannou).
# Dropped for want of sources or a second author: the King James count of “hell” for Sheol (only Blue Letter Bible and Watch Tower Insight state 31/31/3; see uncited); Kimhi c. 1200 as the origin of the dump story (only Bailey, read in a non-publisher copy; lead) — the page keeps Henning's “medieval period” and Montgomery's 1908 report of Kimchi, attributed; how necromancy-heavy Israel was (Sonia vs the minimalists: reported as debated, not as “phenomenally common”); Augustine's role in fixing the doctrine (only a 1963 NCE clause); Revelation's lake of fire as its own statement (thin; Henning only, uncited); Josephus on the Essenes (1987 text only).
# Conflicts (data/scholarship-candidates.yaml, not attached): 98@00:10:40's first sentence (King James “hell every single time”) vs translations; 89@00:41:01 (“Hades … never occur in any of Paul's writings”) vs paul (Janse van Rensburg and Van Eck: 1 Cor 15:54–55); 15@00:30:11 (Paul reflects none of the three categories) vs paul (Bakhos, Janse van Rensburg and Van Eck: destruction/annihilation). Not attached, no conflict: 15@00:09:14 (“necromancy was phenomenally common”, stronger than the-dead's “debated”); 15@00:30:52 (systematisation in the fourth and fifth centuries; later-doctrine reports sixth-century councils only).
# First pass: four research agents fetched every source on 2026-11-26 into separate scratch folders with curl (Internet Archive snapshots where bible.usccb.org, Britannica and Iranica bot-checked) and copied quotes from the fetched text; every page quote was then script-matched (whitespace, quotes, dashes, line-end hyphens and HTML entities normalised) against those saved texts: 129/129, 0 misses (Montgomery's Kimchi sentence against the page image, owing to OCR damage). The second pass must re-fetch.
# Flags for the second pass: (1) Papaioannou (MJT 2017) argues a conditionalist thesis; classed Scholarly by venue; cited on isaiah-66, gehenna-punishment, rubbish-dump and nt-words, never alone behind a short. (2) Bakhos's Posen introduction has no volume or year on the page and a members banner; check it reads in full without login. (3) Sonia's SBL Press book is a publisher-hosted full text marked “All rights reserved” (#80 clarification). (4) NABRE New Testament notes (Mt 5, 1 Pet 3, 2 Pet 2) are the 1986 edition, outside the window; each is attributed and none stands alone behind a short. (5) Henning's two Bible Odyssey articles count once; Sim's two HTS articles count once. (6) The rubbish-dump short's “the studies that examine the claim” rests on Henning, Papaioannou and Segovia; Segovia leans on Bailey and Papaioannou. (7) the-dead short says “debated” on Sonia's “divide scholarly opinion” and the HarperCollins counter-view. (8) daniel-12 short's “the only explicit passage” is Hayes's “only passage … to explicitly espouse”; Merrill Willis and HarperCollins say “first”. (9) descent: NCE fifth century vs Buitendag fourth; the short names neither. (10) persia-greece short attributes the “strong influence” view to “some” (Shaked) against Wyatt, Collins and Silverman; consistent with the published persia statement.
