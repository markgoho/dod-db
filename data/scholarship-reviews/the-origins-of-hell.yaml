  - "David Kimhi (Radak), commentary on Psalm 27:13, read 2026-11-27 (#239) at Sefaria (https://www.sefaria.org/Radak_on_Psalms.27.13; Sefaria Community Translation, CC0; the scripted API now answers): the punishment of the wicked is called Gehinnom by metaphor, after a place near Jerusalem that was “a disgusting place”, where “all the impurities and carcasses were dumped” and “there was a constant fire there to burn the impurities and the bones of the carcasses”. Confirms what Montgomery (rubbish-dump/6) reports Kimchi said; it does not show that the dump story begins with him (Bailey's claim, still closed). A primary text, not cited (as Rufinus)."
