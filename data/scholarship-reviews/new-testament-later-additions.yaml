# Review record for /scholarship/new-testament-later-additions/ (#93 shape). Not rendered.
# agent: results of the agent first pass (#149, 2026-11-26). That pass does not count toward publish.
# owner: empty (""). The owner delegated the publish review (#93, 2026-11-23); the `delegation` block records the independent second agent pass once it has run.
# Issue #149 instructions: queued as new-testament-later-additions; broaden to the Textus Receptus/KJV, Codex Sinaiticus and the Matt 28:19 formula. Short answers report the state of scholarship (#133); confessional study Bibles are Tradition and do not count toward the two. Overlap checked: the-text-of-the-hebrew-bible covers the Hebrew Bible only, so this page keeps to the New Testament; pauline-authorship does not touch 1 Cor 14:34–35. Registry ids reused: martin-rlst152-l6, martin-rlst152-l19, ehrman-brief-5e-ch1-summary, ehrman-brief-5e-ch5-summary.
# Sourcing test (#149, 2026-11-26): gate 1, 17 Trigger Claims in Episodes 11, 17, 48, 160 and 174, read with about two minutes either side and script-matched (speaker, timestamp, verbatim). Gate 2, the core: the candidate “some passages in modern Bibles are not original, among them the longer ending of Mark and the woman caught in adultery” is carried for each passage, but by different authors per passage, so the core is the one passage two in-window authors state together: adulteress (“Most scholars say no”), Knust and Wasserman 2019 (Scholarly, Princeton UP) and Keith (Bible Odyssey, Reference), with Knust BO (same first author as the book, counted once) and the NABRE notes (facts). Gate 3: 2 independent authors behind the core, counted by hand (Knust, Keith; Wasserman as co-author); the checker's author-string count is higher. Gate 4: 20 statements.
# Dropped: Matthew 28:19 (issue #149 asked for it): no Scholarly or Reference source from 1996 on discusses its manuscripts or Eusebius's shorter citations; only Conybeare 1901 and Cuneo 1923 (outside the window, badly OCRed); Thellman 2019 and Peppard (Bible Odyssey) are not on the manuscript question. Constantine's fifty Bibles and Sinaiticus/Vaticanus: Kraft (BMCR 2008) alone reports the hypothesis “has not met with general acceptance”. The basket-for-burning story: only Tischendorf's own account (1867); no scholar's doubt read in the source. KJV New Testament as 83–84% Tyndale: CUL's figure is unattributed. Erasmus's seven manuscripts: only de Jonge 1984, whose OCR is too corrupt to quote. Nel 2020 on Mark 16:9–20: his abstract says “scholarly consensus”, his introduction says it is “not the accepted general scholarly consensus any more”; not cited, and “consensus” is kept out of the mark-ending short (#80: sources disagreeing on the state of the field). Blumell 2011 (BYU Religious Studies Center, a church-university press, classed differently by two research agents; repeats the promise story): not cited. Davidson (Bible Odyssey; doctoral student): not cited (#86 per-author check). Reese (New Catholic Encyclopedia, 1960s text): not cited.
# Conflicts (data/scholarship-candidates.yaml, not attached): 160@00:11:06 (Erasmus's promise) vs promise; 160@00:12:17 (KJV relied on Erasmus's third edition) vs kjv-text; 17@00:39:07 (“our earliest manuscript of the full Bible”) vs sinaiticus.
# First pass: four research agents fetched every source on 2026-11-26 into separate scratch folders (curl; Internet Archive snapshots where bible.usccb.org, tbsbibles.org and codexsinaiticus.org refused scripted requests) and copied quotes from the fetched text. Every page quote was then script-matched, per cited source, against the saved text of that source with whitespace collapsed, HTML entities decoded, ligatures expanded and soft hyphens removed (a soft hyphen at a PDF line break joins the word): 136/136, 0 misses. De Jonge 1980's Leiden scan has unusable OCR and its page image drops punctuation; its four quotes were checked word by word against the rendered page images (pp. 385, 388, 389, at 110 and 300 dpi), with punctuation from a third-party transcription (dick.wursten.be).
# Flags for the second pass: (1) corinthians-14: the short says only what Payne, Fellows 2019 and Martin carry together (some argue addition; every manuscript has the verses); “others disagree” rests on Martin (2009) alone and stays in the text; Fellows 2019 takes no position on authorship; Fellows's 2024 JSNT article (named in Episode 60) was not read (SAGE 403). Payne and Fellows list no academic post. (2) promise rests on de Jonge 1980 (outside the window; documentary) and McDonald 2011 (his doctoral student, in-window). (3) nongbri-2020-p52 cited from its abstract only. (4) Holmes, Bond and Wasserman (Alexandrian text) years null: Bible Odyssey page dates are migration dates (#177 convention). (5) Tönsing's “overwhelming consensus” covers only that the copy we have ends at 16:8; quoted in the text as she scopes it. (6) NABRE NT notes (1986) carry facts only, never a field-wording short. (7) McDonald 2011 is a doctoral thesis, registered as kind book. (8) Karrer's quotes are German; his post is not stated in the saved text. (9) Peer review not verified for the COMSt Bulletin 8/2 papers (Kelhoffer, Andrist, Clivaz, Taylor) or BABELAO (Pinchard). (10) Ciurea 2025 dates the Didascalia to ca. 300–330, later than Knust's third century; not cited, the text gives Knust's date. (11) Codex Sinaiticus Project, INTF and Manchester are unsigned institutional pages (author null, kind article), never alone behind a field-wording short.
