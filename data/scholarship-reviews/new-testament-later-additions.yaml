      agent: pass,
      owner: "",
      note: "First pass 2026-11-26: “most scholars” appears in shorts only where an in-window Scholarly or Reference source says it: mark-ending (Ehrman summary, Bond, Tönsing), adulteress (Knust and Wasserman, Keith, Knust BO). “consensus” appears in no short; Tönsing's “overwhelming consensus” is quoted in the text, scoped as she scopes it. “all but universally rejected” (comma) rests on McDonald's “virtually universal rejection”, with Holmes listing the words among the added verses. mark-16-8 “most recent scholarship” rests on Tönsing (“Scholarship in the last decades has moved”), Bond (“Most scholars”) and Martin.",
