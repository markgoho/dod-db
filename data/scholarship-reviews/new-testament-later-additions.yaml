leads:
  - "Hagner, Matthew 14–28 (WBC 1995), on Matt 28:19 as a “liturgical expansion”: seen only inside a ministry PDF; the Internet Archive copy is loan-only, and 1995 is outside the window. Closed (#241): no open copy. Luz, Hermeneia Matthew 21–28 (2005), and Keener (1999): loan-only on the Internet Archive; France, NICNT (2007): the Google Books preview omits the pages on Eusebius. Closed: no open copy."
  - "Skeat, JTS 50 (1999), on Sinaiticus and Constantine's fifty Bibles: Crossref shows no licence, Unpaywall and Semantic Scholar list it closed, no Internet Archive copy. Closed (#241): paywalled, no open copy; the hypothesis is reported from Kraft and Nongbri 2022. Lake, HTR 1918: outside the window, not opened. Closed."
  - "Parker, Codex Sinaiticus (British Library 2010), on the fifty Bibles and the basket story, and Metzger–Ehrman, The Text of the New Testament (4th ed. 2005): read only in Internet Archive user uploads of uncertain provenance (a “folkscanomy” scan; an “Anna's Archive” file), not treated as qualifying copies; Parker's Google Books record is snippet-only. Closed (#241): no qualifying copy. Rendel Harris's “myth”: outside the window, not read. Porter, Constantine Tischendorf (2015): snippet-only and print-disabled loan. Jacobs, Gospel Thrillers (CUP 2023), ch. 1: paywalled. Closed."
  - "Croy, The Mutilation of Mark's Gospel (Abingdon 2003; “virtually all scholars”): Google Books has no preview, no Internet Archive copy, publisher pages carry only a blurb; quoted only inside Nel and Lunn. Closed (#241): no open copy. Farmer 1974: outside the window and loan-only. Robinson in Black (ed.), Perspectives on the Ending of Mark (B&H 2008, a Southern Baptist house: Tradition): his chapter not in any open preview. Closed."
  - "Maurice Robinson on John 7:53–8:11 as original, in his own words: Filologia Neotestamentaria 13 (2000) is login-only at its host and listed closed by Dialnet and OpenAlex; his 1998 ETS paper is restricted. Closed (#241): no open copy; his position is reported from Yan Ma (2024), cited. Metzger's “overwhelming” is still read only as quoted inside Miller and inside Knust–Wasserman 2020."
  - "Keith, “The Initial Location of the Pericope Adulterae in Fourfold Tradition”, NovT 51 (2009): OpenAlex and Semantic Scholar closed, no Internet Archive copy, not in the St Mary's repository, academia.edu refused without login. Closed (#241): paywalled."
  - "Nongbri, “Palaeography, Precision and Publicity”, NTS 66.4 (2020): body text paywalled (Cambridge Core), not in his open-access list, NVA record has no file. Closed (#241); the abstract stays cited. Nongbri, “The Use and Abuse of P52”, HTR 98 (2005): first page only. Closed."
  - "Niccum, “The Voice of the Manuscripts on the Silence of Women”, NTS 43 (1997): only the publisher's first-page extract opens (no thesis sentence); OpenAlex and Semantic Scholar closed. Closed (#241): paywalled. Delobel, “Textual Criticism and Exegesis”, said by Kloha to consider 1 Cor 14:34–35 authentic: not opened."
  - "Epp, HTR 92 (1999), “The Multivalence of the Term ‘Original Text’”: read only through Wachtel–Holmes and Strutwolf."
  - "Yi, From Erasmus to Maius (2023/2024); Krans-Plaisier, “Erasmus and Codex Vaticanus” (2020): abstracts only."
  - "Britannica (Textus Receptus, textual criticism): 403 to curl and WebFetch."
uncited:
  - "Nel 2020, Verbum et Ecclesia 41(1): read; contradicts himself on whether Mark 16:9–20 as a late addition is the scholarly consensus (abstract vs introduction); not cited."
  - "Blumell 2011, “The Text of the New Testament” (BYU Religious Studies Center): read; confessional press, classed differently by two agents, and repeats the promise story that de Jonge and McDonald reject; not cited."
  - "Tischendorf 1867, When Were Our Gospels Written? (Religious Tract Society): read; his own account of the basket of parchments; the page reports the Codex Sinaiticus Project's summary instead."
  - "Conybeare 1901 (ZNW) and Cuneo 1923 (CUA dissertation) on Matt 28:19: read; outside the window and badly OCRed; Thellman 2019 (Anafora) and Peppard (Bible Odyssey) read, not on the manuscript question."
  - "De Jonge 1984, JTS 35: read; seven manuscripts for 1516; OCR too corrupt to quote."
  - "CUL caption, “83 per cent of the text of the King James Bible comes directly from Tyndale’s Testament of 1534”: read; an unattributed calculation."
  - "Davidson, “What Is the Oldest Bible?” (Bible Odyssey): read; author a doctoral student (#86 per-author check)."
  - "Miller 2020, Themelios 45.2: read; a confessional journal (Tradition); its survey of Robinson's view not used for a scholarly claim."
  - "Ciurea 2025 (Studia UBB) on the number of locations of the pericope (“at least twelve”): read; not cited, the text reports NABRE's five and Pinchard's eight."
  - "UBS Handbooks (Newman & Stine 1988; Newman & Nida 1972, 1980) on Matt 17:21, John 5:4, Acts 8:37: read; pre-1996 (“consensus of scholars” wording outside the window)."
  - "NET Bible note on Mark 16:9 (biblia.com): read; the rendering drops tokens."
  - "GotQuestions, “Should Mark 16:9-20 be in the Bible?”: read; Tradition, not needed."
  - "Burgon 1871, The Last Twelve Verses of Mark: read; historic dissent only."
  - "Van Minnen 1990 (Duke papyrus page) on P52 “ca. A.D. 125”: read; outside the window."
  - "Reese, New Catholic Encyclopedia, “Bible (Texts)”: read; 1960s text; the 1633 Elzevir preface is carried by Holmes and CUL."
  - "Joan Taylor 2022, p. 693 sentences on the shorter ending and on defenders of 16:9–20: read; fragments across a page break, not quoted."
  - "Lavrinoviča, NTS 63 (2017), on 1 Cor 14:33b: abstract read; takes no position on the authenticity of 14:34–35; body paywalled (#241)."
  - "White, “The Traditional and Ecclesiastical Paul of 1 Corinthians”, CBQ 79 (2017), pp. 659–61 (Clemson repository via the Internet Archive): read; reads 14:34–35 as Paul's own argument only by implication, with no sentence saying so; not cited (#241)."
  - "Wilson, Religions 13.5 (2022) 432 (MDPI): read in a browser; his “sharply divided” is between interpolation and quotation–refutation among scholars who agree the sentiment is not Paul's; not needed (#241)."
  - "Kloha, A Textual Commentary on Paul's First Epistle to the Corinthians (PhD thesis, Leeds 2006), vol. II p. 556: read; an unpublished thesis; his view is reported from Fellows 2024 (#241)."
  - "Keith, Jesus Began to Write (PhD thesis, Edinburgh 2008): read; an unpublished thesis, not the NovT article; treats the passage as an interpolation throughout; not cited (#241)."
  - "Lunn, The Original Ending of Mark (Pickwick 2014), ch. 1 (James Clarke publisher extract): read; concedes his view “consciously conflicts with the bulk of scholarly thinking”; openly apologetic aims (Shively's review), so the book is reported through Shively rather than cited (#241)."
  - "Hester, Does Mark 16:9–20 Belong in the New Testament? (Wipf & Stock 2015): opening of ch. 1 read only in a Perlego preview (not the publisher's); confessional author; not cited (#241)."
  - "NET Bible note on Matt 28:19 (biblia.com): read; the rendering drops tokens and the evangelical publisher's class is unsettled; not needed with Davies–Allison and van Zyl (#241)."
  - "Böttrich 2019, Sächsische Heimatblätter 2/2019: read; retells the basket without assessment; WiBiLex 2012 cited instead (#241)."
  - "Codex Sinaiticus Project “Content” and “Production” pages and the British Library collection-item snapshots: read; nothing on Constantine or the basket (#241)."
