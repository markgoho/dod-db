    note: "First pass 2026-11-27: gotquestions-* as Got Questions Ministries, an evangelical ministry (registry convention); dts-doctrinal-statement as Dallas Theological Seminary (its own name); lcms-ctcr-1989-end-times as the Lutheran Church–Missouri Synod and its Commission on Theology and Church Relations (its own names); ccc-668-677 as the Catholic Church (as ccc-1033); ligonier-mathison-2012-johns-prophecy as Keith Mathison, writing for Ligonier Ministries, an international Christian discipleship organization (registry line). None supports what scholars think."
