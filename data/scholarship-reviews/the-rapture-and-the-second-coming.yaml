rules:
  publish-rule:
    agent: pass
    owner: ""
    note: "First pass 2026-11-27: 13 statements. Core origin cites Tooth 2023 (Reference, CDAMM), Durbin 2022 (Reference, CDAMM), de Villiers 2019 (Scholarly, STJ), Whalen and Stancil (Reference, NCE, undated text), Sweetnam and Gribben 2009 (Scholarly, JETS), Emerson and Minahan 2000 (Reference), Bennett 2008 (Scholarly, EQ): Tooth, Durbin and de Villiers each back the main clause inside the window; the debate clause rests on Bennett, Sweetnam and Gribben, de Villiers and Emerson and Minahan. None Host-authored."
  consensus-wording:
    agent: pass
    owner: ""
    note: "First pass 2026-11-27: no statement says “consensus”. “general agreement” appears only as de Villiers's words, attributed (origin). “most scholars” appears in the scripture short as Tooth's “little support among most scholars”, with Frohlich's “many scholars criticize” beside it; in this-generation only as Bahr's “Most scholars agree”, attributed, scoped as she scopes it; Lippy's “most Christian religious groups” attributed (millennium). #133 per short: origin (Tooth, Durbin, de Villiers; debate Bennett, Sweetnam and Gribben, Emerson and Minahan); dispensationalism (Bass, Durbin, Stancil, Whalen and Stancil); spread (Balmer, Stancil, Bass, Durbin, Tooth, Marsden and Svelmoe); today (Emerson and Minahan, Frohlich, Durbin, Bass, Tooth); thessalonians (Tooth; Gundry for, Plevnik and Cosby against, Martin); word (NABRE, Tooth); paul-expected (NABRE, Ehrman, Martin, Tooth); scripture (Tooth, Frohlich, NABRE, Durbin, Lee); this-generation (NABRE, Martin, Bahr; Luke: NABRE, Martin, Ehrman); millennium (CenSAMM, Lippy; Augustine: Durbin, de Villiers); preterism (Lehner, Molina); israel (Du Toit, Durbin, Stancil; dissent Smith); tradition (Tradition sources, exempt)."
  dissent-attributed:
    agent: pass
    owner: ""
    note: "First pass 2026-11-27: earlier formulations (Emerson and Minahan) and the origins debate (Bennett; Sweetnam and Gribben; de Villiers) attributed; Plevnik's and Cosby's rejection of the reception reading and Gundry's reply attributed; Tooth's “Others argue” on Paul's expectation attributed; Smith's dissent on Christian Zionism's roots attributed; Bass's majority/some on the rapture's timing attributed."
