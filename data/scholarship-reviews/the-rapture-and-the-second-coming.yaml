# Issue #160: merges preterism and Christian Zionism; possible trigger Ep 32 00:34:59 on Darby in the 1830s. Scope kept off pauline-authorship (2 Thessalonians' authorship and its delay of the end), daniel-date and the-historical-jesus (Jesus as apocalyptic prophet), and the Timeline's revelation entry (Revelation's date).
# Sourcing test (#160, 2026-11-27): gate 1, ten Trigger Claims in Episodes 32, 71, 118 and 119, each read with about two minutes either side; three more assertions logged as conflicts in data/scholarship-candidates.yaml (71@00:08:18 and the “1800 years” sentence of 32@00:35:14 vs origin; 71@00:15:48 vs thessalonians). Gate 2, the core: the candidate “the rapture was invented by Darby in the 1830s” sourced only as “the rapture as taught today goes back to Darby's teaching in the early nineteenth century; whether anyone anticipated it is debated”: no Scholarly or Reference source says “invented” or names a forerunner in its own words; Emerson and Minahan say “certainly earlier formulations”; Bennett and Sweetnam and Gribben report the origins debate. Gate 3: three in-window independent authors behind the core's main clause (Tooth 2023, Durbin 2022, de Villiers 2019), plus Whalen and Stancil (NCE). Gate 4: 13 statements.
# Dropped for want of a second author or any qualifying source: a parousia statement (meaning disputed as a technical term; no short needs it); Matthew 24:40–41 as taken in judgment (Tradition only; the NABRE reading is attributed in scripture); partial vs full preterism and preterism as fulfilment in 70 CE (Tradition only; attributed in preterism); 1967 as prophetic (Smith only); survey figures for rapture belief (none found; Pew asks other questions).
# First pass: three research agents fetched every source on 2026-11-27 into separate scratch folders and copied quotes from the fetched text; every page quote was then script-matched (whitespace, HTML entities, curly quotes and dashes normalised; HTML tags stripped with and without a space; two PDF line-break hyphens joined, Gundry and Cosby) against those saved texts: 99/99, 0 misses. The second pass must re-fetch.
# Flags for the second pass: (1) Five sources are Critical Dictionary of Apocalyptic and Millenarian Movements entries (four authors and a corporate CenSAMM entry), an open academic dictionary from an academic centre: classed Reference. (2) De Villiers 2019 carries the only “general agreement” sentence and has slips elsewhere (p. 172). (3) Three doctoral theses (Lee, Molina, Smith) are classed Scholarly by the McDonald precedent; Molina is the second author for the preterism short's list of schools. (4) Bennett (Evangelical Quarterly) and Sweetnam and Gribben (JETS) are in evangelical venues, classed Scholarly by the JETS and Tyndale Bulletin precedents; used for the debate and Darby's development. (5) Contemporary American Religion's year (2000) comes from library catalogues, not the page. (6) NABRE notes (1986) and NCE entries (undated, older text) never carry a short alone. (7) Trigger 32@00:33:06 states the royal-arrival reading flatly; attached as a side the statement reports, while 71@00:15:48 (“critical scholarship … finds”) is logged as a conflict. (8) Du Toit's article argues a confessional case; only its definitions are cited.
# Second agent pass 2026-11-27 (#93 delegation, independent; did not build the page; the first pass's scratch folders not read): all 39 cited sources re-fetched by curl (browser User-Agent) into the second pass's own folder, plus Plevnik's p. 545 page and Du Toit's article galley; every URL returned HTTP 200 except bible.usccb.org Mark 13 and Matthew 24 (403 to scripted requests), read in the Wayback snapshots the first pass named (20260202070742, 20251228060054). PDFs read with pdftotext 26.01 in its default mode, which itself joins line-break hyphens (so Gundry and Cosby matched without the first pass's hyphen joins). Every quote script-matched (whitespace, non-breaking spaces, soft hyphens, fi/fl ligatures, ellipses, doubly escaped HTML entities, curly quotes and dashes normalised; HTML tags stripped, with a space and, for three quotes, without; for seven quotes after the cuts (eight before), the space left before punctuation by a stripped inline link closed up): 99/99 before cuts, 96/96 after, 0 misses. Each quote's nearest heading (HTML) or PDF page and running head printed and compared with its locator; Encyclopedia.com quotes confirmed inside the signed entry each is credited to. All ten Trigger Claims and the three conflict entries in data/scholarship-candidates.yaml re-matched by script at timestamp and speaker (full turn, final Transcript) and read about two minutes either side.
# Second pass changes. Cut to uncited (3): preterism/7 and /8 (gotquestions-preterist: a Tradition source describing a view it opposes, not what its tradition holds), tradition/1 (Got Questions on the church's controversies, not what it holds); tradition keys renumbered (old 2–8 now 1–7). Shorts: dispensationalism (pre-tribulation timing now “Most dispensationalists”, Bass's “majority”); today (“Chiefly conservative Christians”, Emerson and Minahan and Frohlich; “above all in the United States” replaced by dispensationalism's US following as a separate sentence, Durbin and Bass; Emerson and Minahan's “United States and Britain” stays in the text, as theirs alone); paul-expected (“Many scholars” to “Many take”, Tooth's “many have taken”, plus the entry's “Others argue”); scripture (“little support among most scholars, sources say” to “Many scholars criticize it, sources say”: the “most” is Tooth's alone and “on biblical and theological grounds” Frohlich's alone; both authors support “many scholars criticize”); tradition (LCMS's Commission on Theology and Church Relations named, not the Synod). Question: tradition widened to “the rapture and the end times” (the Catechism paragraphs never mention a rapture). Texts: origin (Darby's 1829 writing named, from p. 573; de Villiers's “millenarian thinking and the rapture”); spread (Marsden and Svelmoe's own words, not “say the same”); this-generation (Bahr's imminence clause set apart and credited to Stein); millennium (CenSAMM's postmillennialism “after a given period of time”); preterism (Mathison kept conditional; Got Questions sentence dropped with its cut); israel (Smith's scope: “popular affinity” and “characteristics of contemporary American Christian Zionism”); tradition (Got Questions controversies clause dropped). Locators corrected (10): origin/6 (pp. 573–74), spread/9, this-generation/1–2 (note on 13:3–37), this-generation/6 and /7, paul-expected/2 (15:51–52), millennium/1, /2 and /6 (section headings). Registry and Trigger Claims files not edited. Counts after: 13 statements, 96 citations, 10 Trigger Claims.
# Second pass flags for the lead: (1) gotquestions-preterist is now cited by no page; its registry entry (added in this draft) is left in hugo/data/external-sources.yaml; drop it or keep it for later use. (2) The preterism short's definition (“already fulfilled, for the most part, in the past”) is quoted from Lehner alone; Molina §3.1.2 defines preterism in the sentences after the quoted list but is quoted only for the list. Treated as a descriptive definition (#133 exemption); the lead may want Molina's definition quoted on a re-review. (3) durbin-2023-cdamm-premillennialism: byline “Published: 3rd January 2023”, but the page's citation block says “3 January 2022”; registry 2023 kept. (4) Contemporary American Religion: Open Library has 2000 and one November 1999 record; 2000 kept. (5) First-pass flags (1)–(8) re-checked and stand; (3) Molina now carries only the list (see 2); (7) 32@00:33:06 and 71@00:16:55 stay attached as one side of a debate the statement reports. (6) The trigger 119@00:03:47 (partial and full preterism) now matches no statement sentence; a Trigger Claim gates the subject, not a statement, so it stays. Publish rule recomputed: core origin backed by Tooth 2023 (Reference), Durbin 2022 (Reference) and de Villiers 2019 (Scholarly), plus Whalen and Stancil (Reference); 13 statements; none Host-authored: met. Ids, slug and draft unchanged.
# Publish 2026-11-27 (lead agent, on the second pass's flags): (1) gotquestions-preterist removed from the registry: added in this draft, now cited by no page. (2) The preterism short's definition (“already fulfilled, for the most part, in the past”) rests on Lehner's sentence; kept as a definition of a term, not a state-of-the-field answer (#133 exempts uncontested facts), and the list of schools beside it rests on Lehner and Molina; no citation added. (3) Durbin premillennialism year kept 2023 (the entry's byline date). (4) Contemporary American Religion year kept 2000. (5) Trigger 119@00:03:47 kept: a Trigger Claim gates the subject, not a statement. (6) Tradition question kept as widened (“and the end times”): narrower wording would imply the Catechism takes a rapture position, which §§675–676 do not. (7) scripture: question reworded to “What do scholars make of the rapture as a reading of the New Testament?” and the short's “Many scholars criticize it” to “Many criticize the doctrine”, so the short answers its question; strength unchanged (Tooth, Frohlich). Publish rule recomputed: core origin backed by Tooth 2023 (Reference), Durbin 2022 (Reference) and de Villiers 2019 (Scholarly): 3 independent in-window authors, none Host-authored; 13 statements, 96 citations. draft flag dropped.
# Partial re-review (#251, 2026-11-27; #93 partial: new or changed statements, full first and second pass for their own citations; sourcesRead unchanged). Three research agents read the issue's items into separate scratch folders; the lead read Britannica and Google Books previews in a browser. Added: forerunners (Bennett, Evangelical Quarterly 2008; Lee thesis 2010; Sweetnam and Gribben, JETS 2009; de Villiers 2019 reported only: the short's “debated” rests on Bennett and Lee, its Macdonald sentence on Sweetnam and Gribben and Lee; each named forerunner's verdict is one author's and stays in the text), parousia (Martin l23 and Plevnik's abstract for the royal-visit use; Tooth for “presence”/“arrival”; “technical term” only as Plevnik's report of Deissmann and Dupont), six-day-war (Smith p. 24 and Durbin 2023 for the short, scoped to “many American evangelicals” and premillennialists; Sturm and Albrecht on Lindsey and Comstock in Britannica on Falwell, attributed). Changed texts only: scripture (Boring and Craddock, People's New Testament Commentary 2004, on Matthew 24:40–41 as gathered into the saved community; appended as scripture/9–10) and preterism (Noe, JETS 2006, full versus partial preterism and full preterism's 70 CE fulfilment; du Rand and Song, Acta Theologica 2004, partial preterism's two lines and its minority standing; appended as preterism/7–14); no existing short, id or citation number changed, and no statement behind an infographic mark (word, thessalonians, dispensationalism, origin, spread) touched. Not written, recorded under leads/uncited: Matthew 24:40–41 as a question (the judgment reading is still Tradition-only; Merkle WTJ 2010 read only in a third-party copy); how many hold the belief (YouGov 2025 and Lifeway 2016 read; neither fits an External Source class). First-pass quotes: 37/37 script-matched (one after joining a PDF line-break hyphen, du Rand and Song's abstract; Boring and Craddock against a transcription of the preview page image). Triggers unchanged; the 71@00:08:18 and 32@00:35:14 conflict notes in data/scholarship-candidates.yaml now also name forerunners. Flags for the second pass: (1) Plevnik's abstract is the thin second author for parousia's short. (2) Noe heads a preterist institute; du Rand and Song argue partial preterism; both cited only for descriptions. (3) Comstock (Britannica) is a writer, not a scholar; attributed only. (4) Boring and Craddock read from a page image. (5) Lee's p. 158/159 page split for the Lacunza sentences.
# #251 second pass 2026-11-28 (independent agent, #93 delegation; changed citations only): re-fetched into its own scratch folder, no first-pass file opened. By curl (no browser User-Agent): Bennett, Lee, de Villiers PDFs, Martin l23, Tooth, Durbin 2023, Sturm and Albrecht, and Plevnik pp. 537–546 live (HTTP 200); du Rand and Song from the registry's Internet Archive snapshot (id_); Sweetnam and Gribben, Noe and Smith got 403 live and were read in Internet Archive id_ copies (20240720122156, 20260317192200, 20251101090512), and all three live URLs were then opened in Chrome and load; Britannica's id_ snapshot 20260819150645 (gzip) by curl and the live article and its edit history in Chrome; Boring and Craddock p. 92 on the Google Books page image in Chrome, transcribed afresh. PDFs read with pdftotext 26.01 (default and -layout) at printed page numbers. Matches: 37/37 by script (whitespace, NFKC, entities, curly quotes and dashes normalised; HTML tags stripped with a space): 34 plain, 1 after closing the space a stripped link leaves before punctuation (six-day-war/5, also verbatim in live Chrome text), 1 after joining line-break hyphens in the second pass's own transcription (scripture/9), 1 plain on that transcription (scripture/10); Lee forerunners/9 also stands on p. 134 (the matcher's first hit), its cited p. 158 occurrence confirmed; forerunners/8 matched at p. 159 directly. Every locator finds its quote; surrounding passages read. Changes (page): forerunners question “Did anyone teach a rapture before Darby?” to “Did anyone teach a pre-tribulation rapture before Darby?” (Bennett's and Lee's debate is over a pretribulation rapture; Lee has Lacunza teaching a different rapture before Darby); forerunners short's “from the visions of Margaret Macdonald in 1830” to “from Margaret Macdonald” (the date and vision are de Villiers's n. 29 alone, a report; Sweetnam and Gribben say “utterances”, Lee gives no date), with the 1830 vision moved into the de Villiers sentence of the text; forerunners text adds Bennett's “apparently, two major differences” beside the Dolcino parallel (p. 160, same paragraph, unquoted); parousia text's Plevnik sentence corrected (“his article” is Peterson's, so “in the wake of an article by E. Peterson”, and the replica reading is of “the coming of Christ in 1 Thessalonians 4:13–18”); preterism text's “two lines within it” now “within partial preterism”; six-day-war short narrowed to the two-author overlap, “Many American evangelicals, and many premillennialists, saw prophetic significance in Israel's founding in 1948 and in its expansion in 1967, including East Jerusalem.” (the fulfilled-prophecy and rapture-within-a-generation clause was Durbin's alone and stays in the text); preterism text: Noe's “Most preterists” restored (“most full preterists hold”), and du Rand and Song's minority named as partial preterism's principal advocates, the Tyler School's Christian Reconstructionists. No citation cut, moved or renumbered; no quote or locator changed; registry and triggers not edited. Counts: 16 statements, 133 citations. Flags for the lead: (1) parousia's short omits the New Testament sense (the coming or return of Jesus), which is what the page's readers meet; Tooth's next sentence and Martin's “what early Christians use to call the coming back of Jesus” say it but are not quoted; a third pass may quote them and add it to the short. (2) Cards: the forerunners question and short and the six-day-war short changed; regenerate. (3) Boring and Craddock's edition and year (2004; 2010 paperback) not re-verified on Google Books; class Reference consistent with the JPS Torah Commentary precedent. (4) The forerunners short still answers with “debated” from Bennett and Lee, both evangelical-venue or thesis sources (Scholarly by precedent); no Reference source on forerunners. (5) Durbin 2023's six-day-war/2–3 are the only premillennialist-wide claims; Smith's scope is American evangelicals; the short keeps the two scopes apart. (6) The forerunners text's “beside, apparently, two major differences” rests on Bennett's p. 160 paragraph, read at the locator but not quoted; quote it or drop the clause. (7) Plevnik's p. 542 has Dupont calling parousia no technical term; the page leaves that unstated (no short needs it).
# #251 resolutions 2026-11-28 (lead agent, on the second pass's flags): (1) parousia short kept to the word's ordinary and civic senses; the New Testament sense is in no quoted sentence, so it is not added. (2) Cards regenerated for forerunners and six-day-war; scripture links regenerated. (3) Boring and Craddock edition left as registered (2004; 2010 paperback, as the Google Books page shows). (4) forerunners' “debated” kept on Bennett and Lee (both Scholarly by venue and thesis precedent). (5) six-day-war's two groups kept separate, as the second pass worded them. (6) The unquoted clause on Dolcino's “two major differences” dropped from the forerunners text: no citation carries it. (7) Plevnik p. 542 (Dupont: parousia “no more a technical term”) left unstated beyond the reported critique; the corrected uncited note stands. (8) The Tyler School name the second pass added to the preterism text dropped: it sits in du Rand and Song's n. 3 sentence before the cited one, not in a citation; “principal advocates … are a minority” stays, carried by preterism/13's “they”. Ids unchanged; 16 statements; sourcesRead unchanged (partial re-review).
