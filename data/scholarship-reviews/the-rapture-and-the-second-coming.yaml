# Issue #160: merges preterism and Christian Zionism; possible trigger Ep 32 00:34:59 on Darby in the 1830s. Scope kept off pauline-authorship (2 Thessalonians' authorship and its delay of the end), daniel-date and the-historical-jesus (Jesus as apocalyptic prophet), and the Timeline's revelation entry (Revelation's date).
# Sourcing test (#160, 2026-11-27): gate 1, ten Trigger Claims in Episodes 32, 71, 118 and 119, each read with about two minutes either side; three more assertions logged as conflicts in data/scholarship-candidates.yaml (71@00:08:18 and the “1800 years” sentence of 32@00:35:14 vs origin; 71@00:15:48 vs thessalonians). Gate 2, the core: the candidate “the rapture was invented by Darby in the 1830s” sourced only as “the rapture as taught today goes back to Darby's teaching in the early nineteenth century; whether anyone anticipated it is debated”: no Scholarly or Reference source says “invented” or names a forerunner in its own words; Emerson and Minahan say “certainly earlier formulations”; Bennett and Sweetnam and Gribben report the origins debate. Gate 3: three in-window independent authors behind the core's main clause (Tooth 2023, Durbin 2022, de Villiers 2019), plus Whalen and Stancil (NCE). Gate 4: 13 statements.
# Dropped for want of a second author or any qualifying source: a parousia statement (meaning disputed as a technical term; no short needs it); Matthew 24:40–41 as taken in judgment (Tradition only; the NABRE reading is attributed in scripture); partial vs full preterism and preterism as fulfilment in 70 CE (Tradition only; attributed in preterism); 1967 as prophetic (Smith only); survey figures for rapture belief (none found; Pew asks other questions).
# First pass: three research agents fetched every source on 2026-11-27 into separate scratch folders and copied quotes from the fetched text; every page quote was then script-matched (whitespace, HTML entities, curly quotes and dashes normalised; HTML tags stripped with and without a space; two PDF line-break hyphens joined, Gundry and Cosby) against those saved texts: 99/99, 0 misses. The second pass must re-fetch.
# Flags for the second pass: (1) Five sources are Critical Dictionary of Apocalyptic and Millenarian Movements entries (four authors and a corporate CenSAMM entry), an open academic dictionary from an academic centre: classed Reference. (2) De Villiers 2019 carries the only “general agreement” sentence and has slips elsewhere (p. 172). (3) Three doctoral theses (Lee, Molina, Smith) are classed Scholarly by the McDonald precedent; Molina is the second author for the preterism short's list of schools. (4) Bennett (Evangelical Quarterly) and Sweetnam and Gribben (JETS) are in evangelical venues, classed Scholarly by the JETS and Tyndale Bulletin precedents; used for the debate and Darby's development. (5) Contemporary American Religion's year (2000) comes from library catalogues, not the page. (6) NABRE notes (1986) and NCE entries (undated, older text) never carry a short alone. (7) Trigger 32@00:33:06 states the royal-arrival reading flatly; attached as a side the statement reports, while 71@00:15:48 (“critical scholarship … finds”) is logged as a conflict. (8) Du Toit's article argues a confessional case; only its definitions are cited.
# Second agent pass 2026-11-27 (#93 delegation, independent; did not build the page; the first pass's scratch folders not read): all 39 cited sources re-fetched by curl (browser User-Agent) into the second pass's own folder, plus Plevnik's p. 545 page and Du Toit's article galley; every URL returned HTTP 200 except bible.usccb.org Mark 13 and Matthew 24 (403 to scripted requests), read in the Wayback snapshots the first pass named (20260202070742, 20251228060054). PDFs read with pdftotext 26.01 in its default mode, which itself joins line-break hyphens (so Gundry and Cosby matched without the first pass's hyphen joins). Every quote script-matched (whitespace, non-breaking spaces, soft hyphens, fi/fl ligatures, ellipses, doubly escaped HTML entities, curly quotes and dashes normalised; HTML tags stripped, with a space and, for three quotes, without; for seven quotes after the cuts (eight before), the space left before punctuation by a stripped inline link closed up): 99/99 before cuts, 96/96 after, 0 misses. Each quote's nearest heading (HTML) or PDF page and running head printed and compared with its locator; Encyclopedia.com quotes confirmed inside the signed entry each is credited to. All ten Trigger Claims and the three conflict entries in data/scholarship-candidates.yaml re-matched by script at timestamp and speaker (full turn, final Transcript) and read about two minutes either side.
# Second pass changes. Cut to uncited (3): preterism/7 and /8 (gotquestions-preterist: a Tradition source describing a view it opposes, not what its tradition holds), tradition/1 (Got Questions on the church's controversies, not what it holds); tradition keys renumbered (old 2–8 now 1–7). Shorts: dispensationalism (pre-tribulation timing now “Most dispensationalists”, Bass's “majority”); today (“Chiefly conservative Christians”, Emerson and Minahan and Frohlich; “above all in the United States” replaced by dispensationalism's US following as a separate sentence, Durbin and Bass; Emerson and Minahan's “United States and Britain” stays in the text, as theirs alone); paul-expected (“Many scholars” to “Many take”, Tooth's “many have taken”, plus the entry's “Others argue”); scripture (“little support among most scholars, sources say” to “Many scholars criticize it, sources say”: the “most” is Tooth's alone and “on biblical and theological grounds” Frohlich's alone; both authors support “many scholars criticize”); tradition (LCMS's Commission on Theology and Church Relations named, not the Synod). Question: tradition widened to “the rapture and the end times” (the Catechism paragraphs never mention a rapture). Texts: origin (Darby's 1829 writing named, from p. 573; de Villiers's “millenarian thinking and the rapture”); spread (Marsden and Svelmoe's own words, not “say the same”); this-generation (Bahr's imminence clause set apart and credited to Stein); millennium (CenSAMM's postmillennialism “after a given period of time”); preterism (Mathison kept conditional; Got Questions sentence dropped with its cut); israel (Smith's scope: “popular affinity” and “characteristics of contemporary American Christian Zionism”); tradition (Got Questions controversies clause dropped). Locators corrected (10): origin/6 (pp. 573–74), spread/9, this-generation/1–2 (note on 13:3–37), this-generation/6 and /7, paul-expected/2 (15:51–52), millennium/1, /2 and /6 (section headings). Registry and Trigger Claims files not edited. Counts after: 13 statements, 96 citations, 10 Trigger Claims.
# Second pass flags for the lead: (1) gotquestions-preterist is now cited by no page; its registry entry (added in this draft) is left in hugo/data/external-sources.yaml; drop it or keep it for later use. (2) The preterism short's definition (“already fulfilled, for the most part, in the past”) is quoted from Lehner alone; Molina §3.1.2 defines preterism in the sentences after the quoted list but is quoted only for the list. Treated as a descriptive definition (#133 exemption); the lead may want Molina's definition quoted on a re-review. (3) durbin-2023-cdamm-premillennialism: byline “Published: 3rd January 2023”, but the page's citation block says “3 January 2022”; registry 2023 kept. (4) Contemporary American Religion: Open Library has 2000 and one November 1999 record; 2000 kept. (5) First-pass flags (1)–(8) re-checked and stand; (3) Molina now carries only the list (see 2); (7) 32@00:33:06 and 71@00:16:55 stay attached as one side of a debate the statement reports. (6) The trigger 119@00:03:47 (partial and full preterism) now matches no statement sentence; a Trigger Claim gates the subject, not a statement, so it stays. Publish rule recomputed: core origin backed by Tooth 2023 (Reference), Durbin 2022 (Reference) and de Villiers 2019 (Scholarly), plus Whalen and Stancil (Reference); 13 statements; none Host-authored: met. Ids, slug and draft unchanged.
