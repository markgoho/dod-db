leads:
  - "Barbara Rossing, The Rapture Exposed (2004), “Invention of the Rapture”: read only as quoted in Lee 2010 and de Villiers 2019."
  - "Crawford Gribben, J. N. Darby and the Roots of Dispensationalism (OUP 2024): not public; Google Books not checked by #251 (API quota). His SZRKG 110 (2016) article is now read (see uncited)."
  - "Donald Akenson, Exporting the Rapture (OUP 2018): only the Queen's University blurb read."
  - "Amy Frykholm, Rapture Culture (OUP 2004): read only as quoted by Durbin and Lee."
  - "F. F. Bruce, Evangelical Quarterly 47 (1975), on Margaret Macdonald, and his WBC 1–2 Thessalonians on apantēsis: read only as quoted by Sweetnam and Gribben and by Cosby."
  - "Morgan Edwards (1788), Pseudo-Ephraem and Increase Mather as pre-Darby forerunners: affirmed only by Tradition sources (Thomas Ice, Pre-Trib Research Center; Got Questions; Grant Jeffrey 1995; Gumerlock in Bibliotheca Sacra, no registry precedent) and by LaHaye/Jenkins as quoted in Lee. #251: Bennett, Lee, Sweetnam and Gribben and de Villiers now weigh or report them in their own words (forerunners). Increase Mather appears only in a garbled de Villiers sentence (p. 182) relaying Tradition sources; not stated."
  - "Peterson 1930, Dupont 1952 and Malherbe on 1 Thess 4:17: read only as reported by Plevnik, Cosby and Tooth."
  - "Kenneth Newport, Apocalypse and Millennium (CUP 2000), on Alcázar: read only as quoted in Lehner 2014."
  - "Timothy Weber, On the Road to Armageddon (2004); Abraham and Boer 2009 on Christian Zionism: read only as quoted in de Villiers (HTS 2019) and Du Toit."
  - "Matthew 24:40–41 read as “taken in judgment”: only Tradition sources (Ice on Blue Letter Bible; NET Bible note) read; no Scholarly or Reference source found for that reading. #251: Benjamin Merkle, Westminster Theological Journal 72 (2010) 169–79, argues the judgment reading and says most commentators read “taken” positively, but was read only in a third-party copy (drmsh.com, Michael Heiser's site; Galaxie paywalled), so a lead; the commentaries in his n. 2 (Hagner, Nolland, Green, Bock, Bruner, Wilkins) were not reached (Davies–Allison p. 383 not in preview)."
