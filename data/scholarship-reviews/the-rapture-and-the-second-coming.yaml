leads:
  - "Barbara Rossing, The Rapture Exposed (2004), “Invention of the Rapture”: read only as quoted in Lee 2010 and de Villiers 2019."
  - "Crawford Gribben, J. N. Darby and the Roots of Dispensationalism (OUP 2024) and SZRKG 110 (2016): not public (403)."
  - "Donald Akenson, Exporting the Rapture (OUP 2018): only the Queen's University blurb read."
  - "Amy Frykholm, Rapture Culture (OUP 2004): read only as quoted by Durbin and Lee."
  - "F. F. Bruce, Evangelical Quarterly 47 (1975), on Margaret Macdonald, and his WBC 1–2 Thessalonians on apantēsis: read only as quoted by Sweetnam and Gribben and by Cosby."
  - "Morgan Edwards (1788), Pseudo-Ephraem and Increase Mather as pre-Darby forerunners: named only by Tradition sources (Thomas Ice, Pre-Trib Research Center; Got Questions) and by LaHaye/Jenkins as quoted in Lee; no Scholarly or Reference source names them in its own words."
  - "Peterson 1930, Dupont 1952 and Malherbe on 1 Thess 4:17: read only as reported by Plevnik, Cosby and Tooth."
  - "Kenneth Newport, Apocalypse and Millennium (CUP 2000), on Alcázar: read only as quoted in Lehner 2014."
  - "Timothy Weber, On the Road to Armageddon (2004); Abraham and Boer 2009 on Christian Zionism: read only as quoted in de Villiers (HTS 2019) and Du Toit."
  - "Matthew 24:40–41 read as “taken in judgment”: only Tradition sources (Ice on Blue Letter Bible; NET Bible note) read; no Scholarly or Reference source found for that reading."
  - "Partial versus full preterism, and preterism tied to 70 CE: only Tradition sources (Got Questions, Dockery in Christianity Today, Mathison) found; Lehner frames preterism as early church history."
uncited:
  - "Kevin Wetmore Jr., “Apocalypse in Cinema” (Bible Odyssey): read; “John Nelson Darby was the first to systematically develop a theory of the rapture” sits in a “Did You Know?” sidebar not shown to be the author's, so not cited or counted."
  - "Philip Almond, UQ News / The Conversation (2025): read; a scholar's public explainer, neither Scholarly nor Reference by venue."
  - "Pew Research Center, Diamant (2022): read; asks about end times and premillennial beliefs, not the rapture, so not cited for who holds it."
  - "N. T. Wright, “Farewell to the Rapture”, Bible Review (2001): read on ntwrightpage.com; a popular magazine, not peer-reviewed."
  - "Melton's Encyclopedia of American Religions, “Independent Fundamentalist Family”: read; Albury 1827 and Powerscourt 1831–33 dates conflict with Sweetnam and Gribben (Powerscourt 1830–38); dates left off the page."
  - "Sales figures for The Late Great Planet Earth and Left Behind: read in Bass, Marsden and Svelmoe, Emerson and Minahan, Tooth, de Villiers; they disagree (4 to 28 million; 40 to 80 million), so no figure is stated."
  - "Darby's North American trips: dates differ across NCE, Emerson and Minahan, Melton and de Villiers; not stated."
  - "Boyer, “Second Coming” (Contemporary American Religion): read; its 1996 poll is unnamed; not cited."
  - "Kuehner and Dolan, NCE “Millenarianism”: read; first-edition text (bibliography to the 1960s); Augustine is carried by Durbin and de Villiers."
  - "Augustine, City of God XX.7–9: read; a primary text, not cited."
  - "New Catholic Encyclopedia, “Parousia” (Ceroke, Duffy), Deissmann 1922, Moulton–Milligan 1914, HarperCollins “Parousia”, NABRE Matthew 24:3: read for the meaning of parousia; Plevnik disputes the “technical term” claim; no parousia statement written, the meaning is not needed for any short."
  - "Tooth, CDAMM “2 Thessalonians”, NABRE 2 Thessalonians 2: read; the authorship and delay points belong to pauline-authorship's second-thessalonians statement and are not restated."
  - "Siegman and Winkler, NCE “Revelation, Book of”: read; Feuillet's method labels do not use “preterist”, and its text is pre-1996."
  - "Ehrman ch. 19 summary on Revelation's first-century setting, and the Timeline's revelation entry: not restated; the page does not equate a historical reading with preterism."
  - "Martin l6 and l7, Sim (Bible Odyssey), Ehrman ch. 6 on the dates of Mark and Matthew: read; dates not stated on the page."
  - "de Villiers, HTS 75(3) 2019, “The dangerous role of politics in modern millennial movements”: read; never names Christian Zionism, so not cited in israel."
  - "Smith 2010 on 1967 as a prophetic turning point: read; one source, not stated."
  - "Du Toit 2016, “Christian Zionism has never enjoyed much support in New Testament scholarship”: read; not cited, as it comes from an article arguing a confessional case against Christian Zionism."
  - "Lippy, Balmer, Huber (Bible Odyssey “Millennium”): Huber's “Premillennialism, the dominant perspective among most evangelical Christians”: read; not cited, today rests on rapture-specific sources."
  - "Got Questions, “Origin of the rapture theory”; Thomas Ice, “A Brief History of the Rapture”: read; Tradition sources making historical claims (forerunners), not what a tradition holds; see leads."
  - "Got Questions Ministries, “What is the preterist view of the end times?” (gotquestions-preterist), opening and second paragraphs (preterism as fulfilled prophecy; full versus partial): read; cut at the second pass (were preterism/7–8): a Tradition source describing a view it does not hold, which is neither what its tradition holds nor what scholars think. The registry entry is no longer cited by any page."
  - "Got Questions Ministries, “When is the Rapture going to occur in relation to the Tribulation?”, opening paragraph (“one of the most controversial issues in the church today”): read; cut at the second pass (was tradition/1): a claim about the state of the church, not what the ministry holds."
