leads:
  - "Eerdmans Dictionary of the Bible, ed. David Noel Freedman (Eerdmans, 2000), p. 441: “In fact, there is no contemporary reference or description in any extrabiblical source.” Google Books snippet; not read in the source itself (#86). Was evidence/5 in the prototype."
  - "John J. Collins, Introduction to the Hebrew Bible, 3rd ed. (Fortress Press, 2019), p. 122: “Sargon of Akkad (c. 2300 b.c.e.), whose mother also placed him in a vessel of reeds in a river.” Google Books snippet; not read in the source itself (#86). Was sargon/2 in the prototype."
  - "Collins and Eerdmans retried 2026-11-23 in a browser: Google Books showed the book's landing page, not p. 122 or p. 441. Still leads."
  - "HarperCollins Bible Dictionary (Bible Odyssey), “Other Unnamed Egyptian Kings”: the pharaoh of the exodus is “often identified by biblical scholars as Rameses II … or, somewhat less likely, his son and successor, Merenptah”. Could back the date statement; left off to keep it lean."
  - "Aaron Adair, “Counting on the Census Numbers”, HIPHIL Novum 10 (2025): the census numbers are “most likely artificial” (abstract). Author's affiliation is MIT Physics; venue not confirmed as peer-reviewed. Not cited."
  - "Ben Zion Katz, “Recounting the Census: A Military Force of 5500”, TheTorah.com: title and search snippets only; author's field not checked. Not read."
  - "Colin J. Humphreys, “How Many People Were in the Exodus from Egypt?”, Science and Christian Belief 12.1, PDF on cis.org.uk: reads ’elep as a troop, about 20,000 people. Search snippet only; author's field not checked. Not read."
uncited:
  - "Jeffrey Stackert, “Moses”, Bible Odyssey (2016): “there is no external evidence from antiquity confirming that Moses was a real, historical person”. Read in full; not cited, because it is broader than the moses statement. Would back a reworded statement (and fits 21@00:28:28) if the owner wants one."
  - "John Huddlestun, “Was Moses' Name Egyptian?”, Bible Odyssey (2016): a 13th-century Moses in Egypt is a figure “many scholars are increasingly less inclined to accept”. Same author, “The Plagues of Egypt” (2022): naturalistic correlations “lack any support in ancient Egyptian records”. Read in full; no plagues statement on the page."
  - "Pithom and Rameses: Meyers p. 6 says they “escape positive identification”; Yoo and Hayes l7 identify Rameses with Pi-Ramesses, rebuilt in the 13th century. A statement would have to show the split, attributed."
  - "Hyksos: the Coogan summary (Josephus's exodus-as-expulsion) and Hayes l7 (the Hyksos era as the setting for Joseph and the descent; “really not well supported”) describe different theories. Only Coogan's is on the page, inside date. Ep 138 has a Taking Issue segment on the Hyksos (00:35:03–00:50:08; 00:48:06: “attempts to find Joseph, Jacob, the enslaved Hebrews, Moses, those folks in the Hyksos is misguided at best”) for a Hyksos statement."
  - "Stanislaw Krajewski, “On Some Arguments Regarding the Number of Israelites During the Exodus and Their Relevance”, Religions 17(6): 737 (MDPI, 2026), abstract and § 1, read 2026-11-23 in a browser: the 600,000 figure is “widely regarded as highly implausible by non-fundamentalist readers of the Torah”; Numbers 1:46's 603,550; a population “well exceeding two million”; scholars treat the numbers as fiction or exaggeration or reread elef as a clan, family or military unit. Was numbers/1–5 and 7. Dropped 2026-11-23 for the Coogan ch. 9 summary: the author is a philosopher, not a biblical scholar, MDPI's standing is in question and the paper later argues a theological case. The page loses “widely regarded”, the two-million figure and the elef reading. An elef sentence would also sit beside Coogan's “no reasonable interpretation … has ever been presented”, so it would need attributing to Krajewski by name."
  - "Zev Farber, “The Torah's Exodus”, TheTorah.com (2015, updated 2026), section “The Number of Israelites”, read in full 2026-11-23: “All historians agree that such a number could not have been supported in ancient Egypt”; rejects the eleph-as-clan reading because Exod 38:26 gives 603,550; reports Friedman's view that the numbers are an exaggeration, perhaps a few hundred. Author holds a PhD in Hebrew Bible (Emory). Not cited: TheTorah.com is a source type #86 didn't rule on (an edited online magazine of the Academic Torah Institute, close to the excluded blog class), and the essay ends in a religious argument. Ruled 2026-11-23 (#86): TheTorah.com is not an External Source class, so this stays uncited."
  - "Coogan and Chapman, chapter 6 summary, section “Exodus and History”, re-read 2026-11-23: “the abundant Egyptian historical records recount no mention of these events or figures.” Was moses/3. Cut in the second pass (owner ruling): “these events or figures” follows a sentence about the unnamed pharaohs and never names Moses, so it does not back “No text discovered in Egypt mentions Moses or Aaron”."
  - "Christine Hayes, Open Yale RLST 145 lecture 7, ch. 3 [00:10:06], re-read 2026-11-23: “It places the Exodus 480 years before Solomon's building of the Temple: 480 is a multiple of 12, and the Bible really likes multiples of 12, so it is an ideal number.” Was date/3. Cut in the second pass with the clause it backed (“the 480 years from the Exodus to Solomon's Temple is an ideal number”): Hayes makes the point while discussing the 430-year stay and never ties the 480 years to the Bible's mid-fifteenth-century date, and the Coogan summary names no number, so the colon linking them was the page's own inference."
  - "Trigger Claim removed 2026-11-23 (owner ruling): Ep 105, Angela Roskop Erisman, 00:15:41.290: the basket story “Modeled on a text about the Assyrian king, Sargon II”. Exact in the Transcript, but the page's sargon statement is about Sargon of Akkad (Hayes), and a card naming Sargon II would confuse readers."
