leads:
  - "Eerdmans Dictionary of the Bible, ed. David Noel Freedman (Eerdmans, 2000), p. 441: “In fact, there is no contemporary reference or description in any extrabiblical source.” Google Books snippet; not read in the source itself (#86). Was evidence/5 in the prototype."
  - "John J. Collins, Introduction to the Hebrew Bible, 3rd ed. (Fortress Press, 2019), p. 122: “Sargon of Akkad (c. 2300 b.c.e.), whose mother also placed him in a vessel of reeds in a river.” Google Books snippet; not read in the source itself (#86). Was sargon/2 in the prototype."
  - "Collins and Eerdmans retried 2026-11-23 in a browser: Google Books showed the book's landing page, not p. 122 or p. 441. Still leads."
  - "Jeffrey Stackert, “Moses”, Bible Odyssey (2016): “there is no external evidence from antiquity confirming that Moses was a real, historical person”. Read in full; not cited, because it is broader than the moses statement. Would back a reworded statement (and fits 21@00:28:28) if the owner wants one."
  - "John Huddlestun, “Was Moses' Name Egyptian?”, Bible Odyssey (2016): a 13th-century Moses in Egypt is a figure “many scholars are increasingly less inclined to accept”. Same author, “The Plagues of Egypt” (2022): naturalistic correlations “lack any support in ancient Egyptian records”. Read in full; no plagues statement on the page."
  - "HarperCollins Bible Dictionary (Bible Odyssey), “Other Unnamed Egyptian Kings”: the pharaoh of the exodus is “often identified by biblical scholars as Rameses II … or, somewhat less likely, his son and successor, Merenptah”. Could back the date statement; left off to keep it lean."
  - "Pithom and Rameses: Meyers p. 6 says they “escape positive identification”; Yoo and Hayes l7 identify Rameses with Pi-Ramesses, rebuilt in the 13th century. A statement would have to show the split, attributed."
  - "Hyksos: the Coogan summary (Josephus's exodus-as-expulsion) and Hayes l7 (the Hyksos era as the setting for Joseph and the descent; “really not well supported”) describe different theories. Only Coogan's is on the page, inside date. Ep 138 has a Taking Issue segment on the Hyksos (00:35:03–00:50:08; 00:48:06: “attempts to find Joseph, Jacob, the enslaved Hebrews, Moses, those folks in the Hyksos is misguided at best”) for a Hyksos statement."
  - "Aaron Adair, “Counting on the Census Numbers”, HIPHIL Novum 10 (2025): the census numbers are “most likely artificial” (abstract). Author's affiliation is MIT Physics; venue not confirmed as peer-reviewed. Not cited."
