leads:
  - "James L. Kugel's four assumptions of ancient interpreters (How to Read the Bible, 2007, pp. 14–16; The Bible As It Was, 1997, pp. 17–23): read only as reports in Alan T. Levenson's review (Jewish Bible Quarterly 40:3, 2012), Michael B. Shepherd (The Bible and Interpretation, 2025) and a First Things essay. Kugel's own text not readable (Google Books captcha; Internet Archive lending-only). Levenson: Kugel “insists that this mode of reading … was not inherent in Scripture”, but calls Kugel's “the minority opinion” and points to Daniel 9 reading Jeremiah 25. Would bear on the Ep 6 claim that univocality is imposed from outside the texts."
  - "Brueggemann, Theology of the Old Testament (Fortress 1997), testimony and countertestimony; Licona, Why Are There Differences in the Gospels? (OUP 2017); Barker, Tatian's Diatessaron (OUP 2021): not public."
  - "Journal of Theological Studies 72/1 (2021) on the Diatessaron, reportedly arguing Tatian's aim was not apologetic harmonizing: blocked, not read. Petersen's “none, on its own, is convincing” already keeps the motive open."
  - "Ehrman's horizontal and vertical reading (Jesus, Interrupted, 2009): not in any public Scholarly or Reference text found."
uncited:
  - "Alan T. Levenson, review of Kugel, Jewish Bible Quarterly 40:3 (2012), jewishbible.org, read in full. Not cited: the Quarterly describes itself as for readers of every background and states no peer review, so its class is unsettled."
  - "Anthony Le Donne, A Study Companion to The Bible (Fortress 2014), ch. 1 “One Book, Many Voices” (“not all of these perspectives are harmonious”), and Ryan Bonfiglio, A Study Companion to Introduction to the Hebrew Bible (Fortress 2014): publisher-hosted sample PDFs. Not cited: the section may excerpt Sumney's textbook, and Bonfiglio's authorship comes from retailer listings."
  - "Henning, “Hell” (Bible Odyssey, 2017): “In Paul’s letters there is no explicit mention of eternal punishment or hell.” Not cited: afterlife diversity across NT authors rests on this one author (Ep 15 trigger)."
  - "Dei Verbum §12 (1965): “the content and unity of the whole of Scripture”. Not cited; the Catechism §112 quotes it."
  - "Augustine, De consensu evangelistarum 1.7.10, and Origen, Commentary on John 10.2, in 19th-century translations (New Advent): primary texts, not an External Source class; no modern Reference account of them read."
  - "Encyclopaedia Judaica, “Bible” (Sarna): Ha-Sefarim, “The Books”. Not cited; 1971 text."
