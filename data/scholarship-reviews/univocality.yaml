      note: "First pass 2026-11-24: No statement says “consensus”. “almost all biblical scholars” (hebrew-bible text) is Coogan/Chapman ch. 4's own wording, attributed, scope the Pentateuch's sources only. “most scholars use a combination” (methods text) is Shectman's, attributed. #133 per short: one-voice (Hayes, Coogan, Martin, Ehrman); anthology (Hayes, Coogan, Breed, Neufeld); hebrew-bible (Meyers, Hayes, Coogan, Ainslie/Lam); gospels (Ehrman, Bond, Martin, HarperCollins); paul-and-james “Scholars differ” (Martin reports the debate; Ehrman and Painter frame it differently); the-end (Ehrman, Martin, HarperCollins); canon “Scholars say” (Ehrman, Martin; Hayes supporting); harmonizing (Tatian fact: Petersen, Breed, Martin); methods (descriptive: Martin, Ehrman; Shectman, Hayes); tradition (Tradition, exempt). Second pass: judge canon's “minimized when they are read as one collection” against Martin, whose quotes are about early Christianity's unifying project rather than the canon.",
