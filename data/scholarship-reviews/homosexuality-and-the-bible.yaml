# Review record for /scholarship/homosexuality-and-the-bible/ (#93 shape). Not rendered.
# agent: results of the agent first pass (#177, 2026-11-25). That pass does not count toward publish.
# owner: empty (""). The owner delegated the publish review (#93, 2026-11-23); the `delegation` block records the independent second agent pass once it has run.
# Sourcing test (#177, 2026-11-25): gate 1, nine Trigger Claims in Episodes 10 and 114, read with the turns either side. Gate 2, the core: the candidate “the biblical writers had no concept of sexual orientation” sourced only as “not in the modern sense”: HarperCollins (Reference), Loader 2014 (Scholarly), Martin l20 (Reference) back it; Brooten (as reported by Brennan) and Loader's Aristophanes caveat show ancient exceptions, so the short reports the debate. Gate 3: 3 independent authors behind the core. Gate 4: 10 statements.
# Dropped for want of a second author or any qualifying source: Jude 7 “strange flesh” as angels (no Scholarly or Reference source discusses it; Bauckham, Hultin, Keener only as quoted in Otey, Themelios 2024, a confessional journal); Ezekiel 16:49 as Sodom's sin (Stiebert only; attributed in the sodom text); Leviticus 18:22 addressing only the insertive partner (Joosten reporting Olyan only; attributed); to‘evah as relative abhorrence (Kawashima only; not stated); a cultic-prostitution reading of Leviticus (no source).
# First pass: three research agents fetched every source on 2026-11-25 into separate scratch folders and copied quotes from the fetched text; every page quote was then script-matched (whitespace and HTML entities normalised) against those saved texts: 77/77, 0 misses. The second pass must re-fetch.
# Flags for the second pass: (1) Most Reference citations are Bible Odyssey pages (nine authors): independent authors, one platform. (2) Huber reports what LGBTQ+ interpreters argue (passages); the passages short also rests on HarperCollins and Loader. (3) Wells's “most academic scholars” is his own judgment, attributed by name in the today text and not used as the short. (4) Brennan and Halperin (BMCR 1997) sit at the edge of the 30-year window; they back only the attributed dissent. (5) Tushima writes from a stated canonical-theological frame at an evangelical seminary; Old Testament Essays is peer-reviewed, so Scholarly by venue (#80: class follows venue), used only for the dissent. (6) Jefferson's field is early Christianity and art; his women citation reports what “commentators” argue. (7) Joosten's own reading (married man) is a new proposal, attributed. (8) Stiebert's first name is not on the PDF; registry and text use “J. Stiebert”.
# Second agent pass 2026-11-25 (#93 delegation, independent): all 28 cited sources (29 URLs; two HarperCollins entries) re-fetched by curl into the second pass's own scratch folder, not the first pass's files: 9 Bible Odyssey articles and their author bios, 2 HarperCollins entries on Bible Odyssey, 2 Hayes and 2 Martin lectures on oyc.yale.edu, the OUP ch. 8 summary, HTS (Loader), SciELO (Tushima), 2 BMCR pages, Encyclopedia.com, vatican.va, gotquestions.org, and PDFs of Stiebert, Joosten (plus its ORA record), Ahern (Humanities Commons, after a cookie retry), Instone-Brewer, ELCA and UCC. The first pass counted 77 quotes; the page held 78. All 78 script-matched (whitespace, HTML entities, stripped tags only), 0 misses; 76 after the cuts below. 15 HTML quotes matched only with inline tags (scripture links, <em>) stripped without inserting a space; no PDF quote needed line-break de-hyphenation. Lecture locators checked against the chapter headings, Bible Odyssey paragraphs counted from the HTML, PDF pages checked against the printed footers, HTS sections checked against the article TOC. All 9 Trigger Claims re-matched by script at timestamp and speaker (full turn, final transcript) and read about two minutes either side.
# Second pass changes. Shorts: orientation (now only “Not in the modern sense, scholars say”, the strength HarperCollins and Loader share, plus the debate; the acts-and-roles clause is cut, since Loader says Paul condemns passion as well as the act); passages (“A few:” and the list, no frequency word); sodom (“homosexual behavior”, not “same-sex desire”; “Some still hold that view” moved out, as it rests on Tushima alone); leviticus (“some scholars question”, not “scholars debate”); women (no “usually … only reference”); vice-lists (“One reading”, not “A common reading”); jesus (“explicitly”). Text: orientation now has Loader's “some” via Aristophanes, and Halperin's “in his view”; sodom drops “she” for Stiebert; leviticus has Hayes's “most scholars think” and Wells's “in his opinion”; women says what Loader says, not “agrees”; romans scopes Martin to ancient Judaism and Christianity, apart from Romans 1; vice-lists describes HarperCollins's words as it does; today drops the uncited “Loader himself holds” clause. Cut to uncited: Joosten's “Several Old Testament scholars…” (old leviticus/8 and today/2), as quoting it alone dropped his “But our verse … would still … prohibit” counterpoint; later keys renumbered. Locators: orientation/7, orientation/8 (not the closing paragraph), leviticus/11–12 (paragraph “In my opinion”), vice-lists/2 (item “a.”), tradition/7–9 (ELCA pp. 20, 20, 21). Registry: Ahern series 27(2): 209–233, publisher University of Texas Press, edition pre-copyedited version; Tushima title subtitle added.
# Second pass flags: (1) Halperin's BMCR response is a letter, not shown to be peer-reviewed; it backs only the attributed reply, and the orientation “debated” also rests on Brennan and Loader. (2) Wells year kept null though his page is dated 14 December 2022, the convention the other BO entries follow. (3) Trigger 10@00:34:12 does not carry the next turn's “active role” qualification; 114@00:44:10 stops before “did abominable things”. Triggers file not edited. (4) Zeichmann's article is sponsored by his own book's publisher. (5) UCC “linked from ucc.org” not re-checked. Publish rule recomputed: core backed by HarperCollins (Reference) and Loader 2014 (Scholarly), 2 independent authors; Martin is not counted. 10 statements. Ids, slug and draft unchanged.
# Publish 2026-11-25 (lead agent, on the second pass's flags): 114@00:44:10 extended to “She was haughty and did abominable things.” so the trimmed quote keeps the clause the speaker goes on to discuss; re-matched by script. 10@00:34:12 kept: the qualification is in the next turn, and a Trigger Claim gates the subject, not a statement. Sodom short kept without the dissent clause (#133: Tushima alone; attributed in the text). Wells year kept null (14 December 2022 is the site migration date; registry convention, as breed-bo-written-transmitted). Halperin kept for the attributed reply only. draft flag dropped.
