      owner: "",
      note: "First pass 2026-11-28 (#265 partial re-review): script-matched against the saved text of the source at its printed folio (p. 248 = PDF p. 262); note markers 11 and 12 (after “von Pilgrim,” and “Briant,”) dropped from the quote. Kottsieper reports von Pilgrim's initial view (note 11: “Elephantine” 262–4; “Tempel des Jahu” 315–7) that the temple was broken up and rebuilt in a reduced size. Text attributes it to Kottsieper reporting von Pilgrim; statement, question and short answer read against it. Second pass 2026-11-28 (#265): re-fetched into my own scratch folder (id_ snapshot 20250519175720, 604 pp.); script-matched verbatim at p. 248 (PDF p. 262, folio checked), only note markers 11 and 12 dropped. The text’s “initially held that the temple was broken up and rebuilt in a reduced size, restoring the old street between it and the wall of the Khnum temple” renders the quote without adding to it (the motive, the street relocation as cause of the Chnum priests’ action, is left out, which narrows rather than overstates).",
