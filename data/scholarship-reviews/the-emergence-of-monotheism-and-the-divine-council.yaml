# Partial re-review for #265 (2026-11-28; owner delegated, #93; no owner check), on #264's second-pass flag (a). First pass (lead agent): BZAW 548 whole-volume PDF re-fetched from the id_ form of Internet Archive snapshot 20250519175720 (604 pp., created 2024-10-03), saved with pdftotext; Kottsieper p. 248 = PDF p. 262 (folio checked). #265's gate (cite only if Kottsieper says the revision concerns the rebuilding, not just the layout): met, narrowly. The view von Pilgrim revised is that the temple “was then broken up and rebuilt in a reduced size” (p. 248, note 11: “Elephantine” 262–4, “Tempel des Jahu” 315–7); the revised view is that temple and Chnum boundary wall “were designed from the beginning” with the main street between them, so the reduced footprint is no longer a rebuilding. Kottsieper never says in so many words that von Pilgrim now denies any rebuilding. Added to elephantine-temple's text, attributed to Kottsieper reporting von Pilgrim, after Stökl's and Moore's reports (elephantine-temple/12, /13, appended; no renumbering). The text does not say which von Pilgrim publication carries which view or that this explains Stökl vs Moore: no source says so. Left uncited: the pp. 248–249 sentence that the later action “probably did not lead to the destruction of the buildings but only to some damages” (what von Pilgrim “maintains” is the juridical background; whether the no-destruction clause is his or Kottsieper's gloss is unclear; it concerns the destruction, not the rebuilding; Kottsieper in his own voice speaks of the temple's “destruction”, PDF p. 259, so no split with the short). Short unchanged (it never mentions the traces), so no question card; the infographic's Elephantine panel draws only on the short and is unaffected. Review date and sourcesRead unchanged (partial re-review, #93).
