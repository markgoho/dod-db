      note: "First pass 2026-11-28 (#264 partial re-review): script-matched against the saved text of the source at its printed folio; surrounding passage, statement, question and short answer read against it. Same Holm sentence as elephantine-sacrifice/11; here cited for its second clause, the second temple's remains not uncovered. Second pass 2026-11-28 (#264): re-fetched; script-matched at p. 204 (PDF p. 218, folio checked). The text said “the remains of the rebuilt temple have not been uncovered”, which takes the rebuilding as fact where Holm says documents “may indicate” it; narrowed to “documents dated after 404 BCE may indicate it was rebuilt, though the remains of a rebuilt temple have not been uncovered”, her hedge kept (as elephantine-sacrifice does); verified as narrowed.",
