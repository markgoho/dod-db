leads:
  - "Mark S. Smith, The Origins of Biblical Monotheism (OUP 2001), on the divine council's four tiers and the household model: only via Trapp's JHS review, Frankel and Heiser; OUP pages gated."
  - "Mark S. Smith, The Early History of God (2nd ed. 2002), Miller's foreword “No consensus has been reached on the origins of monotheism in ancient Israel”: read only in a user-uploaded Internet Archive scan."
  - "Joel S. Burnett, A Reassessment of Biblical Elohim (SBLDS 183, 2001): not open; known through Burns's review."
  - "Robert Gnuse, No Other Gods (1997), on a “rising consensus” for an exilic breakthrough: quoted in Markl p. 5."
  - "Saul Olyan, “Is Isaiah 40–55 Really Monotheistic?” JANER 12 (2012): cited by Fredriksen; not opened."
  - "Pongratz-Leisten (ed.), Reconsidering the Concept of Revolutionary Monotheism (2011): cited by Markl; not open."
  - "Nathan MacDonald, Deuteronomy and the Meaning of “Monotheism” (2003/2012), full text: paywalled."
  - "Karel van der Toorn, Becoming Diaspora Jews (Yale 2019), on the community's northern origins: known through Stökl and Moore."
  - "BZAW 548 chapters by Kratz, Kottsieper, Moore and Barnea on Elephantine and the Torah, the Passover letter and the rebuilt temple's sacrifices: read by a research agent in a browser, not saved; to be re-read for any future Elephantine statement."
  - "van Ruiten, “Angels and Demons in the Book of Jubilees” (2007), on Jubilees 15:31–32: open PDF behind Cloudflare."
  - "Trotter, JBL 131 (2012) on Psalm 82 and Deut 32: paywalled. McClellan, JBL 137 (2018) on Psalm 82 (Host-authored): not downloaded."
  - "Krašovec, Živa Antika 45 (1995): “the majority of commentators” read Psalm 82's gods as Israelite judges; read, but one year outside the window (see uncited)."
  - "van der Toorn, “The Nature of the Biblical Teraphim”, CBQ 52 (1990); Lewis, “Teraphim”, DDD; Schmidt, Israel's Beneficent Dead (1996): via Sonia, Cook and Cox and Ackerman."
uncited:
  - "Second pass 2026-11-27, cut from category (was category/9): Mohr Siebeck's catalogue description of Nathan MacDonald, Deuteronomy and the Meaning of “Monotheism” (FAT II/1, 2nd ed. 2012), “He traces the use of 'monotheism' since its coinage in 1660 and argues that its use in Old Testament scholarship frequently reflects a narrowed, intellectualistic conception of religion”: read; marketing copy that reports MacDonald's argument, not his own text, and unlike the OUP chapter summaries (#86) no precedent admits a catalogue blurb; when in doubt, cut. Registry entry macdonald-2012-deut-meaning-monotheism-summary removed (cited by no page); category keeps Fredriksen, Markl, Sommer and Ben-Dov."
  - "Krašovec 1995, Živa Antika 45: read; “the majority of commentators have interpreted these psalms as referring to Israelite judges”; just outside the 30-year window, so not set against Frankel's and Mongé-Greer's in-window statements."
  - "Heiser 2006 (HIPHIL, evangelical e-journal) and Heiser, Bibliotheca Sacra 158 (2001): read; Tradition venues; the “consensus view” that the council's gods became angels is reported only to be disputed."
  - "Frankel 2010 pp. 3–7 and Ben-Dov 2018 n. 16 on whether Elyon and Yahweh are distinct in Deut 32:8–9 and Psalm 82: read; the El/Yahweh question belongs to the-origins-of-yahweh; not stated."
  - "Hayes l7 on the evolutionary and revolutionary models failing and Smith's convergence model: read; the-origins-of-yahweh's convergence statement already reports the model."
  - "Hartman/Sperling, EJ “God, Names of”, on why elohim is plural (“explained in various ways… More likely… Canaanite usage”): read; the paragraph may be first-edition text; why the word is plural is not stated."
  - "Oseka 2017 (Journal for Semitics) and 2018 (Scriptura) on Jewish and Christian readings of the plural verbs and Genesis 1:26: read; not needed once the Trinity question was dropped."
  - "LaCugna, Encyclopedia of Religion “Trinity”: read; “Exegetes and theologians today are in agreement that the Hebrew Bible does not contain a doctrine of the Trinity” is 1987 text."
  - "Ligonier, Reformation Study Bible and Watchtower (Aid to Bible Understanding) on elohim and the Trinity: read; Tradition; statement not made."
  - "NCE Murphy, “Elohim” (plural of majesty): read; text likely 1967."
  - "Trapp 2003 review of Smith (JHS) and Handy's publisher page: read; one source per council model; not stated."
  - "Posen Library headnotes on the Elephantine petition and Passover letter: read; no credentials shown; not needed."
  - "Ziemba and Fry, Teologisk Information (Copenhagen faculty magazine): read; not peer-reviewed, misdates Darius II."
  - "Levine 2014 p. 41 rendering of Deut 6:4 (“Yahweh is the single God”): read; not needed beside Dolansky, Tigay and Kimelman."
  - "Chabad.org, Loewenthal, “Expressing Oneness”: read; a third Tradition source, not needed."
  - "Cox and Ackerman 2012 p. 1: “no consensus has been reached regarding the etymology” of teraphim: read; scope is the word's etymology only."
  - "EJ “Teraphim”: “The idea that possession of the household gods was in some way connected with rights to property inheritance has found widespread acceptance”: read; first-edition text (bibliography to 1968)."
