# Review record for /scholarship/the-emergence-of-monotheism-and-the-divine-council/ (#93 shape). Not rendered.
# agent: results of the agent first pass (#151, 2026-11-27). That pass does not count toward publish.
# owner: empty (""). The owner delegated the publish review (#93, 2026-11-23); the `delegation` block records the independent second agent pass once it has run.
# Issue #151 instructions: merge Elohim, Elephantine and teraphim into the page; stay clear of the El/Baal questions answered on the-origins-of-yahweh. Short answers report the state of scholarship (#133); confessional study Bibles are Tradition and do not count toward the two. Overlap checked: the-origins-of-yahweh already states El as head of a council of gods (resemblance) and Mark Smith's convergence model (convergence), so this page makes no El–Yahweh, Baal or convergence statement (council reports White's four-tier Ugaritic pantheon only as the comparison)  and leaves whether Elyon and Yahweh are distinct in Deut 32:8–9 unstated; satan-demons-and-angels made no sons-of-God statement and covers angel names and the satan of Job, so angels here is only the recasting of the nations' gods; the-text-of-the-hebrew-bible states the Deut 32:8 reading as a textual fact, so deuteronomy-32 reuses davies-ej-dead-sea-scrolls with the same quote and is about what the verse says. Asherah and creation ex nihilo are separate candidates, not touched. Registry ids reused: hayes-rlst145-l2, -l5, -l7, -l19, coogan-brief-4e-summary-ch21, sperling-2005-god-hebrew-scriptures, sonia-2020-caring-for-the-dead, davies-ej-dead-sea-scrolls, ej-angels-bible, ej-angels-apocrypha, nabre-genesis-1-notes, nabre-daniel-notes (cite-level url for Daniel 10).
# Sourcing test (#151, 2026-11-27): gate 1, 14 Trigger Claims in Episodes 7, 19, 59, 117, 121, 126 and 182, each script-matched at timestamp and speaker and read with about two minutes either side. Gate 2, the core: the issue's subject (“the emergence of monotheism”) is carried at the strength its sources share as explicit: the first explicit denial that other gods exist is in Second Isaiah, sixth century BCE, and earlier texts call for Yahweh's exclusive worship without denying other gods. Backed by Coogan and Chapman 2019 (Reference), the NABRE Isaiah 44 note (Reference), Hayes 2006 (Reference), Sperling 2005 (Reference), Markl 2020 (Scholarly) and Machinist 2006 (Scholarly): 6 independent in-window authors, none Host-authored; dissent from Levine 2014, Petry (reported by Markl) and Fredriksen 2022 is attributed in the text. Deuteronomy 4 is named only by Markl, so it is in the text, not the short. Gate 4: 16 statements.
# Dropped: Mark S. Smith, The Early History of God (2002): read only in a user-uploaded Internet Archive scan of an in-copyright book, not a publisher or library copy; not cited. Four BZAW 548 chapters (Kratz, Kottsieper, Moore, Barnea) were read by a research agent only in a browser and not saved; with them go the Passover-letter question, what Elephantine shows about the Torah, the community's origins (six authors, no agreement) and the reported ban on animal sacrifice in the rebuilt temple (EJ and Posen against Moore); none is stated. van der Toorn 2024 (same volume) is cited from an excerpt the lead copied from the publisher's page in Chrome. Why elohim is plural (no in-window source states a field position; EJ “God, Names of” paragraph may be first-edition text) and elohim and the Trinity (only Tradition sources on the noun; LaCugna's “Exegetes and theologians today are in agreement” is 1987 text): not stated. Models of the council (Smith's household, Handy's bureaucracy, royal court): one source per model, no comparison: not stated. Jubilees 15:31–32: no secondary source read. Psalm 82's date: kept as attributed disagreement inside psalm-82, not a statement. Heiser (Bibliotheca Sacra 2001; HIPHIL 2006): Tradition venues, not needed.
# First pass: four research agents fetched sources on 2026-11-27 into separate scratch folders (curl; Internet Archive snapshots for bible.usccb.org, Brandeis and Chabad) and copied quotes from the fetched text; the lead fetched the four Bible Odyssey articles by Sommer, White, Ballentine and Dolansky and the Davies EJ entry itself, and copied the van der Toorn 2024 excerpt from Chrome. Every page quote was then script-matched against the saved text of its source with whitespace collapsed, HTML entities decoded, ligatures expanded (NFKC), soft hyphens and zero-width spaces removed, line-break hyphens joined, and converter spaces before punctuation and inside parentheses removed (the page quotes carry the tidied spacing): 170/170, 0 misses.
# Flags for the second pass: (1) TheTorah.com (Tov 2023, Ben-Dov 2018) has no class precedent in the registry; classed Reference like Bible Odyssey (credentialed authors, not peer-reviewed); neither is alone behind a short. (2) Mongé-Greer 2023 is a Pickwick (Wipf & Stock) monograph, classed Scholarly; read from the publisher's sample chapter PDF. (3) psalm-82: Frankel 2010's “Most scholars by now agree” and Mongé-Greer's “no clear consensus” disagree about the state of the field, so the short says “Scholars disagree” (#80) and keeps “Many”; Frankel's sentence is quoted in the text, attributed. (4) van der Toorn 2024: De Gruyter gives scripts an empty body; the excerpt was copied from the browser's text (line-break hyphens “com- munities”, “peri- od” joined for the match); the HTML has no page numbers, so the locator names the paragraph. (5) Encyclopaedia Judaica entries (Jacobs, Schalit and Matassa, Bamberger, Gutmann) have year null; their text may be first-edition (1971). Bamberger and Gutmann back angels beside NABRE Daniel 10 (2011) and van der Toorn 2024; Schalit and Matassa back facts only (dates, destruction, petition) beside Stökl 2025 and Mondriaan 2013. (6) Kimelman (Brandeis University's The Jewish Experience, 2022) classed Reference; read in an Internet Archive snapshot; the analysis is presented as his. (7) MacDonald is cited from the publisher's description of his book, as the publisher summarises it. (8) explicit quotes Sperling's consensus sentence (“Scholars are in agreement”) in the text with its own scope (by the end of the Babylonian exile); the short says “scholars say” for the Second Isaiah claim, which six authors carry. (9) Markl p. 6 reads “late exilic Judah” where his p. 5 has “late pre-exilic Judah”; the development quote stops before those words. (10) Bible Odyssey years are the page dates shown (Sommer 2015, Brown 2017, Dolansky 2021, White 2023, Cook 2024, Ballentine 2025). (11) Agharanya and Poniatowski's affiliation is the Adventist University of Africa; the venue (The Biblical Annals, KUL) is peer-reviewed, so the class follows the venue; 2026 is inside the window. (12) Tigay is the JPS Torah Commentary excerpt on MyJewishLearning, year 1996 from the commentary's edition, not from the page. (13) Hayes l2's quote keeps the transcript's “counsel” for “council”. (14) Stökl's “Most scholarly analyses can be grouped in this category” refers to his first category (mixed or syncretic Judaism, with a hypostasis variant); the text reports it so scoped.
