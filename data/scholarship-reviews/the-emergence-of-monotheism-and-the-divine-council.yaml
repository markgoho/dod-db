# #243 flags for the second pass: (1) Each short reports the field from 2+ authors: origins (Holm's “much debated… most scholars do agree… before Persian conquest”, Becking's “unclear… many possible options”); passover (Barnea's “for all scholars thus far” and Moore's “as most have previously argued”, each with its own scope, Kottsieper's “disputed”, Stökl's “too fragmentary”); torah (Kratz and Holm; Stökl and Moore on psḥ/šbh); sacrifice (Kottsieper holds the usual reading, Moore reports it as followed by all and dissents) — sacrifice is the thinnest: only Kottsieper holds the reading himself. (2) The sacrifice question avoids presupposing the rebuilding happened (Moore p. 320; Holm p. 204 “may indicate”). Moore p. 320 n. 40 (no archaeological evidence of renovation at von Pilgrim's site) sits against Stökl p. 66's “traces of an attempt at rebuilding” cited on elephantine-temple; not changed here (existing statement), flagged for the owner's next full re-review. (3) Kottsieper and Barnea date Cambyses' conquest to 526 BCE, Mondriaan and the existing page to 525; elephantine-origins gives Mondriaan's 525 attributed and no year for Kottsieper. (4) Barnea's and Moore's alternative readings of A4.1 and Moore's of A4.9/A4.10 are single-author views, so they are in the texts, attributed, not in the shorts. (5) The Kottsieper registry title is a transliteration of the chapter's Hebrew.
