      note: "First pass 2026-11-28 (#264 partial re-review): script-matched against the saved text of the source at its printed folio; surrounding passage, statement, question and short answer read against it. Moore reports von Pilgrim (“On the Archaeological Background,” 11); quote ends before the note's next sentence. Text attributes the finding to Moore reporting von Pilgrim, set against Stökl's report (elephantine-temple/9), per #80. Second pass 2026-11-28 (#264): re-fetched (BZAW 548 id_ snapshot, own scratch folder); script-matched at p. 320 (PDF p. 334, folio checked), note 40; text matches the note (Moore reporting von Pilgrim, “On the Archaeological Background,” 11). Kottsieper pp. 248–249 suggests this is von Pilgrim's later, revised view (he first saw the temple as “broken up and rebuilt in a reduced size”); the text attributes each report to its author, so the split stands as shown; verified.",
