rules:
  publish-rule:
    {
      agent: pass,
      owner: "",
      note: "First pass 2026-11-27: 16 statements. Core explicit cites Coogan and Chapman 2019 (Reference), NABRE Isaiah 44 note (Reference, 2011), Hayes l19 (Reference, 2006), Sperling 2005 (Reference), Markl 2020 (Scholarly), Machinist 2006 (Scholarly) for the claim, and Levine 2014 and Fredriksen 2022 for attributed dissent: 6 independent authors behind the claim, none Host-authored. Holds.",
    }
  consensus-wording:
    {
      agent: pass,
      owner: "",
      note: "First pass 2026-11-27: no short says “consensus”. “Scholars generally recognise” (council) rests on Agharanya and Poniatowski's own “generally recognised in scholarship” (2026), with White, NABRE, Hayes and Lemański describing the scenes. “Most scholarly treatments”, “largely fallen out of favor” and “gained some acceptance” (teraphim text) are Sonia's words, attributed. Sperling's “Scholars are in agreement” and Frankel's “Most scholars by now agree” are quoted in texts, attributed and scoped. psalm-82 drops consensus words because Frankel and Mongé-Greer disagree on the state of the field (#80). “scholars say” (first-commandment, explicit) rests on 5 and 6 in-window authors respectively. development's “Many accounts” is weaker than Markl's “Most commonly” and Hayes's “Most scholars conjecture”.",
    }
  dissent-attributed:
    {
      agent: pass,
      owner: "",
      note: "First pass 2026-11-27: Levine, Petry (as reported by Markl), Fredriksen (explicit); Kaufmann (as reported by Hayes), White, Ben-Dov (development); Fredriksen, MacDonald (via publisher), Sommer's redefinition, Markl, Ben-Dov (category); Kaufmann (via Frankel), Lemański's own view (psalm-82); Sonia's dissent from the ancestor reading (teraphim); van der Toorn, Becking, Mondriaan, Stökl (elephantine-gods): each named in the text.",
    }
  tradition-named:
    {
      agent: pass,
      owner: "",
      note: "First pass 2026-11-27: the Catholic Church (Catechism of the Catholic Church) and Reform Judaism (ReformJudaism.org, Union for Reform Judaism) named in their own words in tradition; Dolansky's “Jewish tradition” and Jacobs's “Jewish thought” are Reference sources' words.",
    }
