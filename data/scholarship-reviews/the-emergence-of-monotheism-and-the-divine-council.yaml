# Issue #151 instructions: merge Elohim, Elephantine and teraphim into the page; stay clear of the El/Baal questions answered on the-origins-of-yahweh. Short answers report the state of scholarship (#133); confessional study Bibles are Tradition and do not count toward the two. Overlap checked: the-origins-of-yahweh already states El as head of a council of gods (resemblance) and Mark Smith's convergence model (convergence), so this page makes no El–Yahweh, Baal or convergence statement (council reports White's four-tier Ugaritic pantheon only as the comparison)  and leaves whether Elyon and Yahweh are distinct in Deut 32:8–9 unstated; satan-demons-and-angels made no sons-of-God statement and covers angel names and the satan of Job, so angels here is only the recasting of the nations' gods; the-text-of-the-hebrew-bible states the Deut 32:8 reading as a textual fact, so deuteronomy-32 reuses davies-ej-dead-sea-scrolls with the same quote and is about what the verse says. Asherah and creation ex nihilo are separate candidates, not touched. Registry ids reused: hayes-rlst145-l2, -l5, -l7, -l19, coogan-brief-4e-summary-ch21, sperling-2005-god-hebrew-scriptures, sonia-2020-caring-for-the-dead, davies-ej-dead-sea-scrolls, ej-angels-bible, ej-angels-apocrypha, nabre-genesis-1-notes, nabre-daniel-notes (cite-level url for Daniel 10).
# Sourcing test (#151, 2026-11-27): gate 1, 14 Trigger Claims in Episodes 7, 19, 59, 117, 121, 126 and 182, each script-matched at timestamp and speaker and read with about two minutes either side. Gate 2, the core: the issue's subject (“the emergence of monotheism”) is carried at the strength its sources share as explicit: the first explicit denial that other gods exist is in Second Isaiah, sixth century BCE, and earlier texts call for Yahweh's exclusive worship without denying other gods. Backed by Coogan and Chapman 2019 (Reference), the NABRE Isaiah 44 note (Reference), Hayes 2006 (Reference), Sperling 2005 (Reference), Markl 2020 (Scholarly) and Machinist 2006 (Scholarly): 6 independent in-window authors, none Host-authored; dissent from Levine 2014, Petry (reported by Markl) and Fredriksen 2022 is attributed in the text. Deuteronomy 4 is named only by Markl, so it is in the text, not the short. Gate 4: 16 statements.
# Dropped: Mark S. Smith, The Early History of God (2002): read only in a user-uploaded Internet Archive scan of an in-copyright book, not a publisher or library copy; not cited. Four BZAW 548 chapters (Kratz, Kottsieper, Moore, Barnea) were read by a research agent only in a browser and not saved; with them go the Passover-letter question, what Elephantine shows about the Torah, the community's origins (six authors, no agreement) and the reported ban on animal sacrifice in the rebuilt temple (EJ and Posen against Moore); none is stated. van der Toorn 2024 (same volume) is cited from an excerpt the lead copied from the publisher's page in Chrome. Why elohim is plural (no in-window source states a field position; EJ “God, Names of” paragraph may be first-edition text) and elohim and the Trinity (only Tradition sources on the noun; LaCugna's “Exegetes and theologians today are in agreement” is 1987 text): not stated. Models of the council (Smith's household, Handy's bureaucracy, royal court): one source per model, no comparison: not stated. Jubilees 15:31–32: no secondary source read. Psalm 82's date: kept as attributed disagreement inside psalm-82, not a statement. Heiser (Bibliotheca Sacra 2001; HIPHIL 2006): Tradition venues, not needed.
