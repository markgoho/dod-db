rules:
  publish-rule:
    {
      agent: pass,
      owner: "",
      note: "First pass 2026-11-27: 16 statements. Core explicit cites Coogan and Chapman 2019 (Reference), NABRE Isaiah 44 note (Reference, 2011), Hayes l19 (Reference, 2006), Sperling 2005 (Reference), Markl 2020 (Scholarly), Machinist 2006 (Scholarly) for the claim, and Levine 2014 and Fredriksen 2022 for attributed dissent: 6 independent authors behind the claim, none Host-authored. Holds. Second pass 2026-11-27: recount by clause. “First explicit denial in Second Isaiah”: Coogan and Chapman (“first passage in the Bible to explicitly state”) and NABRE (“with Second Isaiah… explicitly monotheistic”; earlier formulas did not exclude other gods) say it outright; Hayes (implicit in Isaiah, “quite explicit” in Second Isaiah) and Markl (earliest evidence in Deuteronomy 4 and Deutero-Isaiah, order debated) support it; Sperling (“most consistent monotheist”) and Machinist (Second Isaiah the late-daters' “favored option”) do not say “first”. So 2 authors state it, 2 more support it, not 6. “Sixth century BCE, during the Babylonian exile”: Coogan (“sixth century in Babylon”) and Machinist (“the Babylonian Exile of the sixth century BCE, in the writing of… Deutero-Isaiah”); Markl's “around, or some time after, 539” and Petry's fifth century are in the text. “Earlier texts… without denying”: NABRE and Sperling. 16 statements kept after one citation cut (category/9); core still backed by 2+ independent Reference sources, none Host-authored. Holds.",
    }
  consensus-wording:
    {
      agent: pass,
      owner: "",
      note: "First pass 2026-11-27: no short says “consensus”. “Scholars generally recognise” (council) rests on Agharanya and Poniatowski's own “generally recognised in scholarship” (2026), with White, NABRE, Hayes and Lemański describing the scenes. “Most scholarly treatments”, “largely fallen out of favor” and “gained some acceptance” (teraphim text) are Sonia's words, attributed. Sperling's “Scholars are in agreement” and Frankel's “Most scholars by now agree” are quoted in texts, attributed and scoped. psalm-82 drops consensus words because Frankel and Mongé-Greer disagree on the state of the field (#80). “scholars say” (first-commandment, explicit) rests on 5 and 6 in-window authors respectively. development's “Many accounts” is weaker than Markl's “Most commonly” and Hayes's “Most scholars conjecture”. Second pass 2026-11-27: re-checked each sentence against its source. Agharanya and Poniatowski's n. 15 antecedent is their list of six passages; “scholars say” in explicit rests on 2 authors who state the claim outright and 2 who support it (see publish-rule), which still meets #133. No short widens its source's scope; verified.",
    }
  dissent-attributed:
    {
      agent: pass,
      owner: "",
      note: "First pass 2026-11-27: Levine, Petry (as reported by Markl), Fredriksen (explicit); Kaufmann (as reported by Hayes), White, Ben-Dov (development); Fredriksen, MacDonald (via publisher), Sommer's redefinition, Markl, Ben-Dov (category); Kaufmann (via Frankel), Lemański's own view (psalm-82); Sonia's dissent from the ancestor reading (teraphim); van der Toorn, Becking, Mondriaan, Stökl (elephantine-gods): each named in the text. Second pass 2026-11-27: MacDonald removed from category with its citation (category/9 cut: publisher's catalogue blurb, not his text); the rest re-checked; verified.",
