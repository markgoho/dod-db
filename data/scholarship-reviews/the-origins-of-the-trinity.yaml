rules:
  publish-rule:
    {
      agent: pass,
      owner: "",
      note: "First pass 2026-11-27: 18 statements. Core new-testament cites Kärkkäinen 2017 (Scholarly), Tuggy 2025 (Reference), Martin 2009 (Reference) and Lietaert Peerbolte 2015 (Scholarly): 4 independent authors, all in the window, none Host-authored. Second pass 2026-11-27: recounted clause by clause after the cuts. “Not explicitly”: Kärkkäinen 2017 (Scholarly, p. 15), Tuggy 2025 (Reference), Martin 2009 (Reference): 3 independent authors, in the window, none Host-authored. “Worked out after the New Testament”: Martin and Lietaert Peerbolte (Scholarly; his note is about Paul). “Contested”: Tuggy, with Martin's “some people will say … hinted at”. Peerbolte is not counted for “not explicitly”. 18 statements; rule holds.",
    }
  consensus-wording:
    {
      agent: pass,
      owner: "",
      note: "First pass 2026-11-27: no short says “consensus”. “Consensus” appears only in Moser's quote, attributed in worship text with its dissent. “Most scholars” appears only as Carr and Brettler's and Martin's words (plural) and Demacopoulos's (easter), attributed. #133 per short: new-testament (Kärkkäinen, Tuggy, Martin, Peerbolte; contested: Tuggy, Martin, Kärkkäinen); worship (Hurtado, Kärkkäinen vs Fredriksen, Dunn as reported by Moser); triadic (fact, Peppard; differ: Kärkkäinen vs Levison's minimal reading); spirit (HarperCollins, Bowker, van Aarde; Levison attributed); plural (HarperCollins, Carr and Brettler, Kärkkäinen, Martin); word (fact: Whittaker, Richard and Hill, Tuggy; debate Tuggy vs Parsons); subordination (Delport, Edwards, Tuggy, Hamell); arius (Tuggy, Lyman, De Clercq, Bowker, Delport); arius-roots (Lyman, Delport, De Clercq, Edwards; debated: Lyman); nicaea, homoousios, easter, spirit-nicaea (facts, 2+ authors each); after-nicaea (Kim, Lyman, Ortiz de Urbina, De Clercq); constantinople (Bowker, Hauser, Kreilkamp, Kim, Baber; creed wording Haykin, Noble); creed (Kim, Ryan, Bowker, Noble; debated Ryan vs Bowker); persons (Tuggy, Baber, LaCugna); tradition (Tradition sources, exempt). Second pass 2026-11-27: re-checked after the edits: no short says “consensus” or “most scholars”. #133 changes: plural short no longer carries HarperCollins's “grandeur” (one source); worship's Fredriksen clause scoped to Paul's communities; arius-roots now rests on Lyman, Delport and Edwards (De Clercq cut).",
    }
  dissent-attributed:
