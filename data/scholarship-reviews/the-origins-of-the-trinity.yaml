# Issue #154 instructions: merges Holy Spirit and Council of Nicaea; possible trigger Ep 5 (Nicaea, homoousios). Short answers report the state of scholarship (#133); confessional study Bibles are Tradition. Scope against overlap pages: the Johannine comma (1 John 5:7–8) is new-testament-later-additions' `comma` and is not restated; Matthew 28:19 appears only as a triadic text a source names, with no claim about its authenticity (#241 has no in-window source for that); the monotheism page's `elohim` (is Elohim plural?) is not re-answered: `plural` asks only whether the plural points to the Trinity. No candidate entry existed for this subject (slug from the issue title).
# Sourcing test (#154, 2026-11-27): gate 1, eleven Trigger Claims in Episodes 5, 42, 53, 109, 160 and 182, each read with about two minutes either side. Gate 2, the core: no candidate core; the sources set it as “no explicit doctrine of the Trinity in the New Testament; worked out later; whether it can be inferred is contested”. Gate 3: four independent authors behind the core: Kärkkäinen 2017 (Scholarly, Fortress), Tuggy 2025 (Reference, SEP), Martin 2009 (Reference, Yale), Lietaert Peerbolte 2015 (Scholarly, HTS); none Host-authored. Gate 4: 18 statements.
# Dropped for want of a qualifying source or a second author: whether Nicaea decided the biblical canon (Huggins, Midwestern Journal of Theology 2010, a seminary house journal, and Meade, Text & Canon Institute, an apologetic site, read; the FCC editors' note on Jerome's Judith preface read; the New Catholic Encyclopedia lists the surviving acts but does not discuss the canon; the 2025 Taylor & Francis article and Voltaire could not be fetched): leads, issue to file; Nicholas of Myra slapping Arius and the iota story (no admissible source mentions either; Gibson's NCE entry, read, says only that Nicholas's presence at Nicaea is legend, one author); Justin's and Philo's “second god” as a statement (Pépin 1987 only; Justin's sentence is quoted in `subordination` as a fact about the text); the filioque (Catholic and Orthodox Tradition sources only); Constantine as the source of homoousios beyond Eusebius's report (Fernández, Theological Studies 2025, blocked).
# Show conflicts not attached as Trigger Claims (CONTEXT.md, 2026-11-25), logged in data/scholarship-candidates.yaml: 5@00:36:39 (Eusebius of Nicomedia exiled with Arius) vs nicaea; 42@00:40:01's later sentences (three persons in one being and consubstantiality first asserted at Nicaea) vs persons and homoousios; 42@00:45:28 (Arius a bishop) vs arius.
# First pass: four research agents fetched every source on 2026-11-27 with curl into separate scratch folders and copied quotes from the saved text; the page's quotes were then extracted by script from those saved texts between anchors and re-matched (whitespace, HTML entities and curly quotes normalised; PDF line-break hyphens joined): 105/105, 0 misses. The second pass must re-fetch.
# Flags for the second pass: (1) Dale Tuggy is himself a unitarian and his SEP supplement cites his own counter-narrative; used for what the New Testament does not state explicitly, the dating of trias/trinitas, “many scholars call this strain subordinationist”, Arius, and the Cappadocians, all attributed. (2) Kärkkäinen's “scholarly consensus” sentence is about the Bible as a whole and he says it applies “first and foremost” to the Old Testament; his NT judgment is his own p. 15 sentence; the short does not say “consensus”. (3) Moser's “consensus” is about high Christology, not the Trinity; reported in `worship` beside the dissent he names; the worship short calls it a disagreement. (4) New Catholic Encyclopedia entries (Catholic University of America) are classed Reference by registry precedent; most carry first-edition text (bibliographies to 1956–1993; “Trinity, Holy” to 2000); used for facts (dates, names, the creed's wording), with the state-of-the-field shorts resting on in-window authors. (5) LaCugna's and Pépin's Encyclopedia of Religion entries are 1987 text in the 2005 edition: used only for specific claims (the Cappadocians' vocabulary; Justin's sentence), never for a state of the field. (6) Haykin writes in the Journal of the Evangelical Theological Society (peer-reviewed; a society with a doctrinal basis) and Parsons and Noble in Tyndale Bulletin (registry precedent: Scholarly); Haykin backs only Gregory of Nazianzus's criticism, beside Noble; Parsons only the implicit-Trinitarianism side of the `word` debate. (7) Van Aarde 1999 is an OCR scan; quote matched in the plain text. (8) Fredriksen's offprint is marked “For use by the Author only” but posted openly by her department. (9) Kärkkäinen is read in the publisher's free sample chapter (ch. 1 only). (10) The Church History forum (2025) has several authors; each section is its own registry entry; section attributions follow the forum's headings. (11) Kim 2025 and J. Rebecca Lyman appear twice each (forum and other work); counted once each. (12) Bowker entries are one author (John Bowker, ed.) across four entries. (13) Carr and Brettler's Bible Odyssey answer does not say which of them wrote it; attributed jointly.
# Second agent pass 2026-11-27 (#93 delegation, independent): all 44 cited sources (41 URLs: two HarperCollins and two Hopko pages; two Encyclopedia.com pages and the Church History forum each serve several entries; plus the SEP main entry for Tuggy's revision date and the IEP Wayback copy) re-fetched by curl with a browser User-Agent into the second pass's own scratch folder, not the first pass's files. All 105 quotes script-matched verbatim (whitespace and HTML entities normalised; HTML tags stripped without inserting a space; PDFs through pdftotext, which itself joined line-break hyphens (e.g. Parsons “secondcentury”, Fredriksen “divineidentification”; neither inside a quote); Hurtado's bitstream is a Word .doc, text extracted by cp1252 byte decoding), 0 misses; then re-matched scoped to the cited author's own entry on shared Encyclopedia.com pages (Bowker vs De Clercq on “Arianism”, Bowker vs Ryan on “Nicene Creed”, by the citation block after each entry and its byline), to the named sub-article or response turn in the Church History forum, and to the url each HarperCollins and Hopko citation names: 0 misses. PDF locators checked against printed page footers; HTML locators checked by script against each quote's nearest preceding heading and its paragraph's opening words. IEP (Baber) returned HTTP 500 four times, was matched on the Wayback copy of 2026-11-14, then on the live page once it returned 200. All 11 Trigger Claims re-matched at timestamp and speaker in the final transcripts as contiguous spans inside the turn (none is the full turn) and read about two minutes either side. 104 quotes after the cut below.
# Second pass changes. Shorts: worship (Fredriksen clause scoped to “prayer in Paul's communities”); plural (HarperCollins's “grandeur”, one source, moved out of the short; now “They reject reading the Trinity into Genesis”, Martin, Kärkkäinen, Carr and Brettler); constantinople (“the creed the council approved”, not “the council's creed”, beside the creed statement's debated origin); creed (“the creed often called …”, not “a longer creed”, which no quote says). Text: triadic drops “quoting it and the blessing that closes 2 Corinthians” (uncited lines); spirit has Levison's “the contrast often drawn”; subordination has Delport's “ontological”; arius-roots drops De Clercq; nicaea drops Edwards's “about 250 who signed” (uncited) and adds “according to Philostorgius”; constantinople has Baber's “the same sort of ontological status”. Cut to uncited: arius-roots/5 (De Clercq, its counterpoint dropped); arius-roots/6 renumbered to /5. Locators: new-testament/8 (p. 4, n. 14), worship/5 (p. 6), triadic/1 (p. 23), spirit/3 (paragraph “Whatever the context”), arius/4 (opening section; no “Arius” sub-entry), after-nicaea/6 (section “Arian Triumph and Downfall.”). Locators (heading check): word/1–2 and subordination/4 (§3.1.1), after-nicaea/4 (section “‘Arianism’ after Arius”), persons/3, /4, /6 (section “Development of Trinitarian Doctrine”), six Ortiz de Urbina locators (“section”, not “paragraph”). related.books drops 2-corinthians (the page no longer names it). Registry: nce-homoousios author “J. M. Carmody” (entry byline).
# Second pass flags: (1) The first pass's trigger notes say “full turn”; every claim is a trimmed span; 42@00:40:01 stops before the sentences logged as conflicts. Triggers file not edited. (2) 109@00:07:18 “a new mechanism” vs the NCE's “should remain in force” (the West's and Egypt's practice): the easter short does not contradict it; kept. (3) 53@00:32:00 “until subsequent centuries” is looser than 381; kept. (4) Hurtado's URL serves a .doc, not a PDF (registry access line says “Author's manuscript”, accurate). (5) IEP was intermittently down (HTTP 500); URL kept, as the live page later served the passage. (6) Spirit short “No, scholars say” stands on Bowker and van Aarde (with HarperCollins for “power or presence”); Levison (Reference) questions the power/person contrast, attributed in text only (#133, one author). (7) First-pass flags re-checked: (2) Kärkkäinen's consensus sentence is about the Bible, his NT judgment is p. 15, and no short says “consensus”; (3) Moser's consensus is about high Christology and sits beside McGrath and Dunn; (9) the Kärkkäinen PDF is chapter 1 only; (10) forum attributions checked by sub-article and response turn (Kim's introduction by the forum's byline, not a printed name); (12) Bowker's four entries are one author; (13) the Carr and Brettler answer carries no initials (the one before it is signed —MZB): attributed jointly. Flags (1), (4)–(8) and (11) not re-assessed beyond the matching and scope checks above. Second-pass flag (8), plural: the short now answers the Elohim half of its question only through “No, scholars say” and “reject reading the Trinity into Genesis”; on Elohim itself the Trinity “No” rests on HarperCollins (“without any suggestion of multiple identities”), and Martin's “into Genesis” sentence is, in context, about Augustine on Genesis 1:1–2; the lead may want to re-scope the question to Genesis 1:26 or keep the Elohim half on that basis. Publish rule recomputed: core “no explicit doctrine of the Trinity in the New Testament” backed by Kärkkäinen 2017 (Scholarly), Tuggy 2025 (Reference), Martin 2009 (Reference): 3 independent authors; Lietaert Peerbolte counted only for “worked out later”. 18 statements. Ids, slug, draft and review unchanged.
# Publish 2026-11-27 (lead agent, on the second pass's flags): (1) plural re-scoped to Genesis 1:26: question now “Does God's “Let us make” in Genesis 1:26 point to the Trinity?”, short “No, scholars say. They read the “us” of Genesis 1:26 as a plural of majesty or deliberation, or as God addressing a heavenly council, not as the Trinity.” (Carr and Brettler, Kärkkäinen; Martin's Genesis sentence kept in the text as he says it). The Elohim half rested on HarperCollins alone; it stays in the text, attributed, and the question no longer asks it. Id unchanged (not yet public). 182@00:19:44 (Elohim) kept: a Trigger Claim gates the subject, not a statement. (2) 109@00:07:18 kept: “a new mechanism” does not contradict the easter short. (3) 53@00:32:00 kept: “subsequent centuries” does not contradict constantinople. (4) spirit short kept on Bowker and van Aarde with HarperCollins; Levison attributed in the text only. (5) Kim kept as the forum introduction's author (byline and first-person organiser). Trigger notes: “full turn” in the first-pass notes means the span was matched inside its full turn; each is a trimmed span. Publish rule recomputed: core new-testament on Kärkkäinen 2017, Tuggy 2025, Martin 2009 (3 independent authors for “not explicitly”), plus Lietaert Peerbolte for “worked out later”; 18 statements; 104 citations. draft flag dropped; review and sourcesRead 2026-11-27.
# #247 first pass 2026-11-27 (agent, partial re-review per #93: the changed statements' own new citations get the full procedure; review and sourcesRead stay 2026-11-27, the new cites carry read 2026-11-27). Leads read: Roukema and Heikens, International Journal of Philosophy and Theology 86 (2025), open access on tandfonline.com (curl 403; read in Chrome, quotes matched in-page against the article text, whitespace and curly quotes normalised, 4/4); Britannica “Trinity”, “Arianism”, “First Council of Nicaea”, “Pneumatomachian”, “First Council of Constantinople”, “St. Nicholas” (read in Chrome and saved from Internet Archive snapshots of the same URLs, 2025-10 to 2026-11; quotes script-matched on the saved text); Gibson, NCE “Nicholas of Myra, St.” (curl, Encyclopedia.com); Thompson, Religions 15(4) 402 (read in Chrome and the Internet Archive snapshot of 2024-04-20). Added: easter/5–9 (text only, short unchanged): Roukema and Heikens on Constantine's letter reporting a unanimous decision on Easter, Britannica's “attempted but failed to establish a uniform date for Easter” (attributed), and Roukema and Heikens's conclusion that the council did not decide the canon, with their own hedge that a few scholars allow some truth in it. The canon is not given its own statement: one study (two co-authors, counted once) addresses Nicaea and the canon directly; Martin's Yale lecture 2 and Britannica's “Biblical canon” and “biblical literature” put the first 27-book list at 367 but do not name Nicaea, and Martin says councils called by Constantine or his successors did try to set the canon; a bounded Google Books search found only an IVP Academic book (ministry publisher) and a self-published one. New statement nicholas (Britannica, Gibson; Trigger Claims 5@00:33:45 and 42@00:46:43): its short says only what both say (no trustworthy record of his life beyond the episcopate; his presence at Nicaea uncertain); the slap is attributed to Britannica's “allegedly”. The iota story: no source read mentions it; no statement. Closed unreadable: Fernández, Theological Studies 86(3) (2025): restricted on SAGE in Chrome too, OpenAlex lists it closed, no Wayback copy. Fernández, Unio cum Christo 11(2) (2025), CC BY-NC-ND on vr-elibrary.de: abstract read; the PDF refuses scripted requests and has no text layer our browser tools can read; it would add no new author (Fernández is cited). Philo's and Justin's “second god”: Todorovska, Živa Antika 65 (2015) read (Philo's Logos as “second God”, citing Wolfson and Williamson); Thompson quotes Justin's “another God and Lord subject to the Maker of all things”; neither needed beside subordination's Justin sentence (Pépin), so no statement change. Counts after: 19 statements, 113 citations, 13 Trigger Claims. Flags for the second pass: (1) easter short “It set a common date for Easter” now sits beside Britannica's “attempted but failed to establish a uniform date”; Roukema and Heikens, Ortiz de Urbina, Bowker and Demacopoulos read as a decision taken; judge whether the short must narrow (e.g. “ruled on”). (2) nicholas short: check “even his presence at Nicaea is uncertain” is no stronger than Britannica's “may have attended” and Gibson's “Legends have him … present”. (3) Roukema and Heikens is browser-only (tandfonline.com refuses curl); Britannica pages refuse curl and have Wayback snapshots. (4) Gibson's NCE entry has no year; its bibliography runs to 1997 (2nd ed.).
