leads:
  - "Britannica “Trinity”, “Arianism”, “Council of Nicaea”, “Pneumatomachian” and “First Council of Constantinople”: 403 or challenge to scripted fetches; not read."
  - "Keith Thompson, “The Origins of the Christian Idea of Trinity”, Religions 15(4): 402 (2024): MDPI returned 403; not read."
  - "Samuel Fernández, “The Council of Nicaea 325: Reassessing the Role of Eusebius of Caesarea”, Theological Studies 86(3) (2025): PDF blocked; would bear on homoousios and Constantine."
  - "“The first Nicene Council and the New Testament canon”, Taylor & Francis 2025, doi:10.1080/21692327.2025.2564797: blocked; the likeliest Scholarly source for whether Nicaea set the canon."
  - "Synodicon Vetus on the Nicaea canon miracle (Duffy and Parker, Dumbarton Oaks 1979, p. 29) and Voltaire's Philosophical Dictionary, “Councils”: seen only as quoted in Huggins and Meade; originals not opened."
  - "Roy Hoover, Bible Review 1993 (“The Council of Nicea in 325 did not address the question”), Chadwick's 1982 JTS review, Ehrman 2004 on Constantine and the canon: seen only as quoted in Huggins."
  - "Hanson, The Search for the Christian Doctrine of God (1988); Ayres, Nicaea and Its Legacy (2004); Kelly, Early Christian Doctrines and Early Christian Creeds; Williams, Arius (2001); Latinovic 2017; Löhr 2006/2007: cited inside read sources; not open."
  - "Bauckham, Jesus and the God of Israel (2008); Dunn, Did the First Christians Worship Jesus? (2010); McGrath 2009; Fee, God's Empowering Presence (1994); Hasker 2013: seen only through Moser, Kärkkäinen, Peerbolte or Tuggy."
  - "Litwa 2014 on Philo's “second god”: seen only as quoted in Lévy's SEP entry on Philo."
  - "Luislampe and Bolgiani on Basil and the Spirit; Hanson 1969 on Basil's treatise: seen only as quoted in Haykin or Noble."
  - "Matthew 28:19's textual history: see #241; not researched here."
uncited:
  - "Catherine Mowry LaCugna, Encyclopedia of Religion “Trinity”: “exegetes and theologians agree that the New Testament also does not contain an explicit doctrine of the Trinity” and the Hebrew Bible sentence: read; 1987 text, outside the window for a state-of-the-field statement; not used for the core."
  - "Kärkkäinen 2017, p. 23 on 2 Cor 13:14 and Ephesians 1:3–14: read; the triadic text describes his position from the two cited sentences."
  - "C. Draina, New Catholic Encyclopedia “Trinity, Holy (in the Bible)”: read; says Matt 28:19 “clearly teaches” equal divinity, in a confessional frame; not cited (a Tradition-like reading in a Reference entry; the triadic statement rests on Peppard, Kärkkäinen, Levison)."
  - "Dirk Van der Merwe, HTS 75(1) 2019, on John as Trinitarian: read; a theological reading, not needed for the worship or new-testament debate."
  - "Henry Warner Bowden, “Trinity”, Contemporary American Religion: read; calls trinus Greek (it is Latin); not cited."
  - "Graham Twelftree, “The Holy Spirit in Luke-Acts” (Bible Odyssey): read; the spirit statement is about the Hebrew Bible; not cited."
  - "Encyclopaedia Judaica, “Ruaḥ ha-Kodesh”: read; about rabbinic usage, not the Hebrew Bible."
  - "Hans Schwarz, Encyclopedia of Science and Religion, “Holy Spirit”: read; one generic line on 381."
  - "Hurtado, JSNT 2004 response to Casey: read; the 2008 chapter carries the binitarian claim."
  - "Edward Moore, IEP “Origen of Alexandria”: read; not needed beside Lyman and Edwards."
  - "Jean Pépin, Encyclopedia of Religion “Logos”: Philo's “second god” and the “prisoners of the Zeitgeist” judgment read; 1987 text, one author's view; only Justin's sentence is quoted."
  - "Mark Edwards, TheoLogica 2020, p. 80 “all Christians before Nicaea … held that the persons differed in rank”: read; his summary of Cudworth, not his own claim; not cited."
  - "I. Ortiz de Urbina and the NCE “Homoousios” entry on whether the creed meant numerical identity: read; they disagree; no statement made."
  - "T. Ryan, NCE “Nicene Creed”, on Eusebius's creed as the model: read; conflicts with Ortiz de Urbina and Fernández; no statement made."
  - "Rugare Rukuni and Erna Oliver, HTS 75(4) 2019: read; weak sourcing (“320 delegates”); not cited."
  - "Bart Ehrman, Truth and Fiction in The Da Vinci Code, excerpt on Beliefnet: read; does not address the canon; popular reprint."
  - "Paul Freedman, Yale HIST 210 lecture 3: read; not needed beside Kim, Lyman and the NCE."
  - "Ronald Huggins, Midwestern Journal of Theology 8.2/9.1 (2010), and John Meade, Text & Canon Institute (2021), on Nicaea and the canon: read; a seminary house journal and an apologetic site, no Scholarly or Reference source beside them; the canon statement is not made."
  - "A. G. Gibson, NCE “Nicholas of Myra, St.”: read; one author on the legend of his presence at Nicaea; no statement made."
  - "Kim, Cambridge Companion to the Council of Nicaea, introduction (publisher excerpt, pp. 1–10): read; the forum carries the same point in full."
  - "Michael Haykin, JETS 2019, on Basil not calling the Spirit God and the Pneumatomachi at the council: read; not needed beside Bowker, Kreilkamp and Noble."
  - "Augsburg Confession, Art. I (bookofconcord.org): read; a privately run site, not a church body's own; not cited."
  - "Orthodox Church in America, Hopko, on the filioque: read; the filioque is not stated on the page."
  - "Catechism of the Catholic Church §§242–247 on 381 and the filioque: read; not needed for the tradition statement."
