# Issue #152 instructions: short answers report the state of scholarship (#133); confessional study Bibles are Tradition and do not count toward the two. No comments on the issue; no candidate entry in data/scholarship-candidates.yaml, so the slug is made from the issue title. Overlap checked: homosexuality-and-the-bible covers same-sex relations, the Leviticus 18:22/20:13 laws and church statements on same-sex marriage, so this page makes no statement on same-sex relations or same-sex marriage; new-testament-later-additions covers the woman caught in adultery (John 7:53–8:11), so this page makes none on it; pauline-authorship covers who wrote 1 Timothy and the-creation-stories-in-genesis the two creation accounts, so this page states neither. No registry id from those pages fitted the passages used here except harpercollins-2009-dictionary (new entries “marriage”, “adultery”, “concubine”), nabre-matthew-5-notes, martin-rlst152-l13, hayes-rlst145-l10 and schalit-matassa-ej-elephantine.
# Sourcing test (#152, 2026-11-27): gate 1, 14 Trigger Claims in Episodes 44, 68, 108, 133 and 139, each script-matched at timestamp and speaker and read with about two minutes either side. Gate 2, the core: the candidate “the Bible sanctions polygamy” is carried only at the strength its sources share: the Hebrew Bible's laws assume and regulate polygyny and scholars generally read it as accepting the practice, with Deuteronomy 17:17 advising kings against it and its frequency unknown. Backed by Calduch-Benages (Bible Odyssey 2021, Reference), Lemos (Bible Odyssey 2021, Reference), Ademiluka (Verbum et Ecclesia 2020, Scholarly; “generally accepted amongst scholars that the OT is not opposed to polygamy”) and Sassoon (Cambridge 2011, Scholarly; “in the main, condone polygyny … but not downright”). Gate 3: 4 independent authors behind the core (HarperCollins and Malena also cited in it), none Host-authored. Gate 4: 20 statements.
# Dropped for want of a second author or a qualifying source: what “husband of one wife” (1 Tim 3:2) means (Mueller, a denominational seminary journal of uncertain class, and Peters's outlier reading only; Martin glosses it “married only once” without discussing polygamy); Malachi 2:16 (Feinstein and Lumanze; cut for length, as no Trigger Claim names it); whether Mark 10:12 adapts the rule to Roman law (NABRE 1986 only, outside the 30-year window); the early Christian rejection of polygamy (no in-window source readable in full); David and Bathsheba (sources split on consent, but no statement needed); the “nuclear family” as modern (only Osiek's general remark; the models text keeps it to her words); a pre-dispatch self-review narrowed the genesis-2-24, second-temple (was monogamy), new-testament-adultery, adultery-penalty, bride-price and exception-clause shorts to what their quotes carry, and normalised extraction spacing in ten quotes (“( Deut 21:15-17 )” → “(Deut 21:15-17)”, as the HTML reads); Rabbenu Gershom's ban itself (EJ “Bigamy and Polygamy”, Schereschewsky's 1971 section, outside the window; the second-temple text cites only Sassoon's report that its ascription is questioned). Not used: Encyclopaedia Judaica 1971 sections (Apple “Marriage”, Herr “Monogamy”, Rainey “Family”/“Concubine”, Tigay “Adultery”, Weinfeld “Ordeal of Jealousy”, Lieber “Divorce”), all outside the window; Wright, Tyndale Bulletin 1979 (outside the window); Cargill's Bible Odyssey video transcript (a video talk); Vyhnánek 2011 (Slovak law-history journal, peer review unconfirmed; the only open defence of mohar as purchase).
# First pass: four research agents (polygyny, marriage, adultery, divorce) fetched every source on 2026-11-27 by curl into separate scratch folders (Internet Archive snapshots of the same URLs for OAPEN, the Durham repository and bible.usccb.org) and copied quotes only from the saved text; every page quote was then script-matched by the lead against those saved texts (whitespace and HTML entities normalised, curly quotes and dashes folded, line-end hyphens rejoined, NFKC): 166/166, 0 misses. The second pass must re-fetch.
# Trigger screen (CONTEXT 2026-11-25): seven Host assertions that contradict a statement are not attached and are logged as conflicts in data/scholarship-candidates.yaml under this page: 108@00:09:48 (the man “was purchasing use” and the bride price was “the price of the transaction”, against bride-price); 108@00:45:30 (women “weren't allowed to [divorce] at all”, against divorce, which reports Feinstein's “we do not know for certain” and Elephantine); 133@00:13:09 (adultery “is not a fundamentally moral question. It's a question of property rights”, against why-adultery, which reports Greenberg's religious-transgression reading); 139@00:12:21 (the reading of Lev 18:18 as a ban on polygyny “isn't supported by anything”, against leviticus-18-18, which reports Tosato, Gruber and Sassoon); 44@00:23:11 (“there's nothing prescriptive going on in Genesis 2:24 at all”, against genesis-2-24, which reports a scholarly split); 139@00:14:19 (the change came “because of Greek philosophy and Greco-Roman social conventions”, against second-temple, which reports Ilan's internal developments as well as Greek and Roman influence); 139@00:33:39, second sentence (a Jewish ban “around 1000 CE”, against second-temple's report that the ascription to Rabbenu Gershom is questioned and Tishby's twelfth-century date). For the same reason 139@00:13:17 is trimmed to its polygyny sentences and leaves out its Genesis 2:24 sentences (“it's clearly not a prescription of proper marriage”), and 108@00:20:34 stops before “Nobody had any concerns with it.”
# Flags for the second pass: (1) Most Reference citations are Bible Odyssey pages (19 authors) and Jewish Women's Archive entries: independent authors, two platforms. (2) Several Bible Odyssey pages carry a 2021-02-03 datePublished (Lemos, Coogan, Calduch-Benages, Wells, Macwilliam), which may be a site-migration date; years kept as the page gives them. (3) Ademiluka's “generally accepted amongst scholars” rests on old secondary citations; the core also rests on Calduch-Benages, Lemos and Sassoon. (4) Slager (The Bible Translator, a UBS journal) classed Scholarly by venue. (5) Edenburg is TheTorah.com, classed Reference as tov-2023-thetorah-deut-32-8; its body was read from the page's embedded JSON. (6) Sloane is an explicitly evangelical response in Tyndale Bulletin, Scholarly by venue, used only for the attributed dissent in prophets. (7) why-adultery: no in-window source says the question is “debated”; the short says “Scholars explain it in different ways”, from sources that do so. (8) The NABRE New Testament notes (Matthew 5) are 1986; attributed in exception-clause's text only; the short's incest reading also rests on Martens 2021 (following Fitzmyer). (9) Heger and Sassoon quotes are fragments where the PDF interleaves Hebrew or footnote markers. (10) bergant-reid-nce-women-bible: only Bergant's Old Testament section is quoted; the registry names Bergant and the section. (11) Lemos: the book (T. M. Lemos) and the Bible Odyssey article (Tracy M. Lemos) are one author; the core cites only the article. (12) Feinstein's Bible Odyssey article is dated 2026.
# Second agent pass 2026-11-27 (#93 delegation, independent): every source re-fetched into the second pass's own scratch folder, not the first pass's files. By curl: 30 URLs for 31 sources (PDFs of Ademiluka, Instone-Brewer ×2, Lemos 2010, Loader, Martens, Sassoon, Scheffler, Slager, Sloane; Encyclopedia.com ×4 entries, JWA ×3, Yale ×4, TheTorah.com, vatican.va ×3, oca.org, churchofjesuschrist.org, gotquestions.org ×2, NABRE Deut 24 live). Internet Archive (live 403 to scripts): Doering 20250111073508, Heger (OAPEN) 20230603135319, NABRE Deut 25 20260308171723, Exod 21 20261022062955, Matt 5 20261029195819. Bible Odyssey (17 articles, 3 HarperCollins entries) refuses scripted requests (Cloudflare challenge), so read live in Chrome: one page opened by plain navigation, the other 19 loaded by in-page fetch() in that same browser session and parsed with DOMParser; quotes matched there by script, and the entries' structure (factoid lists, sentence order) checked the same way. 166/166 quotes matched: 149 by script on whitespace and NFKC alone; polygyny/8 and concubines/5 (outside the body paragraphs) found by script in the full page text and read in the printed snippet; 12 needed HTML-entity decoding, line-end de-hyphenation or quote/dash folding; why-adultery/3 runs across an HTML paragraph split mid-sentence; Sassoon's ahot (leviticus-18-18/7) carries a dotted ḥ in the PDF. Ademiluka and Scheffler matched in the plain, not the layout, PDF extraction. PDF pages checked against printed numbers; HTML paragraphs counted from the markup. All 14 Trigger Claims re-matched by script at timestamp and speaker (final transcript) and read two minutes either side; the first pass's contradiction screen re-run.
# Second pass changes. Shorts: polygyny (core; “Yes, scholars say: the texts in the main accept polygyny, and Deuteronomy's laws assume it…”, no longer “Its laws” or Ademiluka's “scholars generally”); bride-price (“No, scholars now say”, not “most scholars”, as Lemos's “most, though not all” is about bridewealth as a gift class); genesis-2-24 (“and as not in itself forbidding polygamy” cut, Heger alone); second-temple (“a tendency toward monogamy”, not “practice tended toward monogamy”); why-adultery (“a religious offence”, not “against God”); exception-clause (“readings include”); paul-divorce (Instone-Brewer's remarriage debate cut, one author; “allows divorce”, Das's word). Text: polygyny's Malena sentence split into its two passages (the 700 wives are a factoid; “followed the model … contrary to values” is about his kingship as a whole). No citation cut. Registry: scheffler-2011-hts-jesus-torah-divorce series 67(3) → 67(1), art. 1006. Locators: models/3, levirate/4 (Wells paragraphs), polygyny/5 (p. 6), polygyny/8 (key-points list), bride-price/5–8, levirate/1, concubines/4 (Meyers paragraphs, off by one), why-adultery/6 (Hayes paragraph), adultery-penalty/3 (p. 68 only), adultery-penalty/6–7 (JWA heading), new-testament-adultery/7–9 (pp. 4, 5), exception-clause/2–3 (pp. 73, 74, not 78), polygyny/10 (second sentence), polygyny/8 and concubines/5 (factoid lists), adultery/6 and adultery-penalty/2 (Edenburg Case 3, paragraph 6, not 2), tradition/7 (answer, paragraph 2).
# Second pass flags: (1) Triggers, none a direct contradiction, so the triggers file is not edited and no conflict logged (outside this pass's files): 139@00:13:17 “just outright endorse … if not just condone polygamy” is stronger than the polygyny short; 108@00:20:34 “It was not the norm” is a frequency claim; 139@00:16:36 ends before “The one exception would be 1 Timothy 3:2”, so “no outright condemnation of polygyny at all” drops its qualifier; 133@00:09:06 “legally not prohibited” sits against Slager's “penalty less than death” (Deut 22:28–29). (2) Ademiluka's “generally accepted amongst scholars” rests on secondhand citations (Barth 1961, Cocherell 2015, Hillman 1975); kept in the text, attributed. (3) divorce short drops Feinstein's “we do not know for certain” hedge; kept, as HarperCollins states the no-law point flatly. (4) Calduch-Benages's JSON-LD date is 2021-08-16, not 2021-02-03; year unchanged. (5) Bible Odyssey read live in the browser by in-page fetch after one navigation (not page-by-page navigation); the registry access lines are unchanged. (6) leviticus-18-18/7 is not verbatim by one diacritic: the PDF prints ahot with a dotted ḥ. (7) exception-clause text drops Martens's “I suspect” on the remarriage motive. (8) Yale lecture years and the CUP excerpt years not printed on the fetched pages; not re-checked. Publish rule recomputed: core carried by Calduch-Benages, Lemos, Ademiluka and Sassoon, 4 independent authors (2 Scholarly); 20 statements. Ids, slug and draft unchanged.
