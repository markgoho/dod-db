      note: "First pass 2026-11-27: the Catechism as the Catholic Church (registry convention, as ccc-2357); the Orthodox Church in America (its own name); The Church of Jesus Christ of Latter-day Saints (its own name, from its Gospel Topics essay); Got Questions Ministries, an evangelical ministry (registry convention). None supports what scholars think.",
