# Review record for /scholarship/marriage-polygamy-and-adultery-in-the-bible/ (#93 shape). Not rendered.
# agent: results of the agent first pass (#152, 2026-11-27). That pass does not count toward publish.
# owner: empty (""). The owner delegated the publish review (#93, 2026-11-23); the `delegation` block records the independent second agent pass once it has run.
# Issue #152 instructions: short answers report the state of scholarship (#133); confessional study Bibles are Tradition and do not count toward the two. No comments on the issue; no candidate entry in data/scholarship-candidates.yaml, so the slug is made from the issue title. Overlap checked: homosexuality-and-the-bible covers same-sex relations, the Leviticus 18:22/20:13 laws and church statements on same-sex marriage, so this page makes no statement on same-sex relations or same-sex marriage; new-testament-later-additions covers the woman caught in adultery (John 7:53–8:11), so this page makes none on it; pauline-authorship covers who wrote 1 Timothy and the-creation-stories-in-genesis the two creation accounts, so this page states neither. No registry id from those pages fitted the passages used here except harpercollins-2009-dictionary (new entries “marriage”, “adultery”, “concubine”), nabre-matthew-5-notes, martin-rlst152-l13, hayes-rlst145-l10 and schalit-matassa-ej-elephantine.
# Sourcing test (#152, 2026-11-27): gate 1, 15 Trigger Claims in Episodes 44, 68, 108, 133 and 139, each script-matched at timestamp and speaker and read with about two minutes either side. Gate 2, the core: the candidate “the Bible sanctions polygamy” is carried only at the strength its sources share: the Hebrew Bible's laws assume and regulate polygyny and scholars generally read it as accepting the practice, with Deuteronomy 17:17 advising kings against it and its frequency unknown. Backed by Calduch-Benages (Bible Odyssey 2021, Reference), Lemos (Bible Odyssey 2021, Reference), Ademiluka (Verbum et Ecclesia 2020, Scholarly; “generally accepted amongst scholars that the OT is not opposed to polygamy”) and Sassoon (Cambridge 2011, Scholarly; “in the main, condone polygyny … but not downright”). Gate 3: 4 independent authors behind the core (HarperCollins and Malena also cited in it), none Host-authored. Gate 4: 20 statements.
# Dropped for want of a second author or a qualifying source: what “husband of one wife” (1 Tim 3:2) means (Mueller, a denominational seminary journal of uncertain class, and Peters's outlier reading only; Martin glosses it “married only once” without discussing polygamy); Malachi 2:16 (Feinstein and Lumanze; cut for length, as no Trigger Claim names it); whether Mark 10:12 adapts the rule to Roman law (NABRE 1986 only, outside the 30-year window); the early Christian rejection of polygamy (no in-window source readable in full); David and Bathsheba (sources split on consent, but no statement needed); the “nuclear family” as modern (only Osiek's general remark; the models text keeps it to her words); Rabbenu Gershom's ban itself (EJ “Bigamy and Polygamy”, Schereschewsky's 1971 section, outside the window; the monogamy text cites only Sassoon's report that its ascription is questioned). Not used: Encyclopaedia Judaica 1971 sections (Apple “Marriage”, Herr “Monogamy”, Rainey “Family”/“Concubine”, Tigay “Adultery”, Weinfeld “Ordeal of Jealousy”, Lieber “Divorce”), all outside the window; Wright, Tyndale Bulletin 1979 (outside the window); Cargill's Bible Odyssey video transcript (a video talk); Vyhnánek 2011 (Slovak law-history journal, peer review unconfirmed; the only open defence of mohar as purchase).
# First pass: four research agents (polygyny, marriage, adultery, divorce) fetched every source on 2026-11-27 by curl into separate scratch folders (Internet Archive snapshots of the same URLs for OAPEN, the Durham repository and bible.usccb.org) and copied quotes only from the saved text; every page quote was then script-matched by the lead against those saved texts (whitespace and HTML entities normalised, curly quotes and dashes folded, line-end hyphens rejoined, NFKC): 166/166, 0 misses. The second pass must re-fetch.
# Trigger screen (CONTEXT 2026-11-25): five Host assertions that contradict a statement are not attached and are logged as conflicts in data/scholarship-candidates.yaml under this page: 108@00:09:48 (the man “was purchasing use” and the bride price was “the price of the transaction”, against bride-price); 108@00:45:30 (women “weren't allowed to [divorce] at all”, against divorce, which reports Feinstein's “we do not know for certain” and Elephantine); 133@00:13:09 (adultery “is not a fundamentally moral question. It's a question of property rights”, against why-adultery, which reports Greenberg's religious-transgression reading); 139@00:12:21 (the reading of Lev 18:18 as a ban on polygyny “isn't supported by anything”, against leviticus-18-18, which reports Tosato, Gruber and Sassoon); 44@00:23:11 (“there's nothing prescriptive going on in Genesis 2:24 at all”, against genesis-2-24, which reports a scholarly split). For the same reason 139@00:13:17 is trimmed to its polygyny sentences and leaves out its Genesis 2:24 sentences (“it's clearly not a prescription of proper marriage”), and 108@00:20:34 stops before “Nobody had any concerns with it.”
# Flags for the second pass: (1) Most Reference citations are Bible Odyssey pages (19 authors) and Jewish Women's Archive entries: independent authors, two platforms. (2) Several Bible Odyssey pages carry a 2021-02-03 datePublished (Lemos, Coogan, Calduch-Benages, Wells, Macwilliam), which may be a site-migration date; years kept as the page gives them. (3) Ademiluka's “generally accepted amongst scholars” rests on old secondary citations; the core also rests on Calduch-Benages, Lemos and Sassoon. (4) Slager (The Bible Translator, a UBS journal) classed Scholarly by venue. (5) Edenburg is TheTorah.com, classed Reference as tov-2023-thetorah-deut-32-8; its body was read from the page's embedded JSON. (6) Sloane is an explicitly evangelical response in Tyndale Bulletin, Scholarly by venue, used only for the attributed dissent in prophets. (7) why-adultery: no in-window source says the question is “debated”; the short says “Scholars explain it in different ways”, from sources that do so. (8) The NABRE New Testament notes (Matthew 5) are 1986; used only for an attributed reading in exception-clause, never a short. (9) Heger and Sassoon quotes are fragments where the PDF interleaves Hebrew or footnote markers. (10) bergant-reid-nce-women-bible: only Bergant's Old Testament section is quoted; the registry author line names both section authors. (11) Lemos: the book (T. M. Lemos) and the Bible Odyssey article (Tracy M. Lemos) are one author; the core cites only the article. (12) Feinstein's Bible Odyssey article is dated 2026.
