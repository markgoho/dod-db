rules:
  publish-rule:
    {
      agent: pass,
      owner: "",
      note: "First pass 2026-11-27: 20 statements. Core polygyny cites Calduch-Benages (Reference, 2021), Lemos (Reference, 2021), Ademiluka 2020 (Scholarly), Sassoon 2011 (Scholarly), Malena (Reference) and HarperCollins (Reference): 6 independent authors, 4 of them carrying the short's claim, none Host-authored. Rule holds. Second pass 2026-11-27: recomputed after the changes: 20 statements; the core short now reads “scholars say: the texts in the main accept polygyny”, carried by Calduch-Benages (Reference), Lemos (Reference), Ademiluka 2020 (Scholarly) and Sassoon 2011 (Scholarly): 4 independent authors, 2 Scholarly, none Host-authored. Malena and HarperCollins are not counted. Rule holds.",
    }
  consensus-wording:
    {
      agent: pass,
      owner: "",
      note: "First pass 2026-11-27: no statement says “consensus”. State-of-field wording is quoted from its source: “generally accepted amongst scholars” (Ademiluka; polygyny short), “most, though not all, scholars” and “now known to be flawed” (Lemos 2010, Meyers; bride-price short “Most scholars now say no”), “all agree … etiology” and “Some … Other scholars disagree” (Warner; genesis-2-24), “most translators and commentators” and “the common interpretation” (Heger; leviticus-18-18), “commonly interpreted” (Heger) and “famously debated” (Doering; second-temple), “considerable debate” (Collins NCE; adultery-penalty), “no real doubt … few if any followers” (Martens; jesus-divorce), “many, including myself, have assumed” and “no widespread agreement” (Loader, Martens; exception-clause), “still a debate” (Instone-Brewer; paul-divorce), “Scholars disagree” (Weisberg; levirate text), “most interpreters today” (Warner; levirate text). #133 per short: models (Lemos, Wells, Osiek, Mbuvi); arranged (Coogan, Lemos, HarperCollins, Meyers); bride-price (Lemos, Meyers; exchange framing Bergant in the text); love (Meyers, Lemos, Coogan, Bergant); levirate (Meyers, Bergant, NABRE, Wells, Weisberg, Ilan); polygyny (Calduch-Benages, Lemos, Ademiluka, Sassoon); concubines (HarperCollins, NABRE, Bergant, Meyers, Gafney, Scholz); genesis-2-24 (Warner, Doering, Heger); leviticus-18-18 (Heger, Sassoon); second-temple (Calduch-Benages, Ilan, Heger, Doering, Sassoon); adultery (HarperCollins, Rooke, Rosen-Zvi, Slager, Edenburg); why-adultery (Slager, Rooke, Collins, Rosen-Zvi, Hayes, Edenburg); adultery-penalty (Collins, Edenburg, Loader); prophets (Hayes, Rooke, HarperCollins, Yee, Macwilliam, Kamionkowski; dissent Sloane); new-testament-adultery (HarperCollins, Marshall, Martin, Collins, Das, Scheffler); divorce (Feinstein, HarperCollins, EJ Elephantine, NABRE, Martens, Instone-Brewer); jesus-divorce (Martin, Martens, Das); exception-clause (Loader, Martens; NABRE 1986 attributed; Loader's reconsideration attributed in the text, not the short); paul-divorce (Das, Marshall, Instone-Brewer, Martens); tradition (Tradition sources, exempt). Second pass 2026-11-27: re-checked each state-of-field word against its source. Changed: bride-price (“most, though not all, scholars” in Lemos is about bridewealth as a gift class, not about purchase; short now “scholars now say”, from Lemos 2010 p. 8, Lemos BO and Meyers); polygyny (Ademiluka's “generally accepted” no longer heads the short); paul-divorce (Instone-Brewer's “still a debate” cut from the short, one author). Kept: leviticus-18-18's “Most translators and commentators” is Heger's sentence about how the verse has been read (the rabbis, the LXX), not a count of scholars, and Sassoon independently reports the same split (“the builders of the partition who permit polygyny” against CD); Ademiluka's “generally accepted”, by contrast, is a state-of-field claim resting on secondhand citations. Others confirmed in context: Warner “vary greatly”/“Some … Other scholars”, Heger “most translators and commentators”/“commonly interpreted”, Doering “famously debated”/“considerable number of recent studies”, Collins “considerable debate”, Martens “no real doubt … few if any followers” and “no widespread agreement” (on what porneia means), Loader “many, including myself”, Weisberg “Scholars disagree”, Warner (Tamar) “most interpreters today”, Hayes “a little controversial”.",
    }
  dissent-attributed:
    {
      agent: pass,
      owner: "",
      note: "First pass 2026-11-27: Bergant's exchange framing of marriage named (bride-price); Weisberg's widow-protection suggestion named (levirate); Gafney and Scholz on pilegesh named (concubines); Tosato, Gruber and Sassoon on Lev 18:18 named, with Heger's reply (leviticus-18-18); the HarperCollins monogamous-ideal sentence named (polygyny); Babatha archive counter-evidence named (second-temple); Greenberg's reading named via Rosen-Zvi and Hayes, with Hayes's “not everyone agrees” (why-adultery); Sloane's rejection of the pornoprophetic critique named (prophets); D'Angelo named via Martens (jesus-divorce); Loader's reconsideration and the NABRE incest reading named (exception-clause); Instone-Brewer's own reading of 7:15 not stated, only his report of debate (paul-divorce). Second pass 2026-11-27: confirmed; Heger's “does not absolutely convey a divine prohibition of polygamy” and Instone-Brewer's remarriage debate now appear only in their statements' text, attributed.",
