  - "Encyclopaedia Judaica, “Bigamy and Polygamy” (Schereschewsky sections): read; biblical law permits polygamy, Rabbenu Gershom's takkanah, binding among Ashkenazim, extended in Israel in 1950; 1971 text, outside the 30-year window. Elon's 2nd-ed. Israeli-law section is off-topic."
  - "Encyclopaedia Judaica, “Monogamy” (Herr) and “Marriage” (Apple, “the concept”): read; “practice was more monogamous than theory”, polygamy “common among the upper classes”; 1971 text, outside the window."
  - "Encyclopaedia Judaica, “Family” and “Concubine” (Rainey), the biblical section of “Levirate”, “Adultery” (Tigay), “Ordeal of Jealousy” (Weinfeld) and “Divorce, In the Bible” (Lieber): read; 1971 text, outside the window."
  - "Baumgarten, “The Qumran-Essene Restraints on Marriage” (1990, cojs.org reprint): read; Temple Scroll 57:17–19 and “Pentateuchal law which explicitly condones both polygamy and divorce”; 1990, outside the window for a state-of-field claim; the monogamy statement rests on in-window sources."
  - "Mueller, “The Phrase ‘Husband of One Wife’ in 1 Timothy 3:2”, Journal of Asia Adventist Seminary (2012): read; surveys eight readings; class uncertain (a denominational seminary journal), so the 1 Timothy statement was dropped."
  - "Peters, Verbum et Ecclesia 2020, on 1 Tim 3:2 supporting polygamy: read; an outlier conjecture (μία as “first”); no statement on 1 Tim 3:2."
  - "Peters, HTS 2022, on Matthew 5:27–30: read; relies on 1915 reference works; its gynē point was not needed beside Martin."
  - "Martin, RLST 152 lecture 19: read; “married only once, so multiple marriages are really frowned on” (bishops), and Paul's preference against marriage; not stated."
  - "Cargill, “Biblical Marriage” (Bible Odyssey video transcript): read; “an incredible diversity of what constitutes marriage, including polygamy”; a video talk, not cited."
  - "Vyhnánek, Historia et theoria iuris 2011, on mohar as “cost of acquisition”: read; peer review unconfirmed and a junior author; the only open defence of the purchase view; not cited."
  - "Meyers, TheTorah.com 2018 and Bible Odyssey, “Patriarchy and the Hebrew Bible”: read; “Virtually all biblical scholars … consider the Bible and ancient Israelite society patriarchal” and her argument for heterarchy; no statement on patriarchy."
  - "Lemos 2010, “Dowry … relatively infrequent in the biblical corpus”, against Meyers's “a bride's family typically provided a dowry”: read; no statement on dowry."
  - "Ramsey, BMCR 2010 review of Lemos: read; not a separate witness."
  - "Osiek and Standhartinger (Bible Odyssey) on the household codes; Hoke, Marshall and HarperCollins on 1 Corinthians 7 and marriage; NABRE 1 Corinthians 7 and Ephesians 5 notes (1986): read; no statement on household codes or Paul's view of marriage."
