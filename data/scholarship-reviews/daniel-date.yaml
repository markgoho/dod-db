leads:
  - "W. Sibley Towner, “Daniel, The Book of”, Oxford Companion to the Bible (1993): course-reserve copy on a Michigan Tech faculty page; outside the window (“prevailing scholarly opinion” on prophecy after the fact)."
  - "John J. Collins, Daniel (Hermeneia, 1993) and Collins in ABD: not public; pre-window."
  - "Britannica, “biblical literature: Daniel”: 403; snippets only."
  - "Peter Flint, “The Daniel Tradition at Qumran” (Brill 2001); Ulrich, DJD 16: not public."
  - "TheTorah.com, Wills and Kratz on Antiochus IV's persecution: bodies rendered by script, not extractable; class unclear."
  - "John J. Collins, A Short Introduction to the Hebrew Bible (Fortress; 2nd ed. 2014, 3rd ed. 2018, 4th ed. 2025), the Daniel chapter: retried 2026-11-28 (#182) in Google Books (ZI1VBAAAQBAJ, EVkWEQAAQBAJ, bs9YEQAAQBAJ): the Daniel pages show only search snippets (“No preview available”); the 2018 Writings split volume (YR91tAEACAAJ) has no preview. The full Introduction to the Hebrew Bible, 2nd ed. (2014), is now cited from pp. 6 and 566 for the Jehoiakim date, Belshazzar, Darius the Mede and the canon link; its treatment of Dan 11:40–45 (p. 581) is not in the preview, so that point stays a lead for Collins (the page carries it from Coşkun, Newsom and the Coogan–Chapman summary)."
  - "Anathea Portier-Young, “Languages of Identity and Obligation: Daniel as Bilingual Book”, VT 60 (2010): closed. Retried 2026-11-28 (#182): OpenAlex is_oa false, no repository full text; CORE holds Crossref metadata only; no DukeSpace or Internet Archive copy; Brill paywall."
uncited:
  - "Machiela, A Handbook of the Aramaic Scrolls from the Qumran Caves (Brill 2022, open access; OAPEN 20.500.12657/86447): read 2026-11-28 (#182) in the OAPEN in-browser viewer, profile of 4Q242 Prayer of Nabonidus (PDF pp. 273–274, printed 256–257), which sets out its similarities to Dan 4; not cited: history already carries the Prayer of Nabonidus with Smith-Christopher, Wills and now Newsom, and the Daniel-scroll pages looked at (PDF p. 350) are language tables."
  - "Newsom, Daniel (OTL 2014), pp. 6, 10, 12: the Greek additions as embellishment by prayers and hymns, the Persian-period booklet of chs. 4–6 and the Old Greek, and Qumran manuscripts “little more than fifty years” after chs. 8–12: read 2026-11-28 (#182); not cited, the statements on the additions and the scrolls already carry these points."
  - "Coşkun 2019, the sections beyond the cited passages (his chronology of 171–164 BCE and the day counts of Dan 8, 9 and 12): looked over in the saved text 2026-11-28 (#182), not read closely; not cited, outside the page's questions."
  - "Suchard, Aramaic Daniel (2022), p. 5: “the scholarly consensus holds that they [Dan 8–12] were written later”: read 2026-11-28 (#182); not cited, tales/11–12 carry the same author's consensus report."
  - "Bullard and Hatton, A Handbook on the Shorter Books of the Deuterocanon (UBS 2006), Introduction to Susanna, paragraph beginning “There is really no hard evidence”: “… opinion today favors an original in either Aramaic or Hebrew since the Greek occasionally reflects Semitic idiom”: read (first and second pass); cut at the second pass 2026-11-25 (was additions-origin/7): a translators' handbook from a Bible-society publisher fits none of #80's three classes cleanly, and it carries a state-of-the-field claim (“opinion today favors”); when in doubt, cut. Its registry entry removed."
  - "Hayes l23: “It was chronologically the latest book, written between 167 and 164 BCE.”: read; not cited, date/2 carries the date."
  - "Encyclopaedia Judaica, H. L. Ginsberg, “Daniel, Book of” (encyclopedia.com; JVL): read; first-edition text, outside the window; its four-author thesis for chs 7–12 and its Porphyry account not used."
  - "EJ entries Greenfield (Darius the Mede), Bayer (Belshazzar), Afonso (Nabonidus): read; outside the window."
  - "M. McNamara, “Susanna”, New Catholic Encyclopedia: read; bibliography ends 1964, so its “Most scholars, however, now favor a Semitic … original” is outside the window."
  - "Bullard and Hatton, Introduction to the Prayer of Azariah: “Most would agree that Hebrew … was the original language of all four parts.”: read; not cited, one author of doubtful class."
  - "Julius Africanus, Letter to Origen; Origen, Letter to Africanus; Jerome, Preface to Daniel and Commentary on Daniel (trans. Archer): read; ancient texts, no registry class."
  - "Reformation Study Bible, “Because the prophecies in 11:40–12:3 have not been fulfilled historically …”: read; not cited, tradition/4 carries the note."
  - "HarperCollins, “Belshazzar”: read; paraphrases the biblical text only."
  - "SBL, “Three Biblical Canons” chart: read; canon/1 carries the placement."
  - "Salvesen, Oxford Handbook of the Septuagint (ORA PDF): read; Daniel additions treated in another chapter."
  - "Bible Odyssey, Strawn “Was There a Lions' Den?”, Seeman “Maccabees” and “Hanukkah”, Hidalgo “What Is an Apocalypse?”: read; off-scope."
  - "Got Questions “Book of Daniel” and “When was Daniel written?” give 540–530 and 536–530; both cited, the difference stated in the text."
