# Review record for /scholarship/daniel-date/ (#93 shape). Not rendered.
# agent: results of the agent first pass (#155, 2026-11-25). That pass does not count toward publish.
# owner: empty (""). The owner delegated the publish review (#93, 2026-11-23); the `delegation` block records the independent second agent pass once it has run.
# Issue #155: covers the Greek additions; “may suit a Timeline Entry better; decide at sourcing test”. Decision: a page. The Timeline Entry `daniel` (published) already carries the date; this page adds ten more questions (reasons, tales, scrolls, author, languages, history, canon, the additions). The page states the date no more strongly than the Timeline Entry.
# Sourcing test (#155, 2026-11-25): gate 1, 13 Trigger Claims in Episodes 32, 34, 45, 70, 119, 147, 158, script-matched at timestamp and speaker and read about two minutes either side. Gate 2, the core: the candidate “Daniel was written in 167-164 BCE” sourced as “second century BCE, the visions during Antiochus IV’s persecution, 167–164 BCE, the tales earlier”; NABRE intro and Hayes give 167–164, Merrill Willis around 167 and 167–164, the OUP summary “scholars place the date of Daniel in the second century BCE”, Evans and Popović et al. the second century / 160s. No source in the 30-year window says “consensus” or “most scholars” about the date, so the page does not; Suchard (JBL 2022) and Valeta’s Bible Odyssey box report that the date is debated and a sixth-century date still held by some, which the short carries as a clause (two authors). Gate 3: 7 independent authors behind the core (NABRE counts as one, author null). Gate 4: 13 statements.
# Dropped or held back: Collins, A Short Introduction to the Hebrew Bible (Fortress 2018), ch. 27, read only as a JSTOR download reposted on a course server (not an author or publisher copy; #177 precedent) → leads; with it go the Dan 11:40–45 death-prophecy argument, the Jehoiakim date in 1:1, “Darius the Mede is invented”, and the canon-placement-to-date link (Collins only). Darius the Mede and Belshazzar rest on Hayes alone, attributed in the history text, not in the short. The language/genre mismatch as unsolved rests on van Deventer, attributed. Towner (Oxford Companion 1993) and EJ entries: outside the window or reposted. Jerome, Africanus, Origen: ancient texts fit no registry class; Porphyry carried on Suchard and the Posen headnote. Pre-window NCE (McNamara) not cited.
# Conflicts logged in data/scholarship-candidates.yaml, not attached as Trigger Claims (CONTEXT.md 2026-11-25): Ep 70 00:31:24 (Bel “probably written in Greek”, vs additions-origin) and Ep 45 00:40:42 (Kipp Davis, “scholars are uniformly convinced”, vs date).
# First pass: three research agents fetched every source on 2026-11-25 into separate scratch folders and copied quotes from the fetched text; the NABRE ch. 3 and 13 notes, refused to curl, were re-read in Chrome by the lead agent. Every page quote was then script-matched (whitespace, HTML entities, tags, curly quotes and PDF line-break hyphens normalised) against those saved texts: 74/74, 0 misses. The second pass must re-fetch.
# Flags for the second pass: (1) The date short says “scholars place it”, borrowing the OUP summary’s and Popović’s “scholars … date”, beside the debate Suchard and Valeta report; check it is not stronger than the sources. (2) Valeta’s sentence is in a “Did You Know?” box; whether it is Valeta’s or SBL editorial is not stated. (3) Bullard and Hatton (UBS Handbook): class doubtful (Bible-society publisher); used only attributed in additions-origin. (4) Most Reference citations are Bible Odyssey pages (independent authors, one platform). (5) The NABRE introduction text may carry over from the 1970 NAB; registry year 2011 follows the existing entry. (6) Silverman’s Bible Odyssey page is dated 21 August 2026. (7) Nel’s year 2006 is inferred from NGTT vol. 47; the page shows none. (8) The scrolls short says the oldest copy is dated close to the book’s completion: Nel (“closer to the autograph”) and Popović (“from the time of their presumed authors”). (9) The published Timeline Entry `daniel` states 167–164 flatly; Valeta and Suchard bear on it (issue filed for the owner’s re-review).
# Second agent pass 2026-11-25 (#93 delegation, independent): every cited source re-fetched into the second pass's own scratch folder, not the first pass's files. By curl: Hayes l23 (oyc.yale.edu), the OUP ch. 25 summary, PLoS ONE (Popović), Suchard (Leiden repository PDF via the handle), Nel (NGTT inline HTML, plus its landing page for the year), PDFs of van Deventer, Davis Bledsoe and the three NETS introductions, Posen, JWA (Glancy), tips.translation.bible (Bullard–Hatton), both gotquestions.org pages and Bible Gateway (RSB). Bible Odyssey (9 articles, 5 HarperCollins entries) returned Cloudflare 403 to curl, and bible.usccb.org refuses scripted requests, so those were captured in Claude in Chrome (get_page_text; NABRE notes by reading the note elements) and saved as text; Bible Odyssey paragraph locators and datePublished years were then checked by DOM query in Chrome. The Chrome texts were saved by re-typing the tool output into chrome/*.txt; three files (Valeta; Murphy and Perrin; Wills, Silverman and Burnette-Bletsch) keep only the cited paragraphs and their neighbours, so the script match for those pages is against the captured passages, not the whole page. Quotes: 74 on the page; 73 matched by script (whitespace only, tags stripped), 1 miss (scrolls/5: page “14 C”, source <sup>14</sup>C → “14C”; quote corrected). 73 after the cut below. All 13 Trigger Claims re-matched by script at timestamp and speaker (full turn, final transcript) and read about two minutes either side; 13/13.
# Second pass changes. Shorts: date (“scholars date it”, from the OUP summary and Popović, plus “The date has long been debated, and some still hold to the sixth century”, from Suchard and Valeta's box; the “court tales earlier” clause left the short, as within this statement only Hayes carries it); reasons (“in growing detail, and stop before his reign ends” cut, OUP summary alone; now “as prophecy, in coded references to the writer's own time”, OUP summary and Hayes); tales (Suchard's “One recent study argues …” moved to the text only, #133); scrolls (“the oldest is dated” → “one is dated”; neither Nel nor Popović says oldest); history (the ch. 4–Nabonidus clause cut: Merrill Willis alone, with unsourced “madness” and “last Babylonian king”; the short ends at “historical difficulties”); additions-origin (“Probably” → “Possibly”: NABRE “probably”, Posen “may”, McLay “suggest … uncertainty remains”); additions-status (“as part of Daniel” was sourced for Catholics only; now Catholic and Orthodox Christians count them as scripture, Catholic Bibles print them with Daniel). Texts: date says “Did You Know?” box, not “key points”, and Evans's “in the second century BCE, especially under Antiochus IV”; tales says Silverman dates the books, not the stories; additions-origin drops the Bullard–Hatton sentence; additions-status attributes the Glancy line to the article's “In Brief” summary. Cut to uncited: Bullard–Hatton (old additions-origin/7; class doubtful and carries “opinion today favors”); additions-origin/8 renumbered /7; registry entry removed. Quote: scrolls/5 “14 C” → “14C”. Locators: date/6, date/10 and scrolls/4 (§ 2.1), scrolls/5 (§ 6), reasons/4, tales/2, tales/6 (p. 134), scrolls/3 (§ 2), languages/2, history/4–6, canon/2, additions-origin/5, additions-status/3–4, porphyry/2–3 (“headnote”), tradition/1 and /3.
# Second pass flags: (1) NABRE (intro and notes) is Reference by repo convention, but #155 says confessional study Bibles are Tradition and don't count toward the two; the publish rule holds without it, but the author short's “The author is unknown” rests on the NABRE introduction alone among that statement's cites (Merrill Willis and Evans back the fictional-hero clause). Lead to decide. (2) 34@00:44:03 kept: “scholarly consensus” allows a minority, which the date short reports; Ep 45's “uniformly convinced” (unanimity) stays logged as a conflict. Lead to confirm. (3) 34@00:51:05 “Some of the stories originate in the Late Babylonian period” sits beside the tales short (Persian or early Hellenistic); read as origins of material, not a contradiction. (4) Valeta's and Glancy's lines are in page boxes whose authorship is not stated; both are attributed to the box. (5) Posen editor (Carol Bakhos), Volume 2, 2025 and Yale University Press confirmed only in the page's JSON-LD metadata, not its visible text. (6) Single-source clauses kept as facts of the text: the scrolls switch clause (Nel), the languages mismatch clause (van Deventer, with Perrin's boundaries and Smith-Christopher's genre division), and “The author is unknown” (NABRE; see flag 1). Nel also reports Ulrich dating “the Scroll” to 50 BCE, in the sentence after his 4QDanc dating, without naming it. (7) Nel's issue is 3&4 per the landing page; registry series says 47.3 (not changed). (8) The published Timeline Entry `daniel` (first-pass flag 9) still states 167–164 flatly. Publish rule recomputed: core `date` backed by Hayes, Merrill Willis, the Coogan–Chapman summary, Evans (Reference) and Popović et al. (Scholarly): 5 independent authors without NABRE; Suchard and Valeta back only the debate clause. 13 statements. Holds. Ids, slug and draft unchanged.
# Publish 2026-11-25 (lead agent, on the second pass's flags): (1) 34@00:44:03 trimmed to end before “And so the scholarly consensus is that it was in this period when this text was written.”: the date text reports, from Valeta, that both viewpoints have strong defenders, so the consensus sentence is not attached; the trimmed quote still states 167–164 BCE and Antiochus IV, and is re-matched by script. Not logged as a conflict, as the attached text does not contradict a statement. (2) NABRE kept as Reference: CONTEXT.md rules that a study Bible whose notes are written by a scholarly association, as the NABRE's are, is not a Tradition source; #155's note targets confessional study Bibles. The author short no longer rests on NABRE alone: “The author is unknown” replaced by “Not Daniel, scholars say: they read him as the book's hero, probably a fictional one, rather than its writer” (Merrill Willis, Evans). (3) Valeta and Glancy box lines kept, attributed to the boxes. (4) Nel's Hebrew/Aramaic switch at Qumran and the language/genre mismatch kept as plain textual facts (#133 exemption). (5) Timeline Entry `daniel`: issue #181 filed for the owner's re-review; not edited. Grammar of the date and tales shorts mended without changing their strength. Publish rule recomputed: core backed by Hayes, Merrill Willis, Coogan–Chapman summary, Evans (Reference) and Popović et al. (Scholarly), plus NABRE; 13 statements. draft flag dropped.
# #182 first pass 2026-11-28 (agent, partial re-review per #93: the changed statements' new citations get the full procedure; review and sourcesRead stay 2026-11-25, the new cites carry read 2026-11-28). Leads read: Coşkun, Historia 68 (2019), the author's offprint on UWSpace (hdl 10012/18089; opened in Chrome past the repository's Anubis check, PDF then saved by curl from the repository's own server; 7/7 quotes script-matched, whitespace and line-break hyphens normalised). Correction to the old lead and to #182's wording: Coşkun does not date chs 10–11 after the December 164 purification; he confines the pre-death terminus (Dan 11:40–45) to chs 10–11 and dates chs 7–9 and 12 after the purification, finalised by the end of January 163 BCE (abstract; pp. 448, 459). His own thesis is attributed in the reasons text only; his reports of the field (p. 438 “most scholars … around 166 BC”; p. 447 “wide-spread assumption”) back the field wording, not the page's 167–164. Newsom, Daniel (OTL 2014): Google Books preview (ebook ISBN 9781611645392), Introduction pp. 6–12 displayed in full in Chrome; quotes transcribed from the page images (no text layer). Collins: the Short Introduction 2nd (2014) and 4th (2025) editions' Daniel pages are not in the previews (search hits only, “No preview available”), and the Writings split volume has no preview; the full Introduction to the Hebrew Bible, 2nd ed. (2014) shows pp. 6 and 566 in full and is cited from them; its Dan 11 pages (581) are not shown. Brill OAPEN: Suchard, Aramaic Daniel (2022) saved from the Internet Archive copy of the OAPEN PDF (2/2 script-matched); Machiela, Handbook of the Aramaic Scrolls (2022) read in the OAPEN in-browser viewer, not cited (uncited). Portier-Young VT 60 (2010): closed (OpenAlex is_oa false, no repository full text; CORE has Crossref metadata only; no DukeSpace or Internet Archive copy). Added: date/13–15, reasons/7–13, tales/9–12, author/4–5, languages/5–7, history/7–13, canon/4, porphyry/4–5; four registry entries. Shorts changed: reasons (new third sentence: Daniel 11 gets Antiochus's death wrong, so scholars date it before he died, late in 164 BCE; Coogan–Chapman summary, Newsom, Coşkun) and history (Belshazzar never king, no Median Darius known: Hayes and Collins each). Unchanged shorts: date, tales, author, languages, canon, porphyry. Infographic: the reasons plate restates the unchanged little-horn sentence and the legend the unchanged date short, so the infographic stays in step. Flags for the second pass: (1) the reasons short's new sentence rests partly on Newsom's report of Porphyry (reasons/7); check it is not stronger than Newsom, Coşkun and the Coogan–Chapman summary together. (2) history short: “Belshazzar was never king” (Hayes, Collins) and “no Median king Darius is known to history” (Hayes, Collins); Newsom's Darius I point (history/13) is not counted. (3) Collins class (Reference by textbook precedent) and the registry title and edition. (4) Newsom quotes are transcriptions from page images; re-read each against the displayed page.
