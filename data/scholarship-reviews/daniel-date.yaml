# Review record for /scholarship/daniel-date/ (#93 shape). Not rendered.
# agent: results of the agent first pass (#155, 2026-11-25). That pass does not count toward publish.
# owner: empty (""). The owner delegated the publish review (#93, 2026-11-23); the `delegation` block records the independent second agent pass once it has run.
# Issue #155: covers the Greek additions; “may suit a Timeline Entry better; decide at sourcing test”. Decision: a page. The Timeline Entry `daniel` (published) already carries the date; this page adds ten more questions (reasons, tales, scrolls, author, languages, history, canon, the additions). The page states the date no more strongly than the Timeline Entry.
# Sourcing test (#155, 2026-11-25): gate 1, 13 Trigger Claims in Episodes 32, 34, 45, 70, 119, 147, 158, script-matched at timestamp and speaker and read about two minutes either side. Gate 2, the core: the candidate “Daniel was written in 167-164 BCE” sourced as “second century BCE, the visions during Antiochus IV’s persecution, 167–164 BCE, the tales earlier”; NABRE intro and Hayes give 167–164, Merrill Willis around 167 and 167–164, the OUP summary “scholars place the date of Daniel in the second century BCE”, Evans and Popović et al. the second century / 160s. No source in the 30-year window says “consensus” or “most scholars” about the date, so the page does not; Suchard (JBL 2022) and Valeta’s Bible Odyssey box report that the date is debated and a sixth-century date still held by some, which the short carries as a clause (two authors). Gate 3: 7 independent authors behind the core (NABRE counts as one, author null). Gate 4: 13 statements.
# Dropped or held back: Collins, A Short Introduction to the Hebrew Bible (Fortress 2018), ch. 27, read only as a JSTOR download reposted on a course server (not an author or publisher copy; #177 precedent) → leads; with it go the Dan 11:40–45 death-prophecy argument, the Jehoiakim date in 1:1, “Darius the Mede is invented”, and the canon-placement-to-date link (Collins only). Darius the Mede and Belshazzar rest on Hayes alone, attributed in the history text, not in the short. The language/genre mismatch as unsolved rests on van Deventer, attributed. Towner (Oxford Companion 1993) and EJ entries: outside the window or reposted. Jerome, Africanus, Origen: ancient texts fit no registry class; Porphyry carried on Suchard and the Posen headnote. Pre-window NCE (McNamara) not cited.
# Conflicts logged in data/scholarship-candidates.yaml, not attached as Trigger Claims (CONTEXT.md 2026-11-25): Ep 70 00:31:24 (Bel “probably written in Greek”, vs additions-origin) and Ep 45 00:40:42 (Kipp Davis, “scholars are uniformly convinced”, vs date).
# First pass: three research agents fetched every source on 2026-11-25 into separate scratch folders and copied quotes from the fetched text; the NABRE ch. 3 and 13 notes, refused to curl, were re-read in Chrome by the lead agent. Every page quote was then script-matched (whitespace, HTML entities, tags, curly quotes and PDF line-break hyphens normalised) against those saved texts: 74/74, 0 misses. The second pass must re-fetch.
# Flags for the second pass: (1) The date short says “scholars place it”, borrowing the OUP summary’s and Popović’s “scholars … date”, beside the debate Suchard and Valeta report; check it is not stronger than the sources. (2) Valeta’s sentence is in a “Did You Know?” box; whether it is Valeta’s or SBL editorial is not stated. (3) Bullard and Hatton (UBS Handbook): class doubtful (Bible-society publisher); used only attributed in additions-origin. (4) Most Reference citations are Bible Odyssey pages (independent authors, one platform). (5) The NABRE introduction text may carry over from the 1970 NAB; registry year 2011 follows the existing entry. (6) Silverman’s Bible Odyssey page is dated 21 August 2026. (7) Nel’s year 2006 is inferred from NGTT vol. 47; the page shows none. (8) The scrolls short says the oldest copy is dated close to the book’s completion: Nel (“closer to the autograph”) and Popović (“from the time of their presumed authors”). (9) The published Timeline Entry `daniel` states 167–164 flatly; Valeta and Suchard bear on it (issue filed for the owner’s re-review).
