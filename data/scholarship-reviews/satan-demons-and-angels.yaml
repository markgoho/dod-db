# owner: empty (""). The owner delegated the publish review (#93, 2026-11-23); the `delegation` block records the independent second agent pass once it has run.
# Issue #147 instructions: short answers report the state of scholarship, never one scholar's view (#133); confessional study Bibles are Tradition and don't count toward the two. No candidate entry existed; slug from the issue title.
# Sourcing test (#147, 2026-11-26): gate 1, nineteen Trigger Claims in Episodes 1, 18, 28 and 84, read with about two minutes either side and script-matched. Gate 2, the core: the candidate “the Satan figure had not developed in the Hebrew Bible” sourced as “satan means adversary or accuser, and the satan of Job and Zechariah is a member of God's court, not God's enemy”: HarperCollins, Porter, Hayes, NABRE, Dolansky and EJ back it. The development itself is a separate statement (devil), carried by Jonker, Dolansky, Hayes, Porter and Stephens. 14 statements.
# Dropped for want of agreed sources or a second author: whether cherubim and seraphim are angels (sources disagree on the term; see uncited); the sons of God as demoted gods (disputed; overlaps the-origins-of-yahweh); Job's date (sources disagree; the Trigger Claim's “Persian period” not stated); the Sethite reading of Genesis 6 (one older author); Septuagint shedim → daimonia verse by verse (only Proctor's general statement; Reed HTR 2023 paywalled); Jude and 2 Peter dependence on Enoch kept only as Coblentz Bautch's attributed “many scholars”.
# Conflicts: Ep 18 00:50:40 (“we don't really see an explicit identification of Satan either with the serpent … or with Lucifer until … the 2nd and 3rd centuries CE”) is not attached: it contradicts the serpent text's NABRE reading of Wisdom 2:24 as an identification, though Dolansky agrees with it; logged as a conflict for the owner's next re-review in data/scholarship-candidates.yaml.
# First pass: four research agents fetched every source on 2026-11-26 into separate scratch folders with curl and copied quotes from the fetched text; every page quote was then script-matched (whitespace and HTML entities normalised) against those saved texts: 103/103, 0 misses. The second pass must re-fetch. bible.usccb.org and Britannica returned bot checks to most agents; the three NABRE notes cited were fetched by one agent.
# Flags for the second pass: (1) Many Reference citations are Bible Odyssey pages (Porter, Dolansky, Anderson, Proctor, Boling and Proctor, Angel, Coblentz Bautch, Sommer, Twelftree, Feldman, Merrill Willis): independent authors, one platform. (2) Several EJ and NCE entries carry pre-1996 text; each is attributed and none is the only support for a short. (3) Lucifer: “some church fathers” rests on Bowker alone among modern sources (Bowker's page has no year); Quick (2018) carries the window. (4) Persia: Jonker's “Scholars are in agreement” is reported and called contested; check that wording. (5) Exorcism short: “most historical Jesus scholars agree” rests on Craffert's sentence; Twelftree and Proctor back the Gospel facts. (6) chronicles short says “some … others”; check it does not count scholars. (7) Trigger 28@00:09:46's turn goes on to the Host's own interpolation argument; the page reports interpolation as one reading among several. (8) Boling and Proctor and Proctor share an author; counted once for any rule.
