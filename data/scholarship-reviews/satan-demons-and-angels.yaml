  - "#238 (2026-11-27): NABRE notes on Revelation 12:9 (“The ancient serpent: who seduced Eve”) and 12:10, read in the Internet Archive snapshot web.archive.org/web/20261015000056/https://bible.usccb.org/bible/revelation/12: not cited. They are the 1986 New Testament revision, outside the 30-year window for what scholars hold (#86); the Genesis 3:15 note (serpent/5) already gives the Christian identification, citing Rev 12:9."
  - "#238 (2026-11-27): NABRE Deuteronomy 32, read in the Internet Archive snapshot web.archive.org/web/20260425191246/https://bible.usccb.org/bible/deuteronomy/32: there is no note on 32:17 (the shedim verse); the 32:8 note on the “sons of God” is not about demons. Nothing to cite; the lead is closed."
  - "#238 (2026-11-27): NABRE notes on Leviticus 16:8 (“Azazel: a name for a demon (meaning something like “angry/fierce god”)”), Leviticus 17:7 (“Like the demon Azazel”) and Isaiah 13:21 (satyrs “in the popular mind, demons of goatlike form”), read in Internet Archive snapshots (Lev 16: web.archive.org/web/20260220185313/; Lev 17: 20260508110227; Isa 13: 20260412163055): not cited, unhedged where Feldman (demons/7) calls Azazel enigmatic, the same reason as HarperCollins “Azazel”."
  - "#238 (2026-11-27), cherubim and seraphim, re-read: NCE “Cherubim” (Fallon: “Nor were cherubim thought to be angels, i.e., God's messengers”; later identified with God's heavenly courtiers as postexilic angelology developed) and “Seraphim” (“Unwarrantedly, some have associated seraphim with the saraph (burning) serpents”); Sommer, Bible Odyssey “Angels in the Hebrew Bible” (seraphs as “flying heavenly snakes” and kerubs among the beings biblical authors speak of besides mal'akh) and “Seraphs” (the image of the seraph as a snake probably from Egyptian art); EJ “Seraph” (Fishbane): Isaiah 6's seraphim “must be distinguished” from the seraph-snakes, “composite semidivine beings”, so Fishbane does not hold the serpent reading, as #238's summary had it. Newly read: HarperCollins (Bible Odyssey) “cherub” (“an unnatural, composite being … always connected with the deity”) and “seraphim” (“attendants or guardians before the divine throne analogous to the cherubim”); NABRE notes on Isa 6:2 (seraphim “used adjectivally of the cherubim, who are not serpent-like”), Isa 6:1, Exod 25:18–20, Ezek 1:5 (cherubim “known from Assyrian religion as minor guardian deities”), Num 21:6 and Isa 14:29 (winged cobra), via Internet Archive snapshots. No source read states where the field stands on either question, and one bounded search found none, so no statement is made and the #238 item is closed: the sources set the terms differently (angel as messenger vs heavenly being), and on seraphs as serpents Sommer alone of the authors read says yes."
  - "#238 (2026-11-27): Evans, Biblica 85 (2004), pp. 545–547: in the past “the majority of commentators” took satan in 1 Chr 21:1 as a proper name, and Japhet “argued against the consensus”; read, not cited: the sentences carry the Hebrew word in the source's garbled encoding, and the majority claim rests on Breytenbach and Day (DDD), a lead."
