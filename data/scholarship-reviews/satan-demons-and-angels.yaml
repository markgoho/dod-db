leads:
  - "Peggy L. Day, An Adversary in Heaven: śāṭān in the Hebrew Bible (1988): standard monograph; not public."
  - "Ryan E. Stokes, “The Devil Made David Do It … or Did He?”, JBL 128 (2009): satan in 1 Chr 21:1 as a heavenly emissary of God, not a name; known only through Chukwuka's 2020 thesis. Closed (#238, 2026-11-27): DOI 10.2307/25610168 (Crossref); JSTOR only, OpenAlex reports it closed with no repository copy; the Internet Archive holds only the JSTOR landing page; no author or repository copy found by search. JSTOR's free reading needs an account, so not tried. Evans, Biblica 2004 (cited at chronicles/10–14) is open but reads satan as a proper name, so it does not stand in for Stokes."
  - "Sara Japhet, I & II Chronicles (OTL, 1993), on 1 Chr 21:1: via Chukwuka's thesis only."
  - "Chad T. Pierce, “Satan and Related Figures”, Eerdmans Dictionary of Early Judaism (2010): read only as quoted in Jonker 2017."
  - "C. Breytenbach and P. L. Day, “Satan”, DDD (2nd ed.): cited by Jonker and Silverman; not public."
  - "Annette Yoshiko Reed, “When did Daimones become Demons?”, HTR 116.3 (2023): Septuagint daimonia; abstract only. Closed (#238, 2026-11-27): DOI 10.1017/S0017816023000196; the Cambridge page offers “Get access” only and its PDF link returns the access page; OpenAlex reports it closed with no repository copy; no author copy found by search. Reed, Fallen Angels and the History of Judaism and Christianity (CUP 2005): not public."
  - "Archie T. Wright, The Origin of Evil Spirits (2005/2015); Loren Stuckenbruck on the demonic in the Scrolls: not public."
  - "Kim Papaioannou, “The sin of the angels in 2 Peter 2:4 and Jude 6”, JBL 140.2 (2021) 391–408: abstract dissents from the Watchers link. Closed (#238, 2026-11-27): DOI 10.1353/jbl.2021.0019; Project MUSE (Internet Archive snapshot too) shows the abstract with purchase options only; the author's Andrews University repository record says “This document is currently not available here”; OpenAlex reports it closed. An abstract is not the passage, so it is not cited."
  - "J. Doedens, The Sons of God in Genesis 6:1–4 (Brill 2019): Sethite reading dated to Julius Africanus; snippet only."
  - "Saul M. Olyan, A Thousand Thousands Served Him (1993), on angel names: cited by White 1999; not public."
  - "S. A. Meier, “Angel of Yahweh”, DDD; G. von Rad and C. A. Newsom on the angel of the Lord: read only as quoted in NCE and White."
  - "C. Breytenbach and P. L. Day, DDD “Satan” (1995): “The majority of scholars … understand śāṭān to be the proper name Satan” in 1 Chr 21:1; read only as quoted in Evans 2004, p. 545 n. 3 (#238)."
  - "Michael S. Heiser, “The Mythological Provenance of Isa. XIV 12-15”, VT 51 (2001): 403 on both hosts."
  - "Britannica “Satan”, “Lucifer”, “angel”, “demon”, “Ahriman”: 403 to curl."
  - "Graham Twelftree, Jesus the Exorcist (1993); J. P. Meier, A Marginal Jew vol. 2: not public. Marcus Borg's “virtually indisputable that Jesus was a healer and exorcist”: snippet only."
  - "Paul Hanson, Dawn of Apocalyptic (1979), and James Barr, JAAR 53 (1985), against Persian influence: read only as quoted in Jonker and Silverman."
uncited:
  - 'Christine Hayes, RLST 145 l20: “The phrase, "the satan," occurs four times in the Hebrew Bible, here and in Numbers 22 and in Zechariah3.”: read; not cited, conflicts with EJ''s reading of Num 22:32 as “a satan” without the article.'
  - "Brennan Breed, “Authorship of Job” (Bible Odyssey) and Hayes l20 on Job's date (“we really don't know”; dialogues sixth or fifth century BCE): read; not cited, the page states no date for Job. H. L. Ginsberg (EJ “Job, Book of”, 1971 text) dates the satan layer to the Persian period: one older author."
  - "Carol Newsom, “Job”, and Davis Hankins, “Legal Language in Job” (Bible Odyssey): read; the satan as heaven's prosecuting attorney. Not cited: the satan statement is carried by HarperCollins, Porter, Hayes and the NABRE."
  - "Ebele C. Chukwuka, PhD thesis (Pretoria 2020) on 1 Chronicles 21: read; contradicts the author's 2021 HTS article on whether satan there is a proper name; not cited."
  - "EJ “Demons, Demonology” (Hillers), Gaster (“Belial”), Barnett (NCE “Satan”), Hartman (NCE “Demon”), Duchesne-Guillemin (Encyclopaedia Iranica “Ahriman”, 1984; “Dead Sea Scrolls”, 1994) on probable Iranian influence: read; older works, not cited for the persia statement, which is carried by sources from 2005 on."
  - "Stoyanov (and Bianchi), “Dualism”, Encyclopedia of Religion: read; Zoroastrian influence on Qumran must be balanced against native sapiential sources. Not cited: Collins and Silverman carry the same point."
  - "Dale Martin, RLST 152 l23, and Ehrman, Brief Introduction to the NT ch. 3 summary, on apocalyptic dualism (God and Satan): read; general, not cited."
  - "NCE “Seraphim”, “Cherubim” (Fallon), Sommer “Seraphs”, EJ “Cherub” (Paul) and “Seraph” (Fishbane), Piras and Michl on Pseudo-Dionysius: read; sources disagree whether cherubim and seraphim count as angels (NCE: “Nor were cherubim thought to be angels”; Sommer folds them in) and whether seraphs are serpents. No statement made: question dropped for want of agreed terms."
  - "Ellen White, “Divine Council”; Sommer, “Monotheism in the Hebrew Bible”; Ballentine, “Heavenly Hosts”; Heiser, Bibliotheca Sacra 2001; NAB notes on Ps 82, Deut 32:8: read; the sons-of-God-as-demoted-gods question is disputed and overlaps the-origins-of-yahweh; no statement made."
  - "NCE “Michael, Archangel”: “the author has undoubtedly been influenced by the angelology of Zoroastrianism”: read; one author, older text, not cited."
  - "Proctor, “Demons and Unclean Spirits”: “Demons were thought to be the causes of various individual and social ills” and Greco-Roman context: read; not cited, background."
  - "Caciola, “Exorcism” (Encyclopedia of Religion): read; “Exorcism is among Jesus' favorite miracles in the Synoptic tradition”. Not cited: Twelftree and Proctor carry it. Its “(Lk. 19:13)” is a source error for Acts 19:13."
