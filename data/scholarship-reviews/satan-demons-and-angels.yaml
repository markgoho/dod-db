hip-candidates.yaml; (b) the three NABRE notes were read only in Internet Archive snapshots (live pages bot-checked, not dead); (c) lesses-eor-lilith url changed in the shared registry; (d) silverman-2014-zechariah-3 and piras-eor-angels are now uncited by any page, like dewolf-parks-bo-angels-monsters, fallon-nce-uriel and caciola-eor-exorcism added in cd9a57e; (e) lucifer's “some church fathers” still rests on Bowker alone (kept as an uncontested fact about ancient readers); (f) Bible Odyssey carries most Reference citations (first-pass flag 1), unchanged.
