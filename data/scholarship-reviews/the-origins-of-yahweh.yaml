rules:
  publish-rule:
    {
      agent: pass,
      owner: "",
      note: "7 statements (minimum 3). Core (el) backed by two independent authors (#92, counted by distinct author): Christine Hayes (hayes-rlst145-l7, Reference, Yale 2006; el/1–5) and Coogan and Chapman (coogan-brief-4e-summary-ch5 and coogan-brief-4e-summary, Reference, OUP 2019; el/6–7, counting once). None Host-authored. Fleming (Scholarly) does not back the core and isn't cited on it. First-pass flag, resolved by the second pass below: Hayes says her El handout relies “very much on Michael Coogan” (l7 ch. 5), and l8's storm passage relays Coogan. The core still rests on Hayes's own “many scholars have suggested” report (el/1) and the Coogan and Chapman summary (el/6), so it passes by distinct author, but the two aren't wholly independent in substance. Second pass 2026-11-23, owner's core-independence decision: checked whether Fleming (CUP 2021, open excerpt pp. 1–10, all read) backs `el`. He does not: the excerpt never says Israel's ancestors worshipped El; the nearest is p. 6, “El could have been part of the religious landscape before Israel”, which is hedged and about the region, not Israel's ancestors. Fleming does back a different framing (p. 4, “I do not think Yahweh began as any form of ‘The God’ El”), so rewording the core to that common ground was tested: it needs a Hayes or Coogan sentence that says alone that Yahweh did not begin as El. None does. Hayes l7 ch. 6 (Smith's model: Yahweh “originally came from a region further south … began to take on the characteristics of other deities, first El”) implies it only by inference (the first pass already cut it from not-el for that reason); Hayes l8 ch. 2 (“in place of El”) relays Coogan, bringing the dependence back; the Coogan and Chapman summaries never name Yahweh and El as separate gods. Not reworded to fit (#84). `el` left as is; it holds by distinct author only. Substance note: el/1 (“many scholars have suggested…”) comes before Hayes mentions the Coogan-based handout, and el/4–5 are her own ch. 6 summary in the Smith section, so none of her `el` sentences is presented as Coogan's; the dependence she states covers the handout list (resemblance) and the l8 storm passage. 7 statements; publish rule met. Second pass 2026-11-23: verified. #133 first pass: not-el cut, 6 statements (minimum 3); core el unchanged. Second pass on #133 change pending.",
    }
