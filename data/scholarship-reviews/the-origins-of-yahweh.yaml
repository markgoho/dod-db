leads:
  - "Mark S. Smith, The Early History of God, 2nd ed. (Eerdmans, 2002), pp. 7–8: “Convergence involved the coalescence of various deities, and/or some of their features into the figure of Yahweh.” Quoted by Hayes in l7 ch. 6; Smith's own text not read."
  - "Michael D. Coogan, The Old Testament: A Historical and Literary Introduction to the Hebrew Scriptures (OUP, 2006), pp. 101–3: the storm-god shift, relayed by Hayes in l8 ch. 2; not read."
  - "Theodore J. Lewis, The Origin and Character of God (OUP, 2020), ch. 6 “The Origins of Yahweh”, cited in Fleming 2021, p. 3 n. 4 as a systematic review of the inscriptional evidence; not read."
  - "Joseph Blenkinsopp (2008), four lines of evidence for the Midianite Hypothesis, known only through Fleming 2021, p. 8; not read."
uncited:
  - "Hayes l7 ch. 6 [00:38:39]: “The Canaanite god El was, from the biblical text, the God of Israel's earliest ancestors.” The candidate's core-claim passage (#124). Not cited: it opens Hayes's account of Smith's convergence model, so el cites Hayes's own ch. 5 and ch. 6 statements (el/1, el/4, el/5) instead."
  - "Hayes l8 ch. 2 [00:06:51]: “The older god El, the sky god, was replaced by the younger storm god, Baal”. Hayes relaying Coogan (2006). (Second pass correction: not the only passage read naming El as the sky god; l7 ch. 5 also says “the sky god, El”, in Hayes's own account of the Ugarit texts.) Not cited, so el doesn't equate the Coogan ch. 6 summary's sky god with El."
  - "Fleming 2021, p. 4: “The Egyptian evidence is decisive to my analysis: the name Yhwȝ designates a Shasu group, a Yhwȝ-people.” Fleming's own reading of the Egyptian name; not cited, since the page states only that the texts name a Yhwȝ in Shasu-land."
  - "Fleming 2021, p. 6: “If the Bible’s recollection of Yahweh in the southern wilderness must be explained by early Jewish ruminations that offer no threads of real religious history, there is no reason to seek the god’s origins anywhere but the land of Israel itself, even if no evidence survives.” Conditional; would back a statement of the Berlin hypothesis only if worded as a conditional and attributed."
  - "Fleming 2021, p. 8: Blenkinsopp's four lines of evidence (Moses and Midian in Exod 2 and 18; Yahweh from the south in old poetry such as Judges 5; Egyptian Yhwȝ texts; Cain as Kenite ancestor). Fleming relaying another scholar; south/3 gives Fleming's own reasons instead."
  - "Hayes l7 ch. 5 [00:26:43]: “he reveals to Moses a new name, Yahweh, so that Yahwism, and the Yahweh cult, can be said to begin only with Moses.” The Bible's own portrayal; el/5 carries the point."
  - "Hayes l7 ch. 6: Joshua 24:14–15 (“Put away the gods that your forefathers served beyond the Euphrates and in Egypt”). Not on the page."
  - "Coogan and Chapman ch. 5 summary, “Ancestors as History?”: “a secure date for these events is impossible to pinpoint, and some scholars have dismissed these narratives as a historical fiction from late in the biblical period.” Bears on the patriarchs' historicity, not on El; not on the page."
