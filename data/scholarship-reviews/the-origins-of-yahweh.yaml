leads:
  - "Frank Moore Cross, “Yahweh and the God of the Patriarchs”, Harvard Theological Review 55 (1962), pp. 225–59, and Canaanite Myth and Hebrew Epic (1973), ch. “Yahweh and ʾEl”: the classic case that Yahweh began as a cultic name of El. Named in Fleming ch. 7 summary (south/12); HTR is paywalled (Cambridge Core, checked 2026-11-23), the only full-text copy of the book found online is on a third-party site of unclear licence; not read. Both older than the 30-year window the source notes use."
  - "Karel van der Toorn, “Yahweh”, Dictionary of Deities and Demons in the Bible, 2nd ed. (1999), pp. 910–19 (Fleming ch. 7 summary cites p. 915 for the objection to an El-epithet origin); not read."
  - "Marlene E. Mondriaan, “Yahweh and the origin of Yahwism: A critical evaluation”, Old Testament Essays 17/4 (2004), pp. 580–94: reported by a search summary as calling the Yahweh–El equation a view with reasonable consensus and arguing it is too simple. Only a Scribd upload found; not read."
  - "Nissim Amzallag, “YHWH and El”, ch. 6 of Yahweh and the Origins of Ancient Israel (CUP, 2023), pp. 178–96: Cambridge Core summary says the chapter argues the Bible identifies YHWH with El. Paywalled; summary read only in a fetch tool's paraphrase, not verbatim; not read."
  - "Mark S. Smith, The Early History of God, 2nd ed. (Eerdmans, 2002), pp. 7–8: “Convergence involved the coalescence of various deities, and/or some of their features into the figure of Yahweh.” Quoted by Hayes in l7 ch. 6; Smith's own text not read."
  - "Michael D. Coogan, The Old Testament: A Historical and Literary Introduction to the Hebrew Scriptures (OUP, 2006), pp. 101–3: the storm-god shift, relayed by Hayes in l8 ch. 2; not read."
  - "Theodore J. Lewis, The Origin and Character of God (OUP, 2020), ch. 6 “The Origins of Yahweh”, cited in Fleming 2021, p. 3 n. 4 as a systematic review of the inscriptional evidence; not read."
