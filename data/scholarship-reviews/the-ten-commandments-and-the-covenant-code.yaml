leads:
  - "Erhard Blum, “The Decalogue and the Composition History of the Pentateuch”, in The Pentateuch: International Perspectives (FAT 78, 2011): five-prohibition core; read only as reported by Edenburg 2023."
  - "Shimon Gesundheit, Three Times a Year (FAT 82, 2012), 12–43, and David Carr, The Formation of the Hebrew Bible (2011), 264: Exodus 34 as a late compilation; cited by Sherman 2024; not read."
  - "Bruce Wells, “The Covenant Code and Near Eastern Legal Traditions: A Response to David P. Wright”, Maarav 13 (2006): the main critique of Wright's dependence thesis; read only as reported by Wright 2009 and Milstein 2021; not public."
  - "Raymond Westbrook, “The Laws of Biblical Israel” (2008), and Westbrook and Wells, Everyday Law in Biblical Israel (2009): critiques of literary dependence and of the revision model; read only as reported by Wright 2009 and Wright 2011."
  - "William S. Morrow, review of Wright, Bibliotheca Orientalis 70 (2013), 309–331: said by Wright 2019 to accept dependence for Exodus 21:18–32; not read."
  - "Bernard M. Levinson, Deuteronomy and the Hermeneutics of Legal Innovation (OUP 1997): the revision thesis in full; paywalled."
  - "Jeffrey Stackert, Rewriting the Torah (2007): the Holiness Code revising the Covenant Code and Deuteronomy; cited by Sweeney; not read."
  - "Carmen Joy Imes, Bearing YHWH's Name at Sinai (2018): the name command as bearing the name, not speech; publisher blurb only."
  - "Michael LeFebvre, Collections, Codes, and Torah (2006): “Scholars of biblical law widely hold that ancient Israel did not draft law-texts for legislative purposes”, seen only in a podcast-site blurb."
  - "Wright's review of Van Seters, JAOS 124.1 (2004): “most scholars think that CC is earlier than Deuteronomy and HC”; vLex preview only, not readable in full."
  - "Levinson's numbering chart, Jewish Study Bible 2nd ed. (2014), p. 357; W. C. Marlowe, “Ten Commandments or Prohibitions?”, JIBS 8.2 (2022) (fetch blocked)."
uncited:
  - "Robert Gnuse, “Deuteronomic Redaction and the Evolution of the Decalogues in Exodus 20 and Deuteronomy 5”, Qeios 5 (2023): read; “There is also a debate concerning the priority of Exodus 20 or Deuteronomy 5”. Not cited: Qeios uses open post-publication review, not shown to be peer-reviewed, and no second source states the priority debate."
  - "William S. Morrow, “Some Characteristics of Biblical Law”, The Bible and Interpretation (2017): read; three viewpoints on law collections and practice. Not cited: a web magazine, near the #80 blogs exclusion."
  - "New Catholic Encyclopedia, “Commandments, Ten” (Polan): read; “critical scholars generally … abandon the position” that the Decalogue came from the later prophets. Not cited: bibliography stops at 1962, text outside the 30-year window."
  - "Walter Harrelson, “Ten Commandments”, Encyclopedia of Religion (1987): read; “oldest listing of the ‘Ten Words’ (Ex. 34:28)”. Outside the 30-year window."
  - "NET Bible note on Exodus 20:7: read; relies on Driver (1911); evangelical publisher; not cited."
  - "Ronald H. Isaacs, My Jewish Learning, “The Ten Commandments”: read; misstates the Catholic ninth/tenth order (matches Luther only); not cited."
  - "Encyclopaedia Judaica, “Deuteronomy” (Weinfeld/Sperling): read; “complementing … or supplementing” the Book of the Covenant; probably 1st-ed. text; not cited (Hayes reports Weinfeld differently)."
  - "Christine Hayes l10, “God's name in Deuteronomy 5 is not to be used in a vain oath as opposed to a false oath”: read; not cited, as both verses have the same Hebrew word (the šāwʾ/šeqer difference is in the witness command)."
  - "Pietersen, Journal for Semitics 30/1 (2021): read; “all in agreement that the Covenant Code is the oldest”: overstated against Edenburg and Van Seters, and leans on 1960s sources; not cited."
  - "Ada Taggar-Cohen, “Hittite Laws and Texts” (Bible Odyssey): read; Hittite laws were in use, unlike Mesopotamian collections; not cited (about Hittite law, not the Covenant Code)."
  - "Coogan and Chapman ch. 10 summary: read; Deuteronomy's laws “parallel and modify laws found elsewhere”; generic, not naming the Covenant Code; not cited."
  - "Rollston (TheTorah 2017), Levinson 2021 body, Morrow via Wright: read or seen; not needed beyond the cited Hammurabi sources."
  - "Christine Hayes, RLST 145 lecture 11, ch. 3 [00:22:16]: “The Priestly source seems to represent an equally early set of laws, legal traditions, that just emanated from a very different circle and had different concerns” (was oldest/6). Read; cut by the second pass (2026-11-27): the sentence compares P with D, and her next sentence says P “often updates and revises laws of the Covenant Code”, so it does not set P as early as the Covenant Code in the oldest statement."
