# Review record for /scholarship/the-ten-commandments-and-the-covenant-code/ (#93 shape). Not rendered.
# agent: results of the agent first pass (#158, 2026-11-27). That pass does not count toward publish.
# owner: empty (""). The owner delegated the publish review (#93, 2026-11-23); the `delegation` block records the independent second agent pass once it has run.
# Issue #158: new subject from the topic ranking; absorbs the queued `covenant-code` candidate (core "The Covenant Code is the earliest legislation in the Hebrew Bible"), whose entry is removed. Only that one candidate entry matched the subject by grep (covenant, commandment, decalogue, Hammurabi); `child-sacrifice-and-molech` (Exodus 22:29) and `deuteronomy-and-josiah` are separate queued subjects and nothing here states their claims (the page has no statement on Exodus 22:29 or on Deuteronomy's date or Josiah).
# Overlap: no statement on whether the first commandment denies other gods (the-emergence-of-monotheism-and-the-divine-council#first-commandment), on how the Hebrew Bible defines adultery or punishes it (marriage-polygamy-and-adultery-in-the-bible#adultery, #adultery-penalty), or on the Exodus's historicity (moses-and-the-exodus). Reused registry ids: brown-bo-ten-commandments, nabre-exodus-20-notes, nabre-exodus-21-notes, harpercollins-2009-dictionary (per-citation url: Ten Commandments), hayes-rlst145-l10, hayes-rlst145-l11, coogan-brief-4e-summary-ch7, coogan-brief-4e-summary-ch8.
# Sourcing test (#158, 2026-11-27): gate 1, 17 Trigger Claims in Episodes 21, 23, 31, 66, 93, 167 and 187 (the Covenant Code and Decalogue tags' top Episodes, each final transcript grepped for covenant code, decalogue, Hammurabi, Exodus 34, Deuteronomy 5), each script-matched at its turn's leading timestamp and speaker, read about two minutes either side. Three further assertions stronger than their statements are logged as conflicts in data/scholarship-candidates.yaml (31@00:08:39, 93@00:16:59, 23@00:47:06), not attached. Gate 2, the core: the candidate "the earliest legislation in the Hebrew Bible" sourced at the strength "Probably, scholars say: it is widely considered the earliest collection of biblical law. But its date is debated, and some scholars place it later": Halberstam 2017 (Scholarly, Cambridge, "most likely the earliest"), Samet 2017 (Reference, Hebrew University courseware, "considered among scholars to be the oldest"), Edenburg 2019 (Scholarly, OUP abstract, "widely considered the earliest"), Paul/Sperling EJ (Reference; possibly 1st-ed. text), with Hayes l11 ("equally early" Priestly laws) and Van Seters 2003 (abstract; exilic, after D and H) as the debate. Gate 3: 4 independent authors behind the core claim (Halberstam, Samet, Edenburg, Paul and Sperling), Hayes and Van Seters not counted. Gate 4: 20 statements.
# Shorts (#133): no short says "consensus"; "most scholars" appears in no short. Hedged state-of-field words in shorts each rest on 2+ authors: name, versions, differences, numbering, addressed, covenant-code, parallels (NABRE "more than half", attributed in the short), talion, slaves (descriptive: what the texts say, 3 authors); disagreement shorts (ten-words, composition, ritual-decalogue, oldest, date, hammurabi, courts) each show two named sides with 2+ authors on the majority side.
# Dropped for want of a second author or a qualifying source: which of Exodus 20 and Deuteronomy 5 is older (Gnuse, Qeios 2023, open post-publication review, not shown to be peer-reviewed: uncited); Deuteronomy's coveting commandment as two commandments (the Coogan summary only; kept in the differences text as the summary's words); the name commandment as "bearing" the name in public (Imes 2018, publisher blurb only: lead); the Holiness Code revising the Covenant Code beyond the slave law (Sweeney, Wright JHS; Farber disagrees; slaves statement keeps only the slave law); law collections as royal propaganda vs. guidance vs. scribal treatises (Morrow, The Bible and Interpretation, a web magazine: uncited); the ear-piercing location in Exodus 21:6 (NABRE vs Farber/Levinson: not stated).
# First pass: five research agents fetched every source on 2026-11-27 into separate scratch folders and copied quotes from the fetched text; every page quote was then script-matched against those saved texts (whitespace, HTML entities, curly quotes, dashes, soft and non-breaking hyphens, Hebrew vowel points and inline tags normalised; bracketed footnote markers such as [27] stripped from the source text, as earlier pages drop them from quotes): 150/150, 0 misses. The second pass must re-fetch.
# Flags for the second pass: (1) TheTorah.com: 21 articles by named scholars, classed Reference as the registry's earlier TheTorah entries are; the live pages render by script, so the text was read from the embedded article data or Internet Archive copies. Many statements lean on this one platform (independent authors, one site). (2) Abstract-only citations: Edenburg 2019 and Van Seters 2003 (OUP abstracts; chapter and book paywalled), as the registry's abstract-only convention. Edenburg 2019 backs the core; the core holds without her (Halberstam, Samet, Paul/Sperling). (3) Encyclopaedia Judaica: Paul/Sperling "Book of the Covenant" — its "earliest collection" sentence is probably 1st-ed. (1971) text, so it is not relied on for the state of the field; the "Date" section is 2nd-ed. Greenberg "Decalogue" — biblical section is 1st-ed. text with one 2nd-ed. sentence (Staples, Sperling); used for what it reports ("traditionally", "Critics … regard"), not for the current field. (4) Wright 2009 read in an ebook distributor's (pageplace.de) preview PDF of the OUP book, not an OUP-hosted page. (5) Samet 2017: edX asset PDF of IsraelX courseware (lecture text), treated like Open Yale transcripts. (6) SBL lesson plan: no author or date on the PDF (uploaded 2024/08). (7) Van De Mieroop and Farber Bible Odyssey pages: page dates are site bulk-import timestamps; year null. (8) Numbering: Brown and the NABRE place the Anglican tradition on opposite sides; the text says so and the short leaves Anglicans out. (9) Hayes l10 contains a slip ("vain oath as opposed to a false oath" for Deut 5) not cited; her "She" in name-in-vain/4 is Israel. (10) Chabad.org's live site refuses scripted requests; read in an Internet Archive snapshot. (11) Sweeney's extent "Exodus 21:1-24:18" is idiosyncratic; cited only for his date and his law-code view.
# Second agent pass 2026-11-27 (#93 delegation, independent): all 47 cited sources (47 URLs) re-fetched into the second pass's own scratch folder, not the first pass's files. 42 by curl with a browser User-Agent (TheTorah.com text from the page's embedded article data, decoded; PDFs through pdftotext); NABRE Exodus 21 and 34, both OUP abstracts (Edenburg 2019, Van Seters 2003) and Chabad.org returned 403 to curl and were read live in Claude in Chrome as rendered page text (the OUP book page showed a Cloudflare check that cleared on its own; nothing was worked around); no Internet Archive copy was used. Of the 150 first-pass quotes, 135 matched verbatim by script (whitespace, HTML entities, curly quotes, dashes, soft hyphens, inline tags, Hebrew points and [n] footnote markers normalised) and 14 by eye in the browser text; 1 miss: tradition/9 (Chabad), whose live wording differs from the first pass's snapshot, re-transcribed from the live page. Footnote locators checked against the [n] markers (Sherman 3, Horowitz 9 and 13, Milstein 7, Kazen-Lipka 21, Jacobs 23, Collins 23, Levinson 2021 3); Wright 2009 page locators against printed folios; Hayes chapter locators against the transcript chapter headings. All 17 Trigger Claims re-matched by script at timestamp and speaker in the final transcripts as contiguous spans inside the turn and read about two minutes either side. 149 citations after the cut below.
# Second pass changes. Cut to uncited: oldest/6 (Hayes l11 “equally early”: compares P with D, and her next sentence has P revising the Covenant Code, so it is no counterweight in oldest); oldest/7–8 renumbered /6–/7; its text sentence dropped. Shorts: ten-words (“commonly been read” had no quote for 34:28 itself; “some think the phrase was added later” Sherman alone; now “It may refer to the Decalogue of Exodus 20, but many scholars argue …”); composition (“There is no agreed date … or how old it is”, stated by no source, to “Over a long period, scholars say … but they do not agree on what it said”); ritual-decalogue (“Many have held” to “Many hold”; “many scholars now read … late compilation”, Sherman's report alone, to “others question that dating, and some now read …”: Greenberg and Sherman); date (“range from the early monarchy” contradicted EJ's “from the period of Moses”; now “from the time of Moses to after the exile”); parallels (“Among the best known” unsourced, to “They include”); talion (“It is debated” NABRE alone, now “Whether it was ever applied literally is debatable, the NABRE notes say”; “principle of proportionate penalty” Collins alone, out of the short); courts (“Some think the Covenant Code did serve as law” Sweeney alone, out of the short; the NABRE “judicial precedents” line glosses a word, not use). Text: composition Edenburg clause made its own sentence, “Edenburg argues that the Decalogue was a later addition to the narratives …”, out from under “On the age of the Decalogue” (she dates its insertion, not its traditions); courts NABRE “ordinances” gloss given its own sentence, off Sweeney's contrast side; oldest Van Seters sentence attributed to his book's abstract (third-person publisher copy) and narrowed to “laws that resemble Deuteronomy and the Holiness Code are later than both”. Quote: tradition/9 re-transcribed from the live Chabad page. Locators: name/2 (item “1. These should be called the Ten Commandments.”), name/6 (section “Statements/Words (Logoi)”), name/7 (section “Coining the Term ‘Decalogue’”), ten-words/2, /3, /5, /6 and /7, differences/4, composition/2, ritual-decalogue/4 and /5, addressed/5, parallels/2, miscarriage/3–6 and talion/2–4 (each now the nearest section heading before the quote, found by script), parallels/5 (paragraph beginning “3. An entire cluster of laws”), numbering/6 (item 3), parallels/3 (p. 8), slaves/2 (Hayes l11 ch. 3 [00:22:16]). Triggers file and registry not edited.
# Second pass flags: (1) Brown's Bible Odyssey “Did You Know?” box (versions/2, numbering/2) sits under the byline and may be editorial; the Mary Magdalene pass declined such a box (Swenson), but trunk already cites this Brown box (the-emergence-of-monotheism-and-the-divine-council), so kept; numbering/2 is the only quote for the Jewish first word at 20:2 and Brown's Anglican placement (text only). (2) Registry access lines for nabre-exodus-21-notes, nabre-exodus-34-notes and chabad-ten-commandments still say “read in an Internet Archive snapshot”; this pass read them live in Chrome; the Chabad live text differs from the snapshot. (3) Triggers: 66@00:34:04 (“almost certainly … an oath”) is stronger than the name-in-vain short; 93@00:20:23 is unhedged against the courts short (same direction); 31@00:06:51's turn continues into an unhedged “basically an adaptation” of Hammurabi, outside the span; 23@00:48:07, 93@00:04:24 and 93@00:27:05 do not name their subject in the span. None contradicts a statement; all kept. (4) ritual-decalogue: inside the 30-year window each side of “Scholars disagree” rests on one author: Brettler 2015 (“many scholars believe”) for the old dating, Sherman 2024 (“many contemporary scholars now reject”) for the late compilation; Greenberg's questioning is 1st-ed. EJ text. Gesundheit and Carr are leads. The lead may prefer to drop “others question … some now read …” from the short and keep it in the text only. (5) First-pass flags (1)–(11) re-checked: TheTorah.com articles' bodies are in the embedded article data, not an Archive copy, for all 21; Paul/Sperling byline “(2nd ed.)”; Greenberg “© 2008 The Gale Group”; Samet's PDF is lecture text and gives the Book of the Covenant as Exodus 20:22–24:3 (not cited); Sweeney's extent stands. (6) numbering and tradition ask near-identical questions (“Do all traditions number …” / “How do religious traditions number …”); ids unchanged, flagged for the lead. Publish rule recomputed: 20 statements; core oldest on Halberstam, Samet, Edenburg 2019 and Paul/Sperling (4 independent authors; Van Seters not counted); none Host-authored. Ids, slug, draft and review unchanged.
