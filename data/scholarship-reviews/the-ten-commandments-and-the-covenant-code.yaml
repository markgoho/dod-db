      note: "First pass 2026-11-27: 20 statements, 150 citations. Core oldest cites Halberstam 2017 (Scholarly), Samet 2017 (Reference), Edenburg 2019 (Scholarly, abstract), Paul and Sperling (EJ, Reference), Hayes l11 (Reference, nuance), Van Seters 2003 (Scholarly, abstract, dissent): 6 author strings, 4 counted by hand for the claim (Hayes and Van Seters not counted), none Host-authored. Second pass 2026-11-27: recomputed after the cuts: 20 statements, 149 citations (oldest/6, Hayes l11 “equally early”, cut to uncited). Core oldest cites Halberstam 2017 (Scholarly), Samet 2017 (Reference), Edenburg 2019 (Scholarly, abstract), Paul and Sperling (EJ, Reference; sentence possibly 1st-ed. text) and Van Seters 2003 (Scholarly, abstract, dissent): 4 independent authors counted for the claim (Van Seters not counted), at least one Scholarly and inside the 30-year window, none Host-authored. Holds. #249 first pass 2026-11-28: 20 statements, 182 citations (149 + 33). Core oldest now also cites Westbrook 2008 (Scholarly, “most scholars still agree that it predated Deuteronomy”), Wright 2009 p. 323 (Scholarly; “most scholars believe that most of CC’s apodictic laws predate Deuteronomy”), Bhayro 2004 (Scholarly, the “standard hypothesis”) and Edenburg p. 168 (her own later cultic frame, a qualification). Edenburg’s abstract reports the field, her body qualifies it. Independent authors for the claim: Halberstam, Samet, Edenburg (abstract), Paul and Sperling, Westbrook, Bhayro, Wright (7); none Host-authored. Holds. #249 second pass 2026-11-28 (independent agent): core oldest unchanged (Halberstam, Samet, Edenburg 2019, Paul and Sperling; Westbrook, Wright 2009 and Bhayro add in-window reports); 20 statements; 177 citations after five cuts (182 → 177); three registry entries removed (baker-2005-themelios-ten-commandments, baker-2005-tynbul-finger-of-god, davies-2019-litigation), now cited nowhere; none Host-authored. Met.",
