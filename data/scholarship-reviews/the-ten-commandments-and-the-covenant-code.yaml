leads:
  - "Erhard Blum, “The Decalogue and the Composition History of the Pentateuch”, in The Pentateuch: International Perspectives (FAT 78, 2011): not read (#249: no Google Books preview; the publisher sample stops at p. XVI; only pirate copies). The volume editors' introduction (pp. XV–XVI, read) summarizes it as an original seventh-century “heptology” in Exodus with a later exilic version in Deut 5, which does not match Edenburg's report of a five-prohibition core; neither is used."
  - "Shimon Gesundheit, Three Times a Year (FAT 82, 2012), 16–43: not read beyond odd preview pages (#249); pp. 3 and 13 read; p. 3 cited (ritual-decalogue/6), p. 13 moved to uncited by the #249 second pass. David Carr, The Formation of the Hebrew Bible (2011), 264: closed (#249: Google Books p. 264 not viewable; the only full copy is an individual's Internet Archive upload, not a publisher, lending or author copy, not used)."
  - "Bruce Wells, “The Covenant Code and Near Eastern Legal Traditions: A Response to David P. Wright”, Maarav 13 (2006): closed (#249: University of Chicago Press, no open copy by Unpaywall, Semantic Scholar, Internet Archive or the author's pages). Westbrook 2008, a critic in his own words, read and cited in its place (hammurabi/12)."
  - "Westbrook and Wells, Everyday Law in Biblical Israel (2009): closed (#249: Google Books pages unavailable; Internet Archive lending only). Westbrook 2008 read instead."
  - "David P. Wright, reply to Wells, Maarav 13.2 (2006): closed (#249: academia.edu only, login; Brandeis repository has no file)."
  - "Wright's review of Van Seters, JAOS 124.1 (2004): closed (#249: JSTOR login; no repository copy; Wayback has none); only the vLex preview shows the “most scholars think that CC is earlier than Deuteronomy and HC” sentence. Westbrook 2008, Wright 2009 p. 323 and Bhayro 2004 carry the point instead (oldest)."
  - "Levinson 1997, pp. 6–7 (Google Books snippet only; page not viewable in a browser on 2026-11-28, #249; re-tried #261 2026-11-28: pp. 6 and 7 both show Google Books' “unavailable for viewing or reached your viewing limit” page; no other publisher, open or author copy found by search; Internet Archive lending needs a login): Deuteronomy's dependence on the Covenant Code “consistent with the broad scholarly consensus”. Still a Lead; not cited."
  - "Levinson's numbering chart, Jewish Study Bible 2nd ed. (2014), p. 357: closed (#249: Google Books preview does not reach it; search inside returns nothing; Internet Archive lending only)."
uncited:
  - "David L. Baker, “The Finger of God and the Forming of a Nation”, Tyndale Bulletin 56.1 (2005), p. 13: “Deuteronomy adds several clauses to the older version in Exodus, and there are a few small differences in expression.” (was differences/9). Read; cut by the #249 second pass: the sentence asserts Exodus's priority, which this page leaves unstated for want of a second author (see the Gnuse entry), and the article's summary sets out to engage the claim that God spoke and wrote the Decalogue; Tyndale Bulletin asks contributions to be compatible with Tyndale House's doctrinal basis. Registry entry removed. (White 1999 in Tyndale Bulletin stays Scholarly on satan-demons-and-angels; venue flagged for the lead.)"
  - "David L. Baker, “Ten Commandments, Two Tablets: The Shape of the Decalogue”, Themelios 30.3 (2005), numbering table (“Josephus, Eastern Orthodox, Reformed, Anglican”) and the paragraph before it (was numbering/7–8). Read in the Internet Archive copy; cut by the #249 second pass: the only peer-review evidence is the present-day TGC blurb (“peer-reviewed international evangelical theological journal that expounds on the historic Christian faith”), and the same page says it “was formerly a print journal operated by RTSF/UCCF in the UK” before TGC took it on in 2008; whether the 2005 issue was peer-reviewed is not shown, so class cannot be settled, so cut when in doubt. The Anglican numbering is still shown in the Church of England's own catechism (tradition/11). Registry entry removed."
  - "Shimon Gesundheit, Three Times a Year (2012), p. 13: “In the following study I shall attempt to refute this reigning consensus” (was ritual-decalogue/7). Read; cut by the #249 second pass: “this reigning consensus” (p. 12) is that the earliest kernel of Israel's festival calendar lies in Exodus 34:18–26, not p. 3's “earliest legal collection” the text tied it to; and Sherman 2024 reports many now reject the early dating, so #80 drops “consensus” where sources disagree on the field."
  - "Jeffrey Stackert, Rewriting the Torah (2007), on the Holiness Code revising the Covenant Code: read at p. 218 (#249) (“every example of revision … most plausibly explained as an attempt to subvert and replace its source(s)”). Not cited: the page has no Holiness Code statement beyond slaves."
  - "W. Creighton Marlowe, “Ten Commandments or Prohibitions? Numbering the Ten Words”, Journal of Inductive Biblical Studies 8.2 (2022) (#249): read in full (PDF refuses scripts; opened in Chrome, text extracted in the page; also an Internet Archive copy). Abstract: “No consensus has been reached, although one list has become popular.” Not cited: it never mentions the Anglican tradition (the question the lead asked), and the journal (Asbury Theological Seminary, promoting inductive Bible study) states no peer-review policy."
  - "Michael LeFebvre, the lead's sentence “Scholars of biblical law widely hold that ancient Israel did not draft law-texts for legislative purposes” (#249): read at New Books Network; it is the podcast's blurb, not the book's text (not found in the book by search). The book's own p. 31 is cited instead (courts/8–9)."
  - "Robert Gnuse, Qeios 2023, and the priority of Exodus 20 or Deuteronomy 5 (#249): no statement added. Read: Baker, Themelios 30.3 (2005) (Hossfeld's Deuteronomy-first thesis “has been widely refuted”; Exodus “earlier”), Baker, Tyndale Bulletin 56.1 (2005) (cited in differences by the #249 first pass; cut by its second pass, see that entry), the FAT 78 editors' summary of Blum, and Wildenboer, Verbum et Ecclesia 40 (2019), reporting Otto (“the Decalogue was transferred from Deuteronomy 5 to Exodus 20”, but the next sentence contains an evident error, so Otto's position can't be stated without guessing). Only Baker gives a view in his own words; the others are reports. A two-sided short would rest on one author's view plus reports, and Baker's “widely refuted” cuts against an even “scholars disagree”; a new statement id is a permanent URL, so none is minted."
  - "Eckart Otto, review of Van Seters, RBL 07/2004 (#249): read in the Internet Archive copy of bookreviews.org/pdf/3929_3801.pdf; Van Seters claims a revolution “dissolving a basic consensus of more than one hundred years of scholarship, that the CC was as a preexilic law book the paradigm for D and HC”. Not cited: Bhayro (JJS) makes the same point in fewer words; kept for a future re-review."
  - "Konrad Schmid, “Divine Legislation in the Pentateuch”, FAT 107 (2016), author's e-offprint (#249): read; the Covenant Code is “presumably the earliest body of texts in the Pentateuch that includes divine laws”, its dating “of course, contested”, and Deuteronomy reworks it “as William Morrow, Bernard Levinson, Eckart Otto and others have shown”. Not cited: the page already carries each point from 2+ authors."
  - "Wright, “How Exodus Revises the Laws of Hammurabi” (TheTorah.com, 2019), n. 4, names Westbrook among the indirect-relation view; Westbrook read directly instead. No new TheTorah.com citations were added in #249: #86 (2026-11-23) ruled the site not an External Source class, though this page and others cite it as Reference; issue #259 filed."
  - "Robert Gnuse, “Deuteronomic Redaction and the Evolution of the Decalogues in Exodus 20 and Deuteronomy 5”, Qeios 5 (2023): read; “There is also a debate concerning the priority of Exodus 20 or Deuteronomy 5”. Not cited: Qeios uses open post-publication review, not shown to be peer-reviewed, and no second source states the priority debate."
  - "William S. Morrow, “Some Characteristics of Biblical Law”, The Bible and Interpretation (2017): read; three viewpoints on law collections and practice. Not cited: a web magazine, near the #80 blogs exclusion."
  - "New Catholic Encyclopedia, “Commandments, Ten” (Polan): read; “critical scholars generally … abandon the position” that the Decalogue came from the later prophets. Not cited: bibliography stops at 1962, text outside the 30-year window."
  - "Walter Harrelson, “Ten Commandments”, Encyclopedia of Religion (1987): read; “oldest listing of the ‘Ten Words’ (Ex. 34:28)”. Outside the 30-year window."
  - "NET Bible note on Exodus 20:7: read; relies on Driver (1911); evangelical publisher; not cited."
  - "Ronald H. Isaacs, My Jewish Learning, “The Ten Commandments”: read; misstates the Catholic ninth/tenth order (matches Luther only); not cited."
  - "Encyclopaedia Judaica, “Deuteronomy” (Weinfeld/Sperling): read; “complementing … or supplementing” the Book of the Covenant; probably 1st-ed. text; not cited (Hayes reports Weinfeld differently)."
  - "Christine Hayes l10, “God's name in Deuteronomy 5 is not to be used in a vain oath as opposed to a false oath”: read; not cited, as both verses have the same Hebrew word (the šāwʾ/šeqer difference is in the witness command)."
  - "Pietersen, Journal for Semitics 30/1 (2021): read; “all in agreement that the Covenant Code is the oldest”: overstated against Edenburg and Van Seters, and leans on 1960s sources; not cited."
  - "Ada Taggar-Cohen, “Hittite Laws and Texts” (Bible Odyssey): read; Hittite laws were in use, unlike Mesopotamian collections; not cited (about Hittite law, not the Covenant Code)."
  - "Coogan and Chapman ch. 10 summary: read; Deuteronomy's laws “parallel and modify laws found elsewhere”; generic, not naming the Covenant Code; not cited."
  - "Rollston (TheTorah 2017), Levinson 2021 body, Morrow via Wright: read or seen; not needed beyond the cited Hammurabi sources."
  - "Christine Hayes, RLST 145 lecture 11, ch. 3 [00:22:16]: “The Priestly source seems to represent an equally early set of laws, legal traditions, that just emanated from a very different circle and had different concerns” (was oldest/6). Read; cut by the second pass (2026-11-27): the sentence compares P with D, and her next sentence says P “often updates and revises laws of the Covenant Code”, so it does not set P as early as the Covenant Code in the oldest statement."
