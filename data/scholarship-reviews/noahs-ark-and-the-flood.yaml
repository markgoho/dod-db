rules:
  publish-rule:
    {
      agent: pass,
      owner: "",
      note: "10 statements (minimum 3). Core (sources) backed by five distinct authors: Geoghegan (Bible Odyssey 2021, Reference), Jensen (New Catholic Encyclopedia, Reference), Hayes (Yale RLST 145 l4, Reference), Coogan and Chapman (OUP 2019 summary, Reference) and Young and Sperling (Encyclopaedia Judaica 2nd ed., Reference). None Host-authored. The candidate core's second half (“secondary to the Primeval History”) was dropped: only David Carr says it, in a Transcript (Ep 56 00:45:55, 00:47:26), and no source read states it (lead).",
    }
  consensus-wording:
    {
      agent: pass,
      owner: "",
      note: "Only sources uses “most scholars”, from Geoghegan's own “led most scholars to conclude” (sources/2), with NCE's “scholars have recognized” (sources/3) and three more authors agreeing. Other shorts: parallels (EJ, Hayes, Coogan, Callender), borrowing (reports the split: Coogan/EJ/Hayes vs NCE on directness; “sources read”), differences (Hayes, EJ), geology (Montgomery, Jensen; flag on Jensen, geology/9), local (EJ, NCE; “perhaps”, “sources read”), black-sea (Yanko-Hombach et al., Aksu and Hiscott; “the later reviews read”), ark (dimensions NCE; P attribution NCE and Geoghegan), ararat (EJ, Cline), found (Cline, Jensen, Collins). No short gives one scholar's view (#133).",
    }
  dissent-attributed:
    {
      agent: pass,
      owner: "",
      note: "NCE's “do not suggest direct literary dependence” attributed (borrowing). Geoghegan's concession to harmonisers attributed (sources). Cline's Mount Ararat naming claim attributed (ararat). Ryan et al.'s Black Sea hypothesis reported as proposed, not as a view the page rejects on its own (black-sea). Collins's caveat that the ark could be found elsewhere kept (found).",
