leads:
  - "William B. F. Ryan et al., “Catastrophic flooding of the Black Sea”, Annual Review of Earth and Planetary Sciences 31 (2003): 525–54 — the proponents' defence; a web-search summary (not the source) reports its abstract as saying the flood hypothesis best fits the full set of observations. Publisher page blocked by a bot check 2026-11-24; a full copy found only on a third-party course page of unclear licence; not read."
  - "Irving Finkel's Ark Tablet (British Museum; The Ark Before Noah, 2014): a round ark in an Old Babylonian Atrahasis-type text. No open source read; cut."
  - "David Carr (Ep 56 00:45:55, 00:47:26, 00:50:19): the flood as a later insertion into an older non-flood primeval story, and the “two Noahs”. The candidate's second core half; only in a Transcript, no source read; see Carr, The Formation of Genesis 1–11 (OUP, 2020), not read."
  - "Collins and Fasold, “Bogus ‘Noah's Ark’ from Turkey Exposed as a Common Geologic Structure”, Journal of Geoscience Education 44 (1996): 439–44 — the paper Ep 183 cites. Only the author-hosted copy (csun.edu/~vcgeo005/bogus.html) was read; whether it is the published text is unconfirmed, and 1996 is outside the 30-year window. See uncited."
  - "V. Yanko-Hombach, A. S. Gilbert, N. Panin and P. M. Dolukhanov (eds.), The Black Sea Flood Question (Springer, 2007): named in the EGU abstract; not read."
uncited:
  - "Dan McClellan, Bible Odyssey video (as below): “Most scholars believe that the story in the Bible was probably written down somewhere in the 7 or 800s BCE.” Host-authored and no other source read gives a date, so the page has no statement on when the story was written (cut)."
  - "Jensen, NCE, “Historical and Scientific Issues”, last paragraph: “The ancient authors of the Genesis flood story wove their Israelite traditions around one such devastating flood to create a compelling story about their God and His relationship with humanity.” Ambiguous beside his “no one of these is an account of a particular historical flood”; the local short says only “perhaps by memories of local floods”."
  - "Dan McClellan, “Have scholars found Noah’s ark?”, Bible Odyssey video (https://www.bibleodyssey.org/video-gallery/have-scholars-found-noahs-ark), read 2026-11-24: “And the same was discovered when a group in the 1980s was convinced it was Noah’s Ark and did surveys with ground penetrating radar and drilled core samples, and every test they conducted showed this was naturally occurring geologic stuff”; also “most scholars agree refers to the mountains inside the kingdom of Urtu [sic]”. Host-authored and the same claims as the Ep 183 Trigger Claims, so not cited."
  - "Collins and Fasold 1996, author-hosted copy (csun.edu/~vcgeo005/bogus.html), Conclusion: “Evidence from microscopic studies and photo analyses demonstrates that the supposed Ark near Dogubayazit is a completely natural rock formation. It cannot have been Noah's Ark nor even a man-made model.” Matches the sentence McClellan reads in Ep 183 00:34:04. Not cited (see leads)."
  - "Jean Rudhardt, “Flood, The”, Encyclopedia of Religion (1987), Encyclopedia.com (environment/…/flood-0), Conclusion: “In order to account for this, some authors have supposed that everywhere people preserve the memory of distant prehistoric catastrophes that destroyed the universe or vast regions of the earth. Such an explanation strikes this writer as misguided.” Outside the 30-year window; about worldwide myths, not Genesis; not cited."
  - "Jenna Kemp, “Noah”, Bible Odyssey (2023): literary reading of Noah's character; nothing on sources or parallels; not cited."
  - "Jensen, NCE, J paragraph: “Noah's sacrifice of some of every clean animal and bird explains why in J it was necessary for Noah to bring more than one pair of each clean creature onto the ark.” Same reason as Geoghegan (sources/13); could be added in a later pass."
  - "Hayes l4 ch. 5 [00:35:32]: “either to bring two of each sort of living thing, animals and birds and creeping things, or in another passage God tells Moses to bring on seven pairs of pure animals …” Not cited: slip (Moses for Noah)."
  - "Coogan and Chapman ch. 4 summary, “History of Scholarship”: “almost all biblical scholars recognize that the repetitions, inconsistencies, and contradictions in the Pentateuch are best explained by the existence of distinct sources dating to different historical periods.” About the Pentateuch as a whole, not the flood; not cited on the core."
  - "Callender (Bible Odyssey video), video transcript, cut from borrowing in the second pass 2026-11-24 (delegate decision): “It’s three different birds, it’s a dove, a swallow and then finally, a raven.”; “But then, Noah goes on to send a bird three more times and it’s a dove; and that follows the progression of three sending’s of the bird that we have in the Mesopotamian account.”; “So, it appears that perhaps we have two accounts or two elements of two different accounts woven together in the same narrative”. Callender says Noah's raven doesn't come back and the dove goes out three times; EJ says the raven “returned to the ark” and Noah “twice sent out a dove”. The two-accounts inference rests on that bird sequence, so it was cut rather than moved to sources."
  - "Cline (Bible Odyssey video), video transcript: “Mount Ararat was named that a couple of centuries ago in part for tourism purposes, right?” Cut from ararat in the second pass 2026-11-24: one author, no other source read on when the peak was named, and at odds with Ep 183 00:15:59 (“Medieval period, I think”)."
  - "Hayes l4 ch. 4 [00:24:02]: “This is something that's been pointed out by many writers.” (on the Mesopotamian gods not being in control). Hayes's field report for the Mesopotamian side only; no second read author says Genesis's God stays in control, so the short does not use it."
