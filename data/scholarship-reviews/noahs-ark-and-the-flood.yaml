rules:
  publish-rule:
    {
      agent: pass,
      owner: "",
      note: "10 statements (minimum 3). Core (sources) backed by five distinct authors: Geoghegan (Bible Odyssey 2021, Reference), Jensen (New Catholic Encyclopedia, Reference), Hayes (Yale RLST 145 l4, Reference), Coogan and Chapman (OUP 2019 summary, Reference) and Young and Sperling (Encyclopaedia Judaica 2nd ed., Reference). None Host-authored. The candidate core's second half (“secondary to the Primeval History”) was dropped: only David Carr says it, in a Transcript (Ep 56 00:45:55, 00:47:26), and no source read states it (lead). Second pass 2026-11-24: verified; still 10 statements and five core authors after the second pass's cuts (none touched sources' cites).",
    }
  consensus-wording:
    {
      agent: pass,
      owner: "",
      note: "Only sources uses “most scholars”, from Geoghegan's own “led most scholars to conclude” (sources/2), with NCE's “scholars have recognized” (sources/3) and three more authors agreeing. Other shorts: parallels (EJ, Hayes, Coogan, Callender), borrowing (reports the split: Coogan/EJ/Hayes vs NCE on directness; “sources read”), differences (Hayes, EJ), geology (Montgomery, Jensen; flag on Jensen, geology/9), local (EJ, NCE; “perhaps”), black-sea (Yanko-Hombach et al., Aksu and Hiscott; “the later reviews read”), ark (dimensions NCE; P attribution NCE and Geoghegan), ararat (EJ, Cline), found (Cline, Jensen, Collins). No short gives one scholar's view (#133). Second pass 2026-11-24 (#133 test, distinct read authors per clause): sources passes (Geoghegan reports the field, four more authors hold it; “often called” for NCE's “often referred to”). parallels: “older” EJ (date) and Coogan and Chapman; “same outline” now tied to Gilgamesh only (EJ, Callender). borrowing passes (see borrowing/4). differences: “in control throughout” cut (Hayes alone); punishment and righteousness Hayes and EJ; “one God” exempt. geology: Montgomery's own-voice conclusion added (geology/9) beside Jensen (geology/10); the 19th-century dismissal is Montgomery's history (fact about the field). local passes (EJ, Jensen). black-sea narrowed to the gradual reconnection, which both abstracts state; “two later overviews” names what was read rather than claiming a field consensus (doubt kept: both are by critics of the hypothesis; the proponents' 2003 defence is an unread lead). ark: P attribution cut, dimensions exempt. ararat exempt (what Genesis says) plus EJ. found passes (Cline, Jensen, Collins; Collins not sole).",
    }
