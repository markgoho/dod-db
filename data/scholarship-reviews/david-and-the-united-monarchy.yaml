leads:
  - "Jerusalem Journal of Archaeology 1 (2021), open-access issue on tenth-century state formation (Mazar, Garfinkel, Dever; editors' overview): jjar.huji.ac.il refused the research agent's scripted fetch; not read. Top lead for a defender's view after 2007."
  - "Finkelstein, “A Great United Monarchy?” and Mazar, “Archaeology and the Biblical Narrative: The Case of the United Monarchy”, in BZAW 405 (2010): copies only on a course site and academia.edu; Mazar's “total deconstruction … unjustified” seen only as a search abstract."
  - "Finkelstein, Na'aman and Römer, “Restoring Line 31 in the Mesha Stele: The House of David or Biblical Balak?”, Tel Aviv 46 (2019): read only as reported by Langlois; repository copy behind a bot check."
  - "Biran and Naveh, IEJ 43 (1993) and 45 (1995), editio princeps of the Tel Dan inscription: not fetched."
  - "Lemche and Thompson, JSOT 64 (1994); Garbini 1994; Cryer 1994/1996; Gmirkin 2002 (forgery); Athas 2003 (late date, fragment placement): known only through Hagelia."
  - "Robert Rezetko, The Bible and Interpretation (2023), “Most Bible scholars … hold” on Elhanan and Goliath: seen only as a search snippet; the page now returns not found."
  - "Kaspars Ozolins on 2 Samuel 21:19 (scribal error; Elhanan killed Goliath's brother): abstract only."
  - "P. Kyle McCarter, “The Apology of David”, JBL 99 (1980); Andrew Knapp, Royal Apologetic in the Ancient Near East (2015); Bezzel and Kratz (eds.), David in the Desert (BZAW 514, 2021): seen only as citations or blurbs."
  - "Finkelstein's and Sergi's own essays in AIL 40 (2020), and Finkelstein, “The Last Labayu” (2006): only the volume introduction is free."
  - "Bill T. Arnold, JETS 32 (1989), on the two accounts of Saul's death: paywalled; a confessional journal."
uncited:
  - "Omer Sergi, “Goliath”, Encyclopedia of the Bible and Its Reception 10 (2015): read; a subscriber's PDF posted as edX course material, not by the author or publisher. Not cited."
  - "Steven L. McKenzie, “Who Was King David?”, Word & World 23 (2003): read (“most scholars think that it incorporates older sources”; “Scholars have long noted the apologetic flavor”; the Goliath story “is legend”; the section 1 Sam 24–2 Sam 1 denying David's part in Saul's death). Not cited: a seminary theological journal, peer review not shown; the samuel short rests on Finkelstein, Coogan and Chapman, NABRE, Hayes and Garsiel."
  - "Encyclopaedia Judaica, “Elhanan”: read (Mazar's Elhanan = David; “some scholars” on Chronicles emending “Goliath”); the Hebrew forms did not survive text extraction. Not cited; the Elhanan = David view is cited from EJ “Goliath”."
  - "Encyclopaedia Judaica, “Samuel, Book of” (Gottwald), “It is now generally agreed that the finished form of the book comes from the hand of a Deuteronomic compiler in the sixth century”: read; 1971 text, outside the 30-year window."
  - "Encyclopaedia Judaica, “Saul” (Oded): read; biblical retelling with traditional dates."
  - "HarperCollins Bible Dictionary, “David” (“The most powerful king of Israel … an empire”), “Solomon”, “Israel”, “Jerusalem”, “Omri”, “Dan”, “Mesha”, “Elhanan”: read; summaries of the biblical account, nothing on historicity. Not cited."
  - "Coogan and Chapman ch. 15 summary (a historical Solomon c. 968–928; sites dated to the tenth century) and ch. 13 (rise of the monarchy at the end of the eleventh century): read; the older chronology, not stated on the page."
  - "Nakhai, “Archaeological excavations have uncovered elaborate building projects … Jerusalem, Gezer, Megiddo, and Hazor”, and “understood by most scholars to have encompassed much of the 10th century”: read; dating of the era and the buildings, not stated (the page reports the dating disagreement through Hayes, Greenspoon, Finkelstein and Sergi)."
  - "Sergi 2023 p. 21, the Iron I–IIA chronology “seems to have arrived at a general consensus”; p. 12 “most scholars suggest” a post-720 date for northern traditions reaching Judah; p. 302 against the “Israelization of Judah”; p. 212 the Davidic king list in Kings as authentic: read; not stated (one author, or off the page's questions)."
  - "Finkelstein 2013 p. 54 and Na'aman 2017 on Khirbet Qeiyafa (Judahite fortress vs Canaanite enclave); Garfinkel et al. 2012 abstract (“much debated”); Faust and Sapir p. 812: read; Khirbet Qeiyafa is not a statement."
  - "Hagelia p. 6 (the editors' publication commended by the majority), pp. 70–72 Galil's five readings and the word-divider question, p. 118 on deity and toponym readings: read; covered by the cited Hagelia sentences."
  - "Davies, Bible Odyssey video “David and Solomon”; Hayes lecture 22; NABRE notes on 2 Kings 8–9, 2 Samuel 21 and 1 Samuel 31–2 Samuel 1: read; nothing on the page's questions."
  - "Langlois 2019 pp. 46–47 (a mention of the house of David “does not solve issues related to the historicity”), p. 45 n. 67 (Lemche and Thompson on the Mesha line): read; not cited, the house-of-david text uses his abstract."
  - "Bible Odyssey articles by Gilmour (“Samuel”) and others on David's downfall, youth and royal succession: read; literary readings without state-of-field claims."
  - "Goldingay p. 5, “Different groups of modern scholars are more inclined to focus on one or other of these periods”: read; the sentence breaks at the excerpt's page edge, so not quoted."
  - "Hayes lecture 14 on Omri, “the first king from either kingdom to be mentioned in sources outside the Bible”: read; not needed."
