# Review record for /scholarship/david-and-the-united-monarchy/ (#93 shape). Not rendered.
# agent: results of the agent first pass (#150, 2026-11-25). That pass does not count toward publish.
# owner: empty (""). The owner delegated the publish review (#93, 2026-11-23); the `delegation` block records the independent second agent pass once it has run.
# Issue #150 instructions: add Goliath/Elhanan and the Tel Dan Stele; #96 publish rule; shorts report the state of scholarship (#133); confessional study Bibles are Tradition and don't count toward the two (no confessional study Bible is cited; NABRE is Reference per CONTEXT.md).
# Sourcing test (#150, 2026-11-25): gate 1, 17 Trigger Claims in Episodes 6, 40, 52, 64, 67, 139, 154, 169 and 181 (14 Dan McClellan, 3 Aaron Higashi), each matched by script at timestamp and speaker against the final Transcript and read about two minutes either side. Gate 2, the core: the candidate “Scholars are divided on whether a historical David ruled a united monarchy” joined two questions the sources answer differently, so it was split. The core is now united-monarchy (“Scholars debate it. Many doubt …; those who defend an early state describe one far smaller …”): Richards and Nakhai (Bible Odyssey, Reference) say it is debated; Faust and Sapir (“questioned by many”) and Mazar (“a good number of scholars have grown increasingly skeptical”) carry “many”; Mazar, Garfinkel et al. and Sergi (on Garfinkel) carry the smaller-state clause. Gate 3: at least 6 independent authors behind the core, 2 Reference. Gate 4: 10 statements.
# Conflicting state-of-field sentences, handled by #80 (two sources disagree → contested, no “consensus”/“most” in the short): David's existence (Hayes 2006 “most scholars … the consensus”, Hagelia 2009 “most scholars contributing to this debate” against Richards and McKenzie on Bible Odyssey, “scholars debate”); short says “Scholars debate it”, Hayes and Hagelia attributed in the text. Dating of the Solomonic buildings (Hayes 2006 “differ radically”, Greenspoon some/others, against Sergi 2023 “little doubt today”): reported side by side in israel-and-judah text, kept out of its short.
# Dropped: the two accounts of Saul's death (1 Sam 31 vs 2 Sam 1; Ep 161's “most scholars … the Amalekite was lying”): only McKenzie (Word & World) and Hayes, neither on which account is original; no statement, and the Ep 161 claims are not attached. The fragment B year (Rollston 1995, Hagelia 1994): conflicting, not stated. Khirbet Qeiyafa as a statement: excavators vs Na'aman, one author each way read in full; Garfinkel et al. used only for their kingdom-in-Judah view. Iron Age chronology “general consensus” (Sergi p. 21): one author, and Coogan's and Nakhai's summaries keep the older tenth-century dating; not stated.
# First pass: three research agents fetched every source on 2026-11-25 into separate scratch folders and copied quotes from the fetched text; every page quote was then script-matched by the lead agent's own matcher (whitespace, HTML entities, curly quotes and dashes, line-break hyphenation, fi/fl ligature control characters normalised; SBL watermark letters and running heads removed for the AIL 40 front matter) against those saved texts: 130/130, 0 misses. The second pass must re-fetch.
# Triggers vs statements (CONTEXT.md conflict rule): no Trigger Claim contradicts a statement, so none is logged as a conflict. Stronger than the page: 52@00:16:16 (“scholarly consensus” on Elhanan; the page has “one explanation scholars give”); 139@00:48:17 (“Scholars are pretty sure” there was never a united kingdom; the page reports Sergi's mainstream shift and the defenders); 181@00:42:09 (“most scholars would say”; Hayes and Hagelia say most, the page reports the debate). Each is a view at least one cited source reports, and a Trigger Claim gates the subject, not a statement.
# Flags for the second pass: (1) Hagelia and Sergi 2023 are full copyrighted books in PDFs on sbl-site.org with no login and no stated open-access licence; judge whether a publisher/distributor-posted copy meets #80. Hagelia alone carries the Tel Dan date and Hazael “most scholars” sentences, each beside Rollston. (2) Most Reference citations are Bible Odyssey pages (eleven authors): independent authors, one platform. (3) Hayes's lectures (2006) are the oldest source used for field-state wording; attributed only. (4) The house-of-david short's “Most scholars read it that way” rests on Rollston (“the majority of scholars”) and Hagelia (“almost generally accepted”, “most scholars”); “how to interpret the phrase is still debated” on Hagelia (“no general consensus on the interpretation”) and Davies. (5) The tel-dan short's “most scholars attribute it to Hazael” rests on Hagelia's sentence plus Rollston's “most convincing conclusion”. (6) Krause–Sergi–Weingart and Sergi 2023 share an author. (7) ej-goliath may keep first-edition sentences. (8) The goliath short's “One explanation scholars give” rests on HarperCollins (“Some interpreters”) and EJ (“more likely”); “another identifies Elhanan with David” on EJ (“Some scholars hold”). (9) samuel short's “describe the story of David's rise as written to justify his taking the throne” rests on Coogan and Chapman (“propagandistic piece … to justify David's ascent”), Hayes (“may be an apology”) and Garsiel (“some scholars have discerned an apologetic tendency”).
