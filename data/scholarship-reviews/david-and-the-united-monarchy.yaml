rules:
  publish-rule:
    agent: pass
    owner: ""
    note: "First pass 2026-11-25: 10 statements. Core united-monarchy cites Richards (Reference), Nakhai (Reference), Faust & Sapir, Mazar, Krause–Sergi–Weingart, Finkelstein, Sergi, Garfinkel et al. (Scholarly): 8 independent author strings, none Host-authored. Rule holds. Second pass 2026-11-25: recomputed. 10 statements, ids unchanged. Core united-monarchy cites 8 author strings: Richards and Nakhai (Reference, Bible Odyssey), Faust & Sapir 2018, Krause–Sergi–Weingart 2020, Finkelstein 2013, Garfinkel et al. 2012 (Scholarly, all at open URLs), Mazar 2007 and Sergi 2023 (Scholarly, SBL ICI copies, flag 1). Krause–Sergi–Weingart and Sergi share an author, so 7 independent authors; without the two ICI copies, 6 (2 Reference, 4 Scholarly). None Host-authored. Rule holds either way. If the lead cuts the ICI copies, the core short’s more-modest-state clause is left on Garfinkel et al. alone and must be narrowed or cut. #183 ruling 2026-11-26 (lead agent, owner's delegation): ICI copies count as External Sources; the second pass's verified version of the page is restored. Recomputed: 10 statements; core united-monarchy as the second pass recorded it, 7 independent authors (Sergi counted once), none Host-authored. Rule holds."
  consensus-wording:
    agent: pass
    owner: ""
    note: "First pass 2026-11-25: no short says “consensus”. “Most scholars” appears in two shorts: house-of-david (Rollston “the majority of scholars”; Hagelia “almost generally accepted”, “most scholars”) and tel-dan (Hagelia “Most scholars attribute”, with Rollston's own conclusion). “Many” in the united-monarchy short: Faust & Sapir “questioned by many”, Mazar “a good number of scholars”. Every other field word in the texts is the source's own, attributed: Hayes's “most scholars”/“consensus”, Hagelia's “relatively high consensus” and “majority”, Finkelstein's “widely accepted”, Na'aman's “most scholars”, Krause et al.'s “one of the most accepted hypotheses”, Sergi's “little doubt today”. Second pass 2026-11-25: no short says “consensus”. Field words now in shorts: united-monarchy “Many doubt” (Faust & Sapir “questioned by many”; Mazar “a good number of scholars”); tel-dan “most scholars date … and attribute” (Hagelia p. 118 for both, an ICI copy; Rollston gives only his own conclusion); house-of-david “Most scholars read it that way” (Rollston “majority”, Hagelia “almost generally accepted”); samuel “some describe” (Garsiel “some scholars”). Disagreements about the state of the field are shown as contested without the word: historical-david (now “Some … others”) (Hayes 2006 “consensus”, Hagelia “most” vs Richards and McKenzie “debate”), the dating of the Solomonic buildings (Hayes 2006 vs Sergi 2023, side by side with years). Every other field word in the texts is the source’s own and attributed. #183 ruling 2026-11-26 (lead agent, owner's delegation): ICI copies count as External Sources; the second pass's verified version of the page is restored."
  dissent-attributed:
