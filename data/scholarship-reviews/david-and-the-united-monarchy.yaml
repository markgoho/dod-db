# Issue #150 instructions: add Goliath/Elhanan and the Tel Dan Stele; #96 publish rule; shorts report the state of scholarship (#133); confessional study Bibles are Tradition and don't count toward the two (no confessional study Bible is cited; NABRE is Reference per CONTEXT.md).
# Sourcing test (#150, 2026-11-25): gate 1, 17 Trigger Claims in Episodes 6, 40, 52, 64, 67, 139, 154, 169 and 181 (14 Dan McClellan, 3 Aaron Higashi), each matched by script at timestamp and speaker against the final Transcript and read about two minutes either side. Gate 2, the core: the candidate “Scholars are divided on whether a historical David ruled a united monarchy” joined two questions the sources answer differently, so it was split. The core is now united-monarchy (“Scholars debate it. Many doubt …; those who defend an early state describe one far smaller …”): Richards and Nakhai (Bible Odyssey, Reference) say it is debated; Faust and Sapir (“questioned by many”) and Mazar (“a good number of scholars have grown increasingly skeptical”) carry “many”; Mazar, Garfinkel et al. and Sergi (on Garfinkel) carry the smaller-state clause. Gate 3: at least 6 independent authors behind the core, 2 Reference. Gate 4: 10 statements.
# Conflicting state-of-field sentences, handled by #80 (two sources disagree → contested, no “consensus”/“most” in the short): David's existence (Hayes 2006 “most scholars … the consensus”, Hagelia 2009 “most scholars contributing to this debate” against Richards and McKenzie on Bible Odyssey, “scholars debate”); short says “Scholars debate it”, Hayes and Hagelia attributed in the text. Dating of the Solomonic buildings (Hayes 2006 “differ radically”, Greenspoon some/others, against Sergi 2023 “little doubt today”): reported side by side in israel-and-judah text, kept out of its short.
# Dropped: the two accounts of Saul's death (1 Sam 31 vs 2 Sam 1; Ep 161's “most scholars … the Amalekite was lying”): only McKenzie (Word & World) and Hayes, neither on which account is original; no statement, and the Ep 161 claims are not attached. The fragment B year (Rollston 1995, Hagelia 1994): conflicting, not stated. Khirbet Qeiyafa as a statement: excavators vs Na'aman, one author each way read in full; Garfinkel et al. used only for their kingdom-in-Judah view. Iron Age chronology “general consensus” (Sergi p. 21): one author, and Coogan's and Nakhai's summaries keep the older tenth-century dating; not stated.
# First pass: three research agents fetched every source on 2026-11-25 into separate scratch folders and copied quotes from the fetched text; every page quote was then script-matched by the lead agent's own matcher (whitespace, HTML entities, curly quotes and dashes, line-break hyphenation, fi/fl ligature control characters normalised; SBL watermark letters and running heads removed for the AIL 40 front matter) against those saved texts: 130/130, 0 misses. The second pass must re-fetch.
# Triggers vs statements (CONTEXT.md conflict rule): no Trigger Claim contradicts a statement, so none is logged as a conflict. Stronger than the page: 52@00:16:16 (“scholarly consensus” on Elhanan; the page has “one explanation scholars give”); 139@00:48:17 (“Scholars are pretty sure” there was never a united kingdom; the page reports Sergi's mainstream shift and the defenders); 181@00:42:09 (“most scholars would say”; Hayes and Hagelia say most, the page reports the debate). Each is a view at least one cited source reports, and a Trigger Claim gates the subject, not a statement.
# Flags for the second pass: (1) Hagelia and Sergi 2023 are full copyrighted books in PDFs on sbl-site.org with no login and no stated open-access licence; judge whether a publisher/distributor-posted copy meets #80. Hagelia alone carries the Tel Dan date and Hazael “most scholars” sentences, each beside Rollston. (2) Most Reference citations are Bible Odyssey pages (eleven authors): independent authors, one platform. (3) Hayes's lectures (2006) are the oldest source used for field-state wording; attributed only. (4) The house-of-david short's “Most scholars read it that way” rests on Rollston (“the majority of scholars”) and Hagelia (“almost generally accepted”, “most scholars”); “how to interpret the phrase is still debated” on Hagelia (“no general consensus on the interpretation”) and Davies. (5) The tel-dan short's “most scholars attribute it to Hazael” rests on Hagelia's sentence plus Rollston's “most convincing conclusion”. (6) Krause–Sergi–Weingart and Sergi 2023 share an author. (7) ej-goliath may keep first-edition sentences. (8) The goliath short's “One explanation scholars give” rests on HarperCollins (“Some interpreters”) and EJ (“more likely”); “another identifies Elhanan with David” on EJ (“Some scholars hold”). (9) samuel short's “describe the story of David's rise as written to justify his taking the throne” rests on Coogan and Chapman (“propagandistic piece … to justify David's ascent”), Hayes (“may be an apology”) and Garsiel (“some scholars have discerned an apologetic tendency”).
# Second agent pass 2026-11-25 (#93 delegation, independent; did not read the first pass's files): all 36 cited sources re-fetched into the second pass's own scratch folder. curl with a browser User-Agent for 14 Bible Odyssey pages (12 articles and videos, 2 HarperCollins entries), 2 OUP Coogan summaries, 4 Encyclopedia.com pages (EJ Goliath, EJ History, Halpern on two URLs), 2 Hayes lectures on oyc.yale.edu, and PDFs (pdftotext) of Faust & Sapir, Quest (FinkelsteinMazar.pdf), Forgotten Kingdom, Garsiel (via the JHS article page), Goldingay, Hagelia, Krause–Sergi–Weingart, Langlois, Na'aman and Sergi. Garfinkel et al.: the University of Arizona repository refused curl (403); in Chrome it opens a PDF of that title whose text could not be saved, so the article was fetched from Cambridge Core and the registry url moved there. NABRE 1 Chr 20, 1 Sam 16, 1 Sam 17 and the Samuel introduction opened through Claude in Chrome; notes and introduction text saved from the page text (a browser-side script to post the text to a local receiver and one to load pdf.js were not used: the first hung and was stopped, the second was refused by the permission classifier), and all five NABRE quotes also matched in-page by script. Also read: SBL's International Cooperation Initiative pages that list the Hagelia, Sergi and Quest PDFs.
# Quote match: 130/130 before changes, 0 misses; 130/130 after (no citation cut; israel-and-judah/9 trimmed, still verbatim). Normalisation: 125 needed only whitespace and HTML entities (HTML inline tags stripped without inserting a space); 3 Hagelia quotes needed pdftotext ligature control characters mapped to fi/fl; 1 Sergi quote needed an em dash at a line end joined to the next line; 1 Krause–Sergi–Weingart quote (saul/9, across pp. 5–6) needed the SBL watermark letters, a page number and the running head removed. Each of those five was re-tested with only whitespace plus its own normalisation and matched; no quote/dash-style or line-break hyphenation normalisation was needed for any quote. Locators: PDF printed page numbers checked on every cited page (Quest −11, Forgotten Kingdom −14, Sergi −22, Hagelia −12, Krause–Sergi–Weingart −12, Na'aman −1, Faust & Sapir and Garfinkel from the journal pagination); HTML locators checked by script against the page structure: headings, paragraph openings and ordinals (Bible Odyssey article and transcript ordinals counted from the first article paragraph), Hayes chapter titles and timestamps, Encyclopedia.com section headings. Locators fixed for dangling “same paragraph” (david-ruler/9, israel-and-judah/3, /6, /9) and Greene's paragraphing (saul/4, saul/14).
# Trigger Claims: all 17 re-matched by script at timestamp and speaker against the final Transcripts (transcriptPath in data/processed-videos.json), verbatim, and read about two minutes either side. Dropped hedges: 139@00:48:17 drops the next sentence's “maybe … Israel might have subjugated the southern kingdom, or maybe the southern kingdom subjugated the northern kingdom”; 169@00:15:59 drops the previous turn's “or if there was a united kingdom, it was not all of these 12 tribes”. Conflict rule (CONTEXT.md, 2026-11-25), read as the daniel-date entries in data/scholarship-candidates.yaml apply it (a claim that cannot be true alongside what the statement reports): none of the 17 contradicts a statement, so none is logged and the triggers file is unchanged. Stronger than the page but compatible: 52@00:16:16 “scholarly consensus” (goliath short: one explanation); 64@00:47:01 “most scholars don't think there was ever a united kingdom” (short: many doubt); 139@00:48:17 “there was never a single united kingdom” (short: debated); 181@00:42:09 “most scholars would say … leans” (short: debated).
# Second pass changes. Shorts: united-monarchy (“a far more modest one”, not “far smaller”: Mazar p. 139 goes on to “most of Cisjordan”, and Faust & Sapir describe no size); historical-david (the old “for others it shows only that such a founder was remembered” was Davies alone, Sergi being on the other side; now some read it as confirming a founder named David, others call that unproven: Halpern and Finkelstein 2007 vs Richards and Davies); david-ruler (rewritten: “a local ruler of a modest realm” for everyone who accepts David was wider than Mazar, Halpern and Coogan and Chapman; now the empire is read as exaggerated and realm size and Jerusalem are disputed); origin (“of writers in Judah” dropped: Krause–Sergi–Weingart p. 3 report Finkelstein placing the concept in Israel under Jeroboam II); tel-dan (the ninth-century date is now “most scholars date”, since Hagelia reports proposals a century apart); goliath (“another identifies Elhanan with David” cut: EJ alone; the kept explanation reworded to what the EJ and HarperCollins share, Goliath first in Elhanan's story and later attached to David's); saul (“Scholars treat Saul as a real early leader” cut: Sergi p. 4 and Goldingay p. 9 report scholars who take Saul as fiction; now: no outside mention, so whether he was ever a king is hard to determine, and the Israel-or-Judah dispute); samuel (“some describe” the History of David's Rise as justification: Garsiel's “some scholars”, Hayes's “may be”). Texts: united-monarchy quotes Mazar's “rich and widely expanding”; historical-david Davies “if it reads that way” for “at most”; origin Na'aman's modelling view marked as his own; tel-dan forgery sentence scoped to Garbini and Gmirkin; house-of-david Hagelia's “contributing to the debate”. Quote: israel-and-judah/9 trimmed before Hayes's “Most concur that Israel …”, which is about Solomon's kingdom (to uncited). Locators: united-monarchy/11 (printed p. 138), samuel/3 (paragraph 3), samuel/4 (final sentence), samuel/10 (p. 3