# Second pass flags. (1) Access, decided keep, for the lead: Hagelia 2009 (16 citations), Sergi 2023 (9) and Quest 2007 (Finkelstein 4, Mazar 8, Schmidt 2; the first pass did not flag Quest) are PDFs in SBL's ICI online books repository. They open at a public URL with no login, which is what #80 tests (“read in the source itself at a public URL”), so they were kept; but SBL says the ICI files are for persons in qualifying lower-income countries and sends others to its store, the books are all rights reserved, and the page's “terms and conditions of use” has no link. The owner has not ruled on this kind of copy. If they are cut (39 of 130 citations): the core still holds on 6 independent authors, but the united-monarchy short's more-modest-state clause is left on Garfinkel et al. alone; the tel-dan short loses both “most scholars” clauses (Rollston gives only his own conclusion); house-of-david keeps “Most scholars” on Rollston but its “still debated” rests on Davies alone; david-ruler, origin and historical-david lose Finkelstein 2007, Mazar, Schmidt and Sergi but keep 2+ authors behind each short. (2) Bible Odyssey carries 12 of the Reference authors: independent authors, one platform. (3) Hayes 2006 is the oldest field-state source; attributed only. (4) Garfinkel et al. matched in the Cambridge Core copy; the registered Arizona repository copy refused curl and, in Chrome, opened a PDF of that title whose text could not be saved; registry url moved to Cambridge Core. (5) Krause–Sergi–Weingart and Sergi 2023 share an author; not counted twice. (6) Trigger 52@00:16:16 says “scholarly consensus” on Elhanan; the page gives it as one explanation; compatible, so kept, but the lead may prefer to log it as the daniel-date “uniformly convinced” entry was. (7) Goldingay's year is not printed in the excerpt (null kept). (8) EJ History is unsigned; counted as its own source.
# Publish 2026-11-25 (lead agent, on the second pass's flags): (1) ICI copies cut: Hagelia 2009 and the three Quest 2007 entries (Finkelstein, Mazar, Schmidt) are read only in SBL's International Cooperation Initiative repository, which SBL offers to readers in qualifying lower-income countries; when in doubt, cut (#93). Their citations moved to uncited and their registry entries removed; a follow-up issue asks the owner to rule on ICI copies and lists JJAR 1 (2021) as an open route to Mazar's side. Sergi 2023 pp. 4–7 re-pointed to SBL Press's free front-matter PDF (pp. 1–23) and re-matched there by script; pp. 44, 102 and 339 cut. (2) Shorts re-derived from what remains: origin drops “They differ on when it arose and what lay behind it” (Schmidt, Sergi p. 339 and Mazar cut); tel-dan keeps only uncontested facts (the date and Hazael are Rollston's judgment, attributed in the text; the forgery and reconstruction sentences went with Hagelia); house-of-david drops “how to interpret the phrase is still debated” (Davies alone left), keeping “Most scholars” on Rollston's “the majority of scholars”, with Moore and Halpern reading it so. united-monarchy, historical-david and david-ruler keep their shorts: “Many doubt” on Faust and Sapir, Krause–Sergi–Weingart and Sergi p. 5; “a far more modest one” on Garfinkel et al. and Sergi p. 5; “confirming” on Halpern and Hayes, “unproven” on Richards and Davies; “exaggerated” on Coogan and Chapman, the Encyclopaedia Judaica, Halpern and Hayes.
# Publish 2026-11-25: Trigger Claims tested against the #155 precedent (daniel-date “uniformly convinced”): a claim of consensus or near-unanimity where the statement reports named dissent is a conflict. 52@00:16:16 (“scholarly consensus”) and 139@00:48:17 (“Scholars are pretty sure”) logged under statements in data/scholarship-candidates.yaml and removed from the triggers file. 64@00:47:01 (“most scholars”, with “there's a theory that”) and 181@00:42:09 (“I think most scholars would say”) claim a majority, not unanimity, beside a statement that reports a debate: kept. 15 Trigger Claims remain. 169@00:15:59's hedge sits in the previous turn; noted, not extended.
# #183 ruling, 2026-11-26 (lead agent, on the owner's delegation): SBL International Cooperation Initiative PDFs count as External Sources. #80's test is that the cited passage can be read in the source itself at a public URL; these are full texts the publisher hosts openly, with no login. SBL's qualifying-country condition describes whom the programme serves, not a gate, and the page only quotes and links to the publisher's own copy. The publish-step cut is reversed: the page's statements, citations, citation notes, sources, leads and uncited are restored to the independent second pass's version (4fa5c31), which re-fetched and verified every one of these citations and flagged only access. Kept from the publish step: the two conflict Trigger Claims (52@00:16:16, 139@00:48:17) stay logged and off the page; review date and delegation unchanged.
