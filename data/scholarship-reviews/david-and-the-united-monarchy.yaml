rules:
  publish-rule:
    {
      agent: pass,
      owner: "",
      note: "First pass 2026-11-25: 10 statements. Core united-monarchy cites Richards (Reference), Nakhai (Reference), Faust & Sapir, Mazar, Krause–Sergi–Weingart, Finkelstein, Sergi, Garfinkel et al. (Scholarly): 8 independent author strings, none Host-authored. Rule holds.",
    }
  consensus-wording:
    {
      agent: pass,
      owner: "",
      note: "First pass 2026-11-25: no short says “consensus”. “Most scholars” appears in two shorts: house-of-david (Rollston “the majority of scholars”; Hagelia “almost generally accepted”, “most scholars”) and tel-dan (Hagelia “Most scholars attribute”, with Rollston's own conclusion). “Many” in the united-monarchy short: Faust & Sapir “questioned by many”, Mazar “a good number of scholars”. Every other field word in the texts is the source's own, attributed: Hayes's “most scholars”/“consensus”, Hagelia's “relatively high consensus” and “majority”, Finkelstein's “widely accepted”, Na'aman's “most scholars”, Krause et al.'s “one of the most accepted hypotheses”, Sergi's “little doubt today”.",
    }
  dissent-attributed:
    {
      agent: pass,
      owner: "",
      note: "First pass 2026-11-25: named: Davies (house of David, Judah's status, minimal evidence); Lemche and Thompson (toponym; Lemche on historicity) via Hagelia; Garbini, Lemche, Cryer, Gmirkin (forgery) via Hagelia; Benhadad attribution (“some”, Hagelia); Mazar and Faust & Sapir (defending the united monarchy); Garfinkel et al. (kingdom in Judah); Halpern's maximalist reading; Coogan and Chapman's “one of the most powerful monarchs”; Garsiel (duel's general reality; author close to David); Sergi's Judah–Benjamin unity; Lipschits's model via Krause et al.",
    }
