# Review record for /scholarship/1-enoch-the-watchers-and-the-nephilim/ (#93 shape). Not rendered.
# agent: results of the agent first pass (#159, 2026-11-27). That pass does not count toward publish.
# owner: empty (""). The owner delegated the publish review (#93, 2026-11-23); the `delegation` block records the independent second agent pass once it has run.
# Issue #159: new subject from the topic ranking (31 Episodes in the topic group); merges Jubilees. Instructions applied: #96 publish rule; short answers report the state of scholarship, never one scholar's view (#133); confessional study Bibles are Tradition and don't count toward the two. No candidate entry in data/scholarship-candidates.yaml matched the subject (grep: enoch, watcher, nephil, jubilee); slug made from the issue title.
# Overlap: nothing here restates satan-demons-and-angels#watchers (demons as the giants' spirits; 2 Peter 2:4 and Jude 6), the-origins-of-hell (1 Enoch 22, the accursed valley, separate fates), the-emergence-of-monotheism-and-the-divine-council (gods recast as angels; Deuteronomy 32; Jubilees 15:31–32) or noahs-ark-and-the-flood (J and P). The jude statement repeats only the fact that Jude 14–15 quotes 1 Enoch, with new sources, to carry the question of its status. Reused registry ids: coblentz-bautch-bo-enoch, boling-proctor-bo-watchers, angel-bo-nephilim, collins-eor-apocalypse, davies-ej-dead-sea-scrolls, martin-rlst152-l24, reyburn-fry-1997-genesis (per-citation urls for Gen 6:2 and 6:4), sommer-bo-angels-hebrew-bible, hayes-rlst145-l5.
# Sourcing test (#159, 2026-11-27): gate 1, 30 Trigger Claims in Episodes 27, 62, 124, 137 and 157 (the Book of Enoch, Nephilim and Jubilees tags' top Episodes and their Genesis 6, 1 Enoch and Jubilees segments), each script-matched at its turn's leading timestamp and speaker and read unfiltered about two minutes either side. Not attached, because a statement's sources contradict them: 157@00:39:02 (“like 12 to 14 copies of Enoch” at Qumran; the sourced count is eleven, as 62@00:37:56 says), 62@00:10:38's “seven different” sections (sources: five major sections, as 157@00:51:15 says), 62@00:13:48 (the Watchers' own spirits become evil spirits; satan-demons-and-angels#watchers has the giants' spirits). Gate 2, the core: the candidate thesis “1 Enoch is a composite pseudepigraphic work written over several centuries” sourced as worded, without a fixed number of books (sources say “at least five” and “five major sections” plus additions): Coblentz Bautch (Reference), Stuckenbruck and Boccaccini (Scholarly), Ahearne-Kroll (Scholarly), Tigchelaar (Scholarly), Stewart Lester (Reference, pseudepigraphy). Gate 3: 5 independent authors behind the core, none Host-authored. Gate 4: 19 statements.
# Shorts (#133): no short says “consensus”. State-of-field words in shorts and their authors: oldest “commonly dated” (Goff's “as is commonly acknowledged”; DiTommaso, Reed, Collins, Nickelsburg–VanderKam agree; Angel and Boling–Proctor give the earlier and later bounds); parables “in the prevailing view” (DiTommaso's “communis opinio”, Grabbe's “becoming widely recognized”, Baynes's “emerging consensus”; Collins and Botner within the window); son-of-man “sources see some connection … disagree” (Stuckenbruck–Boccaccini, Grabbe, Reynolds); sons-of-god “the reading nearly all translations follow” (Reyburn–Fry's own words; usage backed by NABRE, Adelman, Segal, Sommer; Doedens's “majority” attributed in the text; Usue's “no consensus” attributed); nephilim “commonly explained … origin uncertain” (Angel, NABRE; Reyburn–Fry, Doedens); fragment “sources say … debated” (Doedens's “present majority view”, NABRE, Sommer, Adelman, Hayes/Gunkel; flood link: NABRE and Adelman vs Jang); genesis-6 “scholars have tended to hold … no consensus” (Harkins–Coblentz Bautch–Endres; Doedens; Coblentz Bautch BO; Nickelsburg–VanderKam); strands “scholars generally agree” (Wright's “generally acknowledged”, Orlov's “scholars usually attribute”; Nickelsburg–VanderKam, Harkins et al., Brand, Boling–Proctor describe the strands); origin-of-evil “in scholars' readings … no consensus” (Orlov, Reed, Boling–Proctor, Angel; Pierce's “not reached scholarly consensus”, Wright); jubilees-date “sources say … widely followed” (van Ruiten, Hanneken, Segal, Zahn, Ben-Dov; Monger's “many scholars … follow VanderKam's understanding of the composition”). Uncontested or descriptive shorts: composite, languages, canon, jude (the quotation; its status shown as divided), calendar, jubilees, jubilees-text, jubilees-watchers (van Ruiten, Hanneken). tradition: Tradition sources, exempt.
# Dropped for want of a second author or a qualifying source: the rediscovery (James Bruce's copies, 1773; Hessayon 2023 alone for Bruce, Laurence 1821 with Stuckenbruck–Boccaccini); the Animal Apocalypse's Maccabean date (DiTommaso alone, reporting Nickelsburg); the Epistle's date (no post-1996 source); 1 Peter 3:19 as the Watchers (Pierce's survey alone among sources read; Reed lists allusions in 1 Peter generally); Revelation 12:4 and 1 Corinthians 11:10 (no usable source); Jubilees 4:30 and a day as a thousand years, and angelic mediation of the law (Hanneken alone); Mastema (van Ruiten and Hanneken, but not needed for any statement); the Ethiopic manuscript counts (Hanneken 27 vs Monger 57); Aramaic coverage of 1 Enoch (Nickelsburg's BAR “perhaps one fifth” vs Stuckenbruck–Boccaccini's “about 5 percent”; BAR not cited, a popular magazine).
# First pass: five research agents fetched every source on 2026-11-27 into separate scratch folders (curl; MDPI, Groningen and the MF repository via Internet Archive copies of the same URLs) and copied quotes from the fetched text; every page quote was then script-matched against those saved texts (whitespace, HTML entities, inline tags, soft hyphens and line-end hyphens normalised; curly quotes and dashes not normalised): 177/177, 0 misses. Quotes broken by a page header or footnote block in the PDF text are split into two citations at the break rather than joined. The second pass must re-fetch.
# Flags for the second pass: (1) Bible Odyssey (Coblentz Bautch, Angel, Boling–Proctor, Stewart Lester, White Crawford, Mbuvi, Reynolds, Botner, Ben-Dov, Sommer) and TheTorah.com (Adelman, Sommer, Brand, Segal ×3, Zahn) carry many Reference citations: independent authors, two platforms. (2) Theses: Doedens 2013 (Kampen doctoral dissertation; the book version, Brill 2019, is a lead), Pierce 2009 (Durham PhD), Monger 2018 (MF PhD, open version), all classed Scholarly as doctoral work in university repositories. (3) Unbylined publisher excerpts: the Fortress introductions to Nickelsburg–VanderKam 2012 and Harkins, Coblentz Bautch and Endres 2014 are credited to the translators and editors; Wright 2015 ch. 2 is his own book. (4) Hanneken 2014 is an author-posted course PDF of an introduction prepared for a reader of early Jewish literature; its published venue is unverified, so it is classed Reference (introduction) and backs no short alone. (5) VanderKam 2026 is cited from its abstract only (the eleven manuscripts). (6) eotc-canon: ethiopianorthodox.org calls itself a non-profit introducing the faith and history of the Ethiopian Orthodox Tewahedo Church and speaks as “our church”; it is not shown to be the Patriarchate's own site. The church's canon is also stated by Scholarly sources in canon. (7) Catholic Answers is a media apostolate, not a magisterial voice; the text names it as such. (8) Reed 2005 is the Cambridge excerpt (introduction only). (9) Collins EoR dates the Aramaic fragments “second century ce” (an error); the quote stops before it. Stuckenbruck–Boccaccini's “Birth of Enoch” (for Birth of Noah) and “1 Pet 2:18–22” are not quoted. (10) Jang 2025 calls the flood link the “prevailing scholarly view” and argues against it; reported as his. (11) Grabbe's Matthew claim is split across a page header (pp. 196–97) into two citations.
