    {
      agent: pass,
      owner: "",
      note: "First pass 2026-11-27: 19 statements. Core composite cites Coblentz Bautch (Bible Odyssey, Reference, 2022), Stuckenbruck and Boccaccini (SBL Press, Scholarly, 2016), Ahearne-Kroll (SBL Press, Scholarly, 2019), Tigchelaar (SBL Press, Scholarly, 2019) and Stewart Lester (Bible Odyssey, Reference, 2023): 5 independent authors, all inside the window, none Host-authored. Coblentz Bautch is also an editor of harkins-bautch-endres-2014-introduction, not cited in the core. Second pass 2026-11-27: recomputed after cuts: 19 statements, 173 citations. Counting only sources that back the core claim as a whole (composite, at least five parts, by different writers over centuries): Coblentz Bautch (Reference, 2022), Stuckenbruck and Boccaccini (Scholarly, 2016) and Ahearne-Kroll (Scholarly, 2019): 3 independent authors, one or more Scholarly or Reference, none Host-authored. Tigchelaar (booklets copied separately) and Stewart Lester (attribution) back parts only and are not counted. Rule holds.",
    }
  consensus-wording:
    {
      agent: pass,
      owner: "",
      note: "First pass 2026-11-27: no short says “consensus”; “consensus” appears in texts only as the sources' own words, attributed (Harkins et al. “no absolute consensus”, Usue “basically no consensus”, Pierce “not reached scholarly consensus”, Baynes “emerging consensus”, DiTommaso “communis opinio”). “majority” appears only as Doedens's and Jang's words, attributed. “many specialists” is Botner's, attributed. Hedged shorts listed in the header with their authors (#133). Second pass 2026-11-27: the first pass's “no short says consensus” was false (genesis-6 “no consensus”, origin-of-evil “has no consensus”); both now say “debated”, so it now holds. Other shorts narrowed: nephilim (no “commonly”), fragment (flood clause dropped: Jang alone), jubilees-date (no “widely followed”: Monger alone), son-of-man (scoped to Matthew; “not settled”, not “disagree”), canon (“scholarly” rediscovery), tradition (Jubilees dropped).",
    }
