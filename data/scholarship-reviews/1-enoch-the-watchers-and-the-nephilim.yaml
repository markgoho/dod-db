leads:
  - "Nickelsburg, 1 Enoch 1 (Hermeneia 2001), and Nickelsburg and VanderKam, 1 Enoch 2 (Hermeneia 2012): no open excerpt beyond the translation's introduction; known through DiTommaso, Doedens and Orlov."
  - "Milik, The Books of Enoch (1976) and HTR 64 (1971); Black (1985); Kvanvig, SJOT 18 (2004); Collins, “Sons of God and Daughters of Men” (2008); Hendel, JBL 106 (1987) and “The Nephilim were on the Earth” (2004); Alexander, JJS 23 (1972): read only as reported by Doedens, Jang, Wright or Tigchelaar."
  - "Doedens, The Sons of God in Genesis 6:1–4 (Brill OTS 76, 2019): the book version of the cited dissertation; closed."
  - "Charlesworth and Bock (eds.), Parables of Enoch: A Paradigm Shift (2013): search-snippet text only (“consensus seems to be growing for the late first century bce”)."
  - "Sacchi (2007) on the Camaldoli consensus for the Parables: cited by Baynes n. 66; not read."
  - "VanderKam, Jubilees: The Hermeneia Translation (Fortress 2020), introduction: read only in a third-party copy (AlHaTorah.org) with no licence shown."
  - "Chabad.org, “Nephilim: Fallen Angels, Giants or Men?” (Shurpin): Cloudflare refused scripted fetches; only short WebFetch excerpts seen."
  - "Papaioannou, JBL (2021), on 2 Peter 2:4 and Jude 6: abstract only (logged by satan-demons-and-angels)."
  - "Drawnel, Qumran Cave 4: The Aramaic Books of Enoch (OUP 2019), for an updated manuscript count: closed."
  - "Britannica, “Book of Enoch”: 403 to scripted requests; nothing saved."
uncited:
  - "Nickelsburg, “Dead Sea Scrolls Spotlight: The Book of Enoch”, Biblical Archaeology Review 33:5 (2007): read; a popular magazine, not a Scholarly or Reference venue. Its “11 Aramaic manuscripts”, “perhaps one fifth” coverage and Aramaic → Greek → Ethiopic chain not cited."
  - "Hessayon, “James Bruce and His Copies of Ethiopic Enoch” (Brill 2023, Goldsmiths repository): read; the rediscovery statement was dropped for want of a second author on Bruce."
  - "Lied and Stuckenbruck 2019, n. 24 (only the Ge'ez preserves chs. 37–71): read; the footnote is split by a page break in the PDF text; the Parables' absence is carried by White Crawford and Davies."
  - "DiTommaso 2023, p. 92 (“among the earliest known apocalyptic texts”): read; the sentence is broken by a footnote block; DiTommaso n. 27 carries his point."
  - "DiTommaso 2023, p. 100 and n. 44: the Animal Apocalypse in a Maccabean setting, 165–163 BCE per Nickelsburg: read; one author."
  - "Stuckenbruck and Boccaccini 2016, p. 3 (“Hardly anyone would doubt … Jude 6 and 14–15 … citing 1 En. 1:9 directly”): read; the sentence also cites “1 Pet 2:18–22”, apparently an error, so not quoted."
  - "Coblentz Bautch 2016 (EJL 44, p. 105): Augustine and Jerome's consternation about Enochic literature: read; same author as coblentz-bautch-bo-enoch."
  - "Pierce 2009 on 1 Peter 3:19–20 as the Watchers (Dalton's reading “dominated scholarship since … 1964”): read; no statement on 1 Peter."
  - "Sim 1999 (HTS) on Matthew knowing the Book of the Watchers: read; one author's argument. Sim and Wright on the Watchers bound until judgment: read; background, covered by satan-demons-and-angels and the-origins-of-hell."
  - "Reed 2005 p. 6 n. 27 (the instruction motif only in Jubilees and the Similitudes before the second century CE): read; not needed."
  - "Hanneken 2014 on Jubilees 4:30 (a thousand years as one day) and on angelic mediation of the Torah: read; one author each."
  - "van Ruiten 2007 and Hanneken 2014 on Mastema and on where Jubilees' demons come from (10:5): read; they disagree; no statement."
  - "Monger 2018 on 57 Ethiopic manuscripts vs Hanneken's 27: read; counts differ, not stated."
  - "Britannica, “Book of Jubilees” (Internet Archive copy): read; no year on the page; “not included in any canon of scripture” conflicts with the Ethiopian canon in every other source."
  - "Davies, EJ, “ten Hebrew manuscripts” of Jubilees: read; lower than Hanneken's fourteen and Segal's “about 15”; not stated."
  - "White Crawford, Bible Odyssey: “a calendar based on the 365-day rotation of the sun” for Enoch: read; an error against Nickelsburg–VanderKam, Ben-Dov and Segal; not quoted."
  - "Encyclopaedia Judaica: Grintz, “Enoch, Ethiopic Book of” and “Jubilees, Book of”; Ahituv, “Azazel”; Bamberger, “Nephilim” (also registered as ej-nephilim); Montague, NCE “Sons of God”; Skehan and Plastaras, NCE “Enoch”: read; pre-1996 text, not used for state-of-field statements."
  - "Usue's dependence on Walton and Mathews (“ignorance on this subject”): read; Usue cited for his own conclusion only."
  - "Wright 2005 Durham thesis (“the majority of scholars assume” the Nephilim are the offspring; “as most scholars would agree, Genesis 6.1-4”): read; the title page restricts quotation without consent; not cited."
  - "Reed 2004 PSCO paper (rabbinic suppression from the second century; Genesis and the Watchers may draw from Israelite lore): read; venue class unsettled."
  - "Aish.com, “Sons of God – Bnei Elohim” (Rosenfeld, Ask the Rabbi): read; most commentators read judges and noblemen: no organisational self-description found; not cited."
