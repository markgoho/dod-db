leads:
  - "Damon et al. 1989, p. 614: “the age of the shroud is obtained as AD 1260–1390, with at least 95% confidence.” Known only through Freer-Waters & Jull 2010 and 2026, which quote it; Damon's full text is paywalled."
  - "Nicolas Sarzeaud, “A New Document on the Appearance of the Shroud of Turin from Nicole Oresme”, Journal of Medieval History 51 (2025): 604–621. Press release (EurekAlert!, 28 August 2025) says Oresme referred to the shroud between 1355 and 1382, most likely after 1370, the oldest written evidence known. Paywalled; not read. If confirmed, it bears on earlier and memorandum, not on first-record."
  - "Andrea Nicolotti, The Shroud of Turin: The History and Legends of the World's Most Famous Relic (Baylor UP), and From the Mandylion of Edessa to the Shroud of Turin (Brill, 2014): no preview / restricted. The 2014 book reached through Russakoff's review."
  - "Bella, Garlaschelli and Samperi (Thermochimica Acta 617, 2015; 632, 2016) and Latendresse (624, 2016): the exchange on Rogers's mass spectra. ScienceDirect CAPTCHA; not read."
  - "Commentaries on Borrini & Garlaschelli in JFS 64 (2019) by Sánchez Hermosilla et al., Bevilacqua et al. (with Fanti), and Sánchez Hermosilla and Rucker, each with an authors' response. No abstracts; not read."
  - "Garlaschelli, “Life-size Reproduction of the Shroud of Turin and its Image”, J. Imaging Sci. Technol. 54 (2010); reply by Fanti and Heimburger 55 (2011). Publisher CAPTCHA; the reproduction is cited through Karapanagiotis."
  - "W. C. McCrone, “The Shroud of Turin: Blood or Artist's Pigment?”, Accounts of Chemical Research 23 (1990): 77–83. Not opened; pre-1996. Cited through Karapanagiotis."
  - "STURP 1981 summary statement (“It is not the product of an artist”): readable only on shroud.com (advocacy); quoted in Karapanagiotis §3.2 and Di Lazzaro §1."
  - "Gary Vikan, “Debunking the Shroud: Made by Human Hands”, BAR 24:6 (1998): paywalled; reprint only on shroud.com."
  - "Ian Wilson's rejoinder to Nicolotti, CHR 110.2 (2024): 397–398. Not read."
uncited:
  - "Raymond N. Rogers, “Studies on the radiocarbon sample from the shroud of turin”, Thermochimica Acta 425 (2005): 189–194, read in a Zenodo copy of the Elsevier PDF (zenodo.org/record/1259381; labelled CC0, but the PDF carries Elsevier's copyright): “The radiocarbon sample was thus not part of the original cloth and is invalid for determining the age of the shroud.” Publisher page CAPTCHA. Not cited (copy not author-posted, rights unclear; precedent Collins/Fasold in noahs-ark-and-the-flood); described through Karapanagiotis."
  - "Herbert Thurston, “The Holy Shroud and the Verdict of History”, The Month 101 (January 1903): 21–22, the standard English translation of the d'Arcis memorandum (archive.org): “certain men being hired to represent themselves as healed at the moment of the exhibition of the shroud”. Not cited: a 1903 Jesuit monthly fits no External Source class, so the staged healings (Ep 75 00:38:55) are not on the page. Thurston also calls the surviving text “the Bishop's own draft”."
  - "Thurston, “The Holy Shroud (of Turin)”, Catholic Encyclopedia (1912): first heard of “about the year 1360”; the artist “had confessed to having painted it”. Not cited (1912); “confessed” is a gloss on the memorandum's “attested”."
  - "Ulysse Chevalier, Autour des origines du suaire de Lirey (1903), docs. G and K: Latin of Clement VII's bulls of 6 January 1390. Primary edition; used only to check the two redactions behind clement/2 and clement/4."
  - "Freer-Waters & Jull, npj Heritage Science 14:263 (2026): “The radiocarbon laboratories continue to support this result and see no reason to dispute the results.” Not cited: same authors as freer-waters-jull-2010-dated-piece, which carries the point."
  - "Cicero Moraes, “Image Formation on the Holy Shroud—A Digital 3D Approach”, Archaeometry 68 (2026): 84–93, abstract: the image is “more consistent with an artistic low-relief representation than with the direct imprint of a real human body”; commentary by Casabianca, Marinelli and Piana and Moraes's response (Archaeometry 68: 861–866), abstracts. Not cited: abstracts only; could be added in a later pass."
  - "Benedict XVI (2 May 2010: “the Icon of Holy Saturday”) and Francis (30 March 2013: “this icon of a man scourged and crucified”), vatican.va. Not cited; John Paul II carries the Church's position."
  - "Nicolotti 2019, p. 20: “It is by now an established fact that the Shroud came into the possession of the Duke of Savoy in 1453.” Later history (Savoy 1453, Chambéry fire 1532, Turin 1578) has no statement; no Trigger Claim asks about it."
