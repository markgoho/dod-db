# Illustrations for /scholarship/mary-magdalene/ (generated with Gemini; see
# src/scripts/generate-scholarship-illustrations.ts). Each picture shows only
# what the listed statements support; every caption, link and claim stays in
# hugo/layouts/partials/scholarship-custom/mary-magdalene.html.
#
# Five comic panels in time order: two different women in Luke 7 and Luke 8,
# Gregory's sermon that made them one, the later image, and, full width, what
# the gospels show. `luke8` is the anchor for Mary Magdalene (rust headscarf);
# the unnamed woman of Luke 7 is drawn as a different woman (grey-blue shawl,
# loose hair). Every figure is fully and modestly clothed; nothing sexual.
slug: mary-magdalene
images:
  - id: luke8
    statements: [gospels]
    aspect: "4:3"
    alt: "Mary Magdalene, in a rust headscarf, walks with a small group of women along a dusty Galilean road, carrying a bundle of provisions."
    prompt: >-
      A first-century Galilean woman in her thirties, Mary Magdalene, shown
      from the knees up, walking along a dusty country road with two or
      three other women just behind her. She wears a rust red headscarf over
      dark hair and a plain long amber tunic, and carries a cloth bundle of
      bread and provisions on her hip; she looks ahead, calm and purposeful.
      Rolling hills and a glimpse of a lake in the far background. The upper
      right of the picture is open pale sky. No men in the foreground, no
      halos, no text.
  - id: luke7
    statements: [prostitute]
    aspect: "4:3"
    refs: [luke8]
    alt: "At a dinner, a different woman, with loose hair and a grey-blue shawl, kneels weeping at the feet of a reclining guest, an alabaster jar beside her."
    prompt: >-
      A first-century dinner in a courtyard house: a bearded man in a plain
      robe reclines at a low table, seen from the side, and at his bare feet
      kneels a woman weeping, her long loose black hair falling forward, an
      open small white alabaster jar of ointment beside her. She is clearly a
      DIFFERENT woman from the one in the reference image: younger, loose
      uncovered hair, a grey-blue shawl and a grey dress, no rust headscarf.
      Fully and modestly clothed, nothing sexual. A second man in the
      background watches, frowning. The lower right of the picture is open
      plain floor. No halos, no text.
  - id: sermon
    statements: [prostitute]
    aspect: "4:3"
    alt: "A sixth-century pope in white vestments preaches from a stone pulpit in a dim basilica, one hand raised."
    prompt: >-
      A sixth-century bishop of Rome preaching a sermon: an older clean-shaven
      man in plain white and amber liturgical vestments with a pallium,
      standing in a raised stone pulpit inside a dim early Christian basilica
      with round arches, one hand raised as he speaks, a large open book
      before him. A few listeners seen from behind in the lower left. A
      generic figure, not a portrait of any real person. The upper right of
      the picture is open shadowed wall. No halos, no text.
  - id: image
    statements: [prostitute]
    aspect: "4:3"
    refs: [luke8, luke7]
    alt: "A late painting in a gilded frame shows a penitent woman with long loose hair and an alabaster jar, gazing upward in tears."
    prompt: >-
      A gilded ornate picture frame hanging on a museum wall, holding a
      painting in an old devotional style: a penitent woman, shown from the
      waist up, with long loose dark hair, gazing upward with tears, holding
      the SAME small white alabaster ointment jar as in the second reference
      image. Her face resembles the woman in the first reference image, but
      her hair is loose and uncovered, as the second reference woman's is.
      Fully and modestly clothed in a deep red cloak, nothing sexual. The
      frame fills most of the panel; plain dark wall around it, open at the
      lower right. No text, no plaque words.
  - id: tomb
    statements: [gospels, risen]
    aspect: "16:9"
    refs: [luke8]
    alt: "At dawn, the same Mary Magdalene, in her rust headscarf, stands at the mouth of an open rock-cut tomb, its round stone rolled aside."
    prompt: >-
      Early dawn outside a rock-cut tomb in a garden: the SAME woman as in
      the reference image (rust red headscarf, dark hair, amber tunic) stands
      at the right third of the picture, facing the open dark doorway of the
      tomb, its large round stone rolled aside. Soft amber light from the
      rising sun on the left. The left third of the picture is open sky and
      garden. No other figures, no angels, no halos, no text.
