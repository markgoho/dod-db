#
# Seven comic panels, from the older texts to the later ones: divine beings
# standing over the nations (Deut 32:8–9); a prophet at the edge of a heavenly
# throne room full of divine beings (the council scenes); Israelites at one
# altar while neighbouring peoples' shrines with their own statues stand on the
# horizon (the first commandment: one god worshipped, others not denied);
# Rachel sitting on a camel saddle with small figurines hidden in it (the
# teraphim); a prophet speaking to exiles by a Babylonian river (Second
# Isaiah, the first outright denial); a small temple on a Nile island where a
# scribe writes an Aramaic letter (Elephantine); and, across the bottom, winged
# angelic princes hovering over the lands (Daniel). `nations` is the anchor for
# the divine beings, chained into `council` and `angels`. God is never drawn
# as a figure: the throne is light. No being is drawn as Yahweh or set over
# Israel: the page leaves who the Most High is to the-origins-of-yahweh. No
# count of gods or nations is asserted: the statements give none.
