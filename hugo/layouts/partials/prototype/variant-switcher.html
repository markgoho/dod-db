{{- /*
  PROTOTYPE switcher bar. Toggles sibling [data-variant] wrappers (all are
  rendered; static site), keeps ?variant= in the URL via replaceState, and
  cycles with ← / →. Callers gate it: hugo.IsServer or HUGO_PROTOTYPE=1.
  */
-}}
<nav class="proto-switcher" aria-label="Prototype variant switcher">
  <button
    type="button"
    class="proto-switcher__btn"
    data-step="-1"
    aria-label="Previous variant">
    ←
  </button>
  <span class="proto-switcher__label" aria-live="polite"></span>
  <button
    type="button"
    class="proto-switcher__btn"
    data-step="1"
    aria-label="Next variant">
    →
  </button>
</nav>
<script>
  (() => {
    const variants = [...document.querySelectorAll("[data-variant]")];
    const keys = variants.map(v => v.dataset.variant);
    const label = document.querySelector(".proto-switcher__label");
    let current = new URL(location.href).searchParams.get("variant");
    if (!keys.includes(current)) current = keys[0];
    const show = key => {
      current = key;
      for (const v of variants) v.hidden = v.dataset.variant !== key;
      const v = variants[keys.indexOf(key)];
      label.textContent = `${key} (${v.dataset.variantName}) · ${keys.indexOf(key) + 1}/${keys.length}`;
      const url = new URL(location.href);
      url.searchParams.set("variant", key);
      history.replaceState(null, "", url);
    };
    const step = n =>
      show(keys[(keys.indexOf(current) + n + keys.length) % keys.length]);
    for (const b of document.querySelectorAll(".proto-switcher__btn")) {
      b.addEventListener("click", () => step(Number(b.dataset.step)));
    }
    document.addEventListener("keydown", e => {
      if (e.key !== "ArrowLeft" && e.key !== "ArrowRight") return;
      if (e.altKey || e.ctrlKey || e.metaKey || e.shiftKey) return;
      const t = e.target;
      if (
        t instanceof Element &&
        t.closest(
          "input, textarea, select, [contenteditable], [role=slider], pagefind-modal",
        )
      )
        return;
      e.preventDefault();
      step(e.key === "ArrowLeft" ? -1 : 1);
    });
    show(current);
  })();
</script>
