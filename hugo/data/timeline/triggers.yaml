- entry: merneptah-stele
  episode: 1
  speaker: "Dan McClellan"
  timestamp: "00:45:35.800"
  states: critical
  text: "We have from around the year 1208 BCE, an inscription from Egypt that was commissioned by a king named Merneptah that refers to Israel. And it carries a, what's called a determinative, which is kind of like a category sign that refers to this Israel as a people, not a nation, not a city-state, not a city, but a people, which indicates that they probably weren't an established nation by this time period"
- entry: merneptah-stele
  episode: 64
  speaker: "Dan McClellan"
  timestamp: "00:29:25.170"
  states: critical
  text: "we have a reference to Israel in the Merneptah Stele from around 1208, 1210 BCE and it refers to Israel using a determinative for a people. So it's not a city-state. It's not a kingdom. It's not a nation. It's just a people."
- entry: merneptah-stele
  episode: 187
  speaker: "Dan McClellan"
  timestamp: "00:41:56.730"
  states: critical
  text: "1208 BCE so just before the late Bronze Age collapse, we have the Merneptah Stele, which mentions a people group known as Israel. This is the earliest known reference to the people of Israel."
