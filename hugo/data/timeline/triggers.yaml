  states: critical
  text: "So the first creation account, probably 8th-7th century BCE, somewhere around there; Genesis 1, the later creation account, probably 6th, maybe even 5th century BCE."
- entry: exodus
  episode: 21
  speaker: "Dan McClellan"
  timestamp: "00:25:18.080"
  states: critical
  text: "And so on balance, I and most scholars, the overwhelming majority of critical scholars, would say the Exodus, as it is told in the book of Exodus, is entirely implausible. It is plausible that there's a historical core, some kind of little kernel of history that just grew and grew and grew as these stories were being told over the centuries that involved a small group of people who were enslaved, who escaped, who made their way to the northern hill country and were incorporated into the people known as Israel."
