# PROTOTYPE (#162), throwaway: lives only on branch prototype/timeline-vertical.
# Every value below is a STAND-IN. Nothing here is sourced, reviewed or quoted;
# it exists only to show how tradition-only items sit in a two-lane Timeline.

# Compressed-era axis. `size` is each era's share of the axis (relative
# height): tight before about 2000 BCE, roomy after (#162 "Scale").
eras:
  - { from: -6000, to: -3000, size: 1, label: "6000–3000 BCE" }
  - { from: -3000, to: -2000, size: 1, label: "3000–2000 BCE" }
  - { from: -2000, to: -1500, size: 2, label: "2000–1500 BCE" }
  - { from: -1500, to: -1000, size: 3, label: "1500–1000 BCE" }
  - { from: -1000, to: -500, size: 6, label: "1000–500 BCE" }
  - { from: -500, to: 0, size: 4, label: "500–1 BCE" }

