      short black beard, long near-black robe with rust red lining), arms
      folded, against a dark grey background: he is what Jesus is talking
      about, not someone standing on the hillside. Nobody on the hillside
      itself except Jesus and the three villagers. The BOTTOM LEFT quarter
      of the picture is plain bare hillside. Negative list: no dark figure
      standing on the hillside, no halo, no glow around Jesus's head, no
      wings, no horns, no tails, no fire, no weapons, no fighting, no
      desert, no text.

  - id: serpent
    statements: [serpent]
    aspect: "4:3"
    alt: "In a garden, a snake coiled on a branch of a fruit tree talks to a woman who stands listening."
    prompt: >-
      A lush ancient garden. In the RIGHT half of the picture, a fruit tree
      heavy with round fruit; coiled along one of its low branches is an
      ordinary snake, a plain amber and ink-patterned serpent, its head
      raised as if talking. Beside the tree a young woman with long dark
      hair, fully clothed in a simple plain knee-length light warm grey
      tunic with short sleeves, stands listening to it, curious. The snake
      is just an animal: no human face, no horns, no crown, no legs, no
      glowing eyes. The BOTTOM LEFT quarter of the picture is plain grass
      with nothing in it. The TOP LEFT is plain pale sky. Negative list: no
      man, no other figures, no text.

  - id: babylon
    statements: [lucifer]
    aspect: "4:3"
    alt: "Dawn over the walls and ziggurat of an ancient Babylonian city; one bright morning star shines in the sky."
    prompt: >-
      Dawn over an ancient Babylonian city: in the RIGHT half of the
      picture, the city's high walls, gates and a stepped ziggurat in
      silhouette against a pale amber sunrise sky. Low in the sky above
      the city shines one single bright morning star, drawn as a bold
      white-and-amber star with short rays, the only star in the sky. The
      BOTTOM LEFT quarter of the picture is plain dark empty plain. The TOP
      LEFT is plain pale sky. Negative list: no figures, no people, no
      falling figure, no wings, no moon, no other stars, no text.
