- episode: 174
  speaker: "Dan McClellan"
  timestamp: "00:06:52.990"
  text: "But textual criticism, we used to think of it as trying to recover the original text, the Urtext. We don't really talk about it that much anymore because there might not be an Urtext for an awful lot of the texts we're talking about. Like, it gets really complicated if a given book of the Bible, like was compiled from a bunch of different texts and then those texts came together from different traditions and some of them were written and some of them were oral, and then later traditions alter. Like you can't go back to an original text a lot of the time. And so now really what textual criticism, at least textual criticism of the Bible is mainly concerned with, is trying to reconstruct the earliest recoverable form of a given text."
