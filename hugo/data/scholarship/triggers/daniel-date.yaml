  text: "The Book of Daniel is brought together from some traditions that were collated and finalized in the middle of the second century BCE. In fact, we can probably date it to within maybe two or three years of when it was. It was probably written around 167ish BCE. And the reason we know this is because the story is the earlier in time it gets, the closer it gets to its ostensible composition in the beginning of the Babylonian exile. The less historically accurate it is. Right. The closer it gets to 167 BCE the more historically accurate and the more detailed it gets. And then once we get past 167 BCE it all falls apart. None of it is accurate."
- episode: 34
  speaker: "Dan McClellan"
