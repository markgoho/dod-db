  text: "Now, the seven Pauline epistles that are considered authentic or genuine are First Thessalonians, First Corinthians and Second Corinthians, Galatians, Romans, Philippians, and Philemon."
- episode: 35
  speaker: "Dan McClellan"
  timestamp: "00:35:43.590"
  text: "The disputed ones are where scholars are kind of in disagreement. There's not a clear consensus. On the more critical side, you will have scholars who reject Pauline authorship. On the less critical side, you will have a lot of scholars who assert Pauline authorship. And those are Second Thessalonians, Colossians, and Ephesians. And so for those three, it's a mixed bag. Maybe they're written by Paul, maybe they're not. The last three are First Timothy, Second Timothy, and Titus. These are known as the Pastoral Epistles. And these are ones that most scholars consider spurious. The scholars that assert Pauline authorship of these epistles are in the minority."
- episode: 35
  speaker: "Dan McClellan"
  timestamp: "00:36:46.480"
  text: "But then on the. For the spurious Pauline epistles, the Pastoral Epistles, I think you had like 55% said no. Another 20% said I don't know. And then about a quarter of the scholars said Paul wrote them. And so that's. That's not an overwhelming consensus, but that's a, a good majority."
- episode: 35
  speaker: "Dan McClellan"
  timestamp: "00:37:49.790"
