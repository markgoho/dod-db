- episode: 18
  speaker: "Dan McClellan"
  timestamp: "00:12:11.080"
  text: "And one of the things that this indicates is that a satan is more of a role that someone fills rather than the personal name of a specific individual."
- episode: 18
  speaker: "Dan McClellan"
  timestamp: "00:27:23.560"
  text: "There is not a single syllable in any part of the Hebrew Bible that supports that understanding of the word satan. As we mentioned in the, in the previous segments with Balaam, satan is a noun, a generic noun that means something like accuser, adversary, opponent."
- episode: 18
  speaker: "Dan McClellan"
  timestamp: "00:32:04.050"
  text: "And. And here it's. It's not Hasatan, it's not the Satan, it's just Satan. Some people will argue this suggests it's functioning more as a name, but it's probably something more like a title, the accuser, or an accuser or something like that."
- episode: 18
  speaker: "Dan McClellan"
  timestamp: "00:34:08.370"
  text: "Now, you don't normally have a definite article with a proper name. So this is not a personal name. This is like a title. So it's kind of like the accuser came with them."
- episode: 18
  speaker: "Dan McClellan"
  timestamp: "00:37:12.190"
  text: "And so we're starting to move in the direction of Satan being something individuated. But the real linchpin for that is the traditions that develop in the Greco-Roman period around the tradition of the fall of the angels, the watchers, the Nephilim, all this kind of stuff."
- episode: 18
  speaker: "Dan McClellan"
  timestamp: "00:45:03.190"
  text: "And so it's, it's mocking the king of Babylon. And we have no connection of that story with Satan. No, no explicit connection until the middle of the second century CE. I think around Justin Martyr or somewhere around there is the first time somebody says, hey, this is Satan."
- episode: 18
  speaker: "Dan McClellan"
  timestamp: "00:51:43.390"
  text: "And some people have asked, where does this come from?? Does this have to do with Zoroastrianism? And we, I don't think we have enough data about Zoroastrianism to say for sure, but I think it's likely that."
- episode: 18
  speaker: "Dan McClellan"
  timestamp: "00:54:50.090"
  text: "And so the New Testament is where it is most clearly and systematically fleshed out, but it's going on within Judaism already."
- episode: 28
  speaker: "Dan McClellan"
  timestamp: "00:02:34.910"
  text: "And the same is true of the Hebrew. The word there is malakh, which again is one who is sent, an emissary, coming from a verbal root that means to send."
- episode: 28
  speaker: "Dan McClellan"
  timestamp: "00:03:40.890"
  text: "And in the Hebrew Bible, you have the word used in reference to human messengers as well."
- episode: 28
  speaker: "Dan McClellan"
  timestamp: "00:09:46.060"
  text: "And so there's kind of a conflated identity going on here between the messenger and God themselves. We see this with Hagar when she's out in the wilderness. We see this with Abraham. We see this with Gideon in the Book of Judges."
- episode: 28
  speaker: "Dan McClellan"
  timestamp: "00:24:30.320"
  text: "So New Testament angels, very different from Hebrew Bible angels. And they have names."
- episode: 28
  speaker: "Dan McClellan"
  timestamp: "00:34:57.310"
  text: "And so that's probably the best candidate for a reference to demons in the Hebrew Bible. And it's basically saying these folks were sacrificing to the wrong deities."
- episode: 28
  speaker: "Dan McClellan"
  timestamp: "00:48:16.830"
  text: "But this story of the fall of the angels is one kind of origin story for the concept of demons."
- episode: 84
